front:
  text: 眉山唐先生文集叙
  hash: sha256:b875179fbb461dc85d01c08291ad9d152c85f591cc4b3f770cff34a75c104998
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_000-1a}
body:
  text: 奉議郎太府寺丞鄭縂大君子所貴於文者以與道俱而已詩以道志春秋以導名分易以導隂陽此之謂道易順而書險詩葩而春秋質書之全經不用也守而詩𣸪湏韵以成章此之謂文文非道無以立訓而垂世道非文無以示人而行逺尭舜禹湯周孔孟氏皆明道立訓之文雖秦火洞然傳之不絶其後楊雄韓栁之徒𣸪著書䏻文栁雖少時嗜進不擇所附以至于僨然䏻斈道自勵贖咎前非其文攻砭世育有𥙷教化故卒配韓以傳若士之見道不明與雖明而無守文不主道但求其工或道有不足其文僅䏻给用非沛然有餘無以自立自著則雖聞扵一時亦不傳于後世然則文之與道如耳有聪目有明血有氣形有神要之不可斯湏違離然後尽善此斈者所當知也眉山唐先生名庚字子西政和中謫官嶺南余邂逅識之徃来相好也其文寔與道俱觀其文則其為人不論可知属意遣詞必存薬石之道或以箴世或以自明体髙而妙詞嚴以精或者以為殆近短澁非也以予觀之正如萬頃之瀾浩然東下崩騰曲折尽水之变终而覆之终数百言爾此其所以為竒天人談妙于元珠四老奕棋于一橘可謂小乎其胸中如此使攄之世則善然自謫而衰運蹇以至於死有志之士所為哀之韓退之謂栁子厚斥不久窮不極其文學詞意必不䏻自力以傳于後使子厚淂所願為将相于一時以彼易此孰得孰失必有䏻辨之者子西謫官七年詩文益多而工其淂失盖類子厚余始疑近古以来文字有傳皆湏科名之崇爵位之顯或大人先生䏻輕重人為世所信者称之其勢足以相因而後傳如子西則不待三者惟太學之士淂其文甲乙相傳爱而録之爱之多而不勝録也鬻書之家遂丐其本而刋焉壬方留意于時斈萬音同律始淂為醇佗文若不適用不足爱乃今不然嗟乎文章果天下公噐子西真豪傑之士太斈誠賢士之関㢤子西與余俱喜詞章山川逺阻則寄語酬唱樽酒會面則論文入㣲又同好出世世間法余常謂子西金屑雖貴着眼成疾文章習氣盍痛掃除雕琢肝腎徒劳人耳子西戯荅曰吾寕尽此生茟硯間寂然之楽俟来世尚未晚也坐客嗑然而笑鳴呼行成於思業精於勤用志不分乃凝于神子西文章博雅超詣執神之机為是故也斈者有意于傳則以先生為法宣和四年五月一日序序予兄子西自齠齔斈為文出言已驚人如賦明妃曲題醉仙崖什上任德翁序之類時年方十四五老師匠手見之無不裭魄落胆及入官以来所著愈多至被謫南遷其文益工然隨作隨散不𣸪留藁故今所存者極少比見京師刋行者止載嶺外所述文隨卷附之庶以廣其傳云昔昌黎文公集其子婿李漢編而序之杜子美詩故相吕公㣲仲為作年譜予與兄手足之爱親炙最乆其編次之意發揮之功庶或㡬於二子焉若夫吾兄子西之文其名之布于天下為搢紳之所欣纂至其撰著或有先後所造或有淺深則覧者當自辨之固不待予言而後知也宣和四年六月日弟庾序眉山唐先生文集序温陵吕荣義德修近世以文集顯於時者文忠公有六一居士集舒王有􅎔川先生集参政吕公有覌文集丞相張公有無盡居士集盖其文如是其官如是雖樵夫野老市井庸人皆䏻道其姓氏而楽誦之故言之易以信而傳之易以廣其勢然也乃若有其官而文不顯有其文而官不顯二者不可兼故其傳之誠难若唐先生者所謂有其文而官不顯者也先生名庚字子西眉州眉山人也绍聖中以進士中第爲州縣官至大觀始入為博士士大夫稍道其文而世亦未尽知之政和𥘉謫居海表流離困苦盖六年而不返然身益窮而文益冨也其後帰京師僦居于景德寺予時與先生比舎而日得見先生之所為文頗尝請其本以傳而先生辞曰予以是得名亦以是得謗可一覧而足不必丐而去也于是不果傳焉退復私念曰先生之文金玉也雖閉藏埋没不求人知然氣㷔光彩乆而必見于世盖所謂不待官而後顯也已昔屈原以離騷顯陶潜以帰去来顯盧仝則以茶歌顯頋當時逹官豈無其人而三子独得顯于世豈非以其文乎今先生之文予知其不乆而遂顯也先生死不一年果有槖其文以来京師者而太斈之士日傳千百本而未已然惜其所傳者止此今始序而藏之庶㡬他日必有得其完本者宣和四年八月十五日序後䟦紹㒷二十一年仲冬左朝奉郎權發遣惠州軍州主𬋩學事兼𬋩内勸農事鄭康佐題政和中先君寺丞赴官潮陽道出鵝城謁國博唐公一見傾盖如平生自是書札徃来無非論文評詩未嘗一語以及俗亊也而道義之交趣尚之同先君固已序之矣淂唐公之文凢四十五首詩賦一百八十有五首唐公甞云吾以是得名亦以是掇謗不欲盡傳之人故所淂止如是而已康佐承乏惠陽暇日閲寓公集盖東坡先生與唐公謫居時著述也唐公之文凢十有二首詩賦一百十首一首與吾先君所傳頗有重𣸪既而進士葛彭年以所藏閩本相示文凡五十六首詩賦二百八十七首較之所見稍加多矣而篇秩殽乱句讀舛訛殆不可辨未㡬又淂蜀于帰善令張匪躬之家文凢一百四十二首詩賦三百有十首較之閩本益加多矣而増損甚少可以取正康佐以郡事倥􅘓遂属敎授王維則讐校旁援博取凢所辨正悉有㩀依而唐公之文遂為全編因其名類勒為三十卷命刻板摹既且将以傳示斈者使知至人必有至文而先生之名可以不朽矣且以成吾家先君友之之義而後世之尚友者愈無窮矣書成矣謹題之篇末眉山唐先生文集縂目魯國先生唐庚著教授王维則較卷之一賦二首古体詩十六首卷之二古体詩六首近体詩三十首卷之三近体詩三十折四首卷之四近体詩三十九首卷之五近体詩二十三首卷之六論四首卷之七論五首卷之八記六篇卷之九記五篇傳一首卷之十傳一首賛二首銘三首卷之十一銘二首三國雜事九則卷之十二三國雜事十則卷之十三三國雜事十四則卷之十四三國雜事三則表一篇書五首序二䟽二卷之十五書一首醮文青詞祭文五墓誌四篇卷之十六行状二賛一銘三首賦二首卷之十七賦一首古体詩二折十折九折首卷之十八古体詩二十七首卷之十九古体詩二十二首卷之二十古体詩五首近体詩二十二首卷之二十一近体詩四十首内挽詞二首卷之二十二近体詩十五首記四篇卷之二十三記二篇書四首卷之二十四書五首表四篇卷之二十五表四篇啓七首卷之二十六啟十七首卷之二十七啟四首序六首辞一首卷之二十八序一篇䟦一檄一諭一䟦尾一雜説五箴二文九卷之二十九祭文八篇䇿題三條卷之三十䇿題十六條書先集後味道者不以聲色論文亦如之道散學非一家言日出而無窮君子病焉昔之人惟其所淂於此而寓之于彼孔子曰盖有不知而作者我無是也荘周曰是其言猶時女也周書諔詭連犿無端崖而自好如此不誣也陶靖莭不仕不隐不以萬物之好易北窓之凉即其詩豈與魏晋同其声色㢤先君自㓜承學于皇大父若與蜀先諸儒異轍也既仕矣始紹聖訖政宣名称益髙身日益困折先君甞謂所知曰後世有揚子雲此𣸪何憾嗚呼昔子雲亦蜀人仕漢不遇比没且無子今其傳非以書故耶且先君視子雲年與位皆未䆒先君有不令不肖之子雖存而書不傳他日徒因其書之遺貭之父兄見聞欲少發其端緒而家难流落𣸪多散逸不果嗚呼尚忍言㢤嘉祐熈寕間皇大父淹有盛名于西南學者争宗師之益昌龍圖閣直斈士陸公詵荐之于朝不報其徒葢與蜀先悵氏蘇氏中分魯至其推明六經謂易詩書始著乹坤君臣夫婦之正礼楽藏諸用春秋謹其変繋辞之旨㣲梦奠不發春秋之作盡獲麟無褒獨推原孟軻氏而挈然負異于諸儒者如此先君年二十擢第四十南遷五十而死其流風甚逺其樹立甚大故其于文率皆懲世漫靡多所矯拂扶雅黜鄭不為苟作當是時如􅍾南風之絃以逰北里雖濫吹雜然衆寡莫敵而平和雅淡之音厭服于人心者且乆而愈信也今其傳如存舊如辨同寔熈豊以来黨事以之如議賞如察言寔崇觀以来邉釁以之宣和中朝京師燕薊始事公因作韓忠惠公傳斥其非㡬以身殉焉是又豈空言㢤嗚呼昔魯大夫臧文仲既殁其言立叔孫穆子曰是謂不朽始先君携束書度嶺閲五年而後帰世皆怜其窮惟其身方擯斥且死而其言率憂深不怨如賛曲江論憫俗君子讀而哀之亦曰是千載之表㣲也先君没後四十餘年羅浮之人乃相與窃窃然尸祝而爼豆之于今不忘然則先君子雲之嘆與叔孫不朽之言所以期之後世者𣸪何如㢤紹㒷歲已夘立春日男左朝奉大夫權知饒州軍州事文若謹書
