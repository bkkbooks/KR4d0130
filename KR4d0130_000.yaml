front:
  text: 眉山唐先生文集叙
  hash: sha256:b875179fbb461dc85d01c08291ad9d152c85f591cc4b3f770cff34a75c104998
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_000-1a}
body:
  text: 奉議郎太府寺丞鄭總大君子所貴於文者以與道俱而已詩以道志春秋以導名分易以導隂陽此之謂道易順而書險詩葩而春秋質書之全經不用也守而詩𣸪須韵以成章此之謂文文非道無以立訓而垂世道非文無以示人而行逺堯舜禹湯周孔孟氏皆明道立訓之文雖秦火洞然傳之不絶其後楊雄韓栁之徒𣸪著書䏻文栁雖少時嗜進不擇所附以至于僨然䏻學道自勵贖咎前非其文攻砭世育有𥙷教化故卒配韓以傳若士之見道不明與雖明而無守文不主道但求其工或道有不足其文僅䏻給用非沛然有餘無以自立自著則雖聞于一時亦不傳于後世然則文之與道如耳有聰目有明血有氣形有神要之不可斯須違離然後尽善此學者所當知也眉山唐先生名庚字子西政和中謫官嶺南余邂逅識之往來相好也其文實與道俱觀其文則其為人不論可知屬意遣詞必存藥石之道或以針世或以自明體髙而妙詞嚴以精或者以為殆近短澀非也以豫觀之正如萬頃之瀾浩然東下崩騰曲折尽水之變終而覆之終數百言爾此其所以為竒天人談妙于元珠四老奕棋于一橘可謂小乎其胸中如此使攄之世則善然自謫而衰運蹇以至於死有志之士所為哀之韓退之謂栁子厚斥不久窮不極其文學詞意必不䏻自力以傳于後使子厚淂所願為將相于一時以彼易此孰得孰失必有䏻辨之者子西謫官七年詩文益多而工其淂失蓋類子厚余始疑近古以來文字有傳皆須科名之崇爵位之顯或大人先生䏻輕重人為世所信者稱之其勢足以相因而後傳如子西則不待三者惟太學之士淂其文甲乙相傳愛而録之愛之多而不勝録也鬻書之家遂丐其本而刋焉壬方留意于時學萬音同律始淂為醇他文若不適用不足愛乃今不然嗟乎文章果天下公器子西真豪傑之士太學誠賢士之關哉子西與余俱喜詞章山川逺阻則寄語酬唱樽酒會面則論文入微又同好出世世間法余常謂子西金屑雖貴著眼成疾文章習氣盍痛掃除雕琢肝腎徒勞人耳子西戲答曰吾寧尽此生茟硯間寂然之樂俟來世尚未晚也坐客嗑然而笑鳴呼行成於思業精於勤用志不分乃凝于神子西文章博雅超詣執神之機為是故也學者有意于傳則以先生為法宣和四年五月一日序序豫兄子西自齠齔學為文出言已驚人如賦明妃曲題醉仙崖什上任德翁序之類時年方十四五老師匠手見之無不裭魄落膽及入官以來所著愈多至被謫南遷其文益工然隨作隨散不𣸪留藁故今所存者極少比見京師刋行者止載嶺外所述文隨卷附之庶以廣其傳云昔昌黎文公集其子壻李漢編而序之杜子美詩故相吕公微仲為作年譜豫與兄手足之愛親炙最久其編次之意發揮之功庶或幾於二子焉若夫吾兄子西之文其名之布于天下為搢紳之所欣纂至其撰著或有先後所造或有淺深則覽者當自辨之固不待豫言而後知也宣和四年六月日弟庾序眉山唐先生文集序溫陵吕榮義德修近世以文集顯於時者文忠公有六一居士集舒王有􅎔川先生集參政吕公有觀文集丞相張公有無盡居士集蓋其文如是其官如是雖樵夫野老市井庸人皆䏻道其姓氏而樂誦之故言之易以信而傳之易以廣其勢然也乃若有其官而文不顯有其文而官不顯二者不可兼故其傳之誠難若唐先生者所謂有其文而官不顯者也先生名庚字子西眉州眉山人也紹聖中以進士中第為州縣官至大觀始入為博士士大夫稍道其文而世亦未尽知之政和𥘉謫居海表流離困苦蓋六年而不返然身益窮而文益冨也其後歸京師僦居于景德寺豫時與先生比舍而日得見先生之所為文頗嘗請其本以傳而先生辭曰豫以是得名亦以是得謗可一覽而足不必丐而去也于是不果傳焉退復私念曰先生之文金玉也雖閉藏埋沒不求人知然氣㷔光彩久而必見于世蓋所謂不待官而後顯也已昔屈原以離騷顯陶潜以歸去來顯盧同則以茶歌顯顧當時逹官豈無其人而三子獨得顯于世豈非以其文乎今先生之文豫知其不久而遂顯也先生死不一年果有槖其文以來京師者而太學之士日傳千百本而未已然惜其所傳者止此今始序而藏之庶幾他日必有得其完本者宣和四年八月十五日序後跋紹興二十一年仲冬左朝奉郎權發遣惠州軍州主𬋩學事兼𬋩內勸農事鄭康佐題政和中先君寺丞赴官潮陽道出鵝城謁國博唐公一見傾蓋如平生自是書札往來無非論文評詩未嘗一語以及俗事也而道義之交趣尚之同先君固已序之矣淂唐公之文凡四十五首詩賦一百八十有五首唐公嘗云吾以是得名亦以是掇謗不欲盡傳之人故所淂止如是而已康佐承乏惠陽暇日閲寓公集蓋東坡先生與唐公謫居時著述也唐公之文凡十有二首詩賦一百十首一首與吾先君所傳頗有重𣸪既而進士葛彭年以所藏閩本相示文凡五十六首詩賦二百八十七首較之所見稍加多矣而篇秩殽亂句讀舛訛殆不可辨未幾又淂蜀于歸善令張匪躬之家文凡一百四十二首詩賦三百有十首較之閩本益加多矣而增損甚少可以取正康佐以郡事倥􅘓遂屬教授王維則讐校旁援博取凡所辨正悉有據依而唐公之文遂為全編因其名類勒為三十卷命刻板摹既且將以傳示學者使知至人必有至文而先生之名可以不朽矣且以成吾家先君友之之義而後世之尚友者愈無窮矣書成矣謹題之篇末眉山唐先生文集總目魯國先生唐庚著教授王維則較卷之一賦二首古體詩十六首卷之二古體詩六首近體詩三十首卷之三近體詩三十折四首卷之四近體詩三十九首卷之五近體詩二十三首卷之六論四首卷之七論五首卷之八記六篇卷之九記五篇傳一首卷之十傳一首贊二首銘三首卷之十一銘二首三國雜事九則卷之十二三國雜事十則卷之十三三國雜事十四則卷之十四三國雜事三則表一篇書五首序二疏二卷之十五書一首醮文青詞祭文五墓志四篇卷之十六行狀二贊一銘三首賦二首卷之十七賦一首古體詩二折十折九折首卷之十八古體詩二十七首卷之十九古體詩二十二首卷之二十古體詩五首近體詩二十二首卷之二十一近體詩四十首內挽詞二首卷之二十二近體詩十五首記四篇卷之二十三記二篇書四首卷之二十四書五首表四篇卷之二十五表四篇啓七首卷之二十六啓十七首卷之二十七啓四首序六首辭一首卷之二十八序一篇跋一檄一諭一跋尾一雜說五針二文九卷之二十九祭文八篇䇿題三條卷之三十䇿題十六條書先集後味道者不以聲色論文亦如之道散學非一家言日出而無窮君子病焉昔之人惟其所淂於此而寓之于彼孔子曰蓋有不知而作者我無是也莊周曰是其言猶時女也周書諔詭連犿無端崖而自好如此不誣也陶靖莭不仕不隱不以萬物之好易北窗之凉即其詩豈與魏晋同其聲色哉先君自幼承學于皇大父若與蜀先諸儒異轍也既仕矣始紹聖訖政宣名稱益髙身日益困折先君嘗謂所知曰後世有揚子雲此𣸪何憾嗚呼昔子雲亦蜀人仕漢不遇比沒且無子今其傳非以書故耶且先君視子雲年與位皆未䆒先君有不令不肖之子雖存而書不傳他日徒因其書之遺質之父兄見聞欲少發其端緒而家難流落𣸪多散逸不果嗚呼尚忍言哉嘉祐熙寧間皇大父淹有盛名于西南學者爭宗師之益昌龍圖閣直學士陸公詵荐之于朝不報其徒蓋與蜀先悵氏蘇氏中分魯至其推明六經謂易詩書始著乾坤君臣夫婦之正禮樂藏諸用春秋謹其變繫辭之旨微夢奠不發春秋之作盡獲麟無褒獨推原孟軻氏而挈然負異于諸儒者如此先君年二十擢第四十南遷五十而死其流風甚逺其樹立甚大故其于文率皆懲世漫靡多所矯拂扶雅黜鄭不為苟作當是時如􅍾南風之絃以逰北里雖濫吹雜然衆寡莫敵而平和雅淡之音厭服于人心者且久而愈信也今其傳如存舊如辨同實熙豐以來黨事以之如議賞如察言實崇觀以來邉釁以之宣和中朝京師燕薊始事公因作韓忠惠公傳斥其非幾以身殉焉是又豈空言哉嗚呼昔魯大夫臧文仲既殁其言立叔孫穆子曰是謂不朽始先君携束書度嶺閲五年而後歸世皆憐其窮惟其身方擯斥且死而其言率憂深不怨如贊曲江論憫俗君子讀而哀之亦曰是千載之表微也先君沒後四十餘年羅浮之人乃相與竊竊然尸祝而爼豆之于今不忘然則先君子雲之嘆與叔孫不朽之言所以期之後世者𣸪何如哉紹興歲已卯立春日男左朝奉大夫權知饒州軍州事文若謹書
