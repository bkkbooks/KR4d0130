front:
  text: 眉山唐先生文集卷二十七
  hash: sha256:c373db52925afd6f7be8af793b5eb7a24660eba0ca8eed11cbf490b5d13a474f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_027-1a}
body:
  text: 眉山唐庚子西啓謝陳使君啓剖封七邑歲薦二人首及庸虛良深感愧伏念某偹貟百里至是再期因其俗之所安豈能易俗齊以刑而未肅矧敢去刑惟其守拙以無他所以見稱于不優本來事簡非聼斷之無留適值歲豐致賦輸之僅集以何功效致此品題此蓋伏遇某官以鄉先生為郡刺史土地民政淂諸侯之寶三敬義思恭有君子之道四憫憐椎魯權録羈單所學背時雖不侔于枘鑿此身末世或有望于桑榆論報殊私當期後日答解元謝啓篆刻舊人望經郛而未見眩昏老眼豈文鍳之䏻精偶為國以淂賢則因人而成事尚期勉勵前膺縻爵之榮益使衰遲坐獲知人之譽百函拜賜十襲藏珍謝及第啓射䇿楓宸已甘退黜苐名桂籍尚獲采收叨𬒳寵榮惟知感慨切以文章君子之餘事忠義天下之大間國之休戚不係于文章士之進退莫先于忠義方天子臨軒而䇿士豈徒求摛􅍾之革而諸儒充賦以在庭蓋亦取切時之論欲考終身之莭必觀筮仕之𥘉冝有讜言少禆睿聼如者少不好學老方讀書左右圖史者十年涉獵經傳者萬卷壯心浸癖竇性成癡雖古今成敗之原粗知其略而篆刻雕蟲之學本非所長妄意揀金謾來市璞青天萬里堪嗟蜀道之難白雪一聲難和郢中之曲笙竽異好水石難投自知與世不諧幾欲拂衣而去因緣附驥僥幸化鵬入瞻天日之光親奉絲綸之詔周詢要務兾獲至言顧為學之荒踈愧乎無𥙷若與時而高下誠所不為姑盡莭以惓惓寧抱關而碌碌夫何獻白亦預拾青兹蓋伏遇某官匠石群材鈞鎔衆窳與人不求偹嘉善矜不能苟有寸長未加尺退謂其辭雖鄙訥論不將迎棄在邉庭必䏻褁尸于馬革置之言論必碎首于龍墀薄示甄收或堪器使敢不氷霜志􅍾金石肝腸獄訟簿書豈辭勞于今日功名事業將有望于他年庶免小人之歸永為國士之報答通判趙承議啓代伏審寵膺睿渥榮佐郡符伏惟慶慰恭惟某官宦路老成士流先逹才䏻通敏學術深醇評三尺之祥刑已資口案贊六條之善治豈動心機曽稱慶之未遑遽貽音之見及何承謙挹惟有銘藏雜文送苗師顔序崇寧元年冬興元軍士有怨其守費詵者走益昌上變告詵叛益昌守淂之惶惑夜半遣吏馳出城趨興元捕反虜即日以事聞傳檄郡國拘其親屬後旬日詵面縛至并就逮者數十人悉首幪係獄窮治反狀自冬迄夏纍月無所淂首鼠不决朝廷疑之遷其獄於鳯翔而天興宰苗君師顔實領其事時二年六月也詵既檻就道所至發卒鳴鼓圍繞護送人皆意詵不䏻自白而詵亦自度必死暨至岐下一問而淂實八日而獄具詵無毫髮罪即日破械出之告者用赦竄海外詵之出也感慨悲泣觀者顧指歡呼道路喧傳一日萬口而師顔之名遂滿天下吾嘗論詵之不死其所繫豈小哉向使一夫流言二千石族誅以死則士大夫必將姑息吏卆誰敢控制而使令厮役皆淂以脅制其主非朝廷之明白師顔之俊偉則縉紳之禍豈獨詵而已哉漢時治獄必取通經術知古誼者不可謂無意也後二年豫官鳯翔師顔為治中淂從之遊每服其為人而興元之事昔常欲作傳而未果于其歸也因以為之序上錢憲雜文序憲使錢公按益昌命某獻其所為文意將有以教之也承命欣躍退求平生所業而多難淪失存者無幾其間復有俳諧者放蕩者觸時忌者不近道者妄論天下利害非所當言者文多不足録者為故𥿄糊窗首尾訛缺莫可考者率皆削去淂古賦一首漢漂母碑一首竹軒記一首古樂府二首近體詩一十九首并序為二十五首以獻噫士之自鬻非古也惟某不䏻自鬻以取困于時然亦以此淂出于門下而公亦信其決非自鬻者庶幾可以受教而無嫌焉謹序李生方書序周官硩簇氏掌覆夭鳥之巢庭氏掌射國中之夭鳥吾少時讀書至此未嘗不窈笑以為不急之務也後讀聖惠方言有鳥夜飛謂之無辜小兒衣服遭之輒以感疾因以無辜名之狀如五疳吾以是知夭鳥之害有如此者非獨如鄭氏所謂鶚鵩之類而昔人所以力去者亦自有旨非獨如鄭氏所謂國中潔清而已夫硩簇氏庭氏之所去者雖不專指無辜而無辜之出于斯時者亦無所容其跡雖未必䏻盡誅要當驅而出之于九州四海之外而不淂以為害斯周公所建置果不可謂不切于事也周道衰二官之職廢物之神奸遂淂以滋息􅉼飬于天地之內數千百年愈久而愈不可去故夭鳥之巢往往有之而世終莫之識雖識亦莫如之何當此之時李生以善醫無辜專門名家于秦隴間其功利豈少㦲生出論數十篇示余而求文以為序吾聞扁鵲入秦為小見醫生豈淂其書乎何其術之妙也年月日序送王觀復序紹聖丙子歲豫官益昌始從吾友王硯𣸪逰方是時其文已如擊石拊石誠非世俗之樂獨音莭未和爾其後四年相㑹于南隆𣸪淂其文讀之遂覺雍容調暢取意論事益有條緒庶幾乎八音克諧無相奪倫者豫方聳然異之求其說而未淂或者便謂涪翁在觀𣸪以書相切磨涪翁之相與反覆論書栁子厚效淵明古體詩十數解示之文章低昻踈密之莭疑其有淂于此是未必然觀𣸪比來日益就道蓋更事愈多見善愈明少年鋭氣掃滅殆盡收斂反約漸有歸宿冝其見于文字者如此吾何以知其然也人之精神何與于琴而幾動于心則聲應乎指自然冥合有不可詰者而况于文乎文生于氣氣熟而文和此理之决然無足怪者蓋涪翁所告者法也余所論者理也告之以法而觀𣸪又日進于理今其歸也自言從蘇子于湘南過涪翁于冝城又將盡淂其所謂法者則觀𣸪之于文豈特如是而已耶觀復其勉之哉鄭默字序鄭子以其名默求字于余余為之說曰韓非作說難竟以說死箕子過啇欲哭而不敢梁子作五噫之歌明帝聞而非之近歲蔡常山以笑貶海上甚矣處世之難也言笑歌哭皆有所禁則子之欲默也冝哉雖然孟子不與右師言右師不說由是言之默遂可以免乎字之曰時言上任德翁序時年十五薛郡任公之教授通義也士之曵長𥚑服方領抱書束帶優遊于泮宫者𢾗百人英俊豪傑往往輩出有少年書生曰唐某者誦書不甚多屬文不甚工碌碌落落無可稱者一日持一軸書掉三寸舌草衣麻屨攘𬒮登門危言髙論不顧忌諱公一見而嗟異之再見而禮貌之三見而憐惜之勸戒勤篤教諭欵密某處之而不䏻自安退而咨之于客曰公于我厚矣吾將圖報矣吾欲脅肩諂笑巧言令色以順適其意以是報公可乎客曰不可是小人之報也吾將抱長劔挾匕首有惡聲至者以血濺其襟以是報公可乎客曰不可是俠客之報也吾將淬文鋒礪辭鍔庶幾超騰奮躍髙飛逺舉于天下指之曰斯人也出于任公之門以是報之可乎客曰唯唯是國士之報也某因書以為序招隱辭出左綿城南度涪水至南山下並江而東行三四里有居氏數十家以捕魚為生世不易業不知其幾千百年古木參天自江北望之鬱然幽深圖經號漁父村蓋昔時涪翁隱居處也吾泛舟至其下未嘗不悠然遐想慷慨嘆息徘徊不忍去世言前代隱士大率多虛名少實效此誠有之然不可一槩以此量天下士蓋昔人論隱士者必首稱涪翁河上丈人二人之道實並駕而齊驅者也河上丈人教安期生安期生教毛翕翁毛翕翁教樂瑕翁樂瑕翁教樂臣公樂臣公教蓋公蓋公教平陽侯曺參為漢相國而髙惠之間天下無事民務稼穡衣食滋殖蓋自河上丈人至曺參更六七傳授受失真去祖風益逺而措之天下已竒偉卓絶如此使齊驅並駕者得行其意獨不能處其君堯舜乎河上丈人之裔嘗一顯于時而涪翁之後獨無其人然江鄊澤國安知其果無有也試為長言以招之其辭曰子誰友兮涪之雲出為雨兮澤斯人子誰親兮涪之水朝於海兮日千里趣子之駕兮捨子之舟子不我信兮與雲水謀眉山唐先生文集卷二十七眉山唐先生文集卷二十七目唐庚子西啓謝陳使君啓答解元謝啓謝及第啓答通判趙承議啓雜文送苗師顔序上錢憲雜文序李生方書序送正觀復序鄭默字序上任德翁序招隱辭
