  text: 眉山唐先生文集卷二十二
  hash: sha256:9179b682565fb38731ab9ccec4bd6432317c210bbc4e08545fac2e7b3fb096dd
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_022-1a}
body:
  text: 眉山唐庚子西近体詩書新堂叠茅重葦一堂新設榻聊安簿領身落枕不知鶯樹暁汚書長苦燕泥春獄官何預青苗事野意新一作深便白葛巾䏻向此間時得趣何須分外拜車塵自笑二絶其一案頭故𥿄如撥山三年祗有馬上閑貴官眼髙不觧顔緊推不去何其頑其二平生所學盡虚談為吏文書百不諳喚作參軍真浪漫軍中底事更湏參除夕感懐永漏侵春己数籌地爐猶擁木綿裘無心豈畏三尸訴爱日還驚一歲休故國二千空醉眼新年三十恰平頭光隂未用相敦迫領取衰翁兩鬂秋金牛驛二絶其一秦人虚餌方投釣蜀國痴魚已上鈎天與中原通笮馬人間何處有金牛其二由来仁義行終稳到了權謀術易窮纔見詐牛收劒外已聞真鹿走関中春日郊外城中未省有春光城外榆槐已半黄山好更冝餘積雪水生㸔欲倒垂楊鶯邊日暖如人語草際風来作藥香疑此江頭有佳句為君尋取却茫茫嘉陵江上作多士数車舥誰令汝去家坐舡腰已折持劔手新义雖未能空寂猶然耻攫拏江流何䖏去慿仗弔懐沙自笑已白窮經首仍丹許國心那䏻天𥙷綻更欲海填深児餒嗔郎罷妻寒望藁砧世間南北路何用爾霑襟率諸公飲開元寺勉翁有詩囙為之次其韵三伏光隂過𥘉秋宇宙新一杯桐馬酒千古竹林人坐上七人山入永嘉屐蟻浮彭澤巾悲歌送落日為我少停輪直舎夜坐強仕似㓜學細書仍短檠月来吟處白風及醉時清坐乆露㣲濕更深秋有聲不知愁底亊終夕自悲鳴上張安撫一劔縱横敵萬夫少年功業負雄圖時平不佩将軍印任重来分刺史符膝上細絃調雅操塞前蛮柵長平蕪自慚子美詩才妙难咏花卿絶世無春日今日天涯又見春與春事契合相親君㸔四十年来亊只有東君是故人任滿未聞除代已媿千名佛何堪一卷師千年駒局促萬亊燕差池館下諸生笑門東稚子飢賓僚眼前換歲月鬂邊馳子舎行将去吾車亦已脂謂當魚縦􅊤猶作鳥黏黐宿有詩書債非関造化児岷峨吾故國自合去遲遲次勉翁送客韵仕宦方誇四十强江山那復恋蒼茫征鞍過我横春色别酒斟君釂野芳青史功名時執手紅塵岐路一愁腸神錐可是藏鋒物要使兒曹㸔脱囊記重修思政堂記並嘉陸而南至于大江置守者七而閬中最為名郡後唐長㒷元年始建保寕莭度國家因之為安德軍其山川形勢郛郭衢路制度宏逺隐然有大國之風絲塩之利舟楫之便可以通四方商賈冝其民力冨饒足以自楽然城中無名園甲舎非冨家大姓不用瓦屋閭閻凋踈弥望䔥然其儉嗇如此豈其風聲氣俗自古然耶抑起于近代而莫推其所自也太守之居盖前日莭度使之所治園囿至廣而亭榭至少賓客徃来無燕劳館犒之地殆不類夫所謂莭鎮者上下習熟恬不經意元符元年𬋩城虞公来守是邦明年始作整暇堂壮大華好為一路偉覌而堂之直北舊有思政堂規模劣小不称其名既為整暇所形猶覺蕞然無復氣槩公頋而嘆也曰頭重足弱項背不相副可乎徹而崇之逾年一新然後二堂相望雄傑相應吏民觀之有以知刺史之尊而專城為可楽也是歲某為閬中宰屡尝謁公于堂公道其所以然而求文以為記某聞古人有言俗奢則示之以儉俗儉則示之以礼今閬人以儉為俗乆矣恐其流而入于固也公既示之以好悪如此庶㡬少变而合于礼欤是真不可以不書若夫立名之意則見于前守董公所記彼固又自有説焉故吾之所及不復論次之愚齋記元符三年洛陽蘇公通守南隆治書室于廳事之東偏名之曰愚齋而属某為之記某言于公曰愚有䓁級公将安處也有顔子之愚有髙柴之愚有寗武子之愚楊子以晁錯為愚栁子厚自以為愚顔子之愚老子所謂盛徳者也髙柴之愚中庸所謂不及者也寗武子之愚則詩所謂亦維斯戾者也晁錯之愚則語所謂古之直者也若夫栁子厚之愚則亊載方冊有不可誣者文章學術為當代所宗自唐以来論當時大儒則必稱韓栁而自以為愚可乎然正元之黨婦人女子皆知其必敗而栁子獨不悟也謂之不愚可乎是数子者其愚固有䓁級公将安處也以為髙柴之愚其才非不及于道以為寗武子之愚則生非不逢于時以為晁錯之愚則無吴楚之变以為栁子厚之愚則無伾文之事厶将䖏公以顔子之愚則公豈有意乎公平生聚書萬卷手不停披既已自得于心矣推其緒餘以教諸子皆卓然有立其長子大夀以文學知名于時而公猶以愚自處此真有意于謂盛德者欤傳曰睎顔之人亦顔之徒公何辞焉請以是為記陳子美竹軒記君子之所好有不可以常理詰者珠玉犀象世俗之所共好而必争者也未尝一日介意而竹之為物扶踈抗直非有妖䴡嫵媚可以移人之意此草木之簡静淡泊者然自晋以来賢人君子皆有是癖以此君為一日不可無雖假舘托宿必種而猶以為未足復以墨象其形容置之屋壁寝食必对作為賦詩以称道其風莭以誇耀于世前世之士如七賢六逸之徒皆有英偉絶人之才而一接于竹則脱去世故終身與之周旋而不返嗚呼是豈可以常理詰哉予友陳子美趋向髙逺于世味甚薄凡世俗之好者畧不經意而特蔽于竹所至私居官舎常飬竹以自適自謂性與竹会不知其所以然前日始到官周視廨宇而書室之外竹軒森然龍騰劔㧞得其所好驚喜失聲葺之踰年軒檻一新而竹亦愈茂時與賓客僚友飲酒笑楽于其間方其得意于竹也凝神終日玩味吟嘨忻然相对而不知其隐几者其所好如此冝其求文為記愈却而愈勤也夫捨俗之所好而獨好其所好是亦蔽于物而已雖然苟未至于無物則子美之所好與夫世俗之所好者盖亦有間云箕踞軒記箕踞者山間之容也拳腰聳肩抱膝而危坐傴偻跼縮其圓如箕故古人謂之箕踞便于賦詩便于閲書便于長嘨其势如蹲猿如投竿而漁者盖長松之下灘石之上放然不拘礼法者之所為也以之事上則不恭以之􅎔下則不荘以之待賢者則有所不可以之遇衆人則有所不敢古之士大夫矜名檢餙邊幅者皆鄙而不為予今以五斗紅腐置身于憂患之埸是非利害洶洶百出以一身之微受無窮之責目視上帶則輙取怪怒方且遠讒畏譏䂓䂓然從視于礼法柔声和容歛版罄折拜揖跪起以取媚於世惟恐其不悦而以箕踞名軒豈不異㢤盖官舎之西舊有軒数間直堂屋之後人事之所不及賓客従逰之所不至徃徃獨逰于此觧衣盤薄箕踞于胡床之上含爪賦詩曝背閲書以釋其忽忽不平之氣􅎔風長嘨而草木為之䔥然足以見其誕率如此而猶有所畏雖有所畏而誕率之性終不䏻少貶亦施之處已而不以接物則庶㡬其無患也故以箕踞名之而為文以見其所以名之之意年月日記眉山唐先生文集卷二十二眉山唐先生文集卷二十二目唐庚子西近体詩書新堂自笑二絶其一其二除夕感懐金牛驛二絶其一其二春日郊外嘉陵江上作自笑率諸公飲開元寺勉翁有詩因為之次其韵直舎夜坐上張安撫春日任滿未聞除代次勉翁送客韵記重修思政堂記愚齋記陳子美竹軒記箕踞軒記
