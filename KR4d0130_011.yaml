front:
  text: 眉山唐先生文集卷十一
  hash: sha256:57598d2a83b4d5b860338fe1fdf916f360f3dbca0f9d82e5e7f6f4cc9642efac
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_011-1a}
body:
  text: 眉山唐庚子西銘船娘銘船娘吾幼女也政和五年吾發惠州次番禺艤舟滄浪之亭而女于是乎生明年至江陵寓居于沙頭而女于是乎死是夕瘞于鶴鳴寺之南其生也以十月初三日其死而瘞之也以五月二十六日凡居人世二百三十有三日其將瘞也其母黎氏持而哭之曰兒玉也捨我安之乎吾即其語而為銘曰空空如谷何以得此玉終非作福未幾而毁于櫝黎氏權厝銘侍女黎氏楊越人八年隨吾遵海濱丁酉北歸至江津一疾即死不及伸月實丙午日壬寅葬之未可携莫因權厝于此有子存何以識之考斯文三國雜事序上自司馬遷史記下至五代史其間𢾗千百年正統偏伯與夫僣竊亂賊甚微至弱之國外至蠻夷戎狄之邦史家未有不書其國號者而三國志獨不然劉備父子相繼四十餘年始終號漢未嘗一稱蜀其稱蜀者流俗之語耳陳夀黜其正號從其俗祢循魏晋之私意廢史家之公法用意如此則其所書善惡褒貶與奪尚可信乎魏晋之世稱偹為蜀猶五代稱李璟為吳稱劉崇為晋矣今五代史作南唐比漢世家未嘗以吳晋稱之獨陳夀如此初無義例直狥好惡耳往時歐陽文忠公作五代史王荆公曰五代之事無足采者此何足煩公三國可喜事甚多悉為陳壽所壞可更為之文公然其言竟不睱作也惜㦲三國雜事篇上諸葛丞相為後主寫申韓𬋩子六韜各一通學者責孔明不以經術輔導少主乃用六韜𬋩子申韓之書吾謂不然人主不論撥亂守文要以智略為先後主寬厚仁義襟量有餘而權略智調是其所短当時識者咸以為憂六韜述兵權竒計𬋩子貴䡖重任權衡申子核名實韓子引繩墨切事情施之後主正中其病矣藥無善惡要以對病為妙万金良藥與疾不相值亦復何有𥙷哉法正為蜀郡太守楊武將軍一飯之德睚眦之怨無不報復或言其太橫亮曰主公之在公安也進退狼跋賴孝直為輔翌今翻然翶翔不可復制如何禁止使不得行其意邪孫盛評曰威福自下亡國之道安可以功臣而極其凌肆諸葛氏之言于是失政刑矣秦昭王以范睢之故至質平原君移書趙王以購魏齊之首李廣誅霸陵尉上書自劾武帝詔曰報恩復仇朕之所望于將軍也復何疑哉國初郭進為山西巡檢民訴進略奪其女太祖怒曰汝小民也配女當得小民今得吾貴臣顧不可耶驅出之而三人者卒皆有以報國古之英主所以役使豪傑彼自有意義若孫盛之所見其亦小矣董昭建議曺公冝進爵國公九錫偹物以彰殊勳荀彧稱曺公興師本為朝廷君子愛人以德不冝如此曺公由是不平彧以憂死論者曰彧叶規曺氏以傾漢祚晚莭立異無救運移管仲相御名公伐山戎伐陳蔡伐楚伐晋其志欲尊周爾而御名公遂有封禪之志文若依曺公平青徐平許洛平河朔平漢南其志欲尊漢耳而曺公遂有九錫之議𬋩仲知封禪之不可許也故設詞以拒之文若知九錫之不可長也故遜詞以却之𬋩仲幸故公從其說以全勤王之功文若不幸故曺公不用其語以成竊國之禍其終始幸不幸異耳用心豈不同耶論者何淂非之華歆邴原𬋩寧相善時人號為一龍歆為首原為腹寧為尾魏略云邴原管寧皆盛德之士而歆為之首則歆之為人可知矣然漢書稱伏后之廢操使歆勒兵入宫收后后閉户匿壁中歆破户發壁而入此豈盛德之士哉操雖奸雄然用人各當其理方是之時魏氏群臣如董昭夏侯惇賈詡程昱郭嘉之流為不少足以辨此何至使歆為之歆果賢邪操决不敢以此使之以此事操則歆决不淂為賢者陳夀作原傳稱少與𬋩寧俱以操尚稱初不及歆至作寧傳又稱與原歆相友豈三人相友而歆獨無操尚乎朋友出處不齊理冝有之操尚不同則非所以為友矣此豫之所未解也建興五年丞相亮出屯漢中是歲丁未魏之太和元年吳之黃武六年也魏明帝即位既己踰年君臣無間前此吳人攻夏口圍石陽不克是歲保境不動初孔明說先主以保有荆益西和諸戎南撫夷越外交孫權內修政理天下有變則遣上將向宛洛而將軍身出秦川則伯業可成漢室可興矣孔眀始議如此至是天下寧有變耶而遽有此舉何哉曺公征烏丸遣使辟田疇疇戒門下趨嚴州人問曰昔袁公禮命五至而君不屈今曺公使一來而君若恐弗及何也疇笑曰此非爾所知也即隨使者到軍或曰田疇辭聘于袁氏從辟于曺公門人怪之疇矣而不答何也曰難言也昔漢明帝問于吳良曰先帝召卿不至反從驃騎逰耶良曰先帝以禮待下故臣得以禮進退驃騎以法檢下故臣為法屈爾疇之用意蓋亦如此是時袁氏政寬故疇可得不至曺氏刻急故疇不敢不來來非慕義故終身不受封爵疇雖不言而言無不在其中矣曺公定鄴祠袁紹墓哭之流涕孫盛評曰先王誅賞將以懲勸而盡哀于逆臣之冢為政之道躓矣匿怨友人前哲所耻稅驂舊館義無虛涕道乖好絶何哭之有漢祖失之于項氏曺公遵謬于此舉百慮之一失也禹見刑人于市下車而哭之况劉項受命懷王約為兄弟而紹與􅋵少相友善同起事而紹又盟主乎繼道乖好絶至于相傾然吾以公義討之以私恩哭之不以恩掩義亦不以義廢恩是古之道也何名為失哉孫氏之論非但僻學也蓋亦可謂小人矣章武三年四月先主崩于永安宫五月後主襲位于成都改元建興人君繼體踰年改元而章武三年五月改為建興此陳夀所以短孔明也以吾觀之似不為過古者人君雖立尚未即位也明年正月行即位之禮然後書即位而稱元年後世承襲之初固已即位矣稱元不亦可乎故曰不為過也古者人君襲位未踰年不稱君故子猛不書王子般子赤不書公後世承襲之初固已稱君矣稱元不亦可乎故曰不為過也春秋之時未有一年而二名者如隱公之末年既名之為十一年矣不可𣸪名為御名公元年自紀元以來未有一歲而再易者矣有一歲而三四易者矣豈復以二名為嫌而曰不可乎故曰不為過也非特此也今之所謂元年與古異矣古之所謂元年者某君之一年也故必踰年而後稱之如前所云後世所謂元年者其號之一年耳嗣位而稱之可也踰年而後稱之亦可也建安十三年曺公自江陵征偹至赤壁與偹戰不利退保南郡世之為將者務多其兵而不知兵至三十萬難用矣前代以六十萬勝楚以四十萬勝秦唯王翦項籍二人而多多益善者惟韓信能之自餘兵至三十萬未有得志者趙括以四十五萬敗于長平漢初合五諸侯兵五十六萬敗于彭城以三十萬困于白登王恢引三十二萬伏馬邑無功王邑以百萬敗于昆陽黃中以百萬敗于夀張苻堅以八十萬敗于合肥隋以九十萬敗于遼東其衆愈多其敗愈毒然猶有可諉者曰將不善若曺公可謂善將矣𣸪以水軍六十萬號稱八十萬而敗于烏林是時戰艦相接故為敵人所燒大衆屯聚故疫死者幾半此兵多為纍之明驗也以髙祖之才不過能將十萬則水軍六十萬必得如髙祖者六人乃能將之髙祖豈易得哉其敗也固冝眉山唐先生文集卷十一目唐庚子西銘船娘銘黎氏權厝銘三國雜事序三國雜事篇上諸葛丞相為後主寫申韓管子六韜各一通法正為蜀郡太守楊武將軍一飯之德睚眦之怨無不報𣸪董昭建議曺公冝進爵國公華歆邴原𬋩寧相善時人號為一龍歆為首原為腹寧為尾魏略云建興五年丞相亮出屯漢中曺公征烏丸遣使辟田疇疇戒門下趨嚴州曺公定鄴祠袁紹墓章武三年四月先主崩于永安宫五月後主襲位于成都改元建興建安十三年曺公自江陵征偹至赤壁與偹戰不利退保南郡
