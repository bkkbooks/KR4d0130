front:
  text: 眉山唐先生文集卷二十六
  hash: sha256:c9b83da6acf930d74964b90f53b024ad65d338c9b784d75285e03f2b8ad5b3a8
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_026-1a}
body:
  text: 眉山唐庚子西啓賀馬學士啓伏審光奉宸恩榮升册府除目流布士類􅌚騰伏惟某官望重賢關名髙英彀才適邦家之用識窮道德之微簡在上心重已千之宿學延登客省正門五之闕文蓋朝廷以待于清流而鄉相多由于此出愧郵傳之既晚致慶牘之稍稽賀楊運判啓伏審寵􅈾宸命榮抱使權爰擇剛辰已諧禮卜凡叨屬部舉切歡悰某纍任劔東粗知民俗雖人貧地瘠顧歲入之不饒而吏祿軍儲亦年計之足用倘貨源之不遏宜利孔之並興馴致羡餘式資經畫恭惟某官才猷強濟術略疏通入握省蘭已振望郎之譽出持漕莭用昭煩使之能諒生財之有方不加賦而自給佇騰最目行陟華途某方隸旄麾敢論瓜葛雅故未忘于一日庇庥尚賴于二天􅌚怍所叢端倪曷喻賀楊提刑啓伏審光􅈾寵渥移爾祥刑使選愈華僉引允慰恭惟某官道心藴粹德性稟純氣有飬而益完術無施而不可以才自進容無待于後先中道而行時不分于彼此逮兹顯擢殊慰輿情乘傳出關已嗣棄繻之志過家上冡益知晝錦之榮先聲播騰屬部澄肅某方欲𫐠具利害塵凂聰明若使遷延期月之間必能聼用芻蕘之説遽聞移命今復何言仰望飛騰永言欣懌賀新提舉啓伏審祗􅈾誥綸肅持使斧士流稱慶輿論悉同伏惟交代某官真性稟醇道心飬粹學造天人之理識窮性命之微荐履儒官夙著朝望億萬橋門之士景仰餘輝三千闕里之徒爭傳緒論將以淵源之素施于政事之間爰自講筵出􅈾使指某偶緣幸會黍作交承即諧傾蓋之歡愈切望塵之意賀王安撫啓伏承令嗣新恩祕書榮登者充賦外臺已居前列苐名丹陛復處上遊氣類增光縉紳共慶切以西漢解頥之士止淂丙科元和大手之文猶頃三上况天下承平之後實人材並出之時俯拾巍科不妨談笑非有源流之慶諒由堂今上御名之基伏惟某官文苑摽名將壇授鉞碧油建幕雖尊千里之權白首窮經不改一瓢之樂遂推餘慶俯及諸郎繼三葉之榮名鍾一門之盛事某方圖稱慶首沐騰緘仰認謙沖惟知喜愧賀侍其鈐轄再任代伏審寵􅈾宸命再握中權伏惟􅌚慰伏以某官兵機練逹將略雄深緩帶輕裘鎮壓千里綸巾羽扇指揮六軍上寬當寧之憂乃眷捍城之效知其難繼許以借留詔目外騰人言胥悅飛文展慶寓命于書郵占翰布勤首勒于記室方永言其傾戴夫孰喻乎端倪賀王安撫啓代伏審令嗣祕書新恩賜及第者潛心几案素髙黃絹之詞唱苐殿庭果叶青錢之選士流胥慶儒道增光切以間歲搜賢本朝廷之故事一經肄業𣸪神考之新科人材一興仕路四闢非有過庭之教曷充入彀之英恭惟某官爼豆儒風詩書將業投班超之筆意氣一時請南越之纓功名萬里遂推餘澤俯及諸郎淂片玉于崑山𣸪青氊之舊物揮毫灑翰實髙董賈之才幹蠱克家行繼韋平之盛某未皇展慶先辱飛文感愧之殊敷宣罔既賀王尚書啓伏審光奉宸恩榮膺閫寄凡居屬部舉切􅌚悰竊以自昔雄藩首稱全蜀一十五州之士悉􅊢封疆數千里地之師盡歸莭制實資重厚坐鎮浮華宣惠愛于逺方此倚毗之本意恭惟某官德基宏逺識局深純奕世功名不替忠臣之後歷朝議論共推長者之言輒從喉舌之司出綰山河之柄綸巾羽扇暫寬憂顧之懷鼎席台階行副具瞻之望某備貟屬部託成下風欣懌之私敘陳罔既謝兩府啓代濫充星使未及瓜期殊無遷徙之勞就領轉輸之寄便于私計出自洪庥切以運漕一方按繩百吏其權既重所責非輕軍儲仰哺于十州銓𬋩𣸪歸于八路貟多缺少憂注擬之艱難地瘠民貧苦征輸之窘急冝擇經綸之士以觀施設之方某學術迂踈吏能短薄少年氣鋭謾有志于事功晚歲𢾗竒已冥心于造化偶從常調擢領使權曽未經年𣸪􅈾新命此蓋伏遇某官陶甄士器匠石人材隆太平極治之基開並採兼收之路曲成羽翼特借齒牙敢不推本上心欽承厚德斧斤樗散少酬培植之恩箠䇿疲駑期盡馳驅之力謝楊提刑啓代伏審寵􅈾宸命榮領使權將攬轡于鄊邦因取途于弊境聞名久矣何幸如之伏惟某官廟璉至珍天麟異稟夙負棄繻之志果諧題柱之心奉漢使以巡行講周官之班斂過家上冡為桑梓之光華衣錦還鄉覽溪山而感嘆未遑馳問首辱騰緘瞻望徽猷不勝翹企謝許提刑啓代幸托下風尚未瞻于履幕敢圗過聼遂引納于門墻在于閴然何以稱此伏念某忝分郡寄坐易歲華本自空踈無可稱于尺寸矧今老大豈有輔于涓埃當此遷延居然尸祿推擠未去固已荷于并容剪拂所加尚敢期于見及此蓋伏遇某官道心稟粹德性飬和格物不以所長動為可意待人必出于恕不復求全致是冥頑亦蒙比數雖衮褒一字足為衰朽之光而鼠技五窮終負提携之賜永言銘佩有激肝膺綿州謝監司舉辟啓命教之始置師惟難既非所堪適足為愧伏念某一離國學十閲歲華參兩任之卿軍自云淂趨負三年之令弩未始辭勞止于為貧無所不可獄訟刑名之職皆是道埸簿書錢榖之間莫非樂地况優遊于儒術𣸪咫尺于鄊枌便于婚姻淂以斆學有幸如此歸恩可知此蓋伏遇某官匠石人材甄陶士類好賢樂善每推引類之心憂國愛君深軫思皇之念致兹後學淂託下風才地非堪固難勝于重責使天所庇將銘鎖于𥘉心感佩無窮敷宣罔既謝翟大夫啓竊以使部屈指豈無俊良書生何顔過承論荐伏念某幼而學字少識偏傍長而屬文僅知平側久服聖時之化育竊聞經術之緒餘若淂用其所長庶幾或有可取投之猥冗無所施為豈禮樂云乎哉亦會計當而已荀卿以為仰祿孟子所謂為貧不圖登門便許推轂此蓋伏遇某官賞信而罰必事易而悅難嘉善矜不能與人不求偹遂令微賤幸獲依歸今日窮途自激昻于氣莭異時淂路期奮發于事功庶幾終身不負知已謝吉文州啓代伏承令孫新奉綸恩同登桂藉潛心文苑素髙連運之才較萟詞場大振機雲之譽士流縮手衆議歸心共推黃絹之辭果叶青錢之選三制已秀雙劍橫飛豈徒几案之功蓋有箕裘之素伏惟某官詩書將術爼豆儒家投壷雅歌淂祭遵之瀟灑輕裘緩帶有元凱之風流冝俾慶門疊􅈾盛事未遑稱慶遽辱貽音惟有欣荷之私即此敷陳莫盡答吉文州啓代仁不可失常恐招黃民𣣔必從果諧借冦恭惟某官道心稟粹德性飬淳循吏袴𥜗安一方之民堵將軍裘帶肅千里之塞垣方松庇之共依慮瓜期之亟至欲荐才美自愧言輕幸天髙而聽卑果朝奏而暮下此實邊民之福固非言者之功過辱長箋益深慚德到任謝兩府啓代五嶺乘軺已慚非據三巴擁莭復忝殊私榮踰望端感結情外伏念某奮身仕版通籍朝纓擢自冗流承乏水衡之屬繼膺異數叨持外計之權雖指心誓報于寵靈而臨事輒牽于才分二年攬轡竟無尺寸之功萬里還朝猶在品題之目重申巽命出按坤維地瘠人貧雖困轉輸之苦歲豐事簡曽無施設之勞內省空踈一何僥幸此蓋伏遇某官才猷絶世名實在人定䇿兩朝炳著安劉之業矢謀九德巍摽贊禹之功曲憐孤單未遽遐棄瓶罍易溢憂小器之顛隮陶冶無私荷大鈞之坱圠永懷銘佩有激肝脾謝家提舉啓書生所學粗記姓名軍事方參未知拜起心勞意拙志廣才踈績未考三責將滿百抱關擊柝真為貧之所為毁瓦畫墁歎無功而坐食夤緣厚幸依托下風惟憂鼠技之窮寧顧馬曺之辱逮今三載雖每侍于燕間未始一言輒有求于左右豈有意于為異蓋自耻于無厭遽辱見收實過所望兹蓋伏遇某官賞信罰必事易説難其交物也淡以親其待人也輕以約遂令頑悍亦費陶鎔敢不祗畏簡書服勤簿領一丘一􅊤既未遂于𥘉心三浴三薰其敢忘于厚德感佩戰越不知所裁眉山唐先生文集卷二十六眉山唐先生文集卷二十六目唐庚子西啓賀馬學士啓賀楊運判啓賀楊提刑啓賀新提舉啓賀王安撫啓賀侍其鈐轄再任賀王安撫啓賀王尚書啓謝兩府啓謝楊提刑啓謝許提刑啓綿州謝監司舉辟啓謝翟大夫啓謝吉文州啓答吉文州啓到任謝兩府啓謝家提舉啓
