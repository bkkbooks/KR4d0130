body:
  text: 眉山唐􅏤子西記逰越王䑓記政和元年春吾南迁惠州道出畨禺明日與客逰越王䑓䑓㩀北山其髙数百尋南􅎔小海而潢溪横浦䍧牱之水輻輳于其下左右瞻頋則越中諸山不召而自至却立延望則海外諸國盖可彷彿于冥濛杳靄之間吾逰天下多矣登􅎔之勝未有先于此者此其所以巋然千載雖廢而不毁也欤世言此䑓㒷于漢初廢于元䁀之時以吾覌之不然昔樗里子之葬渭南也曰後百年當有天子宫夹吾墓至漢㒷長樂宮在其東未央宫在其西按史记秦昭王七年歲在辛酉樗里子卒漢髙帝七年長樂宫成八年营未央宫是歲癸夘上距辛酉寔一百有三年世知二宫作于髙帝之時而不知百年之前樗里子廼已言之于秦𣅿王之世矣古称得道至人能知城邑宫殿從何福業生此非虚語也凢物成就本非一時之所能爲至其变㓕亦非一時之䏻廢業凝而成既泮而敗其所由来逺矣世无至人故莫識其所從也若樗里子者豈足名得道㢤彼不過以数知之耳盖萬物本于道故道能知之不外于𢾗故𢾗亦能知之戦國之士大抵皆深于𢾗故知来事如此至詰其所從来彼亦不能言也噫物之廢㒷妙矣吾何足以知之然于廢㒷之理則吾常論之熟矣豈偶然㢤至如士之所以成敗得丧彼亦有自来矣豈云云者所能权之㢤正月初五日記卓錫泉記人之精神亦何所不至㢤揮戈可以退日搏􅈾可以隕霜悲泣可以頺城浩嘆可以决石而况于淂道者乎諸妄既除表裏皆空一真之外无復餘物則其精神之運又何如㦲吾逰羅浮至宝積寺飲泉而甘寺僧曰此卓錫泉也昔梁景泰禅師始居此山其徒以無水难之師笑而不荅已而庵成師卓錫于地泉湧𢾗尺自是得井山中迄今頼之知水者以爲甲扵嶠南而自梁以来未有記其事者夫師之爲人誠不可得知然吾聞世間萬有皆心想所生古之斈道来有不用定慧得者定則深全慧則流通以深全流通之精神而致吾心想中物如父之使子君之使臣有必得之势其見于此者特未足多也或曰前世之士如李廣利耿恭之徒皆功名進取之人以成敗得丧爲心其精神之冨不踰常人而喑唖叱咤飛泉爲之湧溢與師無異此何理也曰二人者皆一時貴臣左氏所謂用物精多至于神明方其困于绝域之中感奮激彂于万死一生之時其用意至到與精進一体唯其岀于一切之誠而無定慧之素以故得之艰勤非若师之頥指目使既㨗而且逸也嗟乎事之不立也我知之矣志意耗于思慮聪明流于視聴則精神所感不行于父子兄弟之間而尚何有于物苟䏻全吾之神則雖山石之堅水泉之柔雍容談笑之間堅者可使闢柔者可使激而躍也而独不得之于人乎吾是以知天下之事凢物盡有然者矣而亦無不可立也年月日記游湯泉記過水北十餘里得白水山山行一里所淂佛跡院院中湧二泉其東所謂湯泉其西雪如也二泉相去歩武間而東泉热甚殆不可觸指以西泉觧之然後調適可浴意山之出二泉專為浴者計㢤或説炎州地性酷烈故山谷多湯泉或説水出硫黄地中即温𥘉不問南北今􅎔潼湯泉乃在正西而炎州餘水未必皆热則地性之説固已夫之然以硫黄置水中水不䏻温則硫黄之論亦未為淂吾意湯泉在天地間自為一類受性本然不必有待然後温也凡物各求其類而水性尤耿介得其類則雖数千萬里而伏流相通非其類則横绝徑过十字旁午而不相入故二泉之間不能容尋常而炎凉特異如此盖亦無足怪者吹氣為寒呵氣為温而同岀于一口此其証也􅎔潼之水在開元天宝最為知名恩幸寵遇震動一時然自是以来是非口語亦紛紛矣此泉岀東南萬里外非山僧野叟之所逰嬉則騷人迁客之所嘨詠而徘徊也寵辱何自而至㢤為泉計者其肯以此而易彼乎同逰者三人佛迹記巨人迹若于長三肘量濶称之在湯泉之東瀑布之西散印于岩石之上深者二寸許前此未有称者近時山中寔始見之自是稍傳于人而或者以為佛迹噫此真可謂異矣與漢武帝時東莱緱氏所見可同日語㢤是時天子求神人為長生不死之計厚㗖方士唯其所欲為李廣結髮戦匃奴三十年不能取封邑而五利為樂通侯汲黯晚莭願為中郎出入禁闥不可得而公孫卿為中大夫邸第玉帛金錢車服之盛莫知纪極而賜之隆如此甚者乃至尚主夫利之所在奸偽従之故当世所谓昼法宝䁀仙人迹之属大抵皆詐今此迹岀于炎海之濱晦昧于黄茅白葦之中以故不為世俗所知雖知亦莫之貴此其所以為異何則凡物求而淂之則容有偽焉不求而獲者乃真耳谓之佛迹雖若無所考然姜嫄之事诗人指為帝武彼亦安所考㢤不过以理知之今夹五嶺之南瘴癘之郷民生于其間者既已薄福而放逐居此者又皆罪戻之餘故諸圣出此以警悟而調伏之此理亦無足疑者羅浮比年徃徃有異迹其栂至数寸而栖禅寺亦時時見之得非疾者愈劇而救者不淂不力欤不然何其多且𢾗也寄傲齋記吾謫居惠州掃一室于所居之南號寄傲斋客指而笑曰此非取渊明之語乎子居京师時何尝念渊眀能念渊朋當不至斥逐今既至此然後區區掇寄傲之语以名其所居而見意焉晚矣無及也吾愧谢曰子責我是矣然豈知吾之心㢤吾官閬中時尝考論晋宋人物至渊明傳慨然有感于吾心時年三十便有帰欤之㒷求田问舎親友皆怪之自是以来俛仰十年雖未即去然田園之樂未常一日不係于心而帰去来辞未尝一日不諷于口頃任愽士自以岀䖏既不與隆替对而迂愚拙直又不能從英俊逰𢾗懇丞相求西南一官以帰盖将老焉会竒禍作以故不果嗟乎吾志不就類皆如此今雖云云谁復信者信與不信此復何有願惟鬼神知吾此心尔雖然吾今適四十尔夭死吾于此乎復何言哉設不吾死淂脱谪藉以帰則吾将以三十年之身窮渊明之樂圃吾名之以日涉之園門吾名之以常関之扉林吾名之以欣欣之林谷吾名之以涓涓之谷壑吾名之以窃窕之壑丘吾名之以﨑嶇之丘豈特取寄傲之語名一室而已㢤惟诗不近渊明雖近亦不敢作独淂其讀書飲酒之趣亦足以了一生矣牧之桑榆猶足以𥙷東隅之失也傳不云乎人之所欲天必從之古人豈欺我㦲年月日記闘茶記政和二年三月壬戌二三君子相與闘茶于寄傲斋予爲取龍塘水烹之而苐其品以某為上某次之某閩人其所賫冝尤髙而又次之然大較皆精绝盖尝以為天下之物有冝淂而不淂不冝淂而淂之者冨貴有力之人或有所不能致而貧賤穷厄流離遷徙之中或偶然獲焉所谓尺有所短寸有所長良不虚也唐相李衛公好飲惠山泉置驛傳送而不逺𢾗千里近世歐陽少师作龍茶録序称嘉祐七年親享明堂致斋之夕始以小團分賜二府人給一餅不敢碾試至今藏之時熈寕元年也吾聞茶不問團銙要之貴新水不問江井要之貴活千里致水真偽固不可知就令識真已非活水自嘉祐七年壬寅至熈寕元年戊申首尾七年更閱三朝而賜茶犹在此豈𣸪有茶也㢤今吾提瓶走龍塘無𢾗十歩此水冝茶昔人以為不减清逺峽而海道趋建安不数日可至故每歲新茶不過三月至矣罪戾之餘上寛不誅淂與諸公從客談笑于此汲泉煮茗取一時之適雖在田野孰與烹𢾗千里之泉澆七年之賜茗也㢤此非吾君之力欤夫耕鑿食息终日䝉福而不知為之者直愚民尔豈我軰谓耶是冝有所纪𫐠以無忘在上者之澤云眉山唐先生文集卷八眉山唐先生文集卷八目唐庚子西記逰越王䑓記卓錫泉記逰湯泉記佛迹記寄傲齋記闘茶記
