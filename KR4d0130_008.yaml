body:
  text: 眉山唐􅏤子西記逰越王臺記政和元年春吾南遷惠州道出畨禺明日與客逰越王臺臺據北山其髙數百尋南􅎔小海而潢溪橫浦牂牱之水輻輳于其下左右瞻顧則越中諸山不召而自至却立延望則海外諸國蓋可倣佛于冥濛杳靄之間吾逰天下多矣登􅎔之勝未有先于此者此其所以巋然千載雖廢而不毁也歟世言此臺興于漢初廢于元䁀之時以吾觀之不然昔樗里子之葬渭南也曰後百年當有天子宫夾吾墓至漢興長樂宮在其東未央宫在其西按史記秦昭王七年歲在辛酉樗里子卒漢髙帝七年長樂宫成八年營未央宫是歲癸卯上距辛酉實一百有三年世知二宫作于髙帝之時而不知百年之前樗里子乃已言之于秦𣅿王之世矣古稱得道至人能知城邑宫殿從何福業生此非虛語也凡物成就本非一時之所能為至其變滅亦非一時之䏻廢業凝而成既泮而敗其所由來逺矣世無至人故莫識其所從也若樗里子者豈足名得道哉彼不過以數知之耳蓋萬物本于道故道能知之不外于𢾗故𢾗亦能知之戰國之士大抵皆深于𢾗故知來事如此至詰其所從來彼亦不能言也噫物之廢興妙矣吾何足以知之然于廢興之理則吾常論之熟矣豈偶然哉至如士之所以成敗得喪彼亦有自來矣豈云云者所能權之哉正月初五日記卓錫泉記人之精神亦何所不至哉揮戈可以退日搏􅈾可以隕霜悲泣可以頺城浩嘆可以决石而况于淂道者乎諸妄既除表裏皆空一真之外無復餘物則其精神之運又何如㦲吾逰羅浮至寶積寺飲泉而甘寺僧曰此卓錫泉也昔梁景泰禪師始居此山其徒以無水難之師笑而不答已而庵成師卓錫于地泉湧𢾗尺自是得井山中迄今賴之知水者以為甲于嶠南而自梁以來未有記其事者夫師之為人誠不可得知然吾聞世間萬有皆心想所生古之學道來有不用定慧得者定則深全慧則流通以深全流通之精神而致吾心想中物如父之使子君之使臣有必得之勢其見于此者特未足多也或曰前世之士如李廣利耿恭之徒皆功名進取之人以成敗得喪為心其精神之冨不踰常人而喑啞叱咤飛泉為之湧溢與師無異此何理也曰二人者皆一時貴臣左氏所謂用物精多至于神明方其困于絶域之中感奮激彂于万死一生之時其用意至到與精進一體唯其出于一切之誠而無定慧之素以故得之艱勤非若師之頥指目使既捷而且逸也嗟乎事之不立也我知之矣志意耗于思慮聰明流于視聽則精神所感不行于父子兄弟之間而尚何有于物苟䏻全吾之神則雖山石之堅水泉之柔雍容談笑之間堅者可使闢柔者可使激而躍也而獨不得之于人乎吾是以知天下之事凡物盡有然者矣而亦無不可立也年月日記游湯泉記過水北十餘里得白水山山行一里所淂佛跡院院中湧二泉其東所謂湯泉其西雪如也二泉相去步武間而東泉熱甚殆不可觸指以西泉解之然後調適可浴意山之出二泉專為浴者計哉或說炎州地性酷烈故山谷多湯泉或說水出硫黃地中即溫𥘉不問南北今􅎔潼湯泉乃在正西而炎州餘水未必皆熱則地性之說固已夫之然以硫黃置水中水不䏻溫則硫黃之論亦未為淂吾意湯泉在天地間自為一類受性本然不必有待然後溫也凡物各求其類而水性尤耿介得其類則雖數千萬里而伏流相通非其類則橫絶徑過十字旁午而不相入故二泉之間不能容尋常而炎凉特異如此蓋亦無足怪者吹氣為寒呵氣為溫而同出于一口此其證也􅎔潼之水在開元天寶最為知名恩幸寵遇震動一時然自是以來是非口語亦紛紛矣此泉出東南萬里外非山僧野叟之所逰嬉則騷人遷客之所嘨詠而徘徊也寵辱何自而至哉為泉計者其肯以此而易彼乎同逰者三人佛迹記巨人迹若于長三肘量濶稱之在湯泉之東瀑布之西散印于岩石之上深者二寸許前此未有稱者近時山中實始見之自是稍傳于人而或者以為佛迹噫此真可謂異矣與漢武帝時東萊緱氏所見可同日語哉是時天子求神人為長生不死之計厚啖方士唯其所欲為李廣結髮戰丐奴三十年不能取封邑而五利為樂通侯汲黯晚莭願為中郎出入禁闥不可得而公孫卿為中大夫邸第玉帛金錢車服之盛莫知紀極而賜之隆如此甚者乃至尚主夫利之所在奸僞從之故当世所謂晝法寶䁀仙人迹之屬大抵皆詐今此迹出于炎海之濱晦昧于黃茅白葦之中以故不為世俗所知雖知亦莫之貴此其所以為異何則凡物求而淂之則容有僞焉不求而獲者乃真耳謂之佛迹雖若無所考然姜嫄之事詩人指為帝武彼亦安所考哉不過以理知之今夾五嶺之南瘴癘之鄉民生于其間者既已薄福而放逐居此者又皆罪戻之餘故諸聖出此以警悟而調伏之此理亦無足疑者羅浮比年往往有異迹其栂至數寸而栖禪寺亦時時見之得非疾者愈劇而救者不淂不力歟不然何其多且𢾗也寄傲齊記吾謫居惠州掃一室于所居之南號寄傲斋客指而笑曰此非取淵明之語乎子居京師時何嘗念淵眀能念淵朋當不至斥逐今既至此然後區區掇寄傲之語以名其所居而見意焉晚矣無及也吾愧謝曰子責我是矣然豈知吾之心哉吾官閬中時嘗考論晋宋人物至淵明傳慨然有感于吾心時年三十便有歸歟之興求田問舍親友皆怪之自是以來俯仰十年雖未即去然田園之樂未常一日不係于心而歸去來辭未嘗一日不諷于口頃任博士自以出處既不與隆替對而迂愚拙直又不能從英俊逰𢾗懇丞相求西南一官以歸蓋將老焉會竒禍作以故不果嗟乎吾志不就類皆如此今雖云云誰復信者信與不信此復何有願惟鬼神知吾此心爾雖然吾今適四十爾夭死吾于此乎復何言哉設不吾死淂脫謫藉以歸則吾將以三十年之身窮淵明之樂圃吾名之以日涉之園門吾名之以常關之扉林吾名之以欣欣之林谷吾名之以涓涓之谷壑吾名之以竊窕之壑丘吾名之以﨑嶇之丘豈特取寄傲之語名一室而已哉惟詩不近淵明雖近亦不敢作獨淂其讀書飲酒之趣亦足以了一生矣牧之桑榆猶足以𥙷東隅之失也傳不云乎人之所欲天必從之古人豈欺我㦲年月日記鬪茶記政和二年三月壬戌二三君子相與鬪茶于寄傲斋豫為取龍塘水烹之而苐其品以某為上某次之某閩人其所賫冝尤髙而又次之然大較皆精絶蓋嘗以為天下之物有冝淂而不淂不冝淂而淂之者冨貴有力之人或有所不能致而貧賤窮厄流離遷徙之中或偶然獲焉所謂尺有所短寸有所長良不虛也唐相李衛公好飲惠山泉置驛傳送而不逺𢾗千里近世歐陽少師作龍茶録序稱嘉祐七年親享明堂致斋之夕始以小團分賜二府人給一餅不敢碾試至今藏之時熙寧元年也吾聞茶不問團銙要之貴新水不問江井要之貴活千里致水真僞固不可知就令識真已非活水自嘉祐七年壬寅至熙寧元年戊申首尾七年更閲三朝而賜茶猶在此豈𣸪有茶也哉今吾提瓶走龍塘無𢾗十步此水冝茶昔人以為不减清逺峽而海道趨建安不數日可至故每歲新茶不過三月至矣罪戾之餘上寬不誅淂與諸公從客談笑于此汲泉煮茗取一時之適雖在田野孰與烹𢾗千里之泉澆七年之賜茗也哉此非吾君之力歟夫耕鑿食息終日䝉福而不知為之者直愚民爾豈我輩謂耶是冝有所紀𫐠以無忘在上者之澤云眉山唐先生文集卷八眉山唐先生文集卷八目唐庚子西記逰越王臺記卓錫泉記逰湯泉記佛迹記寄傲齊記鬪茶記
