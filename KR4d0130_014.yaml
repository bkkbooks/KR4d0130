body:
  text: 眉山唐庚子西三國雜事篇下陳夀曰蜀不置史注記無官以故行事多遺灾異靡書諸葛亮雖逹于為政若此之類猶未周焉禮記人君言則左史書之動則右史書之周禮建官偹矣獨不聞有所謂左右史者雖有太史然不以注記為職是時諸侯皆有史豈天子擉闕乎春秋之時卜田宅者占雲日者皆稱太史則太史殆隂陽家流然書趙盾者書崔杼者亦稱太史則太史又似掌注記者蓋方是時學者通知天人而卜興廢者亦不純用蓍龜太史伯以祝融之功而推楚國之必興太史趙以虞舜之德而占陳氏之未亡其論議證據有絶人者故隂陽注記得兼掌之漢司馬談父子為太史令以論著為已任而又掌天官則兼掌之效於兹可見魏晋之際始置著作郎自是太史之聀分而為二孔明之時未也按後主景耀元年史官奏景星見于是大赦改元而曰蜀不置史妄矣㬌𥘉元年有司奏魏淂地統冝以建丑為正遂改是年三月為孟夏四月世言夏得人統以建寅為正啇得地統以建丑為正周得天統以建子為正其說非也以堯典羲和舜典巡狩觀之唐虞之世固以建寅為正矣至夏后之時其法尤備其書傳于後世謂之夏小正孔子淂之于已以為可用非謂建寅之正自夏后氏始也至成周時始用建子為正然猶不廢夏時謂之正歲後之學者以為夏以建寅為正周以建子為正商居其間不應無所變改因以意推之曰啇以建丑為正而三統之說興焉夫夏后氏以建寅為正吾于論語見之矣論語曰行夏之時周以建子為正吾于春秋見之矣春秋書十月降霜殺菽三月無水商人以建丑為正于經既無所見于理亦復不通夫以建子為正者取二十四氣之首也以建寅為正者取四時之首也以建丑為正其取義安在哉是以知其不然建安十八年先主進軍圍雒縣龎統為流矢所中卒先主每言則為之流涕龎德公以孔明為卧龍以士元為鳯雛則士元之齒當少于孔明孔明卒時年五十四而士元先卒二十有二年則士元物故尚未三十也豈不惜哉建安二十四年先主始王漢中是歲關羽卒明年黃忠法正卒之明年張飛卒又明年馬超馬良卒基業未就而一時功臣相繼淪謝如有物奪之者明年後主踐祚而舊人獨有孔明趙雲後七年雲卒又五年孔明卒而勳舊于是乎盡正卆時年四十五超四十七良三十五自餘不著其年飛傳稱少與羽俱事先主羽年長數歲飛兄事之則飛卒時年才五十許霍峻年四十此數傑者皆以髙材早世而譙周至七十餘而終天不祚漢明矣雜文惠州謝𣸪官表臣某言今月八日惠州送到告身一道伏蒙聖恩復臣承議郎臣已于當日祗受訖始以為夢既而果然俯伏拜恩喑嗚流涕中謝伏念臣身逢堯舜跡雖涉于仕途性嗜老莊口不談于世事自知無用非敢有求適遭學校之興纍冒師儒之選傳經天性已負愧于面顔奉使日圍固難逃于指目果緣僥幸卒至顛隮命察如絲罪幾擢髮奮空拳于嶺表不保朝昏托衆口于江陽莫知存沒夷居萬里烟瘴六年賴禀賦之冥頑淂保全于視息雖簡編度日益堅國爾之心而兄弟潅園巳作家焉之計豈期仕位𣸪齒朝紳此蓋伏遇皇帝陛下如日正中惟天為大曰生曰殺得馭臣之方作福作威有惟辟之道建元良于震邸均介福于坤輿舊惡宿愆悉皆蕩滌前侯故將咸𬒳甄收而臣憂患摧傷志意衰落雖受再生之賜終無一割之功惟作頌聲以歌聖治臣無任上張觀文手書其一某頓首再拜某違逺教誨忽忽纍月暑中未審鈞侯動止何似某六月𥘉五日到瀘南僦居安夷門外無屋以歸無田園以耕以植雖不及陶淵明歸柴桑時然老弱具在無所損失勝杜子美歸鄜州矣以此自遣不敢上煩謹念正逺師門下情不勝瞻依之至謹奉啓起居不備其二某惶恐再拜某既至瀘南瀘南邊人知某為門下客也爭持酒肉相勞且問相公起居狀某具言相公年七十餘精力如四五十人鬚髮烏光無一莖白者今雖翹然獨與道遊而願力深重不忘利他之心父老聞此悉以手加額至于感槩流涕寄謝相公為宗社百姓厚自調衛其三某惶恐再拜某昨去鄉時兒女大率皆幼稚今歸二子皆通經諸女亦𣸪長大見父逺來相對􅌚然貧中亦自有味但念古人從師不逺千里久者至數十載須業成乃去某自學道未有證處而逺去師席不得朝夕請業請益以此胸中忽忽不樂今冬了却木蘭一事便當復走門下卒業矣參侍非逺此不縷縷其四某惶恐再拜某昨舟中無它所為顧惟有讀書又無他書可讀借淂史記數冊反覆讀之見公仲一事適有得于心以為兹事粗善有益因漫録云趙烈侯欲賜歌者田二萬畝國相公仲患之未有以制也畨吳君曰君實好善而未有所持亦嘗進人于君乎公仲曰未也畨吳君曰牛畜荀歆徐越皆可公仲乃進三人及朝牛畜侍烈侯以仁義烈侯逌然眀日荀欣侍烈侯以選任又明日徐越侍烈侯以莭儉烈侯使人謂公仲曰歌者之田可止某愛其不犯腳手而功效捷疾如此謾以為獻伏惟聰明幸察答合守程元老書某頓首李元應到瀘出示所賜書伏承暑中動止萬福眷聚無他良慰某處田野間亦復自適不足垂念但瀘南前日小旱二麥己不償種今又甚雨復憂麻豆矣仕進如此退耕又如此豈但人力耶婦雅病肺比老益甚五月中垂死後治今幸無事然以此都不成家計閒居既無過從而衰晚亦不耐煩逃虛既久己自成趣聞人足音乃更不喜九月間送女到丹稜因于放腳一到峩眉瓦屋霧申青城諸山至春末可歸向示漆器今納二十引去字號聞此寬相憶為邦復好音人生五馬貴莫受二毛侵伏幸檢收合陽過客絶少公帑有餘日生事想見不多多亦不勞餘刃政當薰衣理鬢努力行樂自厚不宣上張觀文所業序某惶恐頓首某欲焚弃筆硯之日久矣而時時技癢終不䏻自制雖制亦不䏻久今日暫止明日復作如間日瘧不斷根本昨既至惠州便用趙廣漢法為缿筒每一篇成輒投之缿中不可復取比其還也始破缿出之得歌詩雜文三百餘篇念持此無所歸必歸之門下而篇目猥多無氣力裝寫但寫古律詩百篇雜文二十篇以獻辭既不工雖工亦安所施亦各著其所愛習而已隱几一閲即投之火中幸甚于冒鈞重悚愧無量門生某位序書姑蘇張自强教授所編寅申録吾平生取名以此其掇謗亦以此頃謪惠州過扶胥此書失手墜海中舟人皆失色豫獨喜幸名與謗俱息矣不謂今日復稍見于士大夫間讀之惘然似他人文思之茫然如隔世事而姑蘇張自强𣸪持此六卷示豫是名與謗持未巳也然自强嗜吾文必知我者也必愛我者也想能為我深藏而慎出之庶幾可以免矣宣和己亥十二月眉山唐子西書祠三使者疏瀕江之神有號三使者世莫知其為何神其原出于雅安漢嘉盛于戎瀘𬒳于巴峽之間民不敢斥以三指相示輒恐懼變色其畏之如此然祭不過巵酒器食其所持蓋狹矣而靈應捷疾有不可掩者吾聞昔沅湘間祠東皇太一湘君湘夫人少司命雲中君山鬼等神為歌舞以樂之而詞不雅馴屈平為作九歌聲施後世今神不可視其他獨不得比山鬼乎而客非其人無文詞以發之嗟哉香林疏昔者香林親得雲門三昧傳之北塔挺生雪竇一枝子子孫孫在在處處正眼周于法界真身葬于寺中隻履具存莫記星霜之變精廬漫蔽率皆風雨之餘文演道人愍此就荒勇于必葺欲使當來末學識前人魚鼓之音豈惟過去祖師存後世箕裘之業冀集無邊之福上資有永之年當賴十方共成此假眉山唐先生文集卷十四眉山唐先生文集卷十四目唐庚子西三國雜事篇下陳夀曰蜀不置史注記無官以故行事多遺灾異靡書諸葛亮雖達于為政若此之類乃猶未周焉景𥘉元年有司奏魏得地統冝以建丑為正遂改是年三月為孟夏四月建安十八年先主進軍圍雒縣龎統為流矢所中卒先主每言則為之流涕雜文表惠州謝復官表上張觀文手書其一其二其三其四答合守程元老書上張觀文所業序書姑蘇張自强教授所編寅申録祠三使者疏香林疏
