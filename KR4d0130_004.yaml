  text: 眉山唐先生文集卷四
  hash: sha256:a44b42867e5d72d10c0be1e392e4ae8f178fd15531062c7e2978deb5163bf49d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_004-1a}
body:
  text: 眉山唐庚子西近體詩雜興白日消諸妄青山對屢空著書防惡客學圃問鄰翁織貝流肌􅉸仁頻入頰紅丹砂落吾手秋至任飄蓬其二多事定何輔寡言聊自溫蟹黃嗔止酒魚白勸加餐濯足樓船岸髙歌抱朴村愧無魑可禦只益負君恩其三閙窄良難入間寬足見容竹根收白疊謂竹布木杪淂黃封謂椰酒問學兼懦釋交遊半士農行歌村落晚落日滿携笻其四為農沙子步附保水西卿隱几江天遠開門佛土香時情荒徑草野色淡一作淨漁梁欲縱髙秋目東偏短作墻其五舊物杯中酒新䘖海上翁百非無一是顯過豈微功引水江分碧烹丹井為紅幽居亦多事度日不全空其六小市江分破連􅑉水卷翻到今佛迹在千古鶴峯尊浮嶠來何處豐湖入𢾗村登􅎔有何好秋至𢾗消魂其七已分詩驅使寧辭酒過差南烹人釣蛤北信峉占鴉年事侵膚理憂端宿肺家向來功業興到晚詠餘霞其八覆載冝然等寒暄乃爾殊雪曽前歲有地過此邦無煮海鯨鯢動烹山虎豹呼南來何所淂詩語帶娵隅其九夜語不覺久晨興良獨難加之淂卯酒晚矣恰朝餐筍蕨春生箸魚蝦海入盤南方禁太飽茗碗直須寬其十海氣東南上野煙申酉間草平連别洞雨轉入他山道路魚鹽去樵蘇竹木還西江并北路相對各蒼顔其十一水過魚村􅊜沙寬牧地平片雲明外暗斜日雨邊晴山轉秋光曲川長瞑色橫瘴鄉人自樂耕釣各浮生其十二浪迹蒼梧外放懷黃木東人情雙鬢雪天色屢頭風國計中宵切家書隔歲通為儒淂愁思一笑賴兒童其十三萬里非吾土三年失我常只愁鳶跕跕敢作寉昂昻白竹連閩越黃雲入夜郎何時返栖息誰為問桃娘間居未許幽人曉夢長朝朝親炷佛前香有詩為愛袁家渴無病緣抄陸氏方身雜蛋中誰是我食除蛇外總隨鄉白沙翠竹門前路疑出西郊向草堂又細細敲門細細應老翁方曲晝眠肱魚陂舊種千頭鱠桑徑新窠十𤱔繒菜足尚堪分地主米餘翻欲供鄰僧平生雅有乘桴興咫尺滄溟去未能聞勾景山輔盩厔丞仍聞學道有淂以詩調之彂萬里一笑人言盩厔似江湖莫對丞哉嘆負余别後耳根無正始向來𥿄尾淂黃初可憐鬼谷縱橫口今讀神溪縹白書臣朔許長錢許少何當天子念公車遣興南來不覺兩秋砧覽照驚呼雪滿簮平日不堪文館冷暮年更賦武溪深敢緣三已有愠色自笑一生能苦心安淂袁絲隨里閈閗雞走狗任浮沉又八千岐路愁何輔四十光隂老亦冝此去只堪犀首飲向來都是虎頭癡逢時有道其如命淂意無言所恨遲詩債即今渾倚閣新萹惟有莫相疑甲午元日非賢幸脫龍蛇歲上聖應憐蟣虱臣憶與政和同度嶺朝來已點四年春春歸東風定何物所至輒蒼然小市花間合孤城栁外圎禽聲犯寒食江色帶新年無計驅愁淂還推到酒邊春日五言啼禽適夢寐芳草過比鄰暖迫花期促愁牽酒量伸又去就慚雲堆浮沉羡海鷗妄心花片落豪氣栁枝柔春日七言更與何人共寂寥竹君時引到溪橋是家大似東郭子能使人之意也消又尚有小桃凌姹女豈無大杓飲衰翁老來不𣸪談堅白醉去猶能愛淺紅鄭太玉送子魚便當權閣太常齋藥灶于傍手自煨須信子魚藏妙理坐令母蟹愧凡才刀頭定向何時得劒眷頻將好意來老去少陵雖病肺尚堪持此荐寒醅兒曺送窮以詩晉之世中貧冨兩浮雲已著居陶比在陳就使真能去窮鬼自量無以致錢神栁車作别非吾意竹馬論交只汝親前此半癡今五十欲將知命付何人鄭二鎖試五羊久而不返問之廣人云已失解從海道歸潮矣聞之惘然唁以此詩望君挹取裒然首為我迃回長者車璧玉已聞歸間道足音那𣸪念逃虛卑微官職緣親屈眊矂情懷賴酒除政使登名似韓子十年曽不補遺餘驟雨黑雲驚小市白雨沸秋江聲入家家樹涼傳處處窗亂流鳴決決疊鼓閙龎龎蘋末清風起斜陽覷海邦江漲秋來雨似澆雨罷水如潮市改依髙岸津喧救斷橋雲隂哭鳩婦池溢走魚苗天意良難測前時旱欲焦代書寄鄭二别後定何似此中難具陳倦憎秋氣濕老怯曉煙辛沸議今方爾歸期覺愈伸須煩三絶手時𣸪餉清新八月十五夜月應緣人望望故令出遲遲幾歲一相見浮雲寧别時吟拚雞腷膞玩覺兔迷離此夕登樓興非關有所思夜久睡覺不復能寐凄然有感無伏更殘暑夜深清欲飢葉飛魂夢數露重語音知月色到秋苦更聲􅎔曉遲平生憎墨翟老去亦悲絲立冬後作啖蔗入佳境冬來幽興長瘴鄉淂好語昨夜有飛霜籬下重陽在醅中小至香西鄰蕉向熟時致一梳黃端孺糴米龍川淂粳糯數十帳以歸作詩調之倒拔孤舟入瘴煙歸來百斛㵼豐年炊香未𢾗神江白米名釀􅉸偏宜佛迹泉飽去定知頻夢與醉中何至便妨禪憑君為比長安米看直公車牘幾千東鄰即今樂事屬墻東歲晚何曾酒盞空白蜜巳輸仍莭近紅藤未動况年豐又肯聽寒梅暖暖消笛聲夜夜到溪橋怪生不似關山月新向城中淂徵招謾成雲暗便窗破山寒賴屋低往還天外少早晏雨中迷書册開仍闔履聲東𣸪西何常有所賦得句旋安題聞鄭二對吏五羊舊友年來略散亡新收鄭子亦遑遑歲云暮矣無雙堆我所思兮在五羊獄吏事權先自貴書生蹤迹况能狂風流人物今餘幾何忍群兒𣸪謗傷東麓經旬不見小羌廬忽爾相逢喜欲呼自入秋來更韶潤却從瘦裡帶敷腴人間信有傷心碧坐上那無滿眼沽可是清暉解娛客能令腸斷到愚儒眉山唐先生文集卷四眉山唐先生文集卷四目唐庚子西近體詩雜興其二其三其四其五其六其七其八其九其十其十一其十二其十三間居又聞勾景山輔盩厔丞仍聞學道有淂以詩調之彂萬里一笑遣興又甲午元日春歸春日五言又春日七言又鄭太玉送子魚兒曺送窮以詩留之鄭二鎖試五羊久而不返問之廣人云已失解從海道歸潮矣聞之惘然唁以此詩驟雨江漲代書寄鄭二八月十五夜月夜久睡覺不復能寐凄然有感立冬後作端孺糴米龍川淂粳糯數十帳以歸作詩調之東鄰又謾成聞鄭二對吏五羊東麓
