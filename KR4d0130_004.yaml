  text: 眉山唐先生文集卷四
  hash: sha256:a44b42867e5d72d10c0be1e392e4ae8f178fd15531062c7e2978deb5163bf49d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_004-1a}
body:
  text: 眉山唐庚子西近体詩雜㒷白日消諸妄青山对屡空著書防悪客斈圃問隣翁織貝流肌􅉸仁頻入頰紅丹砂落吾手秋至任飄蓬其二多事定何𥙷寡言聊自温蟹黄嗔止酒魚白劝加飡濯足楼舡岸髙歌抱朴村愧無魑可禦只益負君㤙其三閙窄良难入閑寛足見容竹根收白叠謂竹布木杪淂黄封謂椰酒問斈兼懦释交㳺半士農行歌村落晚落日滿携笻其四為農沙子歩附保水西卿隐几江天遠開門佛土香時情荒徑草埜色淡一作净漁梁欲縦髙秋目東偏短作墻其五舊物盃中酒新䘖海上翁百非無一是顯過豈㣲功引水江分碧烹丹井為红幽居亦多事度日不全空其六小市江分破連􅑉水卷翻到今佛跡在千古鶴峯尊浮嶠来何䖏豊湖入𢾗村登􅎔有何好秋至𢾗消䰟其七已分詩驅使寕辞酒过差南烹人釣蛤北信峉占鴉年事侵膚理憂端宿肺家向来功業㒷到晚詠餘霞其八覆載冝然䓁寒暄乃爾殊雪曽前歲有地過此邦無煮海鯨鯢動烹山虎豹呼南来何所淂詩語帶娵隅其九夜語不斍乆晨㒷良独难加之淂夘酒晚矣恰朝飡筍蕨春生箸魚蝦海入盤南方禁太飽茗椀直湏寛其十海氣東南上野烟申酉間草平連别洞雨轉入他山道路魚塩去樵蘇竹木還西江并北路相对各蒼顔其十一水過魚村􅊜沙寛牧地平片雲明外暗斜日雨边晴山轉秋光曲川長瞑色横瘴鄉人自楽耕釣各浮生其十二浪迹蒼梧外放怀黄木東人情双鬂雪天色屡頭風國計中宵切家書隔歲通為儒淂愁思一笑賴児童其十三萬里非吾土三年失我常只愁鳶跕跕敢作寉昂昻白竹連閩越黄雲入夜郎何時返栖息誰為問桃娘閒居未許幽人曉梦長朝朝親炷佛前香有詩為爱袁家渇無病縁抄陸氏方身雜蜑中誰是我食除蛇外縂隨郷白沙翠竹門前路疑出西郊向草堂又細細敲門細細應老翁方曲晝眠肱魚陂舊種千頭鱠桑徑新窠十𤱔繒菜足尚堪分地主米餘翻欲供鄰僧平生雅有乗桴㒷咫尺滄溟去未䏻聞勾景山𥙷盩厔丞仍聞斈道有淂以詩調之彂萬里一笑人言盩厔似江湖莫对丞㢤嘆負余别後耳根無正始向来𥿄尾淂黄初可怜鬼谷縦橫口今讀神溪縹白書臣朔許長錢許少何當天子念公車遣㒷南来不斍両秋砧覧照驚呼雪满簮平日不堪文舘冷暮年更賦武溪深敢縁三已有愠色自笑一生䏻苦心安淂袁絲隨里閈閗雞走狗任浮沉又八千岐路愁何𥙷四十光隂老亦冝此去只堪犀首飲向来都是虎頭痴逢時有道其如命淂意無言所恨遲詩債即今渾倚閣新萹惟有莫相疑甲午元日非賢幸脱龍蛇歲上聖應怜蟣虱臣憶與政和同度嶺朝来已點四年春春帰東風定何物所至輙蒼然小市花間合孤城栁外圎禽声犯寒食江色帶新年無計驅愁淂還推到酒边春日五言啼禽適梦寐芳草过比隣暖迫花期促愁牽酒量伸又去就慚雲㕍浮沉羡海鷗妄心花片落豪氣栁枝柔春日七言更與何人共寂寥竹君時引到溪橋是家大似東郭子䏻使人之意也消又尚有小桃凌姹女豈無大杓飲衰翁老来不𣸪談堅白醉去猶䏻爱淺红鄭太玉送子魚便當权閣太常齋薬灶于傍手自煨湏信子魚藏妙理坐令母蟹媿凢才刀頭定向何時得劒眷頻将好意来老去少陵雖病肺尚堪持此荐寒醅児曺送穷以詩晋之世中貧冨両浮雲已着居陶比在陳就使真䏻去穷鬼自量無以致錢神栁車作别非吾意竹馬論交只汝親前此半痴今五十欲将知命付何人鄭二鎖試五羊乆而不返問之廣人云已失觧從海道帰潮矣聞之惘然唁以此詩望君挹取裒然首為我迃囬長者車璧玉已聞帰閒道足音那𣸪念迯虚卑微官職縁親屈眊矂情怀頼酒除政使登名似韓子十年曽不補遺餘驟雨黒雲驚小市白雨沸秋江声入家家樹凉傳䖏䖏窓乱流鳴決決叠鼔閙龎龎蘋末清風起斜陽覷海邦江漲秋来雨似澆雨罷水如潮市改依髙岸津喧救断橋雲隂哭鳩婦池溢走魚苗天意良难測前時旱欲焦代書寄鄭二别後定何似此中难具陳倦憎秋氣湿老怯曉烟辛沸議今方尔帰期斍愈伸湏煩三絶手時𣸪餉清新八月十五夜月應縁人望望故令出遲遲㡬歲一相見浮雲寕别時吟拚雞腷膞玩斍兎迷離此夕登楼㒷非関有所思夜乆睡斍不復䏻寐凄然有感無伏更残暑夜深清欲飢葉飛魂梦数露重語音知月色到秋苦更声􅎔暁遅平生憎墨翟老去亦悲絲立冬後作㗖蔗入佳境冬来幽㒷長瘴郷淂好語昨夜有飛霜籬下重陽在醅中小至香西鄰蕉向熟時致一梳黄端孺糴米龍川淂粳糯数十帳以帰作詩調之倒㧞孤舟入瘴烟帰来百斛㵼豊年炊香未𢾗神江白米名釀􅉸偏宜佛跡泉飽去定知頻梦與醉中何至便妨禅憑君為比長安米㸔直公車牘㡬千東鄰即今楽事属墙東歲晚何曾酒盞空白蜜巳輸仍莭近紅藤未動况年豊又肯聴寒梅暖暖消笛声夜夜到溪橋怪生不似関山月新向城中淂徵招謾成雲暗便窓破山寒賴屋低徃还天外少早晏雨中迷書冊開仍闔履声東𣸪西何常有所賦得句旋安題聞鄭二对吏五羊舊友年来畧散亡新收鄭子亦遑遑歲云暮矣無双㕍我所思兮在五羊獄吏事权先自貴書生蹤跡况䏻狂風流人物今餘㡬何忍群児𣸪謗傷東麓經旬不見小羗廬忽尔相逢喜欲呼自入秋来更韶潤却從瘦裡帶敷腴人間信有傷心碧坐上那無滿眼沽可是清暉觧娱客䏻令腸断到愚儒眉山唐先生文集卷四眉山唐先生文集卷四目唐庚子西近体詩雜㒷其二其三其四其五其六其七其八其九其十其十一其十二其十三間居又聞勾景山𥙷盩厔丞仍聞斈道有淂以詩調之彂萬里一笑遣㒷又甲午元日春帰春日五言又春日七言又鄭太玉送子魚児曺送窮以詩留之鄭二鎖試五羊乆而不返問之廣人云已失觧從海道帰潮矣聞之惘然唁以此詩驟雨江漲代書寄鄭二八月十五夜月夜乆睡斍不復䏻寐凄然有感立冬後作端孺糴米龍川淂粳糯数十帳以帰作詩調之東鄰又謾成聞鄭二对吏五羊東麓
