front:
  text: 眉山唐先生文集卷五
  hash: sha256:fcc85c161fd561d2deed32819074f38138bef23515d6650370ada8179e840e97
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_005-1a}
body:
  text: 眉山唐庚子西近體詩西溪西溪霜後更沆􅉼溪上愁人雪半簮市散爭歸橋納納櫓搖不進水潭潭利傾小海魚鹽集味入他村酒茗甘百里源流千里勢惠州城下有江南野望賴有澄江在專供倚杖清水裁偏岸直雲截亂山平鞞鼓知農隙雞豚覺歲成却緣搖落後木抄淂孤城獨逰是日逰于獨乃情知者誰時光新舊歲莭物淺深枝鴉攫春祠敏鳶窺野燒癡田園有妙理吾悔淂之遲醉眠山靜似太古日長如小年餘花猶可醉好鳥不妨眠世味門常掩時光簟已便夢中頻淂句拈筆又忘筌故游茂先大夫元祐初為唐安守豪逸喜賓客能劇飲談笑蓋陳孟公之流今唐安絃索之盛甲于西蜀自游使君始後纍遷至秦鳯憲以卒既二十餘年而其子振旅逰嶠南相過于惠州乃為作此篇以贈之唐安千指録琵琶故事猶聞蜀叟誇樽酒何人陪北海練裙今日見西華子歸未淂頻芳草我老無成學種瓜萬里相逢俱白首班荆長語夕陽斜憫雨老楚能令畏壘豐此身翻纍越人窮至今無奈曾孫稼幾度虛占少女風兹事會須星有好他時曽厭雨其濛山中賴有茱糧足不向諸矦託寓公贈博士承議無尽南㷌遷客氣平和磊落胸中所淂多白日過從惟陸諝清宵夢想適維摩徘徊未忍捐雞肋寂寞猶能顧雀羅好與鄉人敦薄俗莫因哺啜負岷峨次張天覺見贈韵别公歸去飬天和見說清朝士已多裾捨登門何處曵頂緣受記昔曽摩幾時傳說重調鼎去歲成湯已解羅㑹引鑑湖為故事要從英主乞三峨重陽後一日從無盡泛舟游處士臺故詩人秦龜從所居皂河經雨水微沙船帖臺根日未斜三􅏙就荒悲白土一樽相屬對黃花已將逺眺收平楚更遣清言到永嘉要見仙翁頭似漆請看醉後落烏紗和韵無盡東湖水落露堤沙舟過湖心藻荇斜野􅏙小橋穿竹巷烟村踈栁間蘆花新粳炊熟胭脂白活鯽珍于丙穴嘉飲散肩輿乘皓月燭籠何用兩行紗江陵逢故人宋德粹自播守罷歸南陽以詩見貽依韵和酬昔别方初莭相逢各素秋君歸卧龍國我脫墮鳶州霜鬢含多事塵容帶􅌒逰行藏端可見歲晚莫登樓走城西别處厚居正二宗兄㑹居正出獨與處厚笑語終日頗有卜鄰之興因屬買田江陵作此詩舊交零落半存亡晚歲荆州淂兩唐臨别眼中無小謝再來天外有他楊預行後日誅茅地要近先生避世墻㑹與幽人𢾗晨夕何能結客少年場和觀文相公立春日示詩間把流年指上輪朝來七十五廽春一杯碩荐喬松夀四海方依社稷臣血氣未嫌辛菜冷顔容猶稱彩幡新清詩小字傳觀處滿座驚呼覺有神生還至冝都逢李六更把餘年著酒澆莫談前事廢燈挑地緣有語封還止印為無功鑄復銷賴是詩書能却瘴到今魂夢亦聞潮頭西㱕去君休怪尾假無多不奈焦舟中去楚及梅落過夔逢麥秋既非就國者判作賈胡留心力盤灘盡年光拋渡休移書故山友慎勿厭鋤耰北嵌雙鬢莖莖白孤舟寸寸移北嵌方守劑南畝定何時無處謀春酌他村博晚炊頻年卧江海寧恤一灘遲何執中挽詞白璧就黃壤忘情良獨難觀生六十化比歿九遷官筆下無時俗胸中有歲寒雅懷嗟不遂欲掛死前冠王元隱挽詩㕠鬢翻經老千金食客貧由來户外屨不救甑中塵惜此凌雲手終于入幕賓何人禪家學崔篆淂崔駰悼楊隱之承事忍能揮泪讀豐碑平昔修為我自知一日不齊無此理五行並下記他時肯教靈運先成佛未信王家敢譽兒耆舊即今零落盡鶴歸空嘆冡纍纍題覽勝閣後破佛塵侵面相黃金暗雨入眉毫白玉休此日爭看大垂手逰人誰𣸪小低頭將赴闕有感示𣆀老畏高門地慵便下澤車終然嬰世網難作愛吾廬白首趨行在青𫀆奉起居平生誇好手到此不如疏次韵强幼安冬日旅舍殘歲無多日此身猶旅人客情安枕少天氣舉杯頻桂玉黃金尽風埃白髮新異鄊梅信逺誰寄一枝春次韵幼安留别白頭重踏軟紅塵獨立鵷行覺異倫泩事已空誰叙舊好詩乍見且嘗新細思寂寂門羅雀猶勝纍纍冡卧麟力請宫祠知意否漸謀歸老錦江濱眉山唐先生文集卷五目唐庚子西近體詩西溪野望獨逰醉眠故游茂先大夫元祐初為唐安守豪逸喜賓客能劇飲談笑蓋陳孟公之流今唐安絃索之盛甲于西蜀自游使君始後纍遷至秦鳯憲以卒既二十餘年而其子振旅逰嶠南相過于惠州乃為作此篇以贈之憫雨贈博士承議次張天覺見贈韵重陽後一日從無盡泛舟游處士臺故詩人秦龜從所居和韵江陵逢故人宋德粹自播守罷歸南陽以詩見貽依韵和酬走城西别處厚居正二宗兄㑹居正出獨與處厚笑語終日頗有卜鄰之興因屬買田江陵作此詩和觀文相公立春日示詩生還至冝都逢李六舟中北嵌何執中挽詞王元隱挽詞悼楊隱之承事題覽勝閣後破佛將赴闕有感示𣆀次韵强幼安冬日旅舍次韵幼安留别
