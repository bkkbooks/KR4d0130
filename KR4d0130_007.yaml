  text: 眉山唐先生文集卷七
  hash: sha256:69dbe35f1d65dd2190a00c1faea355288197af16d571e6bfdf91edfe2d8dbf10
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_007-1a}
body:
  text: 眉山唐庚子西論辨蜀論自頃諸公論議多以蜀人為疑苟可以防閑阻遏無不為矣吾不知其說也以公孫述尝有蜀乎是時王郎㩀邯郸盧芳㩀九原刘永㩀梁宋隗囂㩀秦隴而秦豊李憲之属不可勝数何独蜀也以刘氏常有蜀乎是時曺氏㩀河南袁紹㩀河朔袁述㩀九江刘表㩀荆州孫氏㩀江表而公孫度宋度建之属不可勝数何独蜀也以王孟嘗有蜀乎是時刘隱称南漢李景称南唐錢鏐稱吴越刘崇稱東漢而馬啇王審知髙季㒷之属不可勝𢾗何獨蜀也議者以謂蜀有劎閣之險白帝之隘是大不然吴有長江魏有成臯趙有井陘燕有飛狐秦有崤凾天下之險有甚于蜀者矣而議者又謂蜀有沃野之饒塩鉄之冨是又不然史称秦地膏腴謂之陸海斉有魚塩絲麻戦國最為强雄楚通百越擅三江五湖之利吴人鼓鉄􅘮塩通天下天下之冨有甚于蜀者矣江左㓂盗不止于譙縦山東藩鎮十倍于刘闢甘陵之圍难㧞于均順江津之謀易敗于逢育今天下無事大臣長慮却頋推自昔祸患之所從起而逆閑之此其意則是矣而独施之于蜀則吾不知也正友論庾公之斯以朋友之故廢君命而君子不以為私叩輪去金發虚矢以塞責而君子不以為欺􅐱况之說其友也其言甚甘而君子不以為險其友為之墮肌隕首覆宗絶祀而君子不以為忍知此二義然後可以言友矣方漢之時吕禄之権為如何其宗族親黨日夜相與計議者為如何國家社稷宗庙之势為如何而父又刼貭其急為如何又安得捨所重以安所䡖則以計刼之也固冝彼子濯孺子之事豈至是耶以區區之鄭固非衛之所以存亡區區之子濯孺子又非鄭之所以强弱敵去而追之兹又國事之區區者而弯弓于其友則在名義為至重此孟子所謂一鈎金與一輿羽之势也何得以吕禄比之夫莫重于金莫䡖于羽此雖三尺之童足以知之至于輕重之中又有䡖重焉則非通孟子者不能権之矣孟子之書世未有通之者故漢魏之臣如蘇章于禁之徒皆以得已之事親誅其友猶復毅然自謂忠于朝廷而世亦莫知其為天下之至悪自是而后一变而相証再变而相吿三变而至相誣衊也豈不愈惑㢤嗚呼名教之事圣賢談之盡矣患不深考耳君使已誅其友則如之何曰審之祸大則誅之餘者可救則救之可贖則贖之無罪者辨之不可則辞于君要之不可以执戈友為不善則如之何曰審之祸大則誅之其次痛責而匡正之不從則去之其小者則忠告之不従則已終不可棄也夫上則善其君下則善其友使君臣朋友之間無不滿焉者豈非人之所欲㢤不幸而至于此則古人所以䖏之者亦有道矣而論者不察以君臣為公指明友謂之私何其不思之甚欤孔子曰以孝事君則忠曽子曰朋友不信非孝也是相生法也何名為私乎父子兄弟出于天君臣夫婦朋友岀于人而父子兄弟夫婦主恩君臣朋友主義則五教之中近于君臣者惟朋友為然故欲知人臣之忠者必于朋友焉観之寕有賊害其友而能忠于所事者乎是物理之必不然者夫以公心䖏之何適而非公苟私矣則君臣父子夫婦長㓜皆私也寕独友㢤嗟夫敎之所自岀者三而世缺其一曰師其所以為教者五而抑其一曰友察言論古之人臣抵掌緩頬說人主以用兵者其言未常不引義慷慨豪徤俊偉使聴者踊躍激發奮然而從之至考論其心則有為國計者有為身謀者是不可以不察也今夫戦則除害于時不戦則貽患于後此有必勝之势彼有必敗之道思慮深熟利害之形了然于胸中知其决不誤國而後為之若此者為國計非身謀也張華裴度是已天下既平謀臣宿将以侯就苐杜門却掃無所用其竒則瞑目扼腕争為用兵之說庻㡬有以逞其智勇而舒其意氣若此者為身謀非國計也臧宫馬武是已國家無事貪財嗜利之臣無所僥倖則必鼓倡兵端以求其所欲兵革一動則金錢貨幣玉帛子女何求而不淂若此者為身謀非國計也陳湯甘延寿是已官崇禄厚無所羡慕惴惴焉惟恐一日失势而不得保其所有則必建開边之議以中人主之欲以乆其权若此者為身謀非國計也楊國忠是已前侯故将失聀之臣負罪憂畏思有以撼動其君則争議边功以希復進若此者為身謀非國計也竇憲是已古之人臣逆莭已萌而功效未著人心未服則未尝不因戦伐之功以收天下之望若此者為身謀非國計也渊圣御名温刘𥙿是已嗟乎秦漢以来説人主以用兵者多矣或勝或不勝要之為國计者至少為身谋者如此其多途也可不戒㢤憫俗論自古诸矦凨俗大小曷常不與其國相称斉地負海膏壤二千里則其俗濶達寛緩而多智全晋未分時在春秋世最為强國則其俗用意深逺有古帝王之遺風邹鲁居洙泗之间迫于斉楚國小而地狭則其俗亦復齷齪而謹畏今天下大矣尭舜三代之地盖不至于此民生其间耳之所聞目之所睹体之所安者壮矣而凨俗之大不足以称之有是理否凨俗非一事要以人材為本今士大夫達時变識事情警敏有餘矣至于斈治道通大体氣力度量足以支乆而任重者未可多得是豈無有也有而不容于時今之建言者類皆薄物细故非天下所以治乱安危而士之所言亦不過趣一切辦治而已非能有益于宗庙社禝计也斈術小故無大論議力量狭故無大功名以為上世悉然則前此凨俗尝廣矣当是之時惟恐其䟽尔形势非有不同年表日暦非甚相逺而更病其隘是必有说矣吾聞江海之水必有吞舟之魚通邑大都必有千金之家以四方万里之國而非得恢廓宏逺之凨以充之是犹衣九尺之衣束十圍之带髙視濶歩而血氣不逾中人也可乎建武永平之治未必不優于西京而凨俗不及者正其小也傳曰不知其形視其影也今百工之所造啇賈之所鬻女女之所服者日益狭隘而一時人物大率精悍而短小此非其影耶古之化俗悪者可使善邪者可使正今俗非有他也独患小耳頋不可使之大乎議賞論刑賞為用尚矣自尭舜時已有是說今夏書有之啇書亦有之至周礼為最详而孔子孟子无取焉以為上意所向天下靡然而從惟患其過不患其不及故為人主者示以好悪荣辱足矣何至用刑賞㢤天下無事民各安其性命之情非有夏啟伐囯之㪯盤庚涉河之後而重賞以募善痛劾以惧悪此駭民乱俗之本王者之所深悪也揚子曰民可使覿徳不可使覿刑覿徳則纯覿刑則乱以吾覌之寕独刑㢤刑賞皆不可覿而賞爲甚秦法斬一首賜爵一级而秦人賜爵者十室而九方是之時宗室非此者不得附属籍而民非此者不得有芬華故閭閻以公乗侮其郷人郎中以上爵傲其父兄世知覿刑之弊至于亡秦而不知秦俗之敗正坐覿賞尔髙祖以金錢爵邑收天下豪俊此可與創業矣而不可與守成可與立事矣而不可與善俗何則利者君子之所諱也宋牼一言及之孟子恐惧变色以為不可訓而况以利誘天下得乎漢道之雜盖始于此是術也施之衆庻犹若有理焉施之士大夫則過矣古之誓師必以賞戮為言至告群臣則曰用罪罰厥死用徳彰厥善謂之徳者盖有恩礼存焉不指谓賞而已不言戮者以士可殺不可辱故也徳近義所以待君子賞近利所以待小人古之所以待君子小人故有間矣世称伯夷叔斉適周使叔旦徃見之曰加冨二䓁就官一列血牲而盟之二子相視而矣此固虚語也武王周公豈至是㢤使誠有此則其見笑也固冝何則貪夫狥利烈士狥名不察其所狥為如何而一切以利㗖之豈其志也㢤是術也施之士大夫猶有理焉施之大臣則又过矣昔平原君用魏無忌兵觧邯郸之圍虞卿為之請封公孫龍曰不可王㪯君相趙封君東城非以有功也以親戚故也君受相印不辞割地不言無功亦自以親戚故也今有功而欲求夫益封則是以親戚受城而乃以國人計功也其可乎㢤世皆以龍之説為知言吾尝聞之留侯晚莭决䇿建都関中為議又復出竒䇿而取馬邑皆不思求所以益其封由此覌之留侯之䖏于已者不以功名利禄為心而岀扵流俗之表自待者不綦重乎而朝廷所以䖏之者亦復有体漢世君臣惟此爲近古㢤眉山唐先生文集卷七眉山唐先生文集卷七目唐庚子西論辨蜀論正友論察言論憫俗論議賞論
