  text: 眉山唐先生文集卷七
  hash: sha256:69dbe35f1d65dd2190a00c1faea355288197af16d571e6bfdf91edfe2d8dbf10
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_007-1a}
body:
  text: 眉山唐庚子西論辨蜀論自頃諸公論議多以蜀人為疑苟可以防間阻遏無不為矣吾不知其説也以公孫述嘗有蜀乎是時王郎據邯鄲盧芳據九原劉永據梁宋隗囂據秦隴而秦豐李憲之屬不可勝數何獨蜀也以劉氏常有蜀乎是時曺氏據河南袁紹據河朔袁述據九江劉表據荆州孫氏據江表而公孫度宋度建之屬不可勝數何獨蜀也以王孟嘗有蜀乎是時劉隱稱南漢李景稱南唐錢鏐稱吳越劉崇稱東漢而馬啇王審知髙季興之屬不可勝𢾗何獨蜀也議者以謂蜀有劎閣之險白帝之隘是大不然吳有長江魏有成臯趙有井陘燕有飛狐秦有崤函天下之險有甚于蜀者矣而議者又謂蜀有沃野之饒鹽鐵之冨是又不然史稱秦地膏腴謂之陸海齊有魚鹽絲麻戰國最為強雄楚通百越擅三江五湖之利吳人鼓鐵􅘮鹽通天下天下之冨有甚于蜀者矣江左寇盜不止于譙縱山東藩鎮十倍于劉闢甘陵之圍難拔于均順江津之謀易敗于逢育今天下無事大臣長慮却顧推自昔禍患之所從起而逆間之此其意則是矣而獨施之于蜀則吾不知也正友論庾公之斯以朋友之故廢君命而君子不以為私叩輪去金發虛矢以塞責而君子不以為欺􅐱况之説其友也其言甚甘而君子不以為險其友為之墮肌隕首覆宗絶祀而君子不以為忍知此二義然後可以言友矣方漢之時吕祿之權為如何其宗族親黨日夜相與計議者為如何國家社稷宗廟之勢為如何而父又劫質其急為如何又安得捨所重以安所輕則以計劫之也固冝彼子濯孺子之事豈至是耶以區區之鄭固非衛之所以存亡區區之子濯孺子又非鄭之所以強弱敵去而追之兹又國事之區區者而彎弓于其友則在名義為至重此孟子所謂一鈎金與一輿羽之勢也何得以吕祿比之夫莫重于金莫輕于羽此雖三尺之童足以知之至于輕重之中又有輕重焉則非通孟子者不能權之矣孟子之書世未有通之者故漢魏之臣如蘇章于禁之徒皆以得已之事親誅其友猶復毅然自謂忠于朝廷而世亦莫知其為天下之至惡自是而后一變而相證再變而相告三變而至相誣衊也豈不愈惑哉嗚呼名教之事聖賢談之盡矣患不深考耳君使已誅其友則如之何曰審之禍大則誅之餘者可救則救之可贖則贖之無罪者辨之不可則辭于君要之不可以執戈友為不善則如之何曰審之禍大則誅之其次痛責而匡正之不從則去之其小者則忠告之不從則已終不可棄也夫上則善其君下則善其友使君臣朋友之間無不滿焉者豈非人之所欲哉不幸而至于此則古人所以處之者亦有道矣而論者不察以君臣為公指明友謂之私何其不思之甚歟孔子曰以孝事君則忠曽子曰朋友不信非孝也是相生法也何名為私乎父子兄弟出于天君臣夫婦朋友出于人而父子兄弟夫婦主恩君臣朋友主義則五教之中近于君臣者惟朋友為然故欲知人臣之忠者必于朋友焉觀之寧有賊害其友而能忠于所事者乎是物理之必不然者夫以公心處之何適而非公苟私矣則君臣父子夫婦長幼皆私也寧獨友哉嗟夫教之所自出者三而世缺其一曰師其所以為教者五而抑其一曰友察言論古之人臣抵掌緩頰説人主以用兵者其言未常不引義慷慨豪健俊偉使聽者踊躍激發奮然而從之至考論其心則有為國計者有為身謀者是不可以不察也今夫戰則除害于時不戰則貽患于後此有必勝之勢彼有必敗之道思慮深熟利害之形了然于胸中知其決不誤國而後為之若此者為國計非身謀也張華裴度是已天下既平謀臣宿將以侯就苐杜門却掃無所用其竒則瞑目扼腕爭為用兵之説庶幾有以逞其智勇而舒其意氣若此者為身謀非國計也臧宫馬武是已國家無事貪財嗜利之臣無所僥幸則必鼓倡兵端以求其所欲兵革一動則金錢貨幣玉帛子女何求而不淂若此者為身謀非國計也陳湯甘延壽是已官崇祿厚無所羡慕惴惴焉惟恐一日失勢而不得保其所有則必建開邊之議以中人主之欲以久其權若此者為身謀非國計也楊國忠是已前侯故將失聀之臣負罪憂畏思有以撼動其君則爭議邊功以希復進若此者為身謀非國計也竇憲是已古之人臣逆莭已萌而功效未著人心未服則未嘗不因戰伐之功以收天下之望若此者為身謀非國計也淵聖御名溫劉𥙿是已嗟乎秦漢以來説人主以用兵者多矣或勝或不勝要之為國計者至少為身謀者如此其多途也可不戒哉憫俗論自古諸矦凨俗大小曷常不與其國相稱齊地負海膏壤二千里則其俗濶達寬緩而多智全晉未分時在春秋世最為強國則其俗用意深逺有古帝王之遺風鄒魯居洙泗之間迫于齊楚國小而地狹則其俗亦復齷齪而謹畏今天下大矣堯舜三代之地蓋不至于此民生其間耳之所聞目之所睹體之所安者壯矣而凨俗之大不足以稱之有是理否凨俗非一事要以人材為本今士大夫達時變識事情警敏有餘矣至于學治道通大體氣力度量足以支久而任重者未可多得是豈無有也有而不容于時今之建言者類皆薄物細故非天下所以治亂安危而士之所言亦不過趣一切辦治而已非能有益于宗廟社禝計也學術小故無大論議力量狹故無大功名以為上世悉然則前此凨俗嘗廣矣當是之時惟恐其疏爾形勢非有不同年表日曆非甚相逺而更病其隘是必有説矣吾聞江海之水必有吞舟之魚通邑大都必有千金之家以四方万里之國而非得恢廓宏逺之凨以充之是猶衣九尺之衣束十圍之帶髙視濶步而血氣不逾中人也可乎建武永平之治未必不優于西京而凨俗不及者正其小也傳曰不知其形視其影也今百工之所造啇賈之所鬻女女之所服者日益狹隘而一時人物大率精悍而短小此非其影耶古之化俗惡者可使善邪者可使正今俗非有他也獨患小耳顧不可使之大乎議賞論刑賞為用尚矣自堯舜時已有是説今夏書有之啇書亦有之至周禮為最詳而孔子孟子無取焉以為上意所向天下靡然而從惟患其過不患其不及故為人主者示以好惡榮辱足矣何至用刑賞哉天下無事民各安其性命之情非有夏啓伐國之舉盤庚涉河之後而重賞以募善痛劾以懼惡此駭民亂俗之本王者之所深惡也揚子曰民可使覿德不可使覿刑覿德則純覿刑則亂以吾觀之寧獨刑哉刑賞皆不可覿而賞為甚秦法斬一首賜爵一級而秦人賜爵者十室而九方是之時宗室非此者不得附屬籍而民非此者不得有芬華故閭閻以公乘侮其鄉人郎中以上爵傲其父兄世知覿刑之弊至于亡秦而不知秦俗之敗正坐覿賞爾髙祖以金錢爵邑收天下豪俊此可與創業矣而不可與守成可與立事矣而不可與善俗何則利者君子之所諱也宋牼一言及之孟子恐懼變色以為不可訓而况以利誘天下得乎漢道之雜蓋始于此是術也施之衆庶猶若有理焉施之士大夫則過矣古之誓師必以賞戮為言至告群臣則曰用罪罰厥死用德彰厥善謂之德者蓋有恩禮存焉不指謂賞而已不言戮者以士可殺不可辱故也德近義所以待君子賞近利所以待小人古之所以待君子小人故有間矣世稱伯夷叔齊適周使叔旦往見之曰加冨二等就官一列血牲而盟之二子相視而矣此固虛語也武王周公豈至是哉使誠有此則其見笑也固冝何則貪夫徇利烈士徇名不察其所徇為如何而一切以利啖之豈其志也哉是術也施之士大夫猶有理焉施之大臣則又過矣昔平原君用魏無忌兵解邯鄲之圍虞卿為之請封公孫龍曰不可王舉君相趙封君東城非以有功也以親戚故也君受相印不辭割地不言無功亦自以親戚故也今有功而欲求夫益封則是以親戚受城而乃以國人計功也其可乎哉世皆以龍之説為知言吾嘗聞之留侯晚莭決䇿建都關中為議又復出竒䇿而取馬邑皆不思求所以益其封由此觀之留侯之處于已者不以功名利祿為心而出于流俗之表自待者不綦重乎而朝廷所以處之者亦復有體漢世君臣惟此為近古哉眉山唐先生文集卷七眉山唐先生文集卷七目唐庚子西論辨蜀論正友論察言論憫俗論議賞論
