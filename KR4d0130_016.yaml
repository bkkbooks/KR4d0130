front:
  text: 眉山唐先生文集卷十六
  hash: sha256:e2aefd91f364b00ef627905b49721c222d3f828af29c7c77a8f117e25a162564
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_016-1a}
body:
  text: 眉山唐庚子西雜文唐先生行狀唐先生諱某字彥通眉州丹稜縣人曽祖諱某祖諱某考諱某俱不仕皇考之捐館也先生始六歲是時鄉人未知宦學先生孤露自奮卒為名儒其學博而不雜其制行和而不流輕財好施出于自然蓋自堯舜三代以來理亂廢興典章人物莫不考論旁至諸子百家天文地理方技醫卜之書莫不通貫其博至于如此然特深于經術著四經微旨行于世而專用春秋名家為講義三十卷辨三傳七卷大抵以春秋為無褒其于傳注取二三䇿而已此所以見其不雜也性簡易不作崖檢與鄉人處油油然無貴賤皆淂其􅌚心比其沒也逺近聞之俱出涕嘆息逮今二十年思之不忘其和至于如此然議論剛正無所附阿負其所藴非其友不友亦以是見惡于不善者此所以見其不流也平生用財不問其數嘗至濛陽其尉丁憂貧不淂去先生雅不識其人傾槖贈之空手而歸其好施類皆如此而未嘗有難色此所以見其自然也自嘉祐冶平年間先生已有盛名西南學者爭宗師之授經者纍𢾗百人然應進士舉及不中益昌龍圖閣直學士陸公詵荐之亦不報浮沉丘園無復仕進意熙寧𥘉罷詩賦以經義取人士論喜其必有所合既而春秋不為經先生亦老矣始終不遇蜀人惜之然余考其行事以求其用心則平生所有良而可見族本以冶産冨饒而先生專業儒士方以聲律進取而先生獨治經此其志豈為利祿計也哉命雖不偶于今而其書具在是以傳于後世無窮復何憾焉元祐三年閏十二月二十五日終于家享年六十有三前娶家氏再娶史氏男五人如四人適某皆士人也孫男四人孫女二人皆幼卜以崇寧三年二月二十八日葬縣之南二十里鼓面山之原以史氏祔豫頃出守咸安道過閬中而先生之子某適宰是邑傾蓋如故遂定為忘年友然􅺢狀先生行義以告于士大夫者非某職耶謹狀史夫人行狀夫人史氏眉州青神縣人嘉州軍事推官諱著明之曽孫大理寺丞諱昭吉之孫進士諱及之女魯國先生諱某之配也先生喜賓客重然諾視金錢如泥無分毫顧惜不論多寡廢盡乃已竟坐此貧而夫人處之怡然自淂其為善之樂也先生自言吾六歲而孤勤苦自立取名于時豈有兄弟教哉嘗持是説未嘗督責三子以學而夫人則不然躬課諸郎讀書至丙夜乃寢率以是為常平生無所好獨聞誦書聲輒欣然蓋性之所嗜如此夫人不逮事舅姑事先生如事父治飲食以進必立侍須徹饌乃去或者以為過元祐三年春先生遇疾幾殆夫人焚香禱祈碩以身代死家人止之不聽俄而疾暴作擲香爐于地扶掖就枕已不知人後六日夫人病篤而先生疾稍間先生竟愈而夫人遂不起時二月二十日也𥘉夫人之祈死也先生疾革不知夫人既卆諸子以事告先生哀甚為詩以哭之聞者莫不泣下夫人享年五十六某其子也某其壻也某其孫也孫女二人尚幼崇寧三年二月二十八日從先生葬于丹􅏢縣鼓面山之原先生道雖不行于民其行于家者蓋如此非先生何以當夫人之賢觀夫人足以知先生之道其也庚所以必欲狀其行以傳于人豫所以不淂而辭也嗚呼誠亦可書也哉謹狀贊銘先君真贊嘉祐熙寧間西南有隱君子焉幅巾布衣時時出遊人間士大夫好事者多從之遊喜談易詩春秋辭旨邃逺能得先儒所未到者遇人飢寒解衣衣之推食食之人有所求則鬻衣賣履與之無難色緩急輒隂救之問其姓名則嫚罵不以告逢人無貴賤皆抵掌談笑蜀人皆知其為有道之士相與強為先生然竟莫測其果何人也元祐末遂不𣸪法不𣸪出耶抑出而人不見也傳者以為卆矣是殆不然先生遊無何有之鄉獨與道逰者也道在與在道亡與亡使道而果亡則先生信死矣道未喪于天下則先生烏乎死紹聖𥘉有姓唐名庚者畫先生之像而事之為先生作真贊自稱為先生之子云而書此以贊之曰軒然其頎幅巾布衣清凨蕭蕭在人目圍此豈先生者耶孰能援筆一揮摹其心中之精微也哉又次齋銘生而知之自誠而明學而知之自明而誠困而學之又其次者困而不學民斯為下吾少也狂自以為健出而接物然後知困今雖老矣幸其未衰陳書于齋以學以思家藏古研銘硯與筆墨蓋氣類也出處相近也任用寵遇相近也獨壽夭不相近也筆之壽以日計墨之壽以月計硯之壽以世計其故何也其為體也筆最鋭墨次之硯鈍者也豈非鈍者壽而鋭者夭乎其為用也筆最動墨次之硯靜者也豈非靜者壽而動者夭乎吾于是得奍生焉以鈍為體以靜為用或曰壽夭數也非鈍鋭動靜所制借令筆不鋭不動吾知其不能與硯久逺也雖然寧為此勿為彼也銘曰不能鋭因以鈍為體不能動因以靜為用惟其然是以能永年有翠亭銘山不逺人人自逺山見即為易有之為難隴上牧兒林間樵叟雖能淂之而不可有貴戚買園寵侯賜宅雖或有之而不可淂惟吾放浪與是有緣淂而有之蒼翠滿前為亭北牗其髙三仭目力所到閬山皆盡客來登亭勿嗔吾貪子如欲之兮為君分甘謝雨文農事方作雨不來稻畦麥壠飛塵埃神哀此民賜以雨􅍺溝支澮流膏乳殽肥酒香答神休神終相之俾有秋古體惜梅賦閬中縣庭有梅株甚大正當庭中出入者患之有勸豫以伐去者為作惜梅賦縣庭有梅株焉吾不知植于何時蔭一畝其踈踈香數里其披披侵小雪而更煩淂朧月而益竒然生不淂其地俗物混其幽姿前胥吏之紛拏後囚繫之嚶咿雖物性之自適揆人意而非冝既不淂荐嘉實于啇鼎效微勞于魏師又不淂托孤根于竹間遂野性于水涯悵驛使之未逢驚羌笛之頻吹恐飄零之易及雖清絶而安施客猶以為妨賢也而諷豫以伐之嗟夫吾聞豳蘭之美瑞乃以當户而見夷兹昔人之所短顧仁者之所不為吾寧迂數步之行而假以一席之地對寒艷而把酒嗅清香而賦詩可也平臺賦平臺梁王劉武作也班史稱平臺唐杜甫稱吹臺世以謝惠連嘗為雪賦也則又謂之雪臺舊説在大梁城東北如淳晉灼云在大梁城東二十里今在城東南蓋漢距今且千歲城郭凡幾變則聞見之異冝哉作平臺賦豫與客逰汴都之東南登梁王之平臺顧草木之黃落懷古人以裴回客慨然嘆曰吾聞祖龍失劒楚竊其柄漢鑒其孤矯枉過正齊楚趙魏燕韓之郊荆楊兖豫青徐之境蟠城千里星散碁布原田溝澮不知其幾千萬頃瓜分幅裂以王一姓于是擅爵人而赦死罪戴黃屋而私蹕警鼓銅破山煮海絶流侈極奢窮然未有如梁之親幸者也井畢煌煌實沈之疆北界泰山西抵髙陽帝子出閣有燁其光金錢布幣子女玊帛錦繡寶器車馳轂擊轆轆繹繹挽來于梁爾乃羽翼鄒枚腹心勝詭郊關之囿三百餘里萬甃鱗鱗樓閣橫斜擬于未央之邃也峭築峨峨蔽景干霄擬于漸臺之峻也靜影潭潭日星泳􅉼擬于太液之深也麋鹿咿咿禽珍獸竒擬于上林之多也旌旗纛斾前騎後乘擬于五柞之遊也鷙擊盧馳躡景追飛擬于長楊之獵也千金一罍斫瓊􅍢瑰擬于武庫之藏也遊談之士濡毫緩頰曵長𥚑而從之逰擬于公車金馬之待詔也夫侈極則疑勢逼則離弱幹強枝安能久而不危也邪豫曰噫子知其一而未覩其二也勝廣之亂毒于𬋩蔡吕霍之變危于吳楚三馬之逼痛于燕爽王淵聖御名之禍深于齊趙子曷不較其輕重哉周室東遷晉鄭焉依朱虛叱吒祿産殱夷五葉之後宗國陵遲洗垢求瘢吹毛索疵剪刈肘腋棄絶藩籬墮犬牙之形勢壞磐石之宏基故長沙夆𬒮而不淂逞中山感音而涕洟濟之墟梓柱生枝以饐廢食卒死于飢可不悲哉客憮然為間曰然子言淂之眉山唐先生文集卷十六眉山唐先生文集卷十六目雜文唐先生行狀史夫人行狀贊銘先君真贊又次齋銘家藏古研銘有翠亭銘謝雨文古體惜梅賦平臺賦
