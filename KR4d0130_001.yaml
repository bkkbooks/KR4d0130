front:
  text: 眉山唐先生文集卷一
  hash: sha256:6aed1fcd3eeb8a1318e581794e3c809ae669423945e235bfb0a3909e30513aa4
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_001-1a}
body:
  text: 眉山唐庚子西賦南征賦始攝提之孟冬余負罪而南馳雪盈尺而更煩風三日而猶吹體凍極而若無心怖甚而忘悲凡再信而至許覺驚魂之稍歸訪景福之遺基指空郊之荒濼曽禾黍之無有矧欒梁之丹艧國已挹于三馬臣不聞于一鶚豈當世之無儒抑此病之難藥道昆陽而流嘆淡悲風與愁雲階一夫之僣竊紛萬鬼之煩冤嗟世祖之論功忘王章之曩言既直鉤之不食終曲突之無恩過叔子之舊邦登峴山而痛哭方關右之放賈蓋眼中之拔鏃獨何心而表晋卒飬癰而潰肉倘遺靈之猶在當衆白而相沃盡荆門之犖確瞰蜀江之湯湯念故人之久别覺良晤之甘香稍回翔于澧浦忽凌亂于瀟湘時廓舒而浩蕩𣸪收斂而凄凉咏九歌之餘哀閔三閭之孤趨豈公子之足怨實夆國而無與內不懌于女􅎐外見非于漁父持此道以奚歸亦各安于所處自是逺矣行人漸稀水愈激而愈清山益削一作刻而益竒造郴嶺之窮處云湟關之故基客至此兮返顧雁至此兮北飛眷炎溪之毒淫吊文淵之矍鑠射參狼于隴阪觀跕鳶于浪泊奮身出于萬死謄口喧於百惡信老子之是哀覺少遊之差樂經韶陽而再宿寫石上之遺聲悟聖神之在宥如天地之生成彼禽魚固自有理而日月未常不明雖吹萬之不同吾淂一而皆正捨真陽之短䇿放清遠之孤舟覷碧落之靈祕嘲峽山之媚柔承懸崖之滴乳搴裊岸之垂樛探羊城于浩茫發蒲澗于深幽窮一時之詭觀渺萬古之清愁蓋明年之正月矣始稅駕于羅浮省愆賦唐子謫居嶺表既已半載杜門時省愆而慨曰身邪心邪孰陷吾于罪乎吾將求之身則身非我有四大所㑹地水火風誰為之宰吾將求之心則心不在內𣸪不在外不在中間是將安在晝夜以思寢食皆廢骨為之出髮為之改夢有告余曰甚哉子之蔽也罪性本空念念滅壞反𣸪尋繹祗益咎悔道逢臭腐何足眄睞玩味不已適足自穢净是妄而况垢榖猶無而矧稗譬之身體本自安泰或作病想便嬰瘵識此病之誰受尚何施于砭艾譬之手足伸縮無礙忽作縳想舉動輒絓悟此縳之無實即無繩而可解方聳聽于妙語失胸中之結磈若春動而氷坼若秋至而葉敗回視無始以來幾千萬世所作罪業悉消散而崩潰矣豈獨今之所以流落顛沛者哉覺而思之曰噫此殆維摩詰也攬衣而起正冠束帶稽首西望作禮而退古體詩內前行內前車馬撥不開文德殿下宣麻回紫薇侍郎拜右相中使押赴文昌臺旄頭昨夜光照牖是夕收芒如秃帚明日化為甘雨來宅家喚作調元手右相視事明日始淂兩上喜甚書啇霖二大字賜之周公禮樂未要作致身姚宋也不惡向來兩翁當國年民間斗米才四錢長沙示甥郭聖俞我昔官閬中子時趨長安相過日夜飲肯使笑語乾但知醒復醉誰問甜與酸攬衣步中庭仰首羡飛翰誓言早歸休慎勿貪高官時未有添丁眼前惟木蘭舅甥一分背日月㕠跳丸那知十年外相見西江干拜起未寒溫悲來各汍瀾我鬢已秃翁子顔非渥丹相從海上去兹事人所難阪行白􅐯漭山宿青攢攢人烟小歲後草木深冬完昨日次長沙扁舟掠湘灘中流遭惡風滿衣潑驚湍船如旗尾點天作車輪團怖畏目敢側禱祈指頻彈向非鬼神助幾作蛟龍餐忠信時可慿聖賢豈吾謾勿畏嶠南熱我清物自寒勿憂海邦陋心廣身亦寬磨刀斫鯨鱠隱几看鵬搏努力近藥物明年理歸鞍淂之兩鳴鵠龜筒不須鑽張曲江鐡像詩開元太平久錯處非一拍就令乏賢人何至相仙客直道既雕喪曲江遂踈斥汲黯困後薪賈生罷前席金鑑束髙閣鐵胎空數尺妙處難形容英表良髣佛摩挲許國姿尚想立朝色同時反棄置異代長嘆息湖上佳月明作哲好風聖之清湖邉淂二友夜語投三更烟露兩相􅊜水天參互明散衣芭蕉凉曵杖桄榔輕星赱拋餘光山空答虛聲歸矣不可留過幽恐神驚㕠榕水東㕠榕間有叟時出逰清風衣屨古白雪鬚髯虬吟哦明月夕簸弄寒江秋驚傳里中兒不泊岸下舟君看鬼趣中有此風味不安知非黃石但恨無留侯此生鋤犁手誤入簮紳流無功抵毫髮負罪平山丘政爾求㵕濯聞之歎綢繆摳衣倘可親跪履安敢羞淂聞半偈語一解終身憂性不喜伐國兵書非所求大熱行去年大雪埋尺箠水比荔支遭凍死共嗔比客帶寒來我欲分疏誰受理今年諸峒十分熱東江不下龍川米南翁北客兩欣然孰與忍飢餐荔子蛋兒歌瀘南二子天一邉思之不見今三年阮咸已老淂遙集白髮自愧還欣然未看顱骨并頰顴啼中已有過秦篇諸田何淂賤庶孽㑹斬莊賈摧强燕蜜果臣聞失旦雞已曉猶强鳴書生坐口窮抵死輸血誠嶺南貢蜜果海道趨􅊮庭黃蜂樂受聀紫鳯助揚舲忠勤雖云至思慮良未精由來瘴癘鄉不識霜雪清土風不待講氣象昏如酲粳稻粳稻熱水泉水泉腥而况野果實豈足奉聖明未論體性殊已覺面目生食之倘有𥙷勞者甘如餳政恐無禆益所出非和平上林寧少此下箸安可輕軒轅嘗百毒上古雜神靈武王嗜鮑魚㦲諌伏老成芻蕘𣸪何有葵藿但自傾圓蛤黃犢鳴水中相顧皆愕然探之亡所淂有蛙僅如錢持問旁舍翁云此號圓蛤夏潦漲溝渠喧呼自酬答卒然聞其聲謂當可專車既見一拊掌寸莛量有餘物生元氣中小大各異趨蛙賓黃牛鳴持此欲誰附我居固已陋爾鳴良亦村綿蠻囀黃鸝我今思故園白小二年遵海濱開眼即浩渺謂當飽長鯨糊口但白小百尾不滿釡烹煮等芹蓼咀嚼何所淂鱗鬛空紛優向來若魚戲海面橫孤嶠噞喁噴飛沫白雨散晴曉終然不省録從事此微眇短長本相形南北無定表泰山不為多毫末夫豈少詞雄兩月讀理足三語妙人生一漚發誰作千歲調安䏻蹲㑹稽坐待朞年釣瘧疾寄示聖俞體中初微溫末勢如湯鑊忽然毛髮起冷撼如振鐸良久交戰罷項背如釋縳尚覺頭涔涔眉額如鑱鑿空日一寒暑有凖如契約伏枕兩晦朔枵然如空槖平生十圍腰病起如飢寉衰髮本無幾脫去如秋籜到今僅䏻步出沒如尺蠖舊聞五嶺法有此萬户瘧而我自僑寓了不蒙濶略况子又持飬何至亦例著此身自空虛客疾安所托請作如是觀無病亦無藥示蛋先君捐館年六十畸三算我今四十三始淂幼子蛋餘齢繼前躅蛋也才及冠况復未可知孝章積憂嘆祿飬豈不欲兹事覺已緩但愛眉目秀體質净如盥顧瞻既精神懷抱亦氣岸今者新剔髮瑩若珠未貫見之令人清面擁疲手腕輒然攫吾鬚霜雪落几案豈惟不肯嗔更對一笑粲骨肉今遠矣恃汝慰奔竄行當從諸兄誦書喧里閈而我于經術粗能分句斷發蒙要師資心孔為開鍵許慎專偏傍張華休史漢吾家業儒久捨此無别段不應緣一噎便欲廢炊㸑及親三釡足未用萬户鄼人生百年期我今特未半夢泉并序潮陽尉鄭太玉夢至泉側飲之甚甘明日淂之東山上因作夢泉記示余命作此詩入道肯著相出神淂佳泉起尋定中境謾意山之巔四人踏髚數里聞潺湲循聲到巉絶滿意流甘鮮雖深石可數太察魚難筌分為縞練去濺作珠璣圓一窺宿酲解三咽沈疴痊恍惚尚疑夢歡呼欲成顛山間短于井海飲鹹生涎那知道在邇幾作野遺賢事故由人興物為知已妍誰陪濠上遊諒携室中天雖無十丈花中有一滴禪名酒覺殊勝冝茶定常煎蘭亭羽觴冷魚腹青筒連新文來遠矣開卷猶潨然徑欲抱琴去􅎔流聽未全不但受以耳庶幾神者先寫為夢泉􅋵弟入樂府篇將前輒復却萬事付有緣鳴鵲行簷前群鵲鳴相呼法當有客或遠書吾今何處淂書尺而况賓客乘軒車平生眼中抹泥塗泛愛了不分賢愚卒為所賣罪滿􅥟放逐南越烹蟾蜍百口寄食西南隅三年莫知安穩無家書已自不可必更望故人雙鯉魚故人須來絶䏻踈况𣸪萬嶺千江湖雞肋曽是安拳餘至今畏客如於菟豈惟避謗謝還往此日誰肯窺吾廬杜門却掃也不惡何但忘客兼忘吾喧喧鳴鵲汝過矣曷不往噪權門朱採藥行贈梅蟠順途行歌醉者誰先生採藥山中歸昨日携籃入山去今日出山香滿路先生年來飯黃精俗眼但白髮但青得失乘除適相𥙷勿取讒人卑豺虎鍾潭行君不見惠州城之西永福古寺鍾崛竒夜輒亡去黎明歸萍沙摹糊水淋漓山僧初驚久恬嬉一夕徑去不返棲父老嗟惜僧垂洟明年夏旱江水低此鍾居然水中坻奔赱往視空城陴挽以巨纜牛百蹄牛喘梚絶鍾不移度不可得乃去之江花開落水東馳到今過者猶俯窺刻舟記劍真自癡不應此物猶沙泥眉山唐先生文集卷一眉山唐先生文集卷一目唐庚子西賦南征賦省愆賦古體詩內前行長沙示甥郭聖俞張曲江鐵像詩湖上雙榕大熱行蛋兒歌蜜果圓蛤白小瘧疾寄示聖俞示蛋夢泉鳴鵲行採藥行贈梅蟠鍾潭行
