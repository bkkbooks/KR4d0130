  text: 眉山唐先生文集卷十三
  hash: sha256:22493dc855d4cf2744f12993a52d6465ecea7b7fd22d543546eb1cf4d905d1f1
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_013-1a}
body:
  text: 眉山唐庚子西三國雜事篇下亮出祁山南安天水安定三郡響應會馬謖敗三郡不守亮拔西縣千餘家還漢中漢全盛時日月所照橫目之民皆漢赤子其後德薄不能保有黎庶則舉江以東而投之吳割渭以北而捐之魏則民不棄漢而漢棄其民亮出祁山三郡望風響應而亮不能守則亮負于民而民不負亮方是之時固當集其所獲之衆痛自引咎而謝遣之使崤隴之民曉然皆知吾心則後日之舉不患其不至如其不然在彼猶在此也而亮拔西縣千餘家遷之漢中既不足以傷敵而使無辜之民流離遷徙違其宗族去其墳墓豈三郡所以響應之意哉此雖邉鄙之常然于孔明則有不應爾者此吾所以為之惜也孫亮太平二年宗室孫基盜乘御馬付獄侍中刁玄奏曰基法應死然魯王早終惟陛下哀原之亮曰法者天下所共奈何以情相逭耶當思所以釋此者玄曰赦有小大或天下或千里或五百里隨意所及乃赦宫中基得以免吳之君臣可謂上下皆失其分矣漢世諸矦王有罪當誅丞相御史典客宗正廷尉奏請論如法制曰朕不忍致法其與列矦二千石議之於是丞相御史等又奏臣等謹與列侯二千石議皆曰冝論如法制曰朕不忍致法其廢勿王或削地若于夫請論如法者有司以法守不忍致法者人主以道揆今亮人主而論法玄有司也而論情故曰吳之君臣可謂上下皆失其分矣魯肅勸權以荆州借偹周瑜言備梟雄不冝以土地資業之漢時荆南之地為郡者七劉表之殁南陽入于中原而荆州獨有南郡江夏武陵長沙桂陽零陵偹之南奔劉琦以江夏從之其後四郡相繼歸附于是備有長沙武陵桂陽零陵之地曺仁既退關羽周瑜錯處南郡而偹領荆州牧居公安則六郡之地備已悉據之矣其所以云借者猶韓信之言假也雖欲不與得乎魯肅之議正合良平躡足之幾而周瑜獨以為不然屢勝之家果不可與料敵哉建安二十年先主居公安使關羽爭荆州會曹公征漢中先主恐失益州引軍還蜀曹公征漢中先主聞之與吳連和分荆州是矣引軍還蜀非也是時蜀有南郡之地而先主以蜀兵五萬居公安若進據襄陽而羽帥五萬之衆以襲許卷甲疾趨五日而可至事成則天下未可量不成則漢中之師不攻而自退此兵法所謂攻其所必救者𥘉曺公征栁城偹勸表以襲許及偹據荆州亦不能辦此信乎天命之有所在哉孫權稱尊議者以為交之無益而名體弗順冝遂絶之孔眀以為未可或曰孔眀之不絶吳權耶正耶曰正也非權也六國之時諸侯皆僣矣孟子以為有王者作不皆比而誅之必教之不從而後誅之然則未教之罪王者有所不誅孔明之勢既未能有以教􅉴則吳之僣擬未可以遽責此王者之法也非權也􅉴欲以兵萬人討樊胄權問潘濬濬言五千兵足以擒胄因論胄可破狀權竒其言遣將五千討平之權克荆州將吏悉降而濬獨堅卧不屈權輿致之濬伏床而泣悲不自勝其于所事何其厚也既而樊胄欲以武陵自拔歸蜀濬為權畫䇿卒自將討平之其于所厚又何薄也意者在君為君有不淂不然者乎吾聞樂毅去燕適趙趙欲與之伐燕毅泣曰昔之事燕猶今之事趙也毅若獲戾放在他國終身不敢謀趙之徒􅊢况其國乎使樂毅愚人也則可樂毅少知事君則濬不得為無罪矣晉侍中荀朂中書令和嶠使著作郎陳夀定故蜀丞相諸葛亮故事為二十四篇號諸葛氏集上之魏文帝即位求孔融之文以為不減班楊晉武帝踐祚詔定諸葛亮故事而比之周誥融既魏武之仇恨而亮亦晉宣之仇敵二人之言冝非當時之所欲聞而並見收録惟恐其墜失蕩然無忌猶有先王大公至正之道存焉此吾所以特有取乎魏晉也魏明帝即位撫軍大將軍司馬懿鎮軍大將軍陳群征東大將軍曺休中軍大將軍曺真並為開府漢𥘉置丞相御史府後置三公府將帥出征置幕府軍罷即廢不常置也今魏既置三公而懿等並為大將軍開府京師此何理耶公室之卑蓋自此始矣蜀將李平聞懿等開府辟召以説孔眀孔明鄙之是時中原人物推陳長文為第一今長文亦為此餘無足道矣建安十八年漢帝詔并十四州復為九州三御名調魯作三軍合周禮矣其志乃欲卑公室而奪之權曺􅋵諷復九州合禹貢矣其志乃欲廣冀州而益其地夫引經術稱古誼者固未必皆姦人而姦人之欲濟其邪謀者亦未嘗不引經術而稱古誼既不可以盡信亦不可以皆疑要在乎察之而已龎統説先主取益州先主曰今吾與為水火者曺操也操以急吾以寬操以暴吾以仁操以譎吾以忠每事相反乃可成爾以小故而失信義于天下吾不為也寬勝急仁勝暴忠勝譎然操強而備弱冝勝而反不如者何也操稊稗者也備五榖之不熟者也五榖不熟固不如稊稗非謂寬仁忠信不能勝詭暴急詐也備不能勝操耳故曰苟非其人道不虛行青龍三年張掖出石圓廣一丈六尺髙一丈七尺一寸圍五丈八尺蒼質而白理有若麟者若鳯者有若虎者有若牛者若人馬者有若八卦列宿孛彗者其字可讀而不可曉時人以為魏晉之符河圖洛書之説歐陽永叔攻之甚力今觀此圖與河圖洛書亦何以異惜乎時無伏羲神農故莫能通其義而陋者以為魏晉之符彼魏晉何足道安知其非八卦九疇之類也造化之所為猶有幸不幸焉而况於人乎可勝嘆哉可勝嘆哉蘇則為金城守聞魏氏代漢發服悲哭孫盛評曰士不非其所是不是其所非既己䇿名新朝復懷二志豈大雅君子出處之分哉魏氏受禪漢帝尚存縞素舉哀誠為輊脫然盛謂二志兹又過矣箕子過故啇墟感宮室毁壞傷之欲哭以方朝而不敢季札哭王僚而事闔閭晏子哭莊公而事景公哀死事生以待天命此人臣之分也何淂謂之非其所事而事其所非乎孫盛梟音使人聞而惡之諸葛亮聞張溫敗未知其故思之數日曰吾淂之矣是人清濁善惡太分明也善惡太明誠取敗之道然人之禍敗有以其道得之者有不以其道得之者若張溫之敗可謂不以其道矣尚安可以推求其故哉魏文帝賜群臣沒入生口唯歆出而嫁之帝嘆息孫盛評曰子路私饋仲尼則為之毁其食器田氏盜施春秋亦著以為􅏺孥戮之家國刑所肅縱使在哀矜於理亦不冝偏宥歆既以己居股肱之任則亦當公言之於朝冝也而乃默受嘉賜獨為君子可謂匹夫之仁蹈道則未也孫盛以刻薄之資承學于草竊亂賊之世性習皆惡故其論議類皆如此夫見牛未見羊孟子所謂仁術也何名為偏宥哉使盛為廷尉于魏文之時則歆當以私饋盜施誅矣東晉之不用盛不為過也眉山唐先生文集卷十三眉山唐先生文集卷十三目唐庚子西三國雜事篇下亮出祁山南安天水安定三郡皆嚮應孫亮太平二年宗室孫基盜乘御馬付獄魯肅勸權以荆州借偹周瑜言偹梟雄不冝以土地資業之建安二十年先主居公安使關羽爭荆州會操征漢中先主恐失益州引軍還蜀孫權稱尊議者以為交之無益而名體弗順冝遂絶之孔明以為未可吳欲以兵萬人討樊胄權問潘濬濬言五千兵足以擒胄因論胄可破狀權竒其言遣將五千討平之晉侍中荀朂中書令和嶠使著作郎陳夀定故蜀丞相諸葛亮故事為二十有四篇號諸葛氏集上之魏明帝即位撫軍大將軍司馬懿鎮軍大將軍陳群征東大將軍曺休中軍大將軍曺真並為開府建安十八年漢帝詔并十四州𣸪為九州龎統説先主取益州先主曰今與吾水火者操也操以急暴吾每事與相反若失信于天下吾不為也青龍三年張掖出石人以為魏晉之符蘇則為金城守聞魏氏代漢發服悲哭諸葛亮聞張溫敗未知其故思之數日曰吾得之矣是人清濁善惡太分明也魏文帝賜群臣沒入生口惟歆出而嫁之帝嘆息
