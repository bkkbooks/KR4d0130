front:
  text: 眉山唐先生文集􅃃十五
  hash: sha256:6e0d2a66ac07787917f3ca406daaddbf0b5be3c0ec2d559c0c6125875b2bc649
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_015-1a}
body:
  text: 眉山唐庚子西雜文書三謝詩後江左諸謝詩文見文選者六人希逸無詩宣逺叔源有詩不工今取灵運惠連元暉詩合六十四篇為三謝詩是三人者詩至元暉語益工然蕭散自得之趣亦復少减漸有唐風矣于此可以観世変也唐子西書生日設醮文切以有生之衆所欲不同貧者願乎多財冨者期于不死賤者志求乎􅂋逹貴者思保其乆長人既無厭神亦难􅀿臣雖無似志寔不然雖亦有禱于三清惟乞無灾之二字但以私門多故歴􅀊不寕歯髪变于艱危精神耗于􅁨慮爰因生日䖍叩上蒼庶㡬天髙而聴卑所謂物窮則反本使身心安稳尚復何求眠食康寕便為至􅁕其他外物一付自然既所請之甚㣲冝必従于所禱下情懇仰伏望照􅎔臣無任瞻天望聖激切屏营之至生日青詞上界髙髙非人間世衆生􅅰􅅰如海中沙以如此之至㣲求自通于至逺亡何得達惟有至誠臣禀生雖愚奉道有素謹因生日特啓醮筵雖濁世溷淆豈降􅎔之敢望而至心齋㓗庶慈憫以来歆止于禳灾非敢求福臣無任焚黄􅀕文嗣子承議􅀰厶敢昭告于皇考承事先生皇妣孺人五十二娘之靈通籍于朝逮今十年遇大禮者数矣而負罪流落乆隔贈典乃者蒙恩復歯朝著始贈皇考承事皇妣孺人盖自􅀌苦垂三十年然後䏻取一命以追荣父母而少伸人子之心其不孝不敏之罪無所迯矣雖善文其􅂈者莫䏻為之詞也區區之心考妣其鍳之尚享􅀕家氏文敢昭告于前母家氏孺人之灵國家恩德厚矣士人列于朝者非獨荣其父母又并其前母而封之上以極其父子之恩傍以廣其兄弟之義皆聖世之彌文前代之􅆣典也然非平日為善之報亦何能致之㢤尚享代内醮文頃􅀊以来多难相継今兹遇疾猶異常時雖生死之有期兾神明之可禱㕠親皓首殊未報于生成稚子弱齢尚未離于乳哺仰祈洪造少假餘年得畢此心外無所望也墓誌銘行状附淮隂賢婦墓誌銘賢婦亡姓名淮隂下郷人盖老矣貧無自資以洴澼絖為業属秦末乱離民不親耒耜者累年矣天下飢饉婦方坐沙上以水撃絮望見城下有客長大帯刀劍彷徨水濵婦私獨怪之遂就與語則壮士也而有飢色婦哀其困館而食至数十日欣然無倦意客感嘆曰異日必重報母是時天下兵動関東豪傑並起婦視客非庸人終能有所就遂佯怒以語激之曰丈夫不能自食吾哀王孫而進之食寕望報乎㑹楚兵􅂈淮客仗劍楚君麾下楚不能用客亡命帰漢得大􅀅従漢王定三秦與楚人􅀾京索間有功二年八月始以涉西河破魏豹九月破代十二月破趙明年十二月遂破齊盖自北出至是􅀊餘而􅃃天下之半明年二月漢遣使立客齊王明年引兵㑹漢垓下破楚天下大定漢客徙王楚都下邳盖自􅀉食五年裂地数千里南面称􅀌于是下令求婦報千金天下不多客之賢而多婦之長者有知識客韓信也婦䘚葬泗口南岸銘曰項王喑嗚亜父謨謀信来不呼信去不拘坐視信逋反噬其􅥟匹婦區區而知信乎吁徐夫人墓志銘夫人徐氏其先京兆人唐末避地遂家于眉州丹􅏢自考以前蜀人惮逺仕進者尚少故曽祖某祖某考某三世無食禄者夫人㓜穎悟年十二丧所恃己䏻順適継母無毫髪不滿意考為人􅃊重左右莫敢仰視独夫人侍側輙怡然為之觧顔家人因以白亊年二十帰劉氏舅姑得之喜即委以家政方是時劉氏累世好施生事䔥然夫人既專内亊雖細務必親之規畫處置悉有法度可守未㡬刘氏􅂧振舅姑既没父母春秋髙嗣子早丧夫人奉飬丧􅀕能盡其道姪有少􅀌従其母嫁者夫人取置諸子間摩頂撫育無有􅁿重厚薄至爲婚媾䏻自立乃巳課二子讀書甚力既而二子以次取進士第元符三年長子汲爲合州司理参軍奉夫人以行是􅀊六月二十四日卒年五十二少子湜登科時夫人没五年矣惜乎不及見也汲今以宣德郎知鄢陵縣湜以通仕􅀰行蜀州晋原尉女􅆘楊厶孫若于尚㓜大覌四年十一月日葬于厶郷之原其􅀅葬也鄢陵以行状請銘于予予交鄢陵二十餘年朋友之情既不可違而夫人之善又不可廢其事父母舅姑也如此其治家立門户也又如此􅀵卹􅀌露而成之又如此教其子問學連年取科第流声􅃅于時又如此是烏淂不銘也㢤銘曰大児来㱕里門下車小児来帰擁版以趋宦孝成矣繋而母且而母不留可悲也夫史子深墓誌銘君諱通字子深姓史氏世為眉之青神人少與其兄珣皆以文學知名于郷年十七以貢㪯不中遂退居于楠溪之上杜門著書絶人事者数年淂易蓍若干卷乹坤别觧三卷礼記義一􅃃詳説四卷律吕氣数十二卷書義八卷詩義若干卷論語孟子觧各若干卷子史論若干卷其書既出斈者翕然稱之或曰是知古矣其于時亊未必知也己而君至京師進世要机務十卷芻蕘䇿二十卷其言當世便利非草茅布衣之士所䏻言之至于論兵則雖謀臣􅀫􅀅練習边亊者不䏻易也或曰是能言矣其于行事未必能也己而君起家尉通州遂䏻使人畏己遇事輙断號為强明至作磐石今則又專務寛厚和易撫字劝課如古循吏所為盖二邑之俗不同故君所以􅀿之者亦異名声大著諸公交章荐之而君巳卒縣人哭泣悲思至今父老猶喜道當時亊吾尝謂斈者所貴乎知􅀴者以其能知道􅀁貴乎知道者以其能􅀿物白首窮􅀴而不能􅀿物又何以􅀴為㢤悲夫君斈􅁕以知􅀴道􅁕以􅀿世而晚得一命年止五十七不得以充其志官止于一縣令不得以盡其才故其􅀿物者止于如此此吾黨之士所以嗟惋嘆惜為之請銘以􅁙而吾亦不得而辞也史氏糸出鲁國後徙杜陵唐末入蜀遂家于眉曽祖祖考皆不仕君中元祐三年進士第歴逹州通州尉資州盤石令年月日卒于官舎先娶侯氏再娶程氏男二人曰紀曰彦時女五人長適厶次適厶孫男二人女一人皆㓜以大観三年三月日葬于厶山之原銘曰子深之書學者多有雖不銘之自足以乆既􅁕以乆而又銘之子深之傳愈乆不疑史夫人墓誌銘夹江縣孫公諱厶之夫人姓史氏眉州青神人故任嘉州軍事推官諱著明之曽孫故贈大理寺丞諱昭吉之孫余外祖諱及之季女也余少時尝至其家矣公長不逾中人語音如鐘喜談前言徃行亹亹可聴盖尝約家亊勿復相関悉聴夫人夫人明敏觧事而入情其䂓矩措置有絶人者孫氏􅀊入不貲用度亦廣矣而夫人治之皆有法内外親戚姻婭之間冠婚殯􅀕􅂟吊之事殆無虚日而夫人䖏之皆有体公三娶男女九人而夫人待之皆如己之所出余固尝隂以察之矣未尝見其有毫髪䡖重厚薄也方是之時長子昌齡時年四十餘􅀊而喜従予㳺㓜子昌裔時年十五六晝出従师受書及抵暮夜方帰甫帰夫人必親自以敎之使無倦惰之容及垂首誦讀至夜分之時然後乃己女有適羅厶者有適王厶者有適于魏厶而早䘚者有適于張厶者又有適于宋厶者有未笄者及有絶㓜者是􅀊乃紹聖之元年甲戌也今二十五年矣公先卒既葬夫人又卒今及􅁙矣而子昌齢又卒矣有孫七人曽孫則三人也昌裔今又改名衍亦有孫七人矣向之云未笄者今則嫁承議􅀰鮮于厶而有封號矣向所云絶㓜者今則為厶人之妻而且亦有子矣流光如􅂈􅂩耳而欲無老得乎詩云未㡬見􅀆突而弁􅀆是以有徳者所行所為身雖没而音容不隔儀型常著而常新百年之間若旦暮也夫人貌􅀋先妣孺人倘卒然間遇之㡬有不䏻辨之者先妣既没時余以􅀞者失真恐無以示後人因取夫人傳神以􅎔焉見之者無不隕涕其兄弟之間盖如此斯亦竒矣然然則銘其墓者非余而又誰任之㢤夫人享年七十有一其卒也以政和四年十一月五日其葬也以八年十一月一日乃銘之曰豊泉之原封若斧祔而合之盖􅀙魯其甥銘之固其所眉山唐先生文集卷十五眉山唐先生文集􅃃十五目唐庚子西雜文書三謝詩後生日設醮文生日青詞焚黄􅀕文􅀕家氏文代内醮文墓誌銘淮隂賢婦墓誌銘徐夫人墓誌銘史子深墓誌銘史夫人墓誌銘
