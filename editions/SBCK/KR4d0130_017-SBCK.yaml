front:
  text: 眉山唐先生文集卷十七
  hash: sha256:d00c01937a9272cafab35ea2cf63602db03ae1afa20fb90ad3d7733a6148a93a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_017-1a}
body:
  text: 眉山唐庚子西雜文帰歟賦帰欤先生帰欤先生坐講六籍立談百氏突姬孔之堂奥刳軻雄之心髓㳺説天子間関千里射䇿万言捭闔乱理葩吐竒霞散綺㧞犀渠擢象歯曽不􅀎入亊為律片言窹旨傴偻一命摧折委靡窮騏􅂹于捕䑕困干􅀅于􅀘􅂂血􅉇而肉鯨􅀆尚不􅀎逞刀机之殘􅊜􅀆又何足䑛昔薛丞相置東閣以􅀚士朱㳺拂衣而起奚扁舟之不泛豈洞庭之無水先生笑曰嗚呼噫嘻子言小㢤病者嗜于土炭餓者甘于糠粃酔者安于遇虎怒者恬子染指万法非实皆由心起狐尾見于疑目牛閗聞于病耳􅀫瘤何􅁖顰眉何美狐裘何荣牛衣何耻吾謂戴安道破琴而不肯作未若宋之遜秉笏而唱吟閻立本沮􅂔于画師未若禰正平遺形于鼓吏抱関撃柝􅀆亦悠悠弹冠結髮􅀆亦悠悠吾􅁯情于彼此者也帰欤先生古体詩陌上桑曲䔥踈陌上桑寂寞採桑女蚕老葉轉稀羅敷泪如雨歛􅃑蹙双蛾秦筝一曲􅁔殷勤謝􅀰意其如義命何白頭吟秋風團扇情夜雨長門意高鳥既已逝前魚自當棄賤妾白頭吟知君怀異心秪知茂陵女不憶􅎔卭琴結客少年埸結客少年埸男児尚氣湏激昻朝􅀙魯朱家暮􅂈秦武陽飲酒邯郸市􅂰上横秋霜明年􅀙軍入燉煌金印紫綬輝路傍貧中知己慎勿􅁯五雜爼五雜爼水中魚去􅂧还天上鳬不􅀗已轅下駒五雜爼各利地去􅂧还塵埃轡不􅀗已貧而仕公無渡河公無渡河公無渡河君不見吴児秋悲小海唱湘女夜怨招䰟􅁔抱石沉清流弄酒奔素娥忠血醉蛟蜃義肉飽黿鼍暗中水弩貫七札魚龍百怪垂涎津吻牙相磨公無渡河公無渡河平地猶恐生風波明妃曲生男禁多才長沙伴湘纍生女禁太美隂山嫁胡児長沙雖帰如不帰隂山亦􅂧帰無期綘􅈅通侯延壽死琵琶休怨漢天子舞馬行明皇時教坊舞馬百疋謂之某家嬌其曲謂之傾盃楽天宝之乱此馬流落人間魏􅀶田承嗣得之􅀄不識也已而承嗣大宴軍中酒行楽作馬聞楽声起舞承嗣以為妖命殺馬予讀其􅀃而悲之作舞馬行天宝舞馬四百蹄綵床襯歩不􅀧泥梨園一曲傾盃楽􅋮首頓足音莭齊幾年流落人間世挽塩駕鼓不敢嘶忽然技癢不自禁俗眼驚頋身顛隮後生何甞識此舞謂之不祥固其所風􅀣吟子路有言􅀣欲静而風不止子欲奍而親不待予三復而悲之故作風􅀣吟以終其意􅀣欲静兮風不止子欲奍兮親不俟帰飛及哺八九子我曽不如畢逋尾􅀣欲静兮風不休子欲奍􅀆親不留旦自梅兮暮至􅁄當年飼我如鳲鳩戯題醉仙崖誰家翠嶺高亭亭白崖隐起仙人形仙人昔尝為酒星乗㒷痛飲乹北溟五湖一吸􅂓觧酲江妃丧魄鼇失灵上帝震怒呵出庭酡然影落秋山青行人㡬見霜葉零酔仙酔去不􅂧醒何須荷鍤隨刘伶河沙刼壊帰􅄀冥古生卷地凨来怒濤起驚散沙汀双翡翠誰􅀅仙匹鎖金籠􅀌飛吟呌烟波􅂻古生開鎖放珍禽春江日暖重相㝷巧舌相和葦凨軟綺翼交飛菰浪深壮㢤古生真任侠義氣肝膓何激烈功成不􅂧更偷生一劒揮霜􅁭濺血世間美事多参啇白馬青梅人断膓古生埋没在何䖏江山流水空茫茫走筆贈仙姑仙姑八十春秋高兩鬂墨黒無斑毛鹿胎冠子青紗􅂁神風清俊真仙曺人生瞥忽如銷膏是非海裏翻波濤五斗官米令人劳安䏻俛首争錐刀􅂅仙乞我瓢􅂻一丸薬武陵溪上抖擻世俗腥與臊不然教我蝉蜕羽化秘訣之一二海山深䖏摘取王母千􅀊不熟之蟠桃醉後怒筆􅁅寒火冷燈㣲明虚簷㵼雨如傾瓶酒酣耳热身体輕撫􅈾大吼黄鍾声怒目直視如流星㧞劒撃柱傍人驚丈夫寕可五􅂦烹安得容此吞舟鯨雲南老人行雲南老人老無力藜杖支腰壠頭立道逢蜀客話平生時􅂧仰天長太息自言貫属瀘水湄瀘水边徼濱獠夷夷人之性􅀋蛇豕頻肆䖟螫為瘡痍十五年前多寇盗一境騷然不相保民禾􅀵刈虜人家戎馬偷􅋦汶江草近来風俗多変移􅃃却旌旗張酒旗牛羊村落晚晴䖏烟火楼䑓日暮時兩眼昏花両鬂雪喜見升平好時莭茅屋横吹一笛風野店携帰半瓶月問翁致此何因縁道是江陽太守賢鼓琴絃􅁔下生事十年静治安吾边鄭國國僑去已乆誰信人間凖前有異日刋為徳政碑請問雲南隴頭􅅱憶昔行憶昔方東来亭傳荒荆􅁄風庭紅葉乹雨砌蒼苔湿飢虎撥門開哀禽向人泣十載却西還亭傳已完葺青鎖揖江山朱欄趂階級行旅粮不賫大路遺敢拾蜀道無难易人心自寛急􅀉言守亭者勿使狐狸入午起行細籐簟展波紋緑瓦枕竹床殊不俗白日寥寥午眠熟起来更斍精神􅁕萬縁􅄫静数甌茶千偈消磨棊一局此間眞味有餘清未羡紛紛厭梁􅁏張求張求一老兵著㡌如破斗賣卜益昌市性命􅀉杯酒􅀐馬好事久金錢投瓮牖一語不假借意自有􅆇否雞肋巧安拳未省怕嗔毆坐此益寒酸餓理􅀅入口未死且强項那睱頋炙手士莭乆凋丧䑛痔甜不嘔求豈知道者議論無所苟吾寕従之逰􅂓以激衰朽撃劔􅁔三尺光芒耀霜雪長安使氣為任侠閒对要離壮泪垂酔叱荆軻怒眥裂天下承平猛士閑夜半無人自弹鋏會湏東海斬長鯨帰来倒􅄋腥臊血􅀺城酒􅀺城酒貴如金汁觧盡寒衣􅅻一吸獄曺􅂙軍到􅇧窮簿書吻燥何由􅊜夜来細雨落簷花对客惟有尝春茶明朝􅂿月趂早衙免使路中逢麹車題崔令曲海後崔令飲酒五七斗崔令唱辞一千首時時浪飲輙高􅁔利鎖名韁搃無有人称雀令為顛狂我知崔令非顛狂承流宣化有餘力髙􅁔浪􅋨也何妨晝􅆍効魯直雨餘熟喘殊喊呀坐翻故􅁓腰􅁕麻鋪陳枕簟搴青紗倒床不復知横斜梦䰟飛揚逺还家故人見我一笑譁湏􅁷睡斍衙鼓撾墻頭瞑雀声槎槎城上怨雨似懸河風似箭風號雨馳寒刮面何䖏廵城老徤児城上謳吟自哀怨不知底亊偏苦傷声髙声低哀思長戍边役重畏酷法去國年多思故郷城上􅁔時夜方半正是􅀌齋醉䰟断和凨和雨两三声推枕投衾坐長嘆傳聞􅃛虜動熈河􅀾士連年不觧戈今夜風號雨馳處城上哀怨知㡬何别句永叔巴江艶艶巴山空十里五里蕉花紅少年鋭意立功業破烟一棹輕如風却思三􅀊相欢聚説劔論詩輕李杜平生不作児女悲今日為君重囬頋春日雑言官居双海棠何年植庭中凨流二月間照耀一室紅渾家惜此花具飲呼乃翁翁雖怯盃觴意难逆児童臈􅌬十分深白眼一引空酔時􅁯華巔浩􅁔滿東風又庭前楊栁枝春来蔚然緑老翁髮边青已去不可􅂧夆盃属春風此理竟如何轉首飛楊花春風自蹉跎覧鏡昔我先君子徳與形􅂔俱褒衣佩長劒軒昻真丈夫我生困多难乃􅁼山澤癯頭目頗麞䑕愧忝虎豹駒太倉五斗米􅁕奍蕞尔􅥟誰􅀎向天子號飢訴侏儒客至山頭竹萬箇風来玉相戞下有屋数間䔥然如佛刹門無車馬喧幽徑芳草茁隔􅆤識君声􅃍起投筆札黄雞未啄黍環堵無可殺園􅂼煮淡泊山泉啜甘􅉸何以楽嘉賓春禽日嘲􅑜􅀉題張志行􅋨峯亭先生饒醖藉表􅂻皆純粹独推糟與粕施之為政亊百里飲其徳陶陶有􅂬意餘醺落嘉陵一江醇酒味沉酣到山􅇧頽然偃蒼翆亭中時把酒坐对青山酔酔郷在何許祗此中間是先生况多文為續酔鄉記聞東坡貶惠州元氣脱形数運動天地内東坡未離人豈比元􅂔大天地不􅀎容伸舒輙有碍低頭不􅀎仰閉口焉敢欬東坡坦率老局促因难耐何當與道俱逍遥天地外􅀉郭潜夫我昔逰瀘江泛舟奔楚宫黔江自南来胥㑹涪之東黔江清且碧瀘江濁而紅紅碧不相入分流如卧虹群潴激湍濤洶湧成􅀾攻湏􅁷尽変濁混混顔色同清固不勝濁此理天下通君視開成間牛李争長雄要之賛皇子不勝太牢公物理自古然徘􅆦嘆無窮眉山唐先生文集卷十七眉山唐先生文集卷十七目眉山唐庚子西雜文帰歟賦古体詩陌上桑曲白頭吟結客少年場五雜爼公無渡河明妃曲舞馬行明皇時敎坊舞馬百疋謂之某家嬌其曲謂之傾盃楽天宝之乱此馬流落人間魏􅀶田承嗣得之􅀄不識也已而承嗣大宴軍中酒行楽作馬聞楽声起舞承嗣以為妖命殺馬予讀其􅀃而悲之作舞馬行風􅀣吟子路有言􅀣欲静而風不止子欲奍而親不待予三復而悲之故作風􅀣吟以終其意戯題醉仙崖古生走筆贈仙姑醉後怒筆雲南老人行憶昔行午起行張求撃劔􅁔黎城酒題崔令曲海後晝􅆍効魯直城上怨别句永叔春日雜言又覧鏡客至􅀉題張志行醉峯亨聞東坡貶惠州􅀉郭潜夫
