front:
  text: 眉山唐先生文集卷二十六
  hash: sha256:c9b83da6acf930d74964b90f53b024ad65d338c9b784d75285e03f2b8ad5b3a8
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_026-1a}
body:
  text: 眉山唐庚子西啟賀馬學士啓伏審光奉宸恩荣陞冊府除目流布士􅁼􅌚騰伏惟某官望重賢関名髙英彀才適􅀖家之用識窮道徳之㣲簡在上心重已千之宿斈延登客省正門五之􅆣文盖朝廷以待于清流而郷相多由于此出媿郵傳之旣晚致􅂟牘之稍稽賀楊運判啟伏審寵􅈾宸命荣抱使權爰擇剛辰已諧礼卜凢叨属部㪯切􅂬悰厶累任劔東粗知民俗雖人貧地􅇤頋􅀊入之不饒而吏禄軍儲亦年計之足用倘貨源之不遏宜利孔之並㒷馴致羡餘式資􅀴畫恭惟某官才猷强濟術畧䟽通入握省蘭已振望􅀰之譽出持漕莭用昭煩使之䏻諒生財之有方不加賦而自給佇騰最目行陟華途厶方􅀠旄麾敢論瓜􅁑雅故未忘于一日庇庥尚頼于二天􅌚怍所叢端倪􅂚喻賀楊提刑啓伏審光􅈾寵渥移尔祥刑使選愈華僉引􅁢慰恭惟某官道心藴粹徳性禀純氣有飬而益完術無施而不可以才自進容無待于後先中道而行時不分于彼此逮兹􅂋擢殊慰輿情乗傳出関已嗣棄繻之志過家上冡益知晝錦之荣先声播騰属部澄粛厶方欲􅄒具利害塵凂聦明若使遷延朞月之間必䏻聼用蒭蕘之説􅃍聞移命今復何言仰望飛騰永言欣懌賀新提㪯啟伏審祗􅈾誥綸粛持使斧士流称慶輿論悉同伏惟交代某官真性禀醇道心飬粹斈造天人之理識窮性命之㣲荐􅂂儒官夙著朝望億萬橋門之士景仰餘輝三千闕里之徒争傳緒論􅀅以渊源之素施于政亊之間爰自講筵出􅈾使指厶偶縁幸㑹􅁰作交承即諧傾盖之􅂬愈切望塵之意賀王安撫啟伏承令嗣新恩祕書荣登者充賦外䑓已居前列苐名丹陛復䖏上㳺氣􅀋増光縉紳共􅂟切以西漢觧頥之士止淂丙科元和大手之文猶頃三上况天下承平之後寔人材並出之時俯拾巍科不妨談笑非有源流之􅂟諒由堂今上御名之基伏惟某官文􅁐摽名􅀅壇授􅃏碧油建幕雖尊千里之權白首窮􅀴不改一瓢之樂遂推餘􅂟俯及諸􅀰継三葉之荣名鍾一門之盛事厶方圖称􅂟首沐騰緘仰認謙冲惟知喜愧賀侍其鈐轄􅂯任代伏審寵􅈾宸命再握中􅁠伏惟􅌚􅇺伏以厶官兵機練逹􅀅畧雄深緩帯􅁿裘鎮壓千里綸巾羽扇指揮六軍上寛當宁之􅁨乃眷捍城之効知其难継許以借留詔目外騰人言胥悦飛文展􅂟寓命于書郵占翰布勤首勒于記室方永言其傾戴夫孰喻乎端倪賀王安撫啟代伏審令嗣祕書新㤙賜及第者潜心几案素髙黄絹之詞唱苐殿庭果叶青錢之選士流胥􅂟儒道増光切以間􅀊捜賢本朝廷之故亊一􅀴肄業􅂧神考之新科人材一㒷仕路四闢非有􅂈庭之敎􅂚充入彀之英恭惟某官爼豆儒風詩書􅀅業投班超之筆意氣一時請南越之纓功名萬里遂推餘澤俯及諸郎淂片玉于崑山􅂧青氊之舊物揮毫洒翰实髙董賈之才幹蠱克家行継􅅊平之盛厶未皇展􅂟先辱飛文感媿之殊敷宣罔既賀王尚書啟伏審光奉宸㤙荣膺閫􅀉凢居属部㪯切􅌚悰􅀼以自昔雄藩首称全蜀一十五州之士悉􅊢封疆数千里地之師盡帰莭制寔資重厚坐鎮浮華宣惠爱于逺方此􅀝毗之本意恭惟某官徳基宏逺識局深純奕世功名不替忠臣之後歴朝議論共推長者之言輙従喉舌之司出綰山河之柄綸巾羽扇暫寛􅁨頋之懐􅂦席台階行副具瞻之望厶備貟属部託成下風忻懌之私叙陳罔既謝兩府啟代濫充星使未及瓜期殊無迁徙之劳就領轉輸之􅀉便于私計出自洪庥切以運􅈇一方按䋲百吏其􅁠既重所責非􅁿軍儲仰哺于十州銓􅃹􅂧帰于八路貟多缺少􅁨注擬之艰难地􅇤民貧苦征輸之窘急冝擇􅀴綸之士以􅀚施設之方厶斈術迂踈吏䏻短薄少年氣銳謾有志于亊功晚􅀊􅂾竒已􅁳心于造化偶􅀙常調擢領使權曽未􅀴年􅂧􅈾新命此盖伏遇某官陶甄士噐匠石人材隆太平極治之基開並採兼􅀵之路曲成羽翼特借歯牙敢不推本上心欽承厚德斧斤樗散少酬培植之㤙箠䇿疲駑期盡馳駈之力謝楊提刑啓代伏審寵􅈾宸命荣領使􅁠􅀅􅄃轡于鄊􅀖因取途于􅁦境聞名乆矣何幸如之伏惟某官庙璉至珍天麟異禀夙􅀒棄繻之志果諧題柱之心奉漢使以廵行講周官之班歛􅂈家上冡為桑梓之光華衣錦還鄉覧溪山而感嘆未遑馳問首辱騰緘瞻望徽猷不勝翹企謝許提刑啟代幸托下風尚未瞻于􅂂幕敢圗􅂈聼遂引納于門墙在于閴然何以称此伏念厶忝分郡􅀉坐易􅀊華本自空踈無可称于尺寸矧今老大豈有􅀘于㳙埃當此遷延居然尸禄推㨈未去固已荷于并容剪拂所加尚敢期于見及此盖伏遇某官道心禀粹德性飬和格物不以所長動為可意待人必出于恕不復求全致是􅄀頑亦蒙比数雖衮褒一字足為衰朽之光而䑕技五窮終負提携之賜永言銘佩有激肝膺綿州謝監司舉辟啟命敎之始置師惟难旣非所堪適足為愧伏念厶一離國斈十閱􅀊華􅂙両任之卿軍自云淂趋􅀒三年之令弩未始辞劳止于為貧無所不可獄訟刑名之職皆是道􅂣簿書錢榖之間莫非楽地况優㳺于儒術􅂧咫尺于鄊枌便于婚姻淂以斆斈有幸如此帰恩可知此盖伏遇某官匠石人材甄陶士􅁼好賢楽善每推引􅁼之心􅁨國爱君深軫思皇之念致兹後學淂託下風才地非堪固难勝于重責使天所庇􅀅銘鎖于􅀄心感佩無窮敷宣罔旣謝翟大夫啟􅀼以使部屈指豈無俊良書生何顔􅂈承論荐伏念厶㓜而学字少識偏傍長而属文僅知平側乆服聖時之化育窃聞􅀴術之緒餘若淂用其所長庻㡬或有可取投之猥冗無所施為豈礼楽云乎㢤亦㑹計當而已荀卿以為仰禄孟子所謂為貧不圖登門便許推轂此盖伏遇某官賞信而罰必事易而悦难嘉善矜不䏻與人不求偹遂令㣲賤幸􅀗依帰今日窮途自激昻于氣莭異時淂路期􅁬發于事功庻㡬終身不􅀒知已謝吉文州啟代伏承令孫新奉綸恩同登桂藉潜心文􅁐素髙連運之才較萟詞塲大振机雲之譽士流縮手衆議帰心共推黄絹之辞果叶青錢之選三制已秀双劍横飛豈徒几案之功盖有箕裘之素伏惟某官詩書􅀅術爼豆儒家投壷雅歌淂􅀕遵之瀟洒􅁿裘緩带有元凱之風流冝俾􅂟門叠􅈾盛事未遑称􅂟􅃍辱貽音惟有欣荷之私即此敷陳莫盡荅吉文州啓代仁不可失常恐招黄民􅁒必􅀙果諧借冦恭惟某官道心禀粹徳性飬淳循吏袴􅃭安一方之民堵􅀅軍裘帯粛千里之塞垣方松庇之共依慮􅀲期之亟至欲荐才美自愧言􅁿幸天髙而􅃪卑果朝奏而暮下此寔􅁁民之福固非言者之功過辱長牋益深慚徳到任謝兩府啟代五嶺乗軺已慚非㩀三巴擁莭復忝殊私荣踰望端感結情外伏念厶􅁬身仕版通籍朝纓擢自冗流承乏水衡之属継膺異数叨持外計之權雖指心誓報于􅃂灵而臨亊輙牽于才分二年􅄃轡竟無尺寸之功萬里還朝猶在品題之目重申巽命出按坤維地􅇤人貧雖困轉輸之苦􅀊豊事簡曽無施設之劳内省空踈一何僥倖此盖伏遇某官才猷絶世名寔在人定䇿兩朝炳著安劉之業矢謀九德巍摽賛禹之功曲怜􅀌单未􅃍遐棄瓶罍易溢􅁨小器之顛隮陶冶無私荷大鈞之坱圠永懐銘佩有激肝脾謝家提舉啟書生所學粗記姓名軍事方􅂙未知拜起心劳意拙志廣才踈績未考三責􅀅滿百抱関擊柝真為貧之所為毁瓦畫墁歎無功而坐食夤縁厚幸依托下風惟􅁨䑕技之窮寕頋馬曺之辱逮今三載雖每侍于燕閒未始一言輙有求于左右豈有意于為異盖自耻于無厭􅃍辱見􅀵实􅂈所望兹盖伏遇某官賞信罰必亊易説难其交物也淡以親其待人也􅁿以約遂令頑悍亦費陶鎔敢不祗畏簡書服勤簿領一丘一􅊤既未遂于􅀄心三浴三薫其敢忘于厚德感佩􅀾越不知所裁眉山唐先生文集卷二十六眉山唐先生文集卷二十六目唐庚子西啓賀馬斈士啟賀楊運判啟賀楊提刑啟賀新提㪯啓賀王安撫啟賀侍其鈐轄再任賀王安撫啟賀王尚書啟謝两府啟謝楊提刑啟謝許提刑啟綿州謝監司㪯辟啟謝翟大夫啟謝吉文州啟荅吉文州啟到任謝兩府啟謝家提㪯啟
