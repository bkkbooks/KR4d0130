front:
  text: 眉山唐先生文集卷十六
  hash: sha256:e2aefd91f364b00ef627905b49721c222d3f828af29c7c77a8f117e25a162564
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_016-1a}
body:
  text: 眉山唐庚子西雜文唐先生行状唐先生諱厶字彦通眉州丹稜縣人曽祖諱厶祖諱厶考諱厶俱不仕皇考之捐舘也先生始六􅀊是時郷人未知宦學先生􅀌露自奮卒為名儒其斈􅀶而不雑其制行和而不流輕財好施出于自然盖自尭舜三代以来理乱廢㒷典章人物莫不考論旁至諸子百家天文地理方技医卜之書莫不通貫其博至于如此然特深于經術著四經微㫖行于世而專用春秋名家為講義三十􅃃辨三傳七􅃃大抵以春秋為無褒其于傳注取二三䇿而已此所以見其不雜也性簡易不作崖檢與郷人䖏油油然無貴賤皆淂其􅌚心比其沒也逺近聞之俱出涕嘆息逮今二十年思之不􅁯其和至于如此然議論剛正無所附阿負其所藴非其友不友亦以是見􅁖于不善者此所以見其不流也平生用財不問其数尝至濛陽其尉丁􅁨貧不淂去先生雅不識其人傾槖贈之空手而帰其好施􅀋皆如此而未尝有难色此所以見其自然也自嘉祐冶平年間先生已有盛名西南學者争宗師之授經者累􅂾百人然應進士舉及不中益昌龍圖閣直斈士陸公詵荐之亦不報浮沉丘園無復仕進意熈寕􅀄罷詩賦以經義取人士論喜其必有所合既而春秋不為經先生亦老矣始終不遇蜀人惜之然余考其行事以求其用心則平生所有良而可見族本以冶産冨饒而先生專業儒士方以声律進取而先生独治經此其志豈為利禄計也㢤命雖不偶于今而其書具在是以傳于後世無窮復何憾焉元祐三年閏十二月二十五日終于家享年六十有三前娶家氏􅂯娶史氏男五人如四人適厶皆士人也孫男四人孫女二人皆㓜卜以崇寕三年二月二十八日葬縣之南二十里鼓面山之原以史氏祔予頃出守咸安道過閬中而先生之子厶適宰是邑傾盖如故遂定為􅁯年友然􅺢状先生行義以告于士大夫者非厶職耶謹状史夫人行状夫人史氏眉州青神縣人嘉州軍亊推官諱著明之曽孫大理寺丞諱昭吉之孫進士諱及之女魯國先生諱厶之配也先生喜賓客重然諾視金錢如泥無分毫頋惜不論多寡廢盡乃已竟坐此貧而夫人䖏之怡然自淂其為善之楽也先生自言吾六􅀊而􅀌勤苦自立取名于時豈有兄弟教㢤尝持是􅀃未尝督責三子以斈而夫人則不然躬課諸􅀰讀書至丙夜乃􅆍率以是為常平生無所好獨聞誦書聲輙欣然盖性之所嗜如此夫人不逮亊舅姑亊先生如亊父治飲食以進必立侍湏徹饌乃去或者以為􅂈元祐三年春先生遇疾㡬殆夫人焚香禱祈􅂅以身代死家人止之不􅃪俄而疾暴作擲香炉于地扶掖就枕已不知人後六日夫人病篤而先生疾稍間先生竟愈而夫人遂不起時二月二十日也􅀄夫人之祈死也先生疾革不知夫人既卆諸子以亊告先生哀甚為詩以哭之聞者莫不泣下夫人享年五十六厶其子也厶其壻也厶其孫也孫女二人尚㓜崇寕三年二月二十八日従先生葬于丹􅏢縣皷面山之原先生道雖不行于民其行于家者盖如此非先生何以當夫人之賢􅀚夫人􅁕以知先生之道其也庚所以必欲状其行以傳于人予所以不淂而辞也嗚呼誠亦可書也㢤謹状賛銘先君真賛嘉祐熈寕間西南有􅀮君子焉幅巾布衣時時出㳺人間士大夫好亊者多従之㳺喜談易詩春秋辞旨􅃉逺􅀎得先儒所未到者遇人飢寒觧衣衣之推食食之人有所求則鬻衣賣履與之無难色緩急輙隂救之問其姓名則嫚罵不以告逢人無貴賤皆抵掌談笑蜀人皆知其為有道之士相與强為先生然竟莫測其果何人也元祐末遂不􅂧法不􅂧出􅁘抑出而人不見也傳者以為卆矣是殆不然先生㳺無何有之郷獨與道逰者也道在與在道亡與亡使道而果亡則先生信死矣道未丧于天下則先生烏乎死紹聖􅀄有姓唐名庚者􅀞先生之像而亊之為先生作真賛自称為先生之子云而書此以賛之曰軒然其頎幅巾布衣清凨䔥蕭在人目圍此豈先生者耶孰䏻援筆一揮摹其心中之精㣲也㢤又次齋銘生而知之自誠而明斈而知之自明而誠困而斈之又其次者困而不斈民斯為下吾少也狂自以為徤出而接物然後知困今雖老矣幸其未衰陳書于斋以斈以思家藏古研銘硯與筆墨盖氣􅁼也出䖏相近也任用寵遇相近也獨壽夭不相近也筆之壽以日計墨之壽以月計硯之壽以世計其故何也其為体也筆最鋭墨次之硯鈍者也豈非鈍者壽而鋭者夭乎其為用也筆最動墨次之硯静者也豈非静者壽而動者夭乎吾于是得奍生焉以鈍為体以静為用或曰壽夭数也非鈍鋭動静所制借令筆不鋭不動吾知其不􅀎與硯乆逺也雖然寕為此勿為彼也銘曰不􅀎鋭因以鈍為体不􅀎動因以静為用惟其然是以䏻永年有翠亭銘山不逺人人自逺山見即為易有之為难隴上牧児林間樵􅅱雖􅀎淂之而不可有貴戚買園􅃂侯賜宅雖或有之而不可淂惟吾放浪與是有縁淂而有之蒼翠滿前為亭北牗其髙三仭目力所到閬山皆尽客来登亭勿嗔吾貪子如欲之􅀆為君分甘謝雨文農亊方作雨不来稻畦麦壠飛塵埃神哀此民賜以雨􅍺溝支澮流膏乳殽肥酒香荅神休神終相之俾有秋古体惜梅賦閬中縣庭有梅株甚大正當庭中出入者患之有􅂆予以伐去者為作惜梅賦縣庭有梅株焉吾不知植于何時䕃一畆其踈踈香数里其披披侵小雪而更煩淂朧月而益竒然生不淂其地俗物混其幽姿前胥吏之紛拏後囚繋之嚶咿雖物性之自適揆人意而非冝既不淂荐嘉实于啇􅂦効㣲劳于魏師又不淂托􅀌根于竹間遂埜性于水涯悵驛使之未逢驚羗笛之頻吹恐飄零之易及雖清絶而安施客猶以為妨賢也而諷予以伐之嗟夫吾聞豳蘭之美瑞乃以當户而見夷兹昔人之所短頋仁者之所不為吾寕迂数歩之行而假以一席之地对寒艶而把酒嗅清香而賦詩可也平䑓賦平䑓梁王刘武作也班史称平䑓唐杜甫稱吹䑓世以謝惠連尝為雪賦也則又謂之雪䑓舊説在大梁城東北如淳晋灼云在大梁城東二十里今在城東南盖漢距今且千􅀊城郭凡幾変則聞見之異冝㢤作平䑓賦予與客逰汴都之東南登梁王之平䑓頋草木之黄落懐古人以裴囬客慨然嘆曰吾聞祖龍失劒楚窃其柄漢鍳其􅀌矯枉􅂈正齊楚趙魏燕韓之郊荆楊兖豫青徐之境蟠城千里星散碁布原田溝澮不知其㡬千萬頃􅀲分幅裂以王一姓于是擅爵人而赦死罪戴黄屋而私蹕警鼓銅破山煮海絶流侈極奢窮然未有如梁之親倖者也井畢煌煌寔沈之􅆠北界㤗山西抵髙陽帝子出閣有燁其光金錢布幣子女玊帛錦綉宝器車馳轂撃轆轆繹繹挽来于梁爾乃羽翼鄒枚腹心勝詭郊関之囿三百餘里萬甃鱗鱗楼閣横斜擬于未央之䆳也峭築峨峨蔽景干霄擬于漸䑓之峻也静影潭潭日星泳􅉼擬于太液之深也麋鹿咿咿禽珍獸竒擬于上林之多也旌旗纛斾前􅀐後乗擬于五柞之㳺也鷙撃盧馳躡景追飛擬于長楊之獵也千金一罍斵瓊􅍢瑰擬于武庫之藏也㳺談之士濡毫緩頬曵長􅅂而従之逰擬于公車金馬之待詔也夫侈極則疑􅀔偪則離弱幹强枝安􅀎乆而不危也邪予曰噫子知其一而未覩其二也勝廣之乱毒于􅃹蔡吕霍之変危于呉楚三馬之偪痛于燕爽王渊圣御名之祸深于斉趙子􅂚不較其輕重哉周室東遷晋鄭焉依朱虚叱咤禄産殱夷五葉之後宗國陵遅洗垢求瘢吹毛索疵剪刈肘腋棄絶藩籬堕犬牙之形􅀔壊磐石之宏基故長沙夆􅃑而不淂逞中山感音而涕洟済之墟梓柱生枝以饐廢食卒死于飢可不悲㢤客憮然為間曰然子言淂之眉山唐先生文集􅃃十六眉山唐先生文集卷十六目雜文唐先生行状史夫人行状賛銘先君真賛又次齋銘家藏古研銘有翠亭銘謝雨文古体惜梅賦平䑓賦
