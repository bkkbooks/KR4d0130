front:
  text: 眉山唐先生文集卷二十五
  hash: sha256:d3974b9d4fb913b9b370b82e378a5b8bb869a9be142e87e143c2bc74c468a534
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_025-1a}
body:
  text: 唐庚子西表到任謝上表代嶺表觀風已慚治效坤維按漕􅂧玷寵靈引組知荣撫􅁭増㥏中謝伏念臣单平冷系迂暗常才雖懐許國之􅀌忠非有􅂈人之竒莭偶縁冗宦􅀍遇先皇擢任監司猥承人乏出分使指益愧食浮􅅻自脱于殿刑􅌸可書之最目謬􅈾渙渥重忝皇華䑕􅀎已盡于五窮鈆刀何堪于再割鴻恩未報俄驚仙䁀之成濬哲肇㒷尚念遺簮之舊遂容尸素未即棄􅂢此盖伏遇皇帝陛下聖徤行天大明出震開並採兼􅀵之路隆太平極治之基致此􅁳頑􅁼蒙委􅀉粹表未瞻于天日殊私已佩于丘山敢不續短俾長勉為正登車㒷嘆雖㣲孟愽之才叱馭遂行姑勵王尊之莭㳙銖可效糜粉為期賀進築表代臣厶言准進奏院報四月􅀄七日涇原路合熈河環慶秦鳯路人馬出寨􅀵天都山進築西安州天都臨羗寨了當至五月􅀄九日分屯訖者四路雲屯如入無人之境三城􅂦峙坐􅀵不􅀾之功華夏􅌚騰蛮夷震中賀臣窃以要荒之叛服係乎制馭之是非有西羗乆稽天討當元豊之願治􅀅議剪除逮元祐之偷安務􅀙姑息養成其􅁖以迄于今属神圣之嗣㒷起師徒而進築逺攻近取日削月侵城堙漸迫其腹心刁斗相聞于巣穴天都形勝既帰掌握之中靈武􅀔􅀌自有唇亡之惧積年之冦指日可平恭惟皇帝陛下仁勇兼資德刑相濟震文王之一怒所以安民体成周之四征終于成徳神武不殺上兵伐謀故䏻旬月之間大􅂧祖宗之地不疾而速惟断乃成厶猥以空踈誤蒙委􅀉振衣踴躍欣聞三捷之音拜手􅂬呼上萬年之夀同前代百堵皆作三旬而成竒速之功古今未有中賀臣聞王者無外天下為家凢声敎之未通必討平而後已惷兹夏虜乆盗西陲虐彼一方逮今累世宝元慶暦数叛服之不常熈寕元豊屡剪除而未盡比㒷進築出自睿謀大師雲屯萬杵雷動山河克􅂧垺堞相望封􅆠逺跨于流沙刁斗声聞于瀚海天都巨險猶俯拾于纎毫靈武􅀌危諒不劳于餘刄恭惟皇帝陛下湯心勇知堯徳武文建一劳永逸之謀成萬世無􅆠之業攄祖宗之宿憤壮社稷之灵威臣迹逺天顔聀縻使指効官有守惟懐鼇忭之心称夀無因徒切葵傾之志臣無任􅇺國卹表代伏惟遺誥皇太后以正月十四日上昇者發開驛訃宣示郡人狂號失聲震悼䘮魄恭惟大行皇太后家順以巽坤柔而剛决大䇿于禁中指麾而定成治功于天下退托不居有姜任婦徳之賢非漢唐母后之比向嬰疾病本自􅁨勤􅉂眩弗瘳彌留􅃍及伏惟皇帝陛下深仁賦性純孝因心方攀慕于宝慈諒何堪于荼毒然以宗祧任重軍國事叢願寛罔極之哀少副有生之望臣忝郡􅀉不􅀗奔詣闕庭臣無任啟謝蔡太師啓代始縁力請淂返弊廬終絶進陞之望未甘扶杖起居雖徤于􅃹寕乆已餙巾志意自同于陳寔忽奉昭囬之蹟大推霶霈之㤙舊􅁖宿愆一時蕩滌前侯故􅀅以次甄􅀵頋惟朽鈍之􅥟屡費陶鎔之手終􅀩記録不忍棄􅂢謂其尝任宰司故􅄖其班序謂其乆安田里仍處以虚閑就使自為之謀想亦不過如此静循其本敢不知㱕此盖伏遇某官以王佐之才值聖人之運􅀅令四海盡􅀩比屋之封肯使一夫獨掩向隅之泣致兹衰退亦極寵荣食既愈浮寕有小言之􅀘位非所称得無大耋之􅁨辞受之間莫知所措賀鄭太宰啟代伏審拜恩中陛進位元台凢在陶鎔实深慶忭窃以虞刑未措選于衆而舉臯陶啇䁀􅀅調求諸野而得傅説偹見載籍號為美談然臯陶之術非本于民情而傅􅀃之㪯不由于師錫坐超􅒯古􅁢属圣時恭惟其官識照㡬先學窮繋表禁林視草知盛德之有言樞極運籌見真儒之無敵旣延登子揆路寔滿􅇺于輿情以舜亊堯意其在此維申及甫兹豈偶然必􅀅盡攄胸臆之竒庻㡬大慰迩遐之望厶側聞誕告寔副願言徒深賀厦之情阻與掃門之役永懐欣豫未易名言賀劉少宰啟代伏審拜㤙天陛進位台纒凢在陶鎔㪯深􅌚忭窃以國家安治何啻百年宰相称呼盖嘗屡易置平章于後省冠僕射于南宫猶襲唐餘未皇周制主上親行宸翰追述先猷作新二宰之名永著一王之法自非智足以断國論仁􅁕以遂物冝則何以上副旁求進膺大用恭惟某官才推人傑學造天民言不外于圣人故尝合稷喻必根于􅀴術豈肯借秦登二府者曽未数年裨萬乗者盖非一亊逮兹爰立寔副具瞻所謂䔥也規而曺也隨周公左而召公右年登可待刑措爲期方此投閑聞之起立阻逺潭潭之府莫趋両両之階欣躍之誠寔倍倫䓁賀右僕射韓相公啓代伏審􅂋奉制麻延登宰籍席播騰九有􅌚慶一辭窃聞考元亀以断大謀不如舊徳指喬木而稱故國未若世臣才猷夙著于廟堂名寔已隆于天下故社稷因之而􅀝重而朝廷恃此以稽疑恭惟某官器重海􅉼神清玉粹天資攸禀有仁民爱物之心家斈所傳皆論道􅀴􅀖之術藹􅀭令聞坦涉亨途頃任樞纒謀已深于漢幄出􅎔閫􅀉澤未溥于南霖政地乆虚僉言􅁢属值聖朝之嗣服思輔相以迓衡召還三遷遂宅百揆韋平盛事固無媿于古人房杜全功誠責成于今日必􅀅盡發胸中之藴庻㡬大􅇺海内之心厶承乏遐陬側聞除目阻逺潭潭之府莫趋两两之階叢忭寸誠难形尺牘賀門下李侍􅀰啟代伏審拜㤙中陛秉政東䑓凡與生成㪯深欣懌窃以明良之㑹今昔所难董賈有志而竟不逢時房杜淂君而未䏻及禮故漢功不􅂈于如此而唐政亦終于闋然追還古􅀄意在今日恭惟某官識探道奥斈濟聖涯􅀴天緯地之文淂之性禀尊主庇民之畧盡在術中早躋華途夙著時望西垣潤色燦追典誥之風右轄論思粛振維綱之任頃􅀙鳯閣出守麟符衆人嘆其失時君子知其􅂧用值聖神之嗣服思耆舊以迓衡召還自外而任以春官曽未閱時而入居左省除音所徹衆議􅁢諧必􅀅盡攄胸臆之竒庻㡬大􅇺遐迩之望厶乆依琳舘嘗辱鈞陶激􅌚忭于重衿难叙陳于弱翰佇聞爰立益副具瞻賀􅃽樞宻啟代伏審誕敷明命擢貳鴻樞世稔服于重名人共欣于􅂋拜恭惟某官才髙康濟志切􅀴綸文章秀彂于妙齡噐業飬成于晚莭中外荐更之乆所守益完縦横􅀿変之才無施不可出而頗牧入則卿雲先帝深知欲大用而未果嗣皇爱眷遂圖任而無疑召還自外而帰直禁林曾未閱時而延登右府參裁机政寕穆􅀖猷朝廷取决于坐籌􅁁鄙折衝于燕爼君臣千載孰窺造􅂰之謀冠帯百蛮行見止戈之武厶側聞除目阻逺鈞􅃊莫伸賀厦之私永愧登門之舊其如欢忭罔喻端倪賀安諌議啟伏審光奉制綸推居諌􅁐朝廷増重中外聳聞窃以致君澤民聖賢之所易逢時遇主古今之至难當諌行言􅃪之時居面折廷諍之任淂伸其志寔係于天恭惟某官藴藉深醇議論辯博飬慷慨敢言之氣負縦横適用之才必􅀅論列是非敷陳利害然恐供聀未幾别有九遷之荣遇事輙言安俟七年之乆厶荷知有素称慶無縁欣忭之私寔倍夷䓁眉山唐先生文集卷二十五眉山唐先生文集卷二十五目唐庚子西表到任謝上表賀進築表同前慰國卹表啟謝蔡太師啟賀鄭太宰啟賀劉少宰啟賀右僕射韓相公啟賀門下李侍􅀰啟賀􅃽樞宻啟賀安諌議啟
