front:
  text: 眉山唐先生文集卷十八
  hash: sha256:f2d1f73acedfa1dc44948614b7721250bef008fa57b14046c38fb9be193d7bbd
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_018-1a}
body:
  text: 眉山唐庚子西古体詩病鶴行鶴􅀆鶴􅀆何䖏来秋江静􅀆蘆花開波浪浸月白皚皚千声萬声鳴哀哀不飛不翔不飲啄骨脊稜稜痩如削氷姿玉質僅生存雪羽霜毛半零落隺􅀆寉􅀆何欝欝我知爾是冲天物芝田就飬􅀌高情瑶池洗出神仙􅇧傳聞仙島􅄀􅁳中水晶甃作蓬菜宫祥烟瑞霧常濛濛好􅀅六翮􅅮天凨􅀉郭虞卿讀書老益苦潇洒比元澹直行不由徑慎獨肯欺暗如何已鴻􅄀猶􅂧見蜉撼寡和郢中曲忍辱漁陽掺斗筲彼常態義命吾何憾屈伸固有時佳境當徐㗖題温泉􅀚温泉宫􅂻行人􅀫􅊜泉池上行人浴人自多情感盛衰泉固無心任荣辱細路蟠蟠入踈竹萬年秦山一作万里晴川皆在目吾皇高拱九重深一作不􅀂雲青山一枝松蘿爲誰緑題洪川驛倦㳺征人鬂欲絲膏車秣馬東南馳出門四頋迷路歧閉户却坐愁支頥魚生釡灶䑕巣枝尔畦千里成陂池吾皇致治方無爲􅁋雨破塊天何如劝君飲酒君勿疑行使止尼良由時未迯形数皆有涯此独未信無窮期食笋行半夜春山試雷雨驚起蟄龍􅀄出土野人不惜蒼苔古掘得嘉飡自燒煮滿􅐻明玉逺飄風一箸鱸魚味差苦竹齋食罷竹隂午竹裏行吟傲簮組君誇食􅁏君固卑我誇食笋我亦痴阿蛮豊膩飛燕瘦意態雖異要皆竒君不見天隨先生貧食􅂎又不見関中客卿肥刺齒豊儉不齊皆有理彼此相忘􅂓尔耳題史廷直郊居黄金轉手盡郊居掩清晝山容凉肺腑竹意净怀䄂入門編簡香無復更銅臭君㸔道南院豈識元徳秀棕花斫破夜义頭取出仙人掌鮫人滿腹珠鮰魚出新網送王覌􅂧交代文正活國手頗恨見不及宦逰識其孫想像髙冠岌豈但為交承自是賢友执􅀹喜談性命㣲到􅄦神泣吾曺飲滄海百川資一吸失脚沙土間􅃃舌䑛泥汁焉依既云乆􅎔别百􅁨集去去自䕶持雨荷終不􅊜戲贈王推官誠中乃祖賦混成津涯極深逺家斈到諸􅀰文字復清婉今作劾䑕吏于理誠未穏怒草三千牘馳驛奏龍衮上問今安在幕聀􅀘閬􅁐召賜数刻对歎息相見晚縂未置青􅃈亦􅀿校黄本九萬里扶揺忽若馳峻坂送趙元恩司法誰不􅀙王亊夙夜独匪􅈈休沐猶坐曺伏日不帰􅇬平生熟人法餘亊工小楷自称霹􅆮手作縣真癬疥鮑宣雖强項􅎔亊中寔駭􅀙君斈吏礼稍稍識起拜今當告别去何以贈行邁二十罰自親此理湏少戒送扈大夫端􅅱平生未識韓不􅂅封萬户方幸得依刘未㡬公已去三年此􅇔􅆡一味惟忠恕江水倒隨人劍嶺横􅃒路那知黄門手就冩碧蘚賦空聞隴上児撃塊􅁔五袴到任後􅀉家兄君子所就三為食最為下起家仰寸禄此寔下焉者􅀯山無敝廬千里就官舎但使食有魚敢言曺乏馬同寮皆故人每亊相假借况􅂧官長賢􅋨帰􅀿不罵送郷人下弟帰郷閉門誦詩史已讀萬卷破飬􅂔塞天地不受一毫挫名声落空廓蹤跡長坎坷塵埃相邂逅齒髮嗟老大文章心未死功業手猶唾世亊若循環天理猶轉磨朝得暮或失俯弔仰輙賀行見風雲㑹驚起南陽卧送趙安道下苐大官危小官卑君不得官君勿悲君不見前日宰相今海涯胡椒八百斛流落知為誰又不見州縣官折腰亊細児尝􅁨一語不中治敢对西山笏拄頥大官危小官卑君不淂官君勿悲願君酒量如䲭夷勿作瓶甖居井眉與君賭取酔為期明日烏㡌風披披代先状􅀉孫熈􅅩疇昔告行邁别酒月中把蹭蹬我已帰徘􅆦君尚且相逢忽驚怪已斍都幻假但當呼阿素預遣置若下略􅃪誦灵光未敢賦換馬一酔洗塵埃萬亊真􅁟苴郡人献笋守以分餉郡寮而吏独見遺守知之命追賜焉盖不出既乆而人忘之也因成一篇坐穩􅂰生踝凝塵􅇁藍版出少顔面生未熟城市眼争席人相忘饋􅁏礼非簡本自無光彩不必更埋鏟自知吾老矣置酒具瓶盞起舞属細君相对一笑莞友人還郷有感飢烏唖唖枝上啼秋凨䔥蕭吹客衣儒冠誤身不得帰女痴妻寒病乳老帰来聚首貧亦好我固知之帰不早束書十載逰長安一官逺謝医卜賢託生長鑱真可怜君今别我还故里想見親朋問所以為言憔悴京城􅂻哀賢仁庙乃文考􅁉􅁜真武王先帝㡬于成主上賢于康時亦有二子採􅅔登首陽其一猶行􅁔其一今云亡功在百世外懦夫心胆張齊侯但多馬名㓕身未彊讀邸报當今求多聞取士到蓬蓽時時得新語誰謂山縣僻昨日拜御史今日除諌官立朝無貟漢㤙厚論事不妨晁氏安䑓省諸公登衮衮閉門熟睡黄紬穩訊囚参軍坐􅆹亊㩀案嚼歯牙引囚到庭下囚口争喧譁􅂙軍氣益振声厲語更切自古官中財一一民膏血為吏掌营鑰反窃以自私人不汝誰何如摘頷下髭亊老􅁖自彰証佐日月明推窮見毛􅍺那可口舌争有内􅁬然出請與􅂙軍辨􅂙軍心如眼有睫不自見􅂙軍在場屋薄薄有声称只今作􅂙軍㡬時淂騫騰无功食國禄去窃􅀎㡬何上官乃容􅀮曽不加譴訶囚今信有罪参軍冝揣分䓁是爲貧計何苦独相困􅂙軍噤無語反頋吏䘚嗟包褁琴與書明日吾帰休程使君生辰歌使君来分銅虎符哺飬百姓如哺雛設􅓡在旦人奔走夆首争爲使君壽但􅂅使君如乃翁福徳種種皆圓融官至大中年九十諸􅀰鳴玊左右立􅀉杜蓬州閬中勝亊不妨竒舊来僻佐人誰知祗縁乃祖腸断句名與江水東􅀯馳閬人徳之不敢忘遺祠今在􅀯山上壁間􅀞得太痩生想是當年苦吟様􅀉時模本􅀶新詩爲我落筆揮珠璣君家自是箇中脚会道春􅀙沙際帰中秋遇雨感懐呈世澤彦直􅀄逰東都年二十清欢趂得中秋及髙陽會中酒徒集惠和坊􅂻綉鞍入蟹螯尝新左手執雞頭未老搓玉粒盃行到手不待揖明月清風供一吸􅆞頭不惜傾箱給􅀝頼决科如俯拾誰知得官反拘縶此景此􅂬那復緝今􅀊中秋雨如泣穷山牢落秋光湿􅀌灯荧荧照書笈屈指流年如箭急通判蘇君俞見和復次韵荅之公才过人其倍十詞藝即今誰跂及萬卷􅀵藏冨編集詩人閫域称􅄖入西川書生學穿執朅来東㳺為禄粒十分折腰敢長揖欲吐壮怀还自吸朋従調笑閗㨗給狂言偶􅀤难􅀵拾語意俳諧韵牽絷不敢献公公宻緝报章大是鮫人泣一一珠璣落圓􅊜自慚思竭如空笈口吻悲吟知窘急喜雨呈趙世澤去年雨多􅁨水潦今年雨少􅁨枯槁都縁縣政失中和水旱年年勤父老前時雲起雨欲落夜半風来还一掃明朝引首望雲漢屋上晨暾仍杲杲賦輸百萬未破白簿脚何縁淂勾倒上書自劾欲帰去老婦挽衣傍奪藁技穷徃訴北山神是夕沛然償祈禱稲畦罷亜势已活竹裏蕭踈声更好故􅀿神意閔􅀌拙苟免􅀊中書下考便安杵臼伺秋成雲子滿田行可擣蓬州杜使君洪道屡称我于諸公聞之媿甚為詩謝之去天一尺古蓬州年来除守得勝流渠家本是城􅀯杜詩律賢我三千籌礼記投壷厶折于厶若干如此才髙却觧亊入眼人才皆可意他邑猶分刺史天片言每為􅀅軍地故􅀿怜我退無田力相推挽令向前傍人聞説皆撫掌竹竿那使鮎魚縁嘲陸羽陸子作茶經竟為茶所困其中無所主復著毁茶論簡賢傲長者彼自愚不遜茶好固自􅀂于我有何恨便當脱野服洗琖為一献飲罷挈茶去譬彼澆畦畹君㸔襧正平意氣真􅀎徤逹與不達人何啻相千萬眉山唐先生文集􅃃十八眉山唐先生文集卷十八目唐庚子西古体詩病鶴行􅀉郭虞卿題温泉覌題洪川驛食笋行題史廷直郊居棕花送王覌􅂧交代戯贈王推官誠中送趙元恩司法送扈大夫端􅅱到任後􅀉家兄送郷人下第帰郷送趙安道下第代先状􅀉孫熈叔郡人献笋守以分餉郡寮而吏独見遺守知之命追賜焉盖不出既乆而人忘之也因成一篇友人还郷有感哀賢讀邸報訊囚程使君生辰􅁔􅀉杜蓬州中秋遇雨感怀呈世泽彦直通判􅂫君俞見和復次韵荅之喜雨呈趙世澤蓬州杜使君洪道屡称我于諸公聞之媿甚為詩謝之嘲陸羽
