front:
  text: 眉山唐先生文集卷十四
  hash: sha256:f062e4e7929fe358d7ed6eb4da033daa7477a0dad2b4a2a7c8592f5482811f29
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_014-1a}
body:
  text: 眉山唐庚子西三國雜事篇下陳夀曰蜀不置史注記無官以故行亊多遺灾異靡書諸􅁑亮雖逹于為政若此之􅁼猶未周焉礼記人君言則左史書之動則右史書之周礼建官偹矣獨不聞有所謂左右史者雖有太史然不以注記為職是時諸侯皆有史豈天子擉􅆣乎春秋之時卜田宅者占雲日者皆称太史則太史殆隂陽家流然書趙盾者書崔杼者亦稱太史則太史又似掌注記者盖方是時學者通知天人而卜㒷􅆸者亦不純用蓍亀太史伯以祝融之功而推楚國之必㒷太史趙以虞舜之徳而占陳氏之未亡其論議証㩀有絶人者故隂陽注記得兼掌之漢司馬談父子爲太史令以論著為已任而又掌天官則兼掌之効於兹可見魏晋之際始置著作􅀰自是太史之聀分而為二孔明之時未也按後主景耀元年史官奏景星見于是大赦改元而曰蜀不置史􅄭矣㬌􅀄元年有司奏魏淂地綂冝以建丑為正遂改是年三月為孟夏四月世言夏得人綂以建寅為正啇得地綂以建丑為正周得天綂以建子為正其説非也以尭典羲和舜典廵狩観之唐虞之世固以建寅為正矣至夏后之時其法尤備其書傳于後世謂之夏小正孔子淂之于已以為可用非謂建寅之正自夏后氏始也至成周時始用建子為正然犹不􅆸夏時謂之正􅀊後之斈者以為夏以建寅為正周以建子為正商居其間不􅀿無所变改因以意推之曰啇以建丑為正而三綂之説㒷焉夫夏后氏以建寅為正吾于論語見之矣論語曰行夏之時周以建子為正吾于春秋見之矣春秋書十月䧏霜殺菽三月無水商人以建丑為正于􅀴既無所見于理亦復不通夫以建子為正者取二十四氣之首也以建寅為正者取四時之首也以建丑為正其取義安在㢤是以知其不然建安十八年先主進軍圍雒縣龎綂為流矢所中卒先主每言則為之流涕龎徳公以孔明爲卧龍以士元爲鳯雏則士元之歯當少于孔明孔明卒時年五十四而士元先卒二十有二年則士元物故尚未三十也豈不惜㢤建安二十四年先主始王漢中是􅀊関羽卒明年黄忠法正卒之明年張飛卒又明年馬超馬良卒基業未就而一時功臣相継淪謝如有物奪之者明年後主踐祚而舊人獨有孔明趙雲後七年雲卒又五年孔明卒而勲舊于是乎盡正卆時年四十五超四十七良三十五自餘不著其年飛傳稱少與羽俱事先主羽年長数􅀊飛兄事之則飛卒時年􅅻五十許霍峻年四十此数傑者皆以髙材早世而譙周至七十餘而終天不祚漢明矣雜文惠州謝􅂧官表臣厶言今月八日惠州送到告身一道伏蒙聖恩復臣承議􅀰臣已于當日祗受訖始以為梦既而果然俯伏拜㤙喑嗚流涕中謝伏念臣身逢尭舜跡雖渉于仕途性嗜老荘口不談于世事自知無用非敢有求適遭學校之㒷累冐師儒之選傳􅀴天性已􅀒愧于面顔奉使日圍固难逃于指目果縁僥倖卒至顛隮命察如絲罪㡬擢髪奮空拳于嶺表不保朝昬托衆口于江陽莫知存沒夷居萬里烟瘴六年頼禀賦之􅁳頑淂保全于視息雖簡編度日益堅國爾之心而兄弟潅園巳作家焉之計豈期仕位􅂧歯朝紳此盖伏遇皇帝陛下如日正中惟天為大曰生曰殺得馭臣之方作福作威有惟辟之道建元良于震邸均介福于坤輿舊􅁖宿愆悉皆蕩滌前侯故􅀅咸􅀍甄􅀵而臣􅁨患摧傷志意衰落雖受再生之賜終無一割之功惟作頌声以歌聖治臣無任上張観文手書其一厶頓首再拜厶違逺教誨忽忽累月暑中未審鈞侯動止何似厶六月􅀄五日到瀘南僦居安夷門外無屋以帰無田園以耕以植雖不及陶渊明帰柴桑時然老弱具在無所損失勝杜子美帰鄜州矣以此自遣不敢上煩謹念正逺師門下情不勝瞻依之至謹奉啓起居不備其二厶惶恐再拜厶既至瀘南瀘􅀯􅁁人知厶為門下客也争持酒肉相劳且問相公起居状厶具言相公年七十餘精力如四五十人􅂡髪烏光無一莖白者今雖翹然獨與道㳺而願力深重不忘利佗之心父老聞此悉以手加額至于感槩流涕􅀉謝相公為宗社百姓厚自調衛其三厶惶恐再拜厶昨去鄉時児女大率皆㓜稚今帰二子皆通􅀴諸女亦􅂧長大見父逺来相对􅌚然貧中亦自有味但念古人􅀙師不逺千里乆者至数十載須業成乃去厶自斈道未有証䖏而逺去師席不得朝夕請業請益以此胸中忽忽不楽今冬了却木蘭一事便當復走門下卒業矣叅侍非逺此不􅈁􅈁其四厶惶恐再拜厶昨舟中無它所為頋惟有讀書又無佗書可讀借淂史記数冊反覆讀之見公仲一事適有得于心以為兹事粗善有益因漫録云趙烈侯欲賜􅁔者田二萬畆國相公仲患之未有以制也畨吴君曰君寔好善而未有所持亦尝進人于君乎公仲曰未也畨吴君曰牛畜荀歆徐越皆可公仲乃進三人及朝牛畜侍烈侯以仁義烈侯逌然眀日荀欣侍烈侯以選任又明日徐越侍烈侯以莭儉烈侯使人謂公仲曰􅁔者之田可止厶爱其不犯脚手而功効捷疾如此謾以為献伏惟聪明幸察荅合守程元老書厶頓首李元􅀿到瀘岀示所賜書伏承暑中動止萬福眷聚無他良慰厶䖏田野間亦復自適不足垂念但瀘南前日小旱二麦己不償種今又甚雨復􅁨麻豆矣仕進如此退耕又如此豈但人力􅁘婦雅病肺比老益甚五月中垂死後治今幸無亊然以此都不成家計閒居既無􅂈従而衰晚亦不耐煩迯虚既乆己自成趣聞人足音乃更不喜九月間送女到丹稜因于放脚一到峩眉瓦屋霧申青城諸山至春末可帰向示漆噐今納二十引去字號聞此寛相憶為􅀖復好音人生五馬貴莫受二毛侵伏幸檢􅀵合陽􅂈客絶少公帑有餘日生亊想見不多多亦不劳餘刄政當薫衣理鬂努力行楽自厚不宣上張観文所業序厶惶恐頓首厶欲焚弃筆硯之日乆矣而時時技癢終不䏻自制雖制亦不䏻乆今日暫止明日復作如間日瘧不断根本昨既至惠州便用趙廣漢法為缿筩每一篇成輙投之缿中不可復取比其還也始破缿出之得歌詩雜文三百餘篇念持此無所帰必帰之門下而篇目猥多無氣力装冩但寫古律詩百篇雜文二十篇以献辞既不工雖工亦安所施亦各著其所爱習而已隐几一閱即投之火中幸甚于冐鈞重悚愧無量門生厶位序書姑􅂫張自强教授所編寅申録吾平生取名以此其掇謗亦以此頃謪惠州􅂈扶胥此書失手墜海中舟人皆失色予獨喜幸名與謗俱息矣不謂今日復稍見于士大夫間讀之惘然似佗人文思之􅃼然如隔世事而姑􅂫張自强􅂧持此六􅃃示予是名與謗持未巳也然自强嗜吾文必知我者也必爱我者也想能為我深藏而慎出之庻㡬可以免矣宣和己亥十二月眉山唐子西書祠三使者䟽瀕江之神有號三使者世莫知其為何神其原出于雅安漢嘉盛于戎瀘􅀍于巴峡之間民不敢斥以三指相示輙恐惧変色其畏之如此然􅀕不􅂈巵酒噐食其所持盖狭矣而灵􅀿捷疾有不可掩者吾聞昔沅湘間祠東皇太一湘君湘夫人少司命雲中君山􅀑䓁神為􅁔舞以楽之而詞不雅馴屈平為作九􅁔声施後世今神不可視其他獨不得比山􅀑乎而客非其人無文詞以􅀤之嗟哉香林䟽昔者香林親得雲門三昧傳之北塔挺生雪竇一枝子子孫孫在在處處正眼周于法界真身葬于寺中􅃗􅂂具存莫記星霜之変精廬漫蔽率皆風雨之餘文演道人愍此就􅂽勇于必葺欲使當来末斈識前人魚鼓之音豈惟􅂈去祖師存後世箕裘之業冀集無􅁁之福上資有永之年當頼十方共成此叚眉山唐先生文集􅃃十四眉山唐先生文集卷十四目唐庚子西三國雜亊篇下陳夀曰蜀不置史注記無官以故行事多遺灾異靡書諸􅁑亮雖達于為政若此之􅁼乃猶未周焉景􅀄元年有司奏魏得地綂冝以建丑為正遂改是年三月為孟夏四月建安十八年先主進軍圍雒縣龎綂為流矢所中卒先主毎言則為之流涕雜文表惠州謝復官表上張観文手書其一其二其三其四荅合守程元老書上張観文所業序書姑􅂫張自强教授所編寅申録祠三使者䟽香林䟽
