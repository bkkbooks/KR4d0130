front:
  text: 眉山唐先生文集卷九
  hash: sha256:0d1c718750a0661a09bd2bc72c990c7fbbf497ad46e051994e8cd8f11d937a52
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_009-1a}
body:
  text: 眉山唐庚子西記射象記政和三年三月乙夘有象逸于惠州之北門惠人相與攻之操戈㦸􅃓弩火炬者至数百人而空手旁観鼓噪以助勇者亦以千計既至皆逡廵不進有監税蒙順國者邕州边人以趫㨗自矜短衣踊躍挟数十矢射之中項皆如蝟毛象龎然不動徐以鼻卷去最後中左耳流血被面象怒馳之順國棄弓反走未􅂾走象以鼻鈎其􅂰盤之于地蹂踐之衆潰走散象亦緩緩引去少焉走卒就視則順國已碎首折脅䧟􅅐流膓死矣吾時方食聞之投箸嘆息嗟夫使象得入城則鼻之所觸歯之所拂􅁕之所蹴豈􅂧有邑屋居民聚落也㢤為万人排难而以一身死之此吾所以嘆也然吾聞交趾捕象必用机穽未有直决者吾常識其形矣其立如屋其卧如堤其行如舟是豈可與力競也㢤若人者可謂愚矣此吾所以又嘆也然向使百数人者叶心戮力斉􅁬而共擊之亦未必不勝脱令不勝犹当不至于此此吾所以又歎也雖然古之不量事力􅁬區區之忠以排难救人為己任而困扵無助以至碎首折脅䧟胸流腸而死者亦安可勝数凢有志而無成者皆是也何独此㢤此吾所以又歎也作射象記李氏山園記伯陽甫續史記後三百年而老聃伯陽為柱下史後世因以伯陽甫為伯陽則二人為一人矣范武子晋士㑹也而古今人表置士㑹于中上列危武子于上中則一人為二人矣豈惟人㦲龍目一名益智而益智非龍目龍目岀海南山各間味甘益智出西域味辛而廣雅曰益智龍目也則二物為一物矣枇杷盧橘一也而上林賦曰盧橘夏􅍄黄柑橙榛枇杷橪柿亭柰厚朴則一物為二物矣夫父祖之事子孫有不及知州里之物􅂄舊有不遍睹而况述千載之上􅂾千萬里之外者乎亦何能無失􅁘吾􅀯迁惠州寓居城􅀯李氏之山園園高下􅂾十畆草木華寔無所不有而龍目盧橘為特盛吾兄弟甥舅無日不徃来逍遥于其下而笑舊説之謬盖常以比伯陽甫范武子之事而為之嘆息因書其事使後世知有是園又知吾常逰戯于此又知著述不可以不慎而斈諸子百家之言者亦知其有淂有失而審所取云水東庙記庙中神像二其一介胃按劒而坐者曰㒷祚王其一烏巾紫襴端笏而坐者曰泰民王覌㒷祚之名疑南漢時􅀁封而不􅅿遂以為然者盖無所考也吾始至惠州屏居于􅀯山之上北望西江之東林木之間夜夜有灯煜然里人曰此水東㚑庙也吾聞之悚然檮焉自是感于精神彂于梦寐者非一以其事近怪故不復悉書而要之灵􅀿卓然有不可不信者然吾尝聞之易矣凢天道之所􅃜益地道之所流受􅀑神之所祸福與人之好􅁖大抵相似吾今以無状不肖􅀗罪于世至于中原之大無􅀁容其軀而􅇡伏于五嶺之􅀯羅浮之東披黄茅而居者五年後而帰則其見􅁖于人也可謂極矣方是之時雖吾之心亦復自􅁖而神独眷眷如此意者􅀑神之中亦有異好者乎抑亦捨其迹而求其心憐其穷厄而􅁯其罪戾亦如吾君􅀁以寛而不誅已弃而復􅀵之意乎不然何其與易相反神之威徳始于神江被于瀕流􅂾百里之間故神江鉄歩水東皆有庙而水東庙為特盛然皆不在祀典故或者以為疑夫以祀典而論􅀑神犹以閥閲而論人物也便謂之盡可乎此亦無􅁕疑者政和五年六月二十四日眉山唐厶記易庵記客問陶隐居吾欲注周易本草孰先隐居曰易冝先客曰何也隠居曰注易誤犹不至殺人注本草誤則有不得其死者矣世以隐居為知言與吾之説大異盖六经者致治之本草也漢時决疑獄断國論悉引经術兹豈細故而易言㢤本草所以辨物六經所以辨道道者物之所以生物者人之所以資為生一物之誤犹不及其餘道術一誤則無復孑遺矣前世儒臣引經悮國其祸至于伏屍百萬流血千里本草之悮豈至是㢤注本草悮其祸疾而小注六􅀴悮其祸遲而大􅀮居注本草矣故知本草之為难而未尝注􅀴故不知經之為尤难而不可率易如此世以不服藥為中醫此言雖小可以喻大吾用易不審陥祸㡬死今幸閒􅆸方且㩀庵熟讀而深思之復書此記二本其一以自警其一以示二子焉年月日記書大鍳碑隂記曹溪大鍳禅师碑元和中栁栁州文紹圣中􅂫定武書前長老辨公立石至崇寕初此碑坐累毁去今長老和公更書而刻之唐子曰大鍳之道不以文而重􅁿栁州之文不以字而隐顕辨公以大鍳之道栁州之文定武之書三法和合以成此碑使喜書者因字以求文好文者因詞以求道其意以為更相彂明而不知其適􅁕以相累何則志于字者見字而不見文志于文者見文而不見道安在其為更相􅀤眀􅅻去其一而二者皆病此和合之患也今子􅂧以栁州之文配大鍳之道雖無前日字畫之累亦安䏻免于所謂和合者㢤雖然是間盖有理焉文􅀉于字是字而非文道寓于文是文而非道三法雖和合体相各差别眼色合為見色雖去而視存耳声合為聞声雖亡而聴自若也既不能相為用矣又烏能相為累㦲和喜曰然請書子言吾刻之碑隂傳資政韓公家傳韓公諱粹彦字师質相州安陽人魏忠献王之子故丞相儀公之弟也春秋之世韓献子大有功于趙故宋有天下而韓氏爲特盛忠献有勲劳于天下先朝著令世選韓氏子孫一人官相州故公弱冠以選􅁥相州酒税秩滿復監相州倉稍迁國子􅁥光禄寺主簿衛尉寺丞提夆京東常平䓁事尚書司勲貟外􅀰接伴北朝賀天寕莭使充北朝正旦國信使主上即位仪公改左僕射公避親改少府少􅁥迁吏部員外郎丐外􅀘淂陳州儀公罷相公亦罷郡主􅃹嵩山崇礼宫五年許自便主􅃹西京留司御史䑓駕幸㒷徳禅院有感詔韓氏子孫在吏議者悉除之未㡬主􅃹􅀯京鴻慶宫丁毋􅁨服除拜光禄少郷上享原庙攝太常卿接伴北朝賀天寕節大使使还賜岀身拜祕書􅁥二年以徽猷閣待制知㒷仁府俄擢定州路安撫馬歩軍都縂􅃹知定武軍府事還朝拜吏部侍􅀰主􅃹右選求外􅀘拜龍圖閣斈士復知定州年五十四薨于中山公名重北方而聞于契丹故聘使徃还公未尝不在其間而北道謀帥公未常不為選首其使契丹也王师方西征虜意不自安公既入境皆交口問事公对以使事有指不敢及其他公既慎重其事不敢縦言而虜亦順適其意不敢復問而雲中舘送􅎑箱事例客省使不肯拜受香藥酒皆反覆論难卒正其礼淂其所守而还公始授舘虜主戒館中勿生事公射于館中虜主乗小車與其孫覌焉因觧􅆖以侑射且命畫工皃之以帰其為逺人所慕如此公為侍郎者再而吏部之政為最勤其殿大􅀖者三而定武之政為最逸盖吏部分四選而侍郎右選至為雜冗公承積􅁦之後􅁵正簿書遣决􅆡務増損􅆸置五萬四千一百余事髪為㡬白然後怨詈謗讟化為驩謡上聞而嘉之公進秩一䓁官吏賞有差所謂最勤者如此中山魏王儀公舊治也遺民故老猶有存者聞公作世済堂固已感悅而公之撫軍治民悉遵先世規摹故雍容談笑无他施為而軍府粛然所謂最逸者如此余尝讀公奏议以考其為心大抵以爱民為本始公知陳州作護城堤自是無復水患人至今便之然至定武時议者欲决滹沱河水注塘濼中而界保州永寕之間作限水堤則公極論其不可始公在武定時詔訪以俻边之計公畫四䇿以儲蓄為先務然河朔均糴則公復有所不􅀙所謂以爱民為本者如此余讀公奏議十卷至論致仕官􅂧起免追所淂恩典以勵風莭喟然嘆曰大㦲言乎有忠献之風矣始公貌􅀋其父世人以為忠献􅂧岀而號小魏公神宗哲宗亦以是深􅄊之然终不至大用故余所書止于如此世以忠献比周公旦召公奭太公望今考史記世家周公之子伯禽太公之子吕伋皆齷齪庸人無事可書而召公之後九世無聞至燕惠侯然後稍見于史則余今􅀁書如此公可謂不忝其世矣賛曰公子保之謂余言先公在武定時有説先公取幽燕者先公折之曰國家奄有四海寕少此弹丸土􅁘北方無亊百有餘年両朝之民淂以奍生淂以送死得以亊其父母而飬育其子孫始之者冦凖而成之者公也傳曰仁人之言其利溥㢤今􅀁谓仁者果誰欤非公孰能當之眉山唐先生文集卷九眉山唐先生文集卷九目唐庚子西記射象記李氏山園記水東庙記易庵記書大鍳碑隂記傳資政韓公家傳
