front:
  text: 眉山唐先生文集卷五
  hash: sha256:fcc85c161fd561d2deed32819074f38138bef23515d6650370ada8179e840e97
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_005-1a}
body:
  text: 眉山唐庚子西近体詩西溪西溪霜後更沆􅉼溪上愁人雪半簮市散争帰橋納納橹摇不進水潭潭利傾小海魚塩集味入他村酒茗甘百里源流千里势惠州城下有江南野望頼有澄江在專供􅀝杖清水裁偏岸直雲截乱山平鞞鼓知農􅂩雞豚斍􅀊成却縁摇落後木抄淂􅀌城獨逰是日逰于独乃情知者誰時光新舊􅀊莭物淺深枝鴉攫春祠敏鳶窺野燒痴田園有妙理吾悔淂之遲醉眠山靜似太古日長如小年餘花犹可醉好鳥不妨眠世味門常掩時光簟已便梦中頻淂句拈筆又忘筌故游茂先大夫元祐初為唐安守豪逸喜賓客能劇飲談笑盖陳孟公之流今唐安絃索之盛甲于西蜀自游使君始後累迁至秦鳯憲以卒既二十餘年而其子振旅逰嶠南相􅂈于惠州乃為作此篇以贈之唐安千指録琵琶故事猶聞蜀􅅱誇樽酒何人陪北海練裙今日見西華子帰未淂頻芳草我老無成斈種􅀲萬里相逢俱白首班荆長語夕陽斜憫雨老楚能令畏壘豊此身翻累越人窮至今無柰曾孫稼㡬度虚占少女風兹事会須星有好他時曽厭雨其濛山中頼有茱粮足不向諸矦託寓公贈愽士承議無尽􅀯㷌遷客氣平和磊落胸中所淂多白日􅂈􅀙惟陸諝清宵梦想適維摩徘􅆦未忍􅂢雞肋寂寞猶能頋雀羅好與郷人敦薄俗莫因哺啜負岷峨次張天斍見贈韵别公帰去飬天和見􅀃清朝士已多裾捨登門何䖏曵頂縁受記昔曽摩㡬時傳􅀃重調􅂦去􅀊成湯已觧羅㑹引鑑湖為故事要􅀙英主乞三峨重陽後一日􅀙無盡泛舟游䖏士䑓故詩人秦亀􅀙所居皂河經雨水㣲沙舡帖䑓根日未斜三􅏙就荒悲白土一樽相属对黄花已􅀅逺眺收平楚更遣清言到永嘉要見仙翁頭似漆請㸔酔後落烏紗和韵無盡東湖水落露堤沙舟􅂈湖心藻荇斜野􅏙小橋穿竹巷烟村踈栁間蘆花新秔炊熟胭脂白活鯽珍于丙穴嘉飲散肩輿乗皓月烛籠何用両行紗江陵逢故人宋徳粋自播守罷帰南陽以詩見貽依韵和酬昔别方初莭相逢各素秋君帰卧龍國我脫堕鳶州霜鬂含多事塵容带􅌒逰行藏端可見􅀊晚莫登楼走城西别䖏厚居正二宗兄㑹居正出獨與䖏厚笑語終日頗有卜鄰之㒷因属買田江􅁜作此詩舊交零落半存亡晚􅀊荆州淂両唐臨别眼中無小謝再来天外有他楊預行後日誅茅地要近先生避世墙㑹與幽人􅂾晨夕何能結客少年塲和覌文相公立春日示詩閑把流年指上輪朝来七十五廽春一杯􅂅荐喬松夀四海方依社稷臣血氣未嫌辛菜冷顔容犹称彩幡新清詩小字傳覌䖏滿座驚呼斍有神生還至冝都逢李六更把餘年着酒澆莫談前事廢灯挑地縁有語封还止印為無功鋳復銷頼是詩書能却瘴到今魂梦亦聞潮頭西㱕去君休怪尾叚無多不柰焦舟中去楚及梅落􅂈夔逢麦秋既非就國者判作賈胡留心力盤滩盡年光抛渡休移書故山友慎勿厭耡耰北嵌双鬂莖莖白􅀌舟寸寸移北嵌方守剤南畆定何時無䖏謀春酌他村愽晚炊頻年卧江海寕卹一滩遲何執中挽詞白璧就黄壌忘情良独难覌生六十化比歿九遷官筆下無時俗胸中有􅀊寒雅怀嗟不遂欲掛死前冠王元隠挽詩㕠鬂繙􅀴老千金食客貧由来户外􅋰不救甑中塵惜此􅇒雲手終于入幕賓何人禅家斈崔􅂐淂崔駰悼楊隐之承事忍能揮泪讀豊碑平昔修為我自知一日不齋無此理五行並下記他時肯敎灵運先成佛未信王家敢譽児􅂄舊即今零落盡鶴帰空嘆冡纍纍題覧勝閣後破佛塵侵面相黄金暗雨入眉毫白玉休此日争㸔大垂手逰人誰􅂧小低頭􅀅赴􅆣有感示􅅨老畏高門地慵便下澤車終然嬰世􅃠难作爱吾廬白首趋行在青􅂁奉起居平生誇好手到此不如䟽次韵强㓜安冬日旅舎殘􅀊無多日此身猶旅人客情安枕少天氣㪯盃頻桂玉黄金尽風埃白髮新異鄊梅信逺誰􅀉一枝春次韵㓜安留别白頭重􅂿軟紅塵独立鵷行斍異倫泩事已空誰叙舊好詩乍見且尝新細思寂寂門羅雀犹勝纍纍冡卧麟力請宫祠知意否漸謀帰老錦江濱眉山唐先生文集卷五目唐庚子西近体詩西溪野望獨逰醉眠故游茂先大夫元祐初為唐安守豪逸喜賓客能劇飲談笑盖陳孟公之流今唐安絃索之盛甲于西蜀自游使君始後累遷至秦鳯憲以卒既二十餘年而其子振旅逰嶠􅀯相􅂈于惠州乃爲作此篇以贈之憫雨贈愽士承議次張天斍見贈韵重陽後一日􅀙無盡泛舟游䖏士䑓故詩人秦亀􅀙所居和韵江􅁜逢故人宋徳粹自播守罷帰􅀯陽以詩見貽依韵和酬走城西别䖏厚居正二宗兄㑹居正出独與䖏厚笑語終日頗有卜鄰之㒷因属買田江􅁜作此詩和覌文相公立春日示詩生还至冝都逢李六舟中北嵌何执中挽詞王元􅀮挽詞悼楊隐之承事題覧勝閣後破佛􅀅赴􅆣有感示􅅨次韵强㓜安冬日旅舎次韵㓜安留别
