front:
  text: 眉山唐先生文集􅃃二
  hash: sha256:8dd953ccc96e1645b8acc8d128e0230e3c28ddacfd45ab39eb44c7f7badddfd5
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_002-1a}
body:
  text: 眉山唐庚子西古体詩秋水行僕夫取水古龍塘水中木佛三肘長隨波俛仰如簸糠並流拯之置道傍衲衣着㡌僧伽装里人􅀚者如堵墙相與築室􅎔滄浪荷盖荃壁辛夷梁三日屋成小而香野草红花荐芬芳炉烟晝清夜灯光乃知寔相無立鄉人人性中普照王採藤曲魯人酒薄邯郸圍西河渡橋南越悲􅀊調紅藤百萬計此古一作無穷時去年採藤藤已乏今年採藤藤轉竭入山十日脱身帰新藤出􅁟拳如蕨淇園取竹况有年越山採藤輸不前今年輸藤指黄犢明年輸藤波及屋吾皇奍民如奍児鑿空為此謀者誰冬雷行百虫蟄䖏安如家阿香夜起推雷車一時技癢不忍俊撼動尺蠖掀龍蛇龍蛇尺蠖踞已乆亦欲􅁬迅舒頑麻梦中一震忽驚躍􅀤破墐戸排泥沙泥沙已出雷遽止錯愕欲去难藏遮虫蛇狼狽莫知􅂾間有伏龍吁可嗟贈談㣲之去年絃歌程水濱甑中生塵范史雲今年講斈鵝城裏関西孔子楊伯起昔人論士覌心期時人論士㸔目皮只知黄鷂矜觜􅀲不識騶虞避生草㳺使君諸子􅁔大㳺落落如長松説易妙合韋編翁胸中藴藉入眉宇筆下言語駈頭凨小㳺濯濯如春栁十八書生􅂈秦手已􅀅文夆呼大兒更與長源為小友是家諸郎都㡬人傳聞一一連城珎未識龍川五袴守端似當年萬石君北帰至廣州􅀉惠州故人帰心如躍馬􅁬迅不可駐别情如放猿已去犹返頋三年孺子社􅂾借柱史書好在五噫孫善保千金􅥟舊来談天口老去尽地力萬里不相忘􅀉声問眠食近体詩􅀯遷去去寛鄉托此蹤閙中無地頓衰翁未誅綺語犹輕典更賜羅浮有底功蝦莱賤時皆丙穴茅榮美䖏即郫筒著鞭要及春前到趂賦梅花􅁃嶺東渡􅃆隺帰遼海悲人世猿入巴山呌月明惟有沙虫今好在徃来休並水边行武陵道中朝持漢使莭暮作楚囚奔路入離騒國江通欵乃村垣墻知地湿草木騐冬温􅄫寞桃源路行人祗断魂長沙道中古古今今路朝朝暮暮行橘林香䖏飯杉木翠边程山􅅁湘灵􅆭川含楚些清江湖無限句遷客要才情鴨歩仗波江面莹如磨忽尔崩騰作沸渦横笛未终平似板此中端有萬蛟鼉次泊頭何䖏不堪老浮山傾盖親潮田無􅁖􅀊酒國有長春草木疑灵薬漁樵或異人近前端有淂丞相未冝嗔到羅浮始識秧馬擬向明時受一􅒡着鞭常􅂲老農先行藏已問吾家夆􅀙此馳君四十年􅀄到惠州盧橘楊梅乃尔甜肯容遷謫到眉尖因行採薬非無淂取足㸔山未害廉办謗若爲家一喙著書不直字三缣老師􅀘䖏吾何敢政為宗風不敢謙謝人送酒世情不到海边村載酒時来餉子雲便欲醉中藏潦倒已􅀅度外置紛紜細思擾􅅰膠膠事政坐竒竒怪怪文喚取鄰翁傳杓飲漸令安習故􅀅軍水東感懐徃事􅀌􅄘在流年細草頻但知其室通誰識所存神碑壞詩無敵堂空徳有隣吾今稍奸􅃛终日酒边身登栖禅山海雨山烟撥不開眼前遮定一作尽望鄊䑓如何借得維摩手断取西南故國来􅀵景􅀄書并示薬物乹坤心腹友江海鬂毛斑藥􅀘他鄊闕書開故一作去國顔何時乗下澤此日仰髙山㑹是帰耕耦由来有賜環九日懐舎弟重陽陶令莭单閼賈生年秋色蒼梧外衰顔紫菊前登髙知地尽引滿斍天旋去􅀊京城雨茱茰对惠連􅀵家書西州消息到􅀯州􅇧肉無他􅀊有秋􅂹子觧吟青玉案木蘭堪􅀾黒山頭即時旅思春氷坼昨夜燈花黍穂抽從此帰田􅀿坐享故山已為理菟裘瀘人何􅀖直者為安溪把截􅀅有功不賞反淂罪来恵州貧甚吾呼與飲為作此詩楚人季布以勇􅂋魯國朱家用侠聞馳馬弯弓臣好武吹毛洗垢吏深文王孫此日誰漂母卿子前時號冠軍滿引一杯斉物論白衣蒼狗任浮雲予在惠州作酒二種其和者名奍生主其稍劲者名齊物論後禁主字遂去其一除夕患难思年改龍鍾惜􅀊徂関河先壠逺天地小臣􅀌吾道慿温酒時情付擁罏􅀯荒足妖怪此日謾桃符人日人日傷心極天時觸目新殘梅詩㒷晚细草梦魂春挑菜年年俗飛蓬䖏䖏身蟇頥頻語及髣髴到東津栖禅暮帰書所見二首雨在時時黒春帰䖏䖏青山囬失小寺湖盡淂􅀌亭春着湖烟膩晴摇野水光草青仍􅂈雨山紫更斜陽白鷺􅀃與門前白鷺群也宜􅀙此断知聞諸君有意除鈎黨甲乙推求􅂲到君六言㡬年持鉢天外晚􅀊結庵海隅頭白親逢孔墨眼生􅀄識楊盧孔雀墨魚楊梅盧橘又烟合家煨老酒風腥船􅂈醎魚丁米獨遺遷客峒夫不􅂾僑居有所嘆林中宴坐老沙門豈願􅎔年触垢氛正恐先生不淂飽欲令後死與斯文近逃台􅂦居東洛聞道衣冠滿北軍湏信此􅂗天一握人問謾説有􅀌雲其二耕田佩印両徒然憶想平津只去年怪底功名称地獄誰􅀅官府到天仙是非已付漁樵判疑信难憑黨與傳杯酌豈􅀎通大道床頭當得酒如泉舎弟書约今秋到此此日方􅀵信前時已具舟開頭今幾月軟脚定中秋凉徳為兄忝炎荒為尔􅁨從今西望眼􅀿到見時休䟦道徳􅀴闘智饒君三十里著書还我五千言只􅀅得一覌天下约法劉公已太煩夜坐怀舎弟無雲仍露坐有月更江􅆏沉陸傷吾道浮生憶尔曺扁舟􅀿夏口此夕数秋毫不見今三載當時已二毛送外甥之廣州由也乆􅀙我牢之真有甥時情爲客老秋色進舡清撥刺朝朝味鈎輈処処声越䑓休弔古旅􅅎向来驚九日独酌登髙無老伴引滿自髙􅁔欢意天边少重陽野外多黄花空􅀊月白首尚関河他日龍山㒷吾今在網羅壬辰九月二十三日天􅂔始寒以詩記之朝来怪底冷前此已重陽漸逼袴􅃭莭稍聞􅁅火香烟嵐向冬净橘柚淂霜黄嶺表雖多暑天時亦有常眉山唐先生文集卷二眉山唐先生文集卷二目唐庚子西古体詩秋水行採藤曲冬雷行贈談微之㳺使君諸子􅁔北㱕至廣州􅀉惠州故人近体詩南􅁶渡􅃆武陵道中長沙道中鴨歩次泊頭到羅浮始識秧馬􅀄到惠州謝人送酒水東感懐登栖禅山􅀵景􅀄書并示薬物九日懐舎弟􅀵家書瀘人何􅀖直者為安溪把截􅀅有功不賞反淂罪来惠州貧甚吾呼與飲為作此詩除夕人日栖禅暮帰書􅀁見二首白鷺六言又有所嘆其二舎弟書约今秋到此䟦道徳經夜坐懐舎弟送外甥之廣州九日独酌壬辰九月二十三日天􅂔始寒以詩記之
