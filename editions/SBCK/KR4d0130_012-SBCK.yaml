front:
  text: 眉山唐先生文集卷十二
  hash: sha256:fb75ebe6bb3f9cf5ebb699cda833ac4f8d261ca9a6e81d4b707fc95a74c1d5a8
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_012-1a}
body:
  text: 眉山唐庚子西三國雑事曹公征下邳擒関羽以帰礼之甚厚而察其心神無乆􅅏之意使張􅈙以情問之羽嘆曰極知曺公待我厚然吾受劉􅀅軍恩终不可留要當立効報曹公而去及羽破顔良曹公知其必去厚加賞賜公悉封還拜書告辞帰先主于􅀽軍左右請追之公曰彼各為其主勿追之也羽為曺公所厚而终不忘其君可謂賢矣然􅀾國之士亦䏻之曺公淂羽不殺待之厚而因用其力亦可謂賢矣然􅀾國之君亦䏻之至羽必欲立効以報公然後封還所賜拜書告辞而去進退去就雍容可観殆非􅀾國之士矣曹公知羽必去重賞以以贐其帰戒左右勿追曰彼各為其主也内䏻平其氣不以彼我為心外能成羽之忠不私其力于巳是犹有先王之遺風焉吾尝論曹公曰是人䏻為善而不䏻不為􅁖䏻為善是以䏻享國不􅀎不為􅁖是以不􅀎取天下黄􅀄二年八月魏遣太常邢正持莭䇿権為吴王加九錫権受之是􅀊吴蜀相攻大􅀾于夷陵吴人卑辞事魏受其封爵恐魏之議其後耳而魏畧以為権有僣意而自頋位􅁿故先卑而後倨之先卑者規得封爵以成僣窃之基後倨者兾見討伐以激怒其衆且吴至権三世矣其􅀔足以自立尚何以封爵為㢤受封爵則君臣矣供職貢矣除􅁁関矣國有警急以事聞無淂擅㒷兵攻撃矣羽書至則悉甲士從徴矣非身入朝則遣侍子入􅀫衞矣彼藩國固然亡􅁕怪者一不從命則王師致討有詞矣然後􅀤兵拒􅀾是抗上矣尚安䏻激怒其衆也哉旣而魏責侍子権不䏻堪卒叛之為天下笑方其危急之時群臣無魯仲連之識出一切之計以寛目前之患而陳夀以勾踐竒之勾践事吳則尝聞之矣受吴封爵則未之聞也魏明帝問黃権曰三國􅂦立何者為正􅁠曰當以天文為正徃􅀊荧惑守心文皇帝崩吴蜀平安此其証也權推魏為正统未必不然然􅁠初無他説一以天文决之此非余之所敢知也黃初四年三月癸卯月犯心大星占曰心為天王位王者􅁖之四月癸巳蜀先主殂于永安宫而二國皆自如天道豈易言㢤晋天文志稱二石雖僣號其强弱常占􅄧􅀫不関太㣲紫宫然以載纪考之流星入紫宫而劉聰殞彗星掃太㣲而苻堅敗荧惑守帝座而吕隆破故知推論正統固自有理也晋庾翼與兄氷書曰􅀊星犯天関江東無它故而季龍頻年閉関此復是天公憒憒無皂白之証也噫人之責天亦太詳矣為天者不亦难哉先主攻劉璋所至輙克置酒大㑹于涪謂龎綂曰今日之㑹楽矣綂曰伐人之國而以為􅂬非仁者之兵也先主曰武王勝商前􅁔後舞非仁者􅁘備之識陋矣何􅁕論㢤至于楽與不楽之義則有可得而言者傳曰師有功則奏凱􅁔又曰􅀾勝以丧礼居之二義孰是吾聞聖人無心以百姓心為心其􅀾也本所以􅁨民之􅁨其勝也不得不楽民之楽故師有功則奏凱􅁔此無􅁕怪者然道失而後德德失而後仁仁失而後義義失而後礼道至扵礼其去本逺矣而况于兵乎故􅀾勝以丧礼居之亦無足怪者言楽與不楽皆未之盡也古之䖏此者外則􅁔舞而内以丧礼居之黄􅀄四年司徒華歆司空王昭尚書令陳群太史令許芝謁者僕射諸􅁑誕各有書與諸􅁑亮陳天命人事欲使㪯國稱藩亮不報魏之群臣可謂不學亡術而昧于識慮矣使其斈術識慮如漢䔥望之者不為此㪯動也漢宣帝時呼韓欵塞稱藩望之議以客礼待之使他日遁去于漢不為叛臣宣帝􅀙之盖方是時匈奴雖衰然素號敵國非東甌南粤比也名分一正遂不可易他日叛去何以處之彂兵加誅則􅀔有所未䏻置之不問則無以令天下故方其柔順之時待以不臣之礼非獨示以謙徳盖􅀅􅀅為後日乆逺之慮也魏之自視何如宣帝吴蜀雖弱不至如呼韓邪之時彼雖称藩猶當待以弗臣况未服而强之􅁘前此加􅁠封爵而為権所戯侮今􅂧喻蜀称藩為亮所不荅自西自東自南自北無思不服者不如是之劳也㒷平二年􅀽術僣號于九江置南北郊是時荆州牧劉表亦郊祀天地漢不䏻制唯天子祀天地于郊唯魯淂用郊郊祀之礼聖人之所甚重而後之乱人欲為大盗於天下未尝不先盗兵所甚重者此荘老之徒所以有聖人不死大盗不止之説也至楊子之論則又不然秦人祀白畤周不即禁卒舉天下而與之名分所在不淂不重夫荘老之説儒者固己非之而楊子之論亦􅂧有所未盡楊子惟知􅃊名分以􅎔天下而不知䏻保天下者然後䏻守名分秦人之祀白畤周非不欲禁之力有所不䏻也然則欲守名分者先勉其所以保天下者㢤諸􅁑孔明説先主以跨有荆益保其􅑐阻天下有变則命一上􅀅以荆州之軍向宛雒而身率益州之衆以攻秦川先主称善髙祖既破陳狶還至雒陽嘆曰代居常山北而趙􅀙山南有之逺乃立子常為代王以代郡㕍門属焉地固有封境雖接而形势非便者矣荆州在山前距蜀五千餘里而蜀􅀙山後有之其势寔难非獨不䏻有荆州也雖得秦川亦不䏻守何者梁益險絶盖自守之國而不可以兼并凢物之在山外者尺寸不䏻有此髙祖所以棄漢中而取三秦也􅁠欲令太子登讀漢書習知近代之事以張昭有師法重煩劳之乃令休從昭受讀还以授登劉偹教禅以漢書而権亦令張昭以漢書授其子登世以権偹之智不􅁕以知二帝三王故其所以貽謀者止于如此是大不然伊尹之訓太甲也称有夏先后而不及唐虞周公之戒成王也稱啇三宗而不及虞夏豈伊尹周公之智不足以知堯舜禹㢤亦取其近于時切于事者而己権偹之知識不足擬伊尹周公至其教子不忽近而慕逺不貴名而賤实此亦伊尹周公之遺法也晋漢春秋曰孫皓聞羊陸交和以詰于抗抗曰臣不如是正足以彰其德耳于祜無傷也或以祜抗為失臣莭两􅏺之親仁善鄰者國家之事出竒克敵者􅀅帥之職羊陸以􅀅帥之職而修國家之事此論者所以􅏺其失莭也窃謂不然兵固多術矣有以力相傾者有以智相傾者有以德相傾者秦漢以来惟知詐力一有為德則是非為之紛然而不知所謂以德相傾者是亦出竒而己矣何名為失莭㢤然晋陽秋以為羊陸推僑札之好兹太􅂈矣兵家詭道何僑札之有就如所云乃不􅁕貴何則非吴鄭之使而敦僑札之分䖏方面之仕而私境外之交此非所以称羊陸之美也三國雜事篇下操征栁城偹勧劉表襲許表不䏻用其計挟天子令諸矦其事始于齊御名晋文而齊御名晋文未嘗遷惠王㐮王扵齊晋也除难定乱㒷㓕継絶功効既著諸矦自服耳董卓以献帝居長安李茂正以昭宗幸鳯翔􅀤號制令動以制詔為名然而天下諸矦群起而攻之何也無尺寸之功以取信于天下而有刼主之名以負謗于諸矦則天下諸矦群起而攻之亦固其理也使表䏻勤王如御名文􅁘雖不襲許何害其為令諸矦㢤如其不然雖襲許適足以致諸矦之師而已卓與茂正是也眉山唐先生文集卷十二眉山唐先生文集卷十二目唐庚三國雜事曹公征下邳擒関羽以帰礼之甚厚黃初二年八月魏遣太常邢正持莭䇿权為吴王加以九錫权受之魏明帝問黄􅁠曰三國􅂦立何者為正先主攻劉璋所至輙克置酒大㑹于涪黄􅀄四年魏華歆王昭䓁各有書與諸􅁑亮陳天命人事欲使㪯國称藩亮不報興平二年􅀽術僣號于九江漢不䏻制諸􅁑孔明説先主以跨有荆益保其巖阻權欲令太子登讀漢書習知近代之事晋漢春秋曰孫皓聞羊陸交和以詰于抗三國雜事篇下操征栁城備勧劉表襲許表不能用其計
