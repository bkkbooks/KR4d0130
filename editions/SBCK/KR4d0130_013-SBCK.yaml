  text: 眉山唐先生文集􅃃十三
  hash: sha256:529749994dfca1704da3add44db682c33d085fd63cfcea088de3b7fece3de05e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_013-1a}
body:
  text: 眉山唐庚子西三國雜事篇下亮岀祁山南安天水安定三郡響􅀿㑹馬謖敗三郡不守亮㧞西縣千餘家還漢中漢全盛時日月所照横目之民皆漢赤子其後徳薄不能保有􅀺庻則㪯江以東而投之吴割渭以北而捐之魏則民不棄漢而漢棄其民亮出祁山三郡望風響􅀿而亮不能守則亮􅀒于民而民不􅀒亮方是之時固當集其所􅀗之衆痛自引咎而謝遣之使崤隴之民曉然皆知吾心則後日之舉不患其不至如其不然在彼猶在此也而亮㧞西縣千餘家􅁶之漢中既不􅁕以傷敵而使無􅇳之民流離遷徙違其宗族去其坟墓豈三郡所以響􅀿之意㢤此雖邉鄙之常然于孔明則有不􅀿爾者此吾所以為之惜也孫亮太平二年宗室孫基盗乗御馬付獄侍中刁􅀇奏曰基法􅀿死然魯王早終惟陛下哀原之亮曰法者天下所共柰何以情相逭􅁘當思所以釋此者􅀇曰赦有小大或天下或千里或五百里隨意所及乃赦宫中基得以免吴之君臣可謂上下皆失其分矣漢世諸矦王有罪當誅丞相御史典客宗正廷尉奏請論如法制曰朕不忍致法其與列矦二千石議之於是丞相御史䓁又奏臣䓁謹與列侯二千石議皆曰冝論如法制曰朕不忍致法其廢勿王或削地若于夫請論如法者有司以法守不忍致法者人主以道揆今亮人主而論法􅀇有司也而論情故曰吴之君臣可謂上下皆失其分矣魯粛勧權以荆州借偹周瑜言備梟雄不冝以土地資業之漢時荆南之地為郡者七劉表之殁南陽入于中原而荆州獨有南郡江夏武􅁜長沙桂陽零􅁜偹之南奔劉􅄾以江夏􅀙之其後四郡相継帰附于是備有長沙武􅁜桂陽零􅁜之地曺仁既退関羽周瑜錯䖏南郡而偹領荆州牧居公安則六郡之地備已悉㩀之矣其所以云借者猶韓信之言假也雖欲不與得乎魯粛之議正合良平躡􅁕之㡬而周瑜獨以為不然屡勝之家果不可與料敵㦲建安二十年先主居公安使関羽争荆州㑹曹公征漢中先主恐失益州引軍還蜀曹公征漢中先主聞之與吴連和分荆州是矣引軍還蜀非也是時蜀有南郡之地而先主以蜀兵五萬居公安若進㩀㐮陽而羽帥五萬之衆以襲許卷甲疾趋五日而可至事成則天下未可量不成則漢中之師不攻而自退此兵法所謂攻其所必救者􅀄曺公征栁城偹勧表以襲許及偹㩀荆州亦不能辦此信乎天命之有所在㢤孫權稱尊議者以爲交之無益而名体弗順冝遂絶之孔眀以爲未可或曰孔眀之不絶吴権􅁘正􅁘曰正也非権也六國之時諸侯皆僣矣孟子以爲有王者作不皆比而誅之必教之不従而後誅之然則未教之罪王者有所不誅孔明之􅀔既未能有以敎􅉴則吴之僣擬未可以􅃍責此王者之法也非権也􅉴欲以兵萬人討樊伷権問潘濬濬言五千兵􅁕以擒伷因論伷可破状􅁠竒其言遣􅀅五千討平之權克荆州􅀅吏悉降而濬獨堅卧不屈权輿致之濬伏床而泣悲不自勝其于所事何其厚也旣而樊伷欲以武􅁜自㧞帰蜀濬為権畫䇿卒自􅀅討平之其于所厚又何薄也意者在君為君有不淂不然者乎吾聞楽毅去燕適趙趙欲與之伐燕毅泣曰昔之事燕猶今之事趙也毅若􅀗戾放在他國終身不敢謀趙之徒􅊢况其國乎使楽毅愚人也則可楽毅少知事君則濬不得為無罪矣晋侍中荀朂中書令和嶠使著作郎陳夀定故蜀丞相諸􅁑亮故事為二十四篇號諸􅁑氏集上之魏文帝即位求孔融之文以為不减班楊晋武帝踐祚詔定諸􅁑亮故事而比之周誥融既魏武之􅄷恨而亮亦晋宣之仇敵二人之言冝非當時之所欲聞而並見􅀵録惟恐其墜失蕩然無忌猶有先王大公至正之道存焉此吾所以特有取乎魏晋也魏明帝即位撫軍大􅀅軍司馬懿鎮軍大将軍陳群征東大􅀅軍曺休中軍大􅀅軍曺真並爲開府漢􅀄置丞相御史府後置三公府􅀅帥出征置幕府軍罷即廢不常置也今魏既置三公而懿䓁並爲大􅀅軍開府京師此何理􅁘公室之卑盖自此始矣蜀􅀅李平聞懿䓁開府辟召以說孔眀孔明鄙之是時中原人物推陳長文爲第一今長文亦爲此餘無足道矣建安十八年漢帝詔并十四州復為九州三御名調魯作三軍合周礼矣其志乃欲卑公室而奪之􅁠曺􅋵諷復九州合禹貢矣其志乃欲廣冀州而益其地夫引經術稱古􅁩者固未必皆奸人而奸人之欲濟其邪謀者亦未嘗不引􅀴術而称古􅁩既不可以盡信亦不可以皆疑要在乎察之而已龎綂􅀃先主取益州先主曰今吾與為水火者曺操也操以急吾以寛操以􅁀吾以仁操以譎吾以忠每事相反乃可成爾以小故而失信義于天下吾不為也寛勝急仁勝暴忠勝譎然操强而備弱冝勝而反不如者何也操稊稗者也備五榖之不熟者也五榖不熟固不如稊稗非謂寛仁忠信不䏻勝詭􅁀急詐也備不䏻勝操耳故曰苟非其人道不虚行青龍三年張掖出石圓廣一丈六尺髙一丈七尺一寸圍五丈八尺蒼質而白理有若麟者若鳯者有若虎者有若牛者若人馬者有若八卦列宿孛彗者其字可讀而不可曉時人以為魏晋之符河圖洛書之説歐陽永叔攻之甚力今覌此圖與河圖洛書亦何以異惜乎時無伏羲神農故莫䏻通其義而陋者以為魏晋之符彼魏晋何􅁕道安知其非八卦九疇之􅁼也造化之所為猶有幸不幸焉而况於人乎可勝嘆㢤可勝嘆㢤􅂫則為金城守聞魏氏代漢􅀤服悲哭孫盛評曰士不非其所是不是其所非旣己䇿名新朝復懐貳志豈大雅君子岀䖏之分㢤魏氏受禅漢帝尚存縞素㪯哀誠為輊脱然盛謂貳志兹又􅂈矣箕子􅂈故啇墟感宮室毁壊傷之欲哭以方朝而不敢季札哭王僚而事闔閭晏子哭荘公而事景公哀死事生以待天命此人臣之分也何淂謂之非其所亊而事其所非乎孫盛梟音使人聞而􅁖之諸􅁑亮聞張温敗未知其故思之数日曰吾淂之矣是人清濁善􅁖太分明也善􅁖太明誠取敗之道然人之祸敗有以其道得之者有不以其道得之者若張温之敗可謂不以其道矣尚安可以推求其故㢤魏文帝賜群臣没入生口唯歆出而嫁之帝嘆息孫盛評曰子路私饋仲尼則爲之毁其食噐田氏盗施春秋亦著以爲􅏺孥戮之家國刑所粛縦使在哀矜於理亦不冝偏宥歆既以己居股肱之任則亦當公言之於朝冝也而乃黙受嘉賜獨為君子可謂匹夫之仁蹈道則未也孫盛以刻薄之資承斈于草窃乱賊之世性習皆􅁖故其論議􅀋皆如此夫見牛未見羊孟子所謂仁術也何名為偏宥哉使盛為廷尉于魏文之時則歆當以私饋盗施誅矣東晋之不用盛不爲過也眉山唐先生文集􅃃十三眉山唐先生文集卷十三目唐庚子西三國雜事篇下亮出祁山南安天水安定三郡皆嚮􅀿孫亮太平二年宗室孫基盗乗御馬付獄魯粛勧􅁠以荆州借偹周瑜言偹梟雄不冝以土地資業之建安二十年先主居公安使関羽争荆州㑹操征漢中先主􅂲失益州引軍還蜀孫権称尊議者以為交之无益而名体弗順冝遂絶之孔明以為未可吴欲以兵萬人討樊伷权問潘濬濬言五千兵足以擒伷因論伷可破状􅁠竒其言遣􅀅五千討平之晋侍中荀朂中書令和嶠使著作􅀰陳夀定故蜀丞相諸􅁑亮故事為二十有四篇號諸􅁑氏集上之魏明帝即位撫軍大􅀅軍司馬懿鎮軍大􅀅軍陳群征東大􅀅軍曺休中軍大􅀅軍曺真並為開府建安十八年漢帝詔并十四州􅂧為九州龎綂􅀃先主取益州先主曰今與吾水火者操也操以急暴吾每事與相反若失信于天下吾不為也青龍三年張掖岀石人以為魏晋之符蘓則為金城守聞魏氏代漢􅀤服悲哭諸􅁑亮聞張温敗未知其故思之数日曰吾得之矣是人清濁善􅁖太分明也魏文帝賜群臣没入生口惟歆出而嫁之帝嘆息
