body:
  text: 眉山唐庚子西䇿題爲已問爲已之甚而至于絶物者此楊朱之制行也孟子以爲不義兼爱之甚而至于丧我者此墨翟之制行也孟子以爲不仁外不至于絶物内不至于丧我䖏乎二者之間􅃀然守之而不移者此子莫之制行也孟子以爲害道夫士之擇術盖亦可謂难矣兼爱者謂之不仁爲已者謂之不義處乎二者之間自以爲淂之矣而又謂之害道然則如之何而可乎必外此三者而後可以爲道乎抑所以謂之道者亦不離于此乎道德仁義問楊子曰老子之言道德吾有取焉耳及搥提仁義絶㓕礼楽吾無取焉耳夫道德仁義一也道在天則為隂陽在地則為剛柔在人則為仁義仁則三德所謂柔克義則三德所謂剛克仁義相濟則三德所謂正直者也故善言道德者未尝不通于仁義善言仁義者未尝不本于道德知道德而不知仁義是果足以為知道德者乎取其言道徳而不取其賤仁義此有司所以不䏻無疑而貭之于諸君也史官問動則左史書之言則右史書之三代而上王者莫不知此然六官之属三百有六十獨不聞有所謂左右史者以為闕而不置􅁘則古之諸矦莫不有史晋之乗楚之檮杌是也而况於王者乎以為置而不録􅁘則羅春鳥除鳥鳶去鼉黾除水虫之􅀋至纎至悉無所不載而况于書言動者乎意者左右之職非六卿之属􅁘抑周之建官不䏻盡見于六篇之書乎諸君其試陳之焉兵制問兵法有言有制之兵無䏻之􅀅不可敗也無制之兵有􅀎之􅀅不可勝也李廣之為􅀅也居則無部曲出則無行伍幕府無簿書之煩屯合無刁斗之衛務為簡易士卒楽之程不識之為􅀅也居則正部曲出則正行伍晝治簿書夜擊刁斗近乎煩􅅰士卒苦之夫以兵法􅀚之不識之􅀅近乎有制之兵而李廣之事盖不可以為法于後世者也前史是廣而非不識何㦲二者皆古之良􅀅也諸公􅀅安䖏乎六韜問兵家之有六韜猶儒之有六􅀴也其取名必有義其序事必有法自文師以下治内謂之文自􅀤啟以下治外謂之武此斈者之所共知而無􅂧有可疑者焉自王翼至于農器而謂之龍自軍畧至于壘虚而謂之虎自林􅀾至于公險而謂之豹自分合至于武􅀐士而謂之犬其取名之義其序事之法亦可淂而聞乎道体問指不􅁕以喻指也非指者䏻喻之有不足以治有也無有者䏻治之父子之仁君臣之義夫婦之别長㓜之序朋友之信是皆未離乎流者也􅁠量以為平城池以為固車服以為􅂆斧􅃏以為威符莭以為信是皆未離乎形者也既渉于有則不免于累而自古天下未甞敢􅆸者何㢤盖穴土而淂空鑿牗而得無則所謂有者乃無之所資故也夫無相者既不䏻以自行有物者不免于有累然則􅀅安䖏乎以有為体以無為用雖涉于有而免其累焉此必有道矣治道問以道治天下者其事畧以事治天下者其事詳是故曆以歩其数象以占其象以道在日星者如此而已事則有璣衡以齊之平使當其分秩使當其序以道在四時者如此而已事則有廵守以考之或析或因或夷或隩以道在民者如此而已事則有典刑以示之孳尾希革毛毨氄毛以道在物者如此而已事則有官職以掌之覌尭舜之書則所謂道與事盖可見矣以道治天下則無為者也以事治天下則有為者也尭典以道治天下而舜謂之無為者何㢤無為者天也有為者人也舜既以無為為治而堯獨謂之法天者何㢤治法明天問為治之序始于明天次以道德次以仁義五変而刑名可舉九変而賞罰可言古之圣人未有不循于此者也諸子言治道多矣大抵皆失其序其所當務者不􅂈于分守刑名因任之術原省是非賞罰之事方是時䏻以仁義道德為意者盖寡矣而况䏻明天乎天不䏻明則道德裂㓕道德不明則仁義消壊道德仁義既以㓕裂消壊則其所謂分守刑名因任之術原省是非賞罰之事可以為天下用而不􅁕以用天下矣此漢唐之治所以終不及于古欤然則明天者治法之本也此學者之所冝知也同俗問廣谷大川異制人生其間異俗􅀅因其俗而治之􅁘則人自爲礼無所統一家自爲法無所視傚殆非先王所以教民之意也抑􅀅易其俗而同之􅁘或抑其所䏻而强其所不䏻奪其所欲而與其所不欲殆非先王所以覌民之意也古人有言一道德同風俗又曰齊其政不易其冝修其敎不易其俗二說乃相反且如此其可以相爲用乎征歛問周之􅀄王業始基四方諸矦未盡賓貢九州之賦未盡輸入征討􅀾伐之亊未尽休息倉廪府庫未至于有餘方是之時冝乎多取然而関市未有征也澤梁未有禁也園囿之利猶與民共之山薮林麓􅀙可知也天下旣平物衆地大四方諸侯皆已賓貢九州之賦皆已輸入征討􅀾伐之亊皆已休息倉廪府庫之積不患乎不􅁕當是之時冝乎寡取然関市始有征矣澤梁始有禁矣山薮林麓猶設官以守之園囿􅀙可知也豈先後之􅀔有不淂不然者欤抑先王之立法􅀄不為有餘不􅁕計歟諸君其深考而偹陳之耕讀問先王之時其所謂师儒者乃六卿之吏而其所謂士者乃六卿之民故為士者未尝不耕而為農者未甞不斈周官以九職任萬民而士不與焉盖以士寓其間故也周道衰􅃹仲始以新意変三代之法定四民之居而士農之判盖自此始而孔子孟子之教以耕稼為小人之事非士君子之所當為而􅀙斈之徒一言及此則深詆而力排之者何也舜不耕于歴山禹稷不躬稼而有天下伊尹不耕於有莘之野乎何害其為聖且賢而孔子孟子之論如此必自有㫖也有司願與聞之學易問孟子習孔子者也楊子習孟子者也傳称孔子晚而喜易序􅂏繋象説卦文言讀之􅅊編三絶曰加我数年五十以斈易可以無大􅂈矣其篤志如此孟子之書大抵皆淂于􅀴其傳称詩書礼楽盖無所不有而獨未尝言易豈孔子好易而孟子独不好欤楊子之斈雖無所不通而考其所淂尤在于易其言天下休咎既已詳于易之道而推本隂陽律曆又明于易之数豈楊子知易而孟子獨不知欤豈聖賢之嗜好果有不同者欤抑所謂知者果不在于言與不言之間欤老荘問傳稱荘子之學無所不闚而其要本于老子著書十餘萬言大抵以明老子之術而荘之自言則又異于此以為道術既裂各得其一而不䏻以相通如耳目鼻口各有所明如百家技巧各有所用有老􅅨聞而説之者有荘周聞而説之者審如所言則荘子之斈其原不出于老子明矣而傳之所言如此者何㢤老荘之斈諸君深淂之矣其試辨之程材問昔者七十子之徒従夫子于洙泗之間其志未嘗不欲附􅂹尾而名益彰夫子之心亦未甞不欲成其名于後世而卒􅀎以其所長淂與于四科之列者十人而已此夫子所以愍其成材之难而有不及門之嘆也然以曽子之賢而不與德行赤也束帶立朝可使與賓客言而不與于言語子賤之治至於民不忍欺而不與于政事子張有聖人之一体與㳺夏䓁矣而不與于文學夫成材之难夫子常嘆之矣幸而有焉又棄而不録圣人果何心㢤其去取冝自有理也言信問天以五生物地以五成之故萬物盈於天地之間而其要必帰于五在天為五行在人為五事在物則為五味五声五色而吾性之所有者則為五常此天地萬物自然之数匹夫之所共知而圣人不䏻有所加損也今言仁義礼智而信不與焉是犹五行之無土五事之無思至于五味五声五色皆闕其一謂尽物之理可乎而孟子之説如此斈者所冝深考其意也人物問由漢以来著書立言純合于􅀴而不雑以諸子百家之説者楊子一人而已至論人物則猶有可疑者焉夫荘子者古之所謂隐居放言者也而以申韓配之荘子豈申韓之流也㢤顔子之于聖人一間耳而以黔娄四皓配之猶若有理焉至以􅅊成配之不亦甚乎伯夷聖之清栁下恵聖之和而以仲元配之仲元雖賢然亦豈至是㢤楊子必不妄也有司求之未至爾諸君其以告之四庫提要云唐庚與蘇軾皆眉州人又先後謫居恵州宜扵鄉先輩多所􅁛述而集中聞東坡眨恵州詩深著微詞今讀其詩似有所諷至謂集內除前詩及送王􅀚復序内稱􅀙蘇子扵湘南一句外餘無一字及軾則不然今攷集内雜文書朱尚書集後及茅三卷近體詩乙未正月云云七律一首均曾及坡語提要盖未􅀷攷之也壬中秋九月校诵一過并題禮􅇣眉山唐先生文集三十卷終眉山唐先生文集卷三十目唐庚子西䇿題爲已道徳仁義史官兵制六韜道体治道治法明天同俗征歛耕讀斈易老荘程材言信人物
