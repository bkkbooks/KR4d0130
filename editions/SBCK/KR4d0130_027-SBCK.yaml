front:
  text: 眉山唐先生文集卷二十七
  hash: sha256:c373db52925afd6f7be8af793b5eb7a24660eba0ca8eed11cbf490b5d13a474f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_027-1a}
body:
  text: 眉山唐庚子西啟謝陳使君啟剖封七邑􅀊薦二人首及庸虚良深感愧伏念厶偹貟百里至是再期因其俗之所安豈􅀎易俗齊以刑而未粛矧敢去刑惟其守拙以無他所以見称于不􅅰本来事簡非聼断之無留適值􅀊豊致賦輸之僅集以何功效致此品題此盖伏遇某官以郷先生為郡刺史土地民政淂諸侯之宝三敬義思恭有君子之道四憫怜椎魯􅁠録覊単所學背時雖不侔于枘鑿此身末世或有望于桑榆論報殊私當期後日荅觧元謝啟􅂐刻舊人望􅀴郛而未見眩昬老眼豈文鍳之䏻精偶為國以淂賢則因人而成事尚期勉勵前膺縻爵之荣益使衰遲坐􅀗知人之譽百函拜賜十襲藏珍謝及第啟射䇿楓宸已甘退黜苐名桂籍尚􅀗采􅀵叨􅀍寵荣惟知感慨切以文章君子之餘事忠義天下之大閑國之休戚不係于文章士之進退莫先于忠義方天子臨軒而䇿士豈徒求摛􅍾之革而諸儒充賦以在庭盖亦取切時之論欲考終身之莭必覌筮仕之􅀄冝有讜言少禆睿聼如者少不好斈老方讀書左右圖史者十年渉獵􅀴傳者萬卷壮心浸癖竇性成痴雖古今成敗之原粗知其畧而􅂐刻雕虫之學本非所長妄意揀金謾来市璞青天萬里堪嗟蜀道之难白雪一声难和郢中之曲笙竽異好水石难投自知與世不諧㡬欲拂衣而去因縁附􅂹僥倖化􅉇入瞻天日之光親奉絲綸之詔周詢要務兾􅀗至言頋為學之荒踈愧乎無􅀘若與時而高下誠所不為姑盡莭以惓惓寕抱関而碌碌夫何献白亦預拾青兹盖伏遇某官匠石群材鈞鎔衆窳與人不求偹嘉善矜不􅀎苟有寸長未加尺退謂其辞雖鄙訥論不􅀅迎棄在邉庭必䏻褁尸于馬革置之言論必碎首于龍墀薄示甄􅀵或堪器使敢不氷霜志􅍾金石肝腸獄訟簿書豈辞劳于今日功名事業􅀅有望于他年庶免小人之帰永為國士之報荅通判趙承議啟代伏審􅃂膺睿渥荣佐郡符伏惟􅂟慰恭惟某官宦路老成士流先逹才䏻通敏學術􅀷醇評三尺之祥刑已資口案賛六條之善治豈動心机曽称􅂟之未遑􅃍貽音之見及何承謙挹惟有銘藏雜文送苗師顔序崇寕元年冬㒷元軍士有怨其守費詵者走益昌上変告詵叛益昌守淂之惶惑夜半遣吏馳出城趋㒷元捕反虜即日以事聞傳檄郡國拘其親属後旬日詵面縛至并就逮者数十人悉首幪係獄窮治反状自冬迄夏累月無所淂首䑕不决朝廷疑之遷其獄於鳯翔而天㒷宰苗君師顔实領其事時二年六月也詵旣檻就道所至􅀤卒鳴鼓圍繞䕶送人皆意詵不䏻自白而詵亦自度必死暨至岐下一問而淂寔八日而獄具詵無毫髪罪即日破械出之告者用赦􅇡海外詵之出也感慨悲泣覌者頋指欢呼道路喧傳一日萬口而師顔之名遂滿天下吾尝論詵之不死其所繫豈小哉向使一夫流言二千石族誅以死則士大夫必􅀅姑息吏卆誰敢控制而使令厮役皆淂以脅制其主非朝廷之明白師顔之俊偉則縉紳之祸豈獨詵而已哉漢時治獄必取通􅀴術知古􅁩者不可謂無意也後二年予官鳯翔師顔為治中淂従之㳺每服其為人而㒷元之事昔常欲作傳而未果于其帰也因以為之序上錢憲雑文序憲使錢公按益昌命厶献其所為文意􅀅有以敎之也承命欣躍退求平生所業而多难淪失存者無㡬其間復有俳諧者放蕩者觸時忌者不近道者妄論天下利害非所當言者文多不足録者為故􅁓糊􅆤首尾訛缺莫可考者率皆削去淂古賦一首漢漂母碑一首竹軒記一首古楽府二首近体詩一十九首并序為二十五首以献噫士之自鬻非古也惟厶不䏻自鬻以取困于時然亦以此淂出于門下而公亦信其決非自鬻者庶㡬可以受教而無嫌焉謹序李生方書序周官硩簇氏掌覆夭鳥之巢庭氏掌射國中之夭鳥吾少時讀書至此未尝不窈咲以為不急之務也後讀聖惠方言有鳥夜飛謂之無辜小児衣服遭之輙以感疾因以無辜名之状如五疳吾以是知夭鳥之害有如此者非獨如鄭氏所謂鶚鵩之􅀋而昔人所以力去者亦自有旨非獨如鄭氏所謂國中㓗清而已夫硩簇氏庭氏之所去者雖不專指無辜而無辜之出于斯時者亦無所容其跡雖未必䏻盡誅要當駈而出之于九州四海之外而不淂以為害斯周公所建置果不可謂不切于事也周道衰二官之職廢物之神奸遂淂以滋息􅉼飬于天地之内数千百年愈乆而愈不可去故夭鳥之巢徃徃有之而世終莫之識雖識亦莫如之何當此之時李生以善医無辜專門名家于秦隴間其功利豈少㦲生出論数十篇示余而求文以為序吾聞扁鵲入秦為小見医生豈淂其書乎何其術之妙也年月日序送王􅀚復序紹聖丙子􅀊予官益昌始従吾友王硯􅂧逰方是時其文已如擊石拊石誠非世俗之楽獨音莭未和尔其後四年相㑹于南隆􅂧淂其文讀之遂斍雍容調暢取意論事益有條緒庶㡬乎八音克諧無相奪倫者予方􅋍然異之求其説而未淂或者便謂涪翁在􅀚􅂧以書相切磨涪翁之相與反覆論書栁子厚效渊明古体詩十数觧示之文章低昻踈宻之莭疑其有淂于此是未必然􅀚􅂧比来日益就道盖更事愈多見善愈明少年鋭氣掃滅殆盡􅀵歛反約漸有帰宿冝其見于文字者如此吾何以知其然也人之精神何與于琴而幾動于心則声􅀿乎指自然􅄀合有不可詰者而况于文乎文生于氣氣熟而文和此理之决然無足怪者盖涪翁所告者法也余所論者理也告之以法而􅀚􅂧又日進于理今其帰也自言従蘓子于湘南􅂈涪翁于冝城又􅀅盡淂其所謂法者則􅀚􅂧之于文豈特如是而已􅁘􅀚復其勉之㢤鄭黙字序鄭子以其名黙求字于余余為之説曰韓非作􅀃难竟以􅀃死箕子􅂈啇欲哭而不敢梁子作五噫之歌明帝聞而非之近􅀊蔡常山以笑貶海上甚矣䖏世之难也言笑歌哭皆有所禁則子之欲黙也冝㢤雖然孟子不與右師言右師不説由是言之黙遂可以免乎字之曰時言上任德翁序時年十五薛郡任公之教授通義也士之曵長􅅂服方領抱書束带􅄖㳺于泮宫者􅂾百人英俊豪傑徃徃軰出有少年書生曰唐厶者誦書不甚多属文不甚工碌碌落落無可稱者一日持一軸書掉三寸舌草衣麻屨攘􅃑登門危言髙論不頋忌諱公一見而嗟異之再見而礼貌之三見而怜惜之劝戒勤篤教諭欵宻厶䖏之而不䏻自安退而諮之于客曰公于我厚矣吾􅀅圖報矣吾欲脅肩謟笑巧言令色以順適其意以是報公可乎客曰不可是小人之報也吾􅀅抱長劔挟匕首有􅁖聲至者以血濺其􅁭以是報公可乎客曰不可是侠客之報也吾􅀅淬文鋒礪辞鍔庻幾超騰奮躍髙飛逺舉于天下指之曰斯人也出于任公之門以是報之可乎客曰唯唯是國士之報也厶因書以為序招隐辞出左緜城南度涪水至南山下並江而東行三四里有居氏数十家以捕魚為生世不易業不知其幾千百年古木参天自江北望之欝然幽深圖􅀴號漁父村盖昔時涪翁􅀮居䖏也吾汎舟至其下未甞不悠然遐想慷慨嘆息徘􅆦不忍去世言前代隐士大率多虚名少寔効此誠有之然不可一槩以此量天下士盖昔人論􅀮士者必首称涪翁河上丈人二人之道寔並駕而齊駈者也河上丈人教安期生安期生教毛翕翁毛翕翁教楽瑕翁楽瑕翁教楽臣公楽臣公教盖公盖公教平陽侯曺􅂙為漢相國而髙惠之間天下無事民務稼穑衣食滋殖盖自河上丈人至曺􅂙更六七傳授受失真去祖風益逺而措之天下已竒􅊆卓絶如此使齊驅並駕者得行其意獨不能䖏其君尭舜乎河上丈人之裔尝一􅂋于時而涪翁之後獨無其人然江鄊澤國安知其果無有也試為長言以招之其辞曰子誰友兮涪之雲出為雨􅀆澤斯人子誰親􅀆涪之水朝於海􅀆日千里趣子之駕􅀆捨子之舟子不我信􅀆與雲水謀眉山唐先生文集卷二十七眉山唐先生文集卷二十七目唐庚子西啓謝陳使君啟荅觧元謝啟謝及第啟荅通判趙承議啓雑文送苗師顔序上錢憲雑文序李生方書序送正覌復序鄭黙字序上任德翁序招􅀮辞
