front:
  text: 眉山唐先生文集卷二十八
  hash: sha256:b84771028c8b4437b24ddbdd2c808176d3c2193b4c7b4553afe1f9b0349aef17
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_028-1a}
body:
  text: 眉山唐庚子西雑文書朱尚書集後仁廟􅀄號人物全盛時而尚書與其兄鄭公以文章擅天下其後鄭公作宰相以事業􅂋于時而尚書獨不至大用徘􅆦掖垣十数年間故其文特多特竒兄弟于字學至深故其文多竒字誦者徃徃不識其􅀅殁也又命其子慎无刋􅁼文集故甚秘而不傳于世元符二年其子衮臣為利路轉運判官予典獄益昌始淂尚書所為文讀之粲然東坡所謂字字照縑素詎不信哉文集二百卷予淂九十有九卷其餘在曽子開家衮臣謂予他日當取之并以授子云讀巢元修傳唐末有鄭遨者與李振厚善振仕梁至崇政使遨未甞一至其門後唐同光􅀄振竄嶺外遨徒歩萬里徃見之其後一百八十年而宋有巢元修事士之难得盖如此吾聞子由立朝謇謇有大体然靳惜名噐太甚良以是失士心比其敗也士大夫詆之又􅂈矣覌其書巢元修事可勝嘆㢤可勝嘆哉諭幽燕檄我國家運啟漢符疆包禹迹際天所覆無不統臨盡海以還悉皆臣妾措凾生于壽域躋寰宇于聖涯惟燕督亢之圖淂古幽州之域鼓刀屠肆俱懐義烈之風撃筑行歌咸有英雄之氣向因悖晋割㗖孽胡邀功一時貽祸萬世名宗令姓遂為異域文人竒士秀民永棄無知之俗蔑聞五教何啻百年風俗浸移已作李陵之胡服謳謡未改豈忘荘舄之越吟朝廷哀爾無辜淪于不化夷刑虜罰虐我遺黎犬􅁾羊羶薫吾故地爰整弔民之旅不逺徯后之情􅂧千里之関河拯一方之􅂗炭今則遼東欵塞賊歯益寒灵武獗牙虜臂皆断􅀌危之􅀔顛覆可知倘䏻用夏変夷捨逆取順其如信賞當倍常科録可用之新甿捐無名之􅁀歛庻令䧟溺􅂧覩太平誡諭諸路提舉常平司卹民夫理財所以飬民養民所以阜財知理財而不知卹民則民且散矣安淂財而理諸財用不足而加賦􅅰民其害有甚于是者則財亦不可以不理此常平之法所以必不可廢雖廢而必􅂧也雖然徒法不䏻以自行故國家部置使者任之以權授之以成書使專董其事予欲使民仰事俯育足以自給汝為予欲使民凶年飢􅀊無流離失業汝卹予欲使民疾苦呻吟有以自逹汝􅃪予欲使吏奉法惟謹無意外鑿空以侵漁小民汝察庻民艱食赤子開口仰哺嗷嗷吏或恬視不􅀤圭撮民所不欲吏或牽課抑强以利􅀊入之贏數期㑹未至吏或文移四出繋累􅃻撲以要治辦之功汝其紏戒必罰無赦嗚呼有􅁦吏無􅁦法立法之意至寛至厚條目至纎至悉至明至白汝確行之無俾民受其害而歸咎於法毋俾異意之人得以藉口譊譊無謂朝廷不汝聞知徃盡乃職朕言惟服其聼無怠思庵記䟦尾有思是作病無思是㓕病有思而無作惟無邪者近之無思而非㓕惟不出其位者近之君侯㡬於道哉思無邪而不岀乎其位雜著自說詩最難事也吾於他文不至蹇澁惟作詩甚苦悲吟累日然後成篇􅀄讀時未見可羞䖏姑置之明日取讀瑕疵百出輙􅂧悲吟累日返􅂧改正比之前時稍稍有加焉􅂧数日取出讀之病􅂧出凢如此数四方敢示人然終不䏻竒李賀母責賀曰是児必欲嘔出心乃已非􅂈論也今之君子動輙千百言畧不􅀴意真可貴㢤名小子說世疑老子西逰以謂有慈有儉有不為天下先持是道以逰于世何所不容而猶有所去就􅁘是大不然惟其無注而不容則雖蛮貊之􅀖行矣此其所以為老氏故名小子曰聃字以景老客至􅀃貧家無酒食待客惟有茶湯尔山郡無佳茗而湯材亦不尝有頋惟有水自入夏江水渾而井泥不可飲客至相对清談然比来公亊冗冗清談亦不暇客之不至也冝哉失茶具説吾家失茶具戒婦慎勿求婦曰何也吾應之曰彼竊者必其所好也心之所好則思淂之惧吾靳之不與也而窃之則斯人也淂其所好矣淂其所好則宝之惧其􅂥而祕之惧其坏而安置之則是物也淂其所託矣人得其所好物淂其所託􅂧何言㢤婦笑曰嘻是烏淂不貧異箴道丧俗􅁦非惟今日援而救之頋自有術汝既無術欲救不􅀎掲揭自異徒以取憎魯人獵䡋未害于理方春郷社未害于正礼有從俗易貴隨時汝独自異背俗而馳凢汝所為世俗尤嗤充汝之􅍾蚓而後可士不必異亦不必同異褊同汚均失乎中勿異勿同惟義之適勿以汝身與世為的直箴直乃一莭未為全徳全德之人䏻曲䏻直不師全徳而蹈一莭十圍之腹不䏻納一吸之氣􅈳尺之顱不􅀎壓三寸之舌毫端􅁄末在汝胸臆汝不䏻納冲口逆突出輙逆人遂失顔色顔色不懌内藏怨􅂩談笑之間􅃍成􅄷敵汝怨汝疾終身不汝釋汝不早自責何以安汝迹􅁘雑説桓帝永壽二年天下民口五千餘萬自李固杜喬陳蕃李􅈾之徒相継誅死漢室于是大乱天下四分五裂血􅀾百餘年晋武平吴然後天下􅂧合為一是􅀊民口五百餘萬比之永壽殺四千五百餘萬矣嗟哉悲夫君子賢人之存亡用􅃕其所繋豈小哉皇太后服薬齋僧文伏以眉毫散玉臨照十方臂色舒金䕶持一切仰資願力上祝慈闈恭惟皇太后謙道施平坤徳載厚始佑思齊之聖恵于宗公逮􅂙訪落之謀率時昭考􅂈軫􅀖家之念稍違􅆍食之和有詔多方恭修勝利慿無量佛作大医王早臻勿薬之瘳益引後天之筭永均介福敷錫群生和南謹䟽謝雨文攸司失政無以召和正斍能仁勇于利物遂􅀗沛然之澤􅂧㒷槁矣之苗無淂之功莫知所報又攸司失政無以召和大道集虚竗于􅀿物遂􅀗沛然之澤􅂧㒷槁矣之苗不宰之功莫知所報祈晴文維神有以庇民則民有以事神􅀊方幸于有秋雨不止而弥旬􅀅磨鎌而刈穫􅂧閉户而嚬呻人自慙于屡禱神不倦于為仁民之所􅈼神惟有慿謝晴文劔利皆旱種不入土神私此􅀖独賜以雨雨旣􅂈多厥害惟均令􅂧還之遂禱于神拜手未起雨声􅃍止帰未及家霽色千里令有何德感于神明􅀅何以報之惟牲肥酒馨送湫文視之冷然可濫觴􅀆用之沛然澤一方􅀆􅎆瓶罐勺破驕陽􅀆稼穑以蘇民小康􅀆功成不返失其常􅀆作􅁔以送之以示不忘􅀆辞庙祝文敢昭告于某神某不用于時来長此民淂以理去寔賴于神神以為然餘無足道戒行有期敢不以告􅀕諸庙祝文析報著甲令此常典也今􅀊兹土無大旱涝蚕榖以登賦輸以時頋守土者治行不足以致此惟治朝叶氣所薫與夫上下神祇之庇庥而賜不可以虚受故潔蠲飲食以荅靈貺尚享眉山唐先生文集卷二十八眉山唐先生文集卷二十八目唐庚子西雑文書朱尚書集後讀巢元修傳諭幽燕檄誠諭諸路提㪯常平司卹民思庵記䟦尾雑著自説名小子􅀃客至􅀃失茶具􅀃異箴直箴雑􅀃皇太后服薬斋僧文謝雨文又祈晴文謝晴文送湫文辞庙祝文􅀕諸庙祝文
