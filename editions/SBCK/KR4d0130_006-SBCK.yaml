  text: 眉山唐先生文集卷六
  hash: sha256:d346f91ca247c46477dd4a0beb3c3f2f1bfc960d54c1355bdfe95b48e22dcd77
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_006-1a}
body:
  text: 眉山唐庚子西論名治論古者一代之㒷則有一代之治故曰夏后氏尚忠啇人尚貭周人尚文雖聖人之道不可以名言而施之政事必有称號可指非但王者如此而一國之治亦然故曰周公治鲁尚歯而親親太公治齊尚賢而尊尊自是以来謀謨之臣議論之士亦未有不明當世之治体而識其面目者故漢世每以雜伯自名而晋人亦云以道勝寛和為本今宋之為政乆矣其所尚者何也士之通􅀴術知古􅁩者不為不衆日夜講䆒治道以逰于世者亦不為不熟其所称引動以宗周為言而問以當代治体則茫然不知所以名之惟其無淂于此是以有慕于彼愚誠不自揆盖嘗妄論之矣􅋰不必同要之適􅁕治不必同要之適時故成周之治任人而國朝之治任法任人者非不用法也以人為本而輔之以法任法者非不用人也以法為本而行之以人自古法無全是亦無全非而人之忠侫智愚賢不肖至為遼絶故任法之世無甚利亦無甚害而任人之世非大治則大乱矣周時公卿不􅂈数族周召毛原執政至数百載不絶今之大臣更出迭入遠者十餘年極矣近者朞月而已雖無累世輔弼之利亦無妨賢專恣之害矣周之諸矦既錫以上宇則刑賞生殺之柄悉㪯以委之今郡縣之权不􅂈鞭朴尔􅂈此以徃則相頋而議法矣雖無藩屏形势之利亦無􅀾争侵奪之害矣周時任官必考論人物謂之量才度徳今不然矣以資歴為髙下以注籍為先後揭闕子道􅀿法者淂之雖無為官擇人之利亦無好􅁖狥私之害矣周時取士使之自相推擇謂之郷㪯里選今又異于此矣盖自國􅀄以来三易取士之法然要之不離文字晦名易書暗考而明取之雖無出長入治之利亦無毁譽比周之害矣其人畧如此故周之極熾至刑措不用四十餘年典章文物之盛信有以絶人而晚莭祸敗亦足以称此國朝受命百五六十年間海内晏然如一日者此任人任法之効也昔者李勣為􅀅無大勝亦無大敗薛萬徹非大勝即大敗而近世論􅀅未尝不以英衛為先然則今之忻淂多于成周亦眀矣而士方歉然不足争􅀃人主以成康之隆而不知國朝規摹䖏置所以成就天下之势者固己如此非独不知國朝亦􅂧不知成康矣何則人有情而法無心情之所在恩怨以之其無心者漠然而已今者欲成康乎則必脫畧文法而一切任人夫以天下之大利而索之于䋲􅇘之内是猶以李勣之莭制而求萬徹之竒勝終不可兾然與其蹈萬徹之險孰若李勣之持重􅁕任也㢤存舊論漢時儀注大抵率意制造不􅀿古􅁩者十至八九其文采法度畧矣然而天下之人見即喜不見即悲中更王氏之乱廢弃不用者十餘年光武入洛東都之民始見司􅀠僚属欢喜踊躍父老或至垂泣曰不圖今日􅂧見漢官威儀自是天下翕然帰之相與出力鋤去祸难以成中㒷之業而􅂧其宗庙社稷盖又二百餘年雖漢之所以􅂧㒷者不專在是然亦不可謂無助也且漢官威儀非若三代之盛叔孫所謂非有周公之斈術智識也雜以秦制非􅂧圣人之法也而遺民見之如盲者􅂧視廢者􅂧起如流浪積􅀊而返其故郷見其父子兄弟感慨之極至于咨嗟流涕其得民心如此此何理􅁘方是之時以三代車服示之吾知其民不􅂧泣矣何者漢之為漢十世於此矣民知有刘氏而已夫救天下于􅀾國秦項水火之中而措之于安全逸樂之地不􅂾十年海内無事斯民得以飬生得以送死得以事其父母而長育其子孫者漢之力也三代逺矣何有于我㢤由是覌之古者帝王之㒷其正朔服色自為一王法而不慕前朝異姓之陳迹其用意深矣由是覌之國家舊物冝使斯民常見而熟習之以馴其耳目而繋其心自非不淂已者不宜䡖有改易変置以自绝于民也亦灼然矣向使今日変其一明日変其二祖宗餘澤日益就盡不在目前不幸而奸人撼之則人心摇而天下去矣古者公卿大夫猶知守其家法至􅂾十世不易其衣冠閥閱豈無隆替而囯人信服终莫之敢抗謂之名家舊族而况􅂾百年為天下國家者㢤辨同論道至于聖人極矣豈客􅂧有異乎然禹之措置如此湯之措置則如此文武周公之措置則又如此使􅂾人者比肩而事主交臂而共政則論事之際吾意其必有同異者矣寕䏻盡合乎是猶有辞焉曰時不同也若諸子論性豈􅂧繋于時㦲而孟子之􅀃如此荀子楊子之􅀃則如此韓子之􅀃則又如此使数人者比肩而事主交臂而共政則論事之際吾知其必有同異者矣寕能盡合乎是亦有辞焉曰師友不同也若子夏子游曾子子張之徒則又􅀅安所諉㢤皆出于周末不得謂之異師請業請益周旋出䖏奔走憂患盖無適而不同者凢􅂾十年不淂謂之異友而論交論斈如黒白之相反方圓水火之不相入也此􅂧何㢤􅀃者以為孔子没斈者無所统一使夫子在斈者冝不至此然吾聞孔子行年六十而六十化始之所是卒而非之曰言豈一端而已夫當有所合也此一人尔而有所謂昔日之言者有所謂今日之言者而况于衆口乎是以先王知群言之不可一也因使人人淂極其􅀃而不以同異為誅賞公卿大夫之出于斯時者亦人人各荐其所聞而不以同異為喜愠何者閨門之内父子兄弟相與言而有可有不可筮人布䇲卜師引亀而参之一􅀙一不􅀙故曰物之不斉物之情也寕可罪㢤今為申啇之斈者則不然以謂同心同德者周人所以㒷離心離徳者商人所以亡刑賞生殺􅁕以整齊天下而不能塞異議之口則非所以一道徳而同風俗噫古之所謂同心同徳者果謂此􅁘吾不忍聞是􅀃矣周公之時朝廷之士為不少矣而東征之議書称十夫予翌則同者寡而不同者衆矣豈皆小人􅁘豈皆誅之􅁘夫以周公之权而十人者助之其势􅁕以誅鋤議臣之異己者為有餘矣鼻息所向天下其孰敢違然近于人情通于物理忠于王室而推至公于天下者终不肯為此何則駕馭群臣正恐其雷同耳奴婢同則家道危臣下同則人主􅀌人主􅀌而天下之祸可勝講㦲古之人所以貴和而賤同者慮正在此也祸福論昔之談祸福者固常帰之善􅁖矣然其効可睹也其始曰為善者必淂福為􅁖者必淂祸取报于天如探左契于是天下之人悚然而畏然為善者果得福乎為􅁖者果得祸乎是特未可知也言既不効則遷就其􅀃曰為善者非􅃍有福也要乆而後吉為􅁖者非􅃍有祸也要乆而後凶譬之果榖要待其熟于是天下之人憮然而疑今君子長者子孫苗裔不為少矣而果吉乎妬民害物專門為􅁖者古亦衆矣而果凶乎是亦未可知也既又不効則復遷就其􅀃曰為善者淂福常多不幸而抵祸者或寡矣為􅁖者大㮣淂禍幸而免者亦時時有之于是天下之人唖然而笑今所謂常得者果多乎所謂幸不幸者果少乎是亦未可知也自始至此三易其􅀃而言輙不効則民益觧体而矯激之論生焉曰為善者及淂祸為􅁖者及淂福自漢以来尝有是􅀃然蹈道者豈盡淂祸乎奸侫險賊不忠不孝者豈盡淂福乎其效亦可覩矣吾意以謂祸福出于天善􅁖出于人二者不相為謀如五星散行而有时乎相值人見其適相值也而遂引以為常此不可謂合于理矣今世或為善而祸或為善而福或為善而漠然無有祸福其為􅁖也亦如之不為善不為􅁖者亦如之要之不可測善乎楊子之言曰修其善者為善人修其􅁖者為􅁖人善􅁖之报惟是為有証易称積善餘慶詩言自求多福書言福善祸滛孟子言祸福自己求之彼非有失也有為而然也眉山唐先生文集卷六眉山唐先生文集􅃃六目唐庚子西論名治論存舊論辨同論祸福論
