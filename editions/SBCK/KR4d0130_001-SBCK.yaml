front:
  text: 眉山唐先生文集􅃃一
  hash: sha256:bf1ee810049772dc008aedeec856f02cece7440776a7843b54d1edd220ba95fc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_001-1a}
body:
  text: 眉山唐庚子西賦南征賦始攝提之孟冬余􅀒罪而南馳雪盈尺而更煩風三日而猶吹体凍極而若無心怖甚而忘悲凢再信而至許覺驚魂之稍帰訪景福之遺基指空郊之荒濼曽禾黍之無有矧栾梁之丹艧國已挹于三馬臣不聞于一鶚豈當世之無儒抑此病之难薬道昆陽而流嘆淡悲風與愁雲階一夫之僣窃紛萬􅀑之煩􅁈嗟世祖之論功忘王章之􅇮言既直鉤之不食終曲突之無恩􅂈叔子之舊􅀖登峴山而痛哭方関右之放賈盖眼中之㧞鏃独何心而表􅇔卒飬癰而潰肉倘遺灵之猶在當衆白而相沃盡荆門之犖确瞰蜀江之湯湯念故人之乆别斍良晤之甘香稍囬翔于澧浦忽凌乱于潇湘時廓舒而浩蕩􅂧􅀵歛而凄凉咏九􅁔之餘哀閔三閭之􅀌趋豈公子之足怨寔夆國而無與内不懌于女􅎐外見非于漁父持此道以奚帰亦各安于所䖏自是逺矣行人漸稀水愈激而愈清山益削一作刻而益竒造郴嶺之穷䖏云湟􅀜之故基客至此􅀆返頋雁至此兮北飛眷炎溪之毒滛吊文渊之矍鑠射参狼于隴阪覌跕鳶于浪泊􅁬身出于萬死謄口喧於百􅁖信老子之是哀斍少㳺之差楽经韶陽而􅂯宿冩石上之遺声悟聖神之在宥如天地之生成彼禽魚固自有理而日月未常不明雖吹萬之不同吾淂一而皆正捨真陽之短䇿放清遠之􅀌舟覷碧落之灵祕嘲峽山之媚柔承懸崖之滴乳搴裊岸之垂樛探羊城于浩茫􅀤蒲澗于深幽窮一時之詭覌􅄅萬古之清愁盖明年之正月矣始稅駕于羅浮省愆賦唐子謫居嶺表既已半載杜門時省愆而慨曰身邪心邪孰陷吾于罪乎吾􅀅求之身則身非我有四大所㑹地水火風誰為之宰吾􅀅求之心則心不在内􅂧不在外不在中間是􅀅安在昼夜以思􅆍食皆廢􅇧為之出髮為之改梦有告余曰甚㢤子之蔽也罪性本空念念㓕壞反􅂧尋繹祗益咎悔道逢臭腐何􅁕眄睞玩味不已適􅁕自􅁾净是妄而况垢榖猶無而矧稗譬之身体本自安泰或作病想便嬰瘵識此病之誰受尚何施于砭艾譬之手􅁕伸縮無礙忽作縳想㪯動輙絓悟此縳之無寔即無䋲而可觧方􅋍听于妙語失胸中之結磈若春動而氷坼若秋至而葉敗囬視無始以来㡬千萬世所作罪業悉消散而崩潰矣豈独今之所以流落顛沛者㢤斍而思之曰噫此殆維摩詰也􅄃衣而起正冠束􅅁稽首西望作礼而退古体詩内前行内前車馬撥不開文徳殿下宣麻囬紫􅅔侍􅀰拜右相中使押赴文昌䑓旄頭昨夜光照牖是夕􅀵芒如秃箒明日化為甘雨来宅家喚作調元手右相視事明日始淂兩上喜甚書啇霖二大字賜之周公礼楽未要作致身姚宋也不􅁖向来两翁當國年民間斗米􅅻四錢長沙示甥郭圣俞我昔官閬中子時趋長安相􅂈日夜飲肯使笑語乹但知醒復醉誰問甜與酸􅄃衣歩中庭仰首羨飛翰誓言早帰休慎勿貪高官時未有添丁眼前惟木蘭舅甥一分背日月㕠跳丸那知十年外相見西江干拜起未寒温悲来各汍瀾我鬂已秃翁子顔非渥丹相􅀙海上去兹事人所难阪行白􅐯漭山宿青攅攅人烟小􅀊後草木深冬完昨日次長沙扁舟掠湘滩中流遭􅁖風滿衣潑驚湍舡如旗尾􅀧天作車輪團怖畏目敢側禱祈指頻弹向非􅀑神􅂇㡬作蛟龍飡忠信時可慿聖賢豈吾謾勿畏嶠南热我清物自寒勿憂海􅀖陋心廣身亦寛磨刀斫鯨鱠隐几㸔􅉇搏努力近藥物明年理帰鞍淂之兩鳴鵠亀筒不湏鑚張曲江鐡像詩開元太平乆錯䖏非一拍就令乏賢人何至相仙客直道既彫丧曲江遂踈斥汲黯困後薪賈生罷前席金鑑束髙閣鉄胎空数尺妙䖏难形容英表良髣髴摩挲許國姿尚想立朝色同時反棄置異代長嘆息湖上佳月明作哲好風聖之清湖邉淂二友夜語投三更烟露兩相􅊜水天参互明散衣芭蕉凉曵杖桄榔􅁿星赱抛餘光山空荅虚声帰矣不可留􅂈幽􅂲神驚㕠榕水東㕠榕間有􅅱時出逰清風衣􅋰古白雪􅂡髯虬吟哦明月夕􅉫弄寒江秋驚傳里中児不泊岸下舟君㸔􅀑趣中有此風味不安知非黄石但恨無留侯此生鋤犁手誤入簮绅流無功抵毫髮負罪平山丘政尔求㵕濯聞之歎綢缪摳衣倘可親跪􅂂安敢羞淂聞半偈語一觧终身􅁨性不喜伐國兵書非所求大􅀬行去年大雪埋尺箠水比茘支遭凍死共嗔比客􅅁寒来我欲分疏誰受理今年諸峒十分热東江不下龍川米南翁北客两欣然孰與忍飢飡荔子蜑児歌瀘南二子天一邉思之不見今三年阮咸已老淂遥集白髮自媿還欣然未㸔顱􅇧并頰顴啼中已有􅂈秦篇諸田何淂賤庶孽㑹斬荘賈摧强燕􅁡果臣聞失旦雞已曉犹强鳴書生坐口窮抵死輸血誠嶺􅀯貢􅁡果海道趋􅊮庭黃蜂楽受聀紫鳯􅂇􅀭舲忠勤雖云至思慮良未精由来瘴癘鄉不識霜雪清􅁟風不待講氣象昬如酲秔稲秔稲热水泉水泉腥而况野果寔豈􅁕奉聖明未論体性殊已􅁴面目生食之倘有􅀘劳者甘如􅄳政恐無禆益所出非和平上林寕少此下箸安可輕軒轅尝百毒上古雜神灵武王嗜鮑魚㦲諌伏老成芻蕘􅂧何有葵藿但自傾圓蛤黄犢鳴水中相頋皆愕然探之亡所淂有蛙僅如錢持問旁􅃕翁云此號圓蛤夏潦漲溝渠喧呼自酬荅卒然聞其声謂當可專車既見一拊掌寸莛量有餘物生元氣中小大各異趋蛙賓黄牛鳴持此欲誰附我居固已陋尔鳴良亦村綿蛮囀黄􅕢我今思故園白小二年遵海濱開眼即浩􅄅謂當飽長鯨餬口但白小百尾不滿釡烹煑䓁芹蓼咀嚼何所淂鱗鬛空紛􅅰向来若魚戯海面横􅀌嶠噞喁噴飛沬白雨散晴曉終然不省録􅀙事此微􅆌短長本相形南北無定表泰山不為多毫末夫豈少詞雄兩月讀理􅁕三語妙人生一漚􅀤誰作千􅀊調安䏻蹲㑹稽坐待朞年釣瘧疾􅀉示聖俞体中初㣲温末势如湯鑊忽然毛髮起冷撼如振鐸良乆交􅀾罷項背如释縳尚斍頭涔涔眉額如鑱鑿空日一寒暑有凖如契約伏枕兩晦朔枵然如空槖平生十圍腰病起如飢寉衰髮本無㡬脱去如秋箨到今僅䏻歩出没如尺蠖舊聞五嶺法有此萬户瘧而我自僑寓了不蒙濶畧况子又持飬何至亦例着此身自空虚客疾安所托請作如是覌無病亦無藥示蜑先君捐館年六十畸三筭我今四十三始淂㓜子蜑餘齢継前躅蜑也􅅻及冠况復未可知孝章積􅁨嘆禄飬豈不欲兹事斍已缓但爱眉目秀体質净如盥頋瞻既精神懐抱亦氣岸今者新剔髮莹若珠未貫見之令人清面擁疲手腕輙然攫吾􅂡霜雪落几案豈惟不肯嗔更对一笑粲骨肉今遠矣恃汝慰奔􅇡行當従諸兄誦書喧里閈而我于􅀴術粗􅀎分句断􅀤蒙要师資心孔為開鍵許慎專偏傍張華休史漢吾家業儒乆捨此無别段不􅀿縁一噎便欲廢炊㸑及親三釡􅁕未用萬户鄼人生百年期我今特未半夣泉并序潮陽尉鄭太玉梦至泉側飲之甚甘明日淂之東山上因作梦泉記示余命作此詩入道肯著相出神淂佳泉起尋定中境謾意山之巔四人蹋髚数里聞潺湲循声到巉絶滿意流甘鮮雖深石可数太察魚难筌分為缟練去濺作珠璣圓一窺􅀫酲觧三嚥沈疴痊恍惚尚疑梦欢呼欲成顛山間短扵井海飲鹹生涎那知道在邇㡬作野遺賢事故由人㒷物為知已妍誰陪濠上㳺諒携室中天雖無十丈花中有一滴禅名酒斍殊勝冝茶定常煎蘭亭羽觴冷魚腹青筒連新文来遠矣開􅃃犹潨然􅈳欲抱琴去􅎔流聴未全不但受以耳庶㡬神者先冩為梦泉􅋵弟入楽府篇􅀅前輙復􅁍萬事付有縁鳴鵲行簷前群鵲鳴相呼法當有客或遠書吾今何䖏淂書尺而况賓客乗軒車平生眼中抺泥􅂗泛爱了不分賢愚卒為所賣罪滿􅥟放逐南越烹蟾蜍百口􅀉食西􅀯隅三年莫知安稳無家書已自不可必更望故人双鯉魚故人湏来絶䏻踈况􅂧萬嶺千江湖雞肋曽是安拳餘至今畏客如於菟豈惟避謗謝還徃此日誰肯窺吾廬杜門却掃也不􅁖何但忘客兼忘吾喧喧鳴鵲汝􅂈矣􅂚不徃噪權門朱採薬行贈梅蟠順途行􅁔醉者誰先生採藥山中帰昨日携籃入山去今日出山香滿路先生年来飯黄精俗眼但白髪但青得失乗除適相􅀘勿取讒人􅂌豺虎鍾潭行君不見惠州城之西永福古寺鍾崛竒夜輙亡去􅀺明帰萍沙摹糊水淋漓山僧初驚乆恬嬉一夕􅈳去不返棲父老嗟惜僧垂洟明年夏旱江水低此鍾居然水中坻奔赱徃視空城陴挽以巨䌫牛百蹄牛喘梚绝鍾不移度不可得乃去之江花開落水東馳到今􅂈者猶俯窺刻舟記劍真自痴不􅀿此物猶沙泥眉山唐先生文集卷一眉山唐先生文集卷一目唐庚子西賦南征賦省愆賦古体詩内前行長沙示甥郭聖俞張曲江鉄像詩湖上双榕大􅀬行蜑児􅁔􅁡果圓蛤白小瘧疾􅀉示聖俞示蜑梦泉鳴鵲行採藥行贈梅蟠鍾潭行
