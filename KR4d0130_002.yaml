front:
  text: 眉山唐先生文集卷二
  hash: sha256:b291b7738ad4fbdeedce76866adfdc2867173f3d77126c986b0a71de073f26f0
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_002-1a}
body:
  text: 眉山唐庚子西古體詩秋水行僕夫取水古龍塘水中木佛三肘長隨波俯仰如簸粳並流拯之置道傍衲衣著帽僧伽裝里人觀者如堵墻相與築室􅎔滄浪荷蓋荃壁辛夷梁三日屋成小而香野草紅花荐芬芳爐煙晝清夜燈光乃知實相無立鄉人人性中普照王採藤曲魯人酒薄邯鄲圍西河渡橋南越悲歲調紅藤百萬計此古一作無窮時去年採藤藤已乏今年採藤藤轉竭入山十日脫身歸新藤出土拳如蕨淇園取竹况有年越山採藤輸不前今年輸藤指黃犢明年輸藤波及屋吾皇奍民如奍兒鑿空為此謀者誰冬雷行百蟲蟄處安如家阿香夜起推雷車一時技癢不忍俊撼動尺蠖掀龍蛇龍蛇尺蠖踞已久亦欲奮迅舒頑麻夢中一震忽驚躍發破墐戶排泥沙泥沙已出雷遽止錯愕欲去難藏遮蟲蛇狼狽莫知𢾗間有伏龍吁可嗟贈談微之去年絃歌程水濱甑中生塵范史雲今年講學鵝城裏關西孔子楊伯起昔人論士觀心期時人論士看目皮只知黃鷂矜觜瓜不識騶虞避生草遊使君諸子歌大遊落落如長松説易妙合韋編翁胸中藴藉入眉宇筆下言語驅頭凨小遊濯濯如春栁十八書生過秦手已將文夆呼大兒更與長源為小友是家諸郎都幾人傳聞一一連城珍未識龍川五袴守端似當年萬石君北歸至廣州寄惠州故人歸心如躍馬奮迅不可駐别情如放猿已去猶返顧三年孺子社𢾗借柱史書好在五噫孫善保千金􅥟舊來談天口老去盡地力萬里不相忘寄聲問眠食近體詩南遷去去寬鄉托此蹤閙中無地頓衰翁未誅綺語猶輕典更賜羅浮有底功蝦萊賤時皆丙穴茅榮美處即郫筒著鞭要及春前到趂賦梅花庾嶺東渡沔隺歸遼海悲人世猿入巴山呌月明惟有沙蟲今好在往來休並水邊行武陵道中朝持漢使莭暮作楚囚奔路入離騷國江通欵乃村垣墻知地濕草木驗冬溫寂寞桃源路行人祗斷魂長沙道中古古今今路朝朝暮暮行橘林香處飯杉木翠邊程山帶湘靈慘川含楚些清江湖無限句遷客要才情鴨步仗波江面瑩如磨忽爾崩騰作沸渦橫笛未終平似板此中端有萬蛟鼉次泊頭何處不堪老浮山傾蓋親潮田無惡歲酒國有長春草木疑靈藥漁樵或異人近前端有淂丞相未冝嗔到羅浮始識秧馬擬向明時受一􅒡著鞭常恐老農先行藏已問吾家夆從此馳君四十年𥘉到惠州盧橘楊梅乃爾甜肯容遷謫到眉尖因行採藥非無淂取足看山未害廉辦謗若為家一喙著書不直字三縑老師輔處吾何敢政為宗風不敢謙謝人送酒世情不到海邊村載酒時來餉子雲便欲醉中藏潦倒已將度外置紛紜細思擾優膠膠事政坐竒竒怪怪文喚取鄰翁傳杓飲漸令安習故將軍水東感懷往事孤峯在流年細草頻但知其室通誰識所存神碑壞詩無敵堂空德有鄰吾今稍姦黠終日酒邊身登栖禪山海雨山煙撥不開眼前遮定一作盡望鄊臺如何借得維摩手斷取西南故國來收景𥘉書并示藥物乾坤心腹友江海鬢毛斑藥輔他鄊闕書開故一作去國顔何時乘下澤此日仰髙山會是歸耕耦由來有賜環九日懷舍弟重陽陶令莭單閼賈生年秋色蒼梧外衰顔紫菊前登髙知地盡引滿覺天旋去歲京城雨茱茰對惠連收家書西州消息到南州骨肉無他歲有秋驥子解吟青玉案木蘭堪戰黑山頭即時旅思春氷坼昨夜燈花黍穗抽從此歸田應坐享故山已為理菟裘瀘人何邦直者為安溪把截將有功不賞反淂罪來惠州貧甚吾呼與飲為作此詩楚人季布以勇顯魯國朱家用俠聞馳馬彎弓臣好武吹毛洗垢吏深文王孫此日誰漂母卿子前時號冠軍滿引一杯齊物論白衣蒼狗任浮雲豫在惠州作酒二種其和者名奍生主其稍徑者名齊物論後禁主字遂去其一除夕患難思年改龍鍾惜歲徂關河先壠逺天地小臣孤吾道慿溫酒時情付擁罏南荒足妖怪此日謾桃符人日人日傷心極天時觸目新殘梅詩興晚細草夢魂春挑菜年年俗飛蓬處處身蟇頥頻語及髣佛到東津栖禪暮歸書所見二首雨在時時黑春歸處處青山回失小寺湖盡淂孤亭春著湖煙膩晴搖野水光草青仍過雨山紫更斜陽白鷺説與門前白鷺群也宜從此斷知聞諸君有意除鈎黨甲乙推求恐到君六言幾年持鉢天外晚歲結庵海隅頭白親逢孔墨眼生𥘉識楊盧孔雀墨魚楊梅盧橘又煙合家煨老酒風腥船過醎魚丁米獨遺遷客洞夫不𢾗僑居有所嘆林中宴坐老沙門豈願􅎔年觸垢氛正恐先生不淂飽欲令後死與斯文近逃台鼎居東洛聞道衣冠滿北軍須信此塗天一握人問謾説有孤雲其二耕田佩印兩徒然憶想平津只去年怪底功名稱地獄誰將官府到天仙是非已付漁樵判疑信難憑黨與傳杯酌豈能通大道床頭當得酒如泉舍弟書約今秋到此此日方收信前時已具舟開頭今幾月軟腳定中秋涼德為兄忝炎荒為爾憂從今西望眼應到見時休跋道德經鬪智饒君三十里著書還我五千言只將得一觀天下約法劉公已太煩夜坐懷舍弟無雲仍露坐有月更江皋沉陸傷吾道浮生憶爾曺扁舟應夏口此夕數秋毫不見今三載當時已二毛送外甥之廣州由也久從我牢之真有甥時情為客老秋色進船清撥刺朝朝味鈎輈處處聲越臺休弔古旅魄向來驚九日獨酌登髙無老伴引滿自髙歌歡意天邊少重陽野外多黃花空歲月白首尚關河他日龍山興吾今在網羅壬辰九月二十三日天氣始寒以詩記之朝來怪底冷前此已重陽漸逼袴𥜗莭稍聞灰火香煙嵐向冬淨橘柚淂霜黃嶺表雖多暑天時亦有常眉山唐先生文集卷二眉山唐先生文集卷二目唐庚子西古體詩秋水行採藤曲冬雷行贈談微之遊使君諸子歌北歸至廣州寄惠州故人近體詩南遷渡沔武陵道中長沙道中鴨步次泊頭到羅浮始識秧馬𥘉到惠州謝人送酒水東感懷登栖禪山收景𥘉書并示藥物九日懷舍弟收家書瀘人何邦直者為安溪把截將有功不賞反淂罪來惠州貧甚吾呼與飲為作此詩除夕人日栖禪暮歸書所見二首白鷺六言又有所嘆其二舍弟書約今秋到此跋道德經夜坐懷舍弟送外甥之廣州九日獨酌壬辰九月二十三日天氣始寒以詩記之
