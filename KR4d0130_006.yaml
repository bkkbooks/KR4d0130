body:
  text: 眉山唐庚子西論名治論古者一代之興則有一代之治故曰夏后氏尚忠啇人尚質周人尚文雖聖人之道不可以名言而施之政事必有稱號可指非但王者如此而一國之治亦然故曰周公治魯尚齒而親親太公治齊尚賢而尊尊自是以來謀謨之臣議論之士亦未有不明當世之治體而識其面目者故漢世每以雜伯自名而晋人亦云以道勝寬和為本今宋之為政久矣其所尚者何也士之通經術知古誼者不為不衆日夜講䆒治道以逰于世者亦不為不熟其所稱引動以宗周為言而問以當代治體則茫然不知所以名之惟其無淂于此是以有慕于彼愚誠不自揆蓋嘗妄論之矣屨不必同要之適足治不必同要之適時故成周之治任人而國朝之治任法任人者非不用法也以人為本而輔之以法任法者非不用人也以法為本而行之以人自古法無全是亦無全非而人之忠侫智愚賢不肖至為遼絶故任法之世無甚利亦無甚害而任人之世非大治則大亂矣周時公卿不過數族周召毛原執政至數百載不絶今之大臣更出迭入遠者十餘年極矣近者朞月而已雖無纍世輔弼之利亦無妨賢專恣之害矣周之諸矦既錫以上宇則刑賞生殺之柄悉舉以委之今郡縣之權不過鞭朴爾過此以往則相顧而議法矣雖無藩屏形勢之利亦無戰爭侵奪之害矣周時任官必考論人物謂之量才度德今不然矣以資歷為髙下以注籍為先後揭闕子道應法者淂之雖無為官擇人之利亦無好惡狥私之害矣周時取士使之自相推擇謂之鄉舉里選今又異于此矣蓋自國𥘉以來三易取士之法然要之不離文字晦名易書暗考而明取之雖無出長入治之利亦無毁譽比周之害矣其人略如此故周之極熾至刑措不用四十餘年典章文物之盛信有以絶人而晚莭禍敗亦足以稱此國朝受命百五六十年間海內晏然如一日者此任人任法之效也昔者李績為將無大勝亦無大敗薛萬徹非大勝即大敗而近世論將未嘗不以英衛為先然則今之欣淂多于成周亦眀矣而士方歉然不足爭說人主以成康之隆而不知國朝規摹處置所以成就天下之勢者固己如此非獨不知國朝亦𣸪不知成康矣何則人有情而法無心情之所在恩怨以之其無心者漠然而已今者欲成康乎則必脫略文法而一切任人夫以天下之大利而索之于繩墨之內是猶以李績之莭制而求萬徹之竒勝終不可兾然與其蹈萬徹之險孰若李績之持重足任也哉存舊論漢時儀注大抵率意制造不應古誼者十至八九其文采法度略矣然而天下之人見即喜不見即悲中更王氏之亂廢弃不用者十餘年光武入洛東都之民始見司隸僚屬歡喜踊躍父老或至垂泣曰不圖今日𣸪見漢官威儀自是天下翕然歸之相與出力鋤去禍難以成中興之業而𣸪其宗廟社稷蓋又二百餘年雖漢之所以𣸪興者不專在是然亦不可謂無助也且漢官威儀非若三代之盛叔孫所謂非有周公之學術智識也雜以秦制非𣸪聖人之法也而遺民見之如盲者𣸪視廢者𣸪起如流浪積歲而返其故鄉見其父子兄弟感慨之極至于咨嗟流涕其得民心如此此何理耶方是之時以三代車服示之吾知其民不𣸪泣矣何者漢之為漢十世於此矣民知有劉氏而已夫救天下于戰國秦項水火之中而措之于安全逸樂之地不𢾗十年海內無事斯民得以飬生得以送死得以事其父母而長育其子孫者漢之力也三代逺矣何有于我哉由是觀之古者帝王之興其正朔服色自為一王法而不慕前朝異姓之陳迹其用意深矣由是觀之國家舊物冝使斯民常見而熟習之以馴其耳目而繫其心自非不淂已者不宜䡖有改易變置以自絶于民也亦灼然矣向使今日變其一明日變其二祖宗餘澤日益就盡不在目前不幸而奸人撼之則人心搖而天下去矣古者公卿大夫猶知守其家法至𢾗十世不易其衣冠閥閲豈無隆替而國人信服終莫之敢抗謂之名家舊族而况𢾗百年為天下國家者哉辨同論道至于聖人極矣豈客𣸪有異乎然禹之措置如此湯之措置則如此文武周公之措置則又如此使𢾗人者比肩而事主交臂而共政則論事之際吾意其必有同異者矣寧䏻盡合乎是猶有辭焉曰時不同也若諸子論性豈𣸪繫于時㦲而孟子之說如此荀子楊子之說則如此韓子之說則又如此使數人者比肩而事主交臂而共政則論事之際吾知其必有同異者矣寧能盡合乎是亦有辭焉曰師友不同也若子夏子游曾子子張之徒則又將安所諉哉皆出于周末不得謂之異師請業請益周旋出處奔走憂患蓋無適而不同者凡𢾗十年不淂謂之異友而論交論學如黑白之相反方圓水火之不相入也此𣸪何哉說者以為孔子沒學者無所統一使夫子在學者冝不至此然吾聞孔子行年六十而六十化始之所是卒而非之曰言豈一端而已夫當有所合也此一人爾而有所謂昔日之言者有所謂今日之言者而况于衆口乎是以先王知群言之不可一也因使人人淂極其說而不以同異為誅賞公卿大夫之出于斯時者亦人人各荐其所聞而不以同異為喜愠何者閨門之內父子兄弟相與言而有可有不可筮人布䇲卜師引龜而參之一從一不從故曰物之不齊物之情也寧可罪哉今為申啇之學者則不然以謂同心同德者周人所以興離心離德者商人所以亡刑賞生殺足以整齊天下而不能塞異議之口則非所以一道德而同風俗噫古之所謂同心同德者果謂此耶吾不忍聞是說矣周公之時朝廷之士為不少矣而東征之議書稱十夫豫翌則同者寡而不同者衆矣豈皆小人耶豈皆誅之耶夫以周公之權而十人者助之其勢足以誅鋤議臣之異己者為有餘矣鼻息所向天下其孰敢違然近于人情通于物理忠于王室而推至公于天下者終不肯為此何則駕馭群臣正恐其雷同耳奴婢同則家道危臣下同則人主孤人主孤而天下之禍可勝講㦲古之人所以貴和而賤同者慮正在此也禍福論昔之談禍福者固常歸之善惡矣然其效可睹也其始曰為善者必淂福為惡者必淂禍取報于天如探左契于是天下之人悚然而畏然為善者果得福乎為惡者果得禍乎是特未可知也言既不效則遷就其說曰為善者非遽有福也要久而後吉為惡者非遽有禍也要久而後凶譬之果榖要待其熟于是天下之人憮然而疑今君子長者子孫苗裔不為少矣而果吉乎妬民害物專門為惡者古亦衆矣而果凶乎是亦未可知也既又不效則復遷就其說曰為善者淂福常多不幸而抵禍者或寡矣為惡者大概淂禍幸而免者亦時時有之于是天下之人啞然而笑今所謂常得者果多乎所謂幸不幸者果少乎是亦未可知也自始至此三易其說而言輒不效則民益解體而矯激之論生焉曰為善者及淂禍為惡者及淂福自漢以來嘗有是說然蹈道者豈盡淂禍乎奸侫險賊不忠不孝者豈盡淂福乎其效亦可覩矣吾意以謂禍福出于天善惡出于人二者不相為謀如五星散行而有時乎相值人見其適相值也而遂引以為常此不可謂合于理矣今世或為善而禍或為善而福或為善而漠然無有禍福其為惡也亦如之不為善不為惡者亦如之要之不可測善乎楊子之言曰修其善者為善人修其惡者為惡人善惡之報惟是為有證易稱積善餘慶詩言自求多福書言福善禍淫孟子言禍福自己求之彼非有失也有為而然也眉山唐先生文集卷六眉山唐先生文集卷六目唐庚子西論名治論存舊論辨同論禍福論
