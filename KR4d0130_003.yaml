front:
  text: 眉山唐先生文集卷三
  hash: sha256:2b6d80ee4b6694044511f61314fb33b4c3b7d1dbeb2970b7426a6690cdf2137c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_003-1a}
body:
  text: 眉山唐庚子西近體詩十月𣸪暄誰會世間事即今冬後秋殘年仍御夾先日已重裘地勢笑州冷天時北客愁此生橐籥內反𣸪任吹咻送客之五羊不到番禺久繁雄良自如江山禹貢外城郭漢兵餘圓折明珠浦旁行異域書五羊雖足樂雙鯉未冝踈又建國今陳迹逰人合賦詩廢臺樛女後遺井鮑姑時客去通星漢僧來自月支憑君黃木口為致海祠碑送故人赴循州司理溪入尉他宫撑舟門復通梅花吳驛外萍實楚謡東方䇿他時執圓扉到日空天涯并畫絶我無德爵但年尊音塵不繼應相悉萬事而今付默存船居憑誰舉此問瞿曇已築虛空作小庵維摩經虛空作室無有是處不但燕間充泛宅亦堪來往寄浮驂江湖有理吾將老魚鳥無心客自慚非𣸪雲安憂斗水床頭垂手淂清甘壬辰九月不雨至已年三月穡事去矣今夕輒𣸪沛然喜甚卧作老去生涯白木鑱脫逢艱食更何堪春深野色憂年惡夜半簷聲覺雨甘睡外莫聽泥活活想中已覩麥含含明朝竹徑添幽事玉板堂頭作小參舍弟既到有作武陵倉卒記他時我獨南翔子北飛覷過幾多歸後事相看仍是别時衣匪躬老矣惟心在便腹依然但髮稀尚有苦吟三十載與君同飽蜀山薇收景初貶所書信斷常懷信斷憂淂書還有淂書愁未應宿業都相似總為饒聲不肯休見説胸中卷雲夢莫將皮裏貯陽秋而翁有道知興廢不患無詞詣播州次勾景山見寄韻此生正生不知天豈有豨苓解引年但覺囀喉都是諱就令搖尾有誰憐腰金已付兒曹佩心印還當我輩傳他日乘車來問道葦間相顧共延緣夜聞蛋户叩船作長江礧欣然樂之殊覺有起豫之興因念涪上所作招漁又詞非是更作此詩反之示舍弟端孺當年無奈氣狂何醉檄涪翁棄短蓑晚落炎州磨歲月欲從諸蛋丐煙波與君共作長江礧况我能為南海歌身世即今良可見不應老子尚婆娑比風纍日不止寒甚寄鄭潮陽山前臘雪想紛紛風到南訛盡處村甕面不容存酒子床頭幾欲㸑桐孫園林呼舞知衰怯窗户奔馳覺眩昏咫尺潮陽五袴國可能分我一𥜗溫即事歸心急似隴頭水華髮多于嶺上梅正是堯朝猶落此當時湘浦亦冝哉又還家久近書難寫破屋隂晴榻屢移吾道非邪來曠野人生樂爾復何時又案頭行掃塵隨起窗眼才封雨又梢更力窮空沽白餅莫將疲薾閗黃茅遣興僧寺借經便大字鄰墻喚酒及新篘三年于此淂其理一飽已還非所求又酒經自淂非多學詩律深嚴近寡恩田里歌呼無籍在朝廷議論有司存送舍弟幹事廣州欲罷愧決䇿擬行愁索居人心旱魃後旅色颶風餘擊柝秋江夜開帆曉霧初他鄉仗神理瀝膽奠扶胥春日謫居書事四十緇成素清明緑勝紅形客千慮後門館一貧中白日時時别青兼處處同此生唇舌裡啼鳥暮春風大觀四年春吾與友人任景𥘉舍弟端孺自蜀來京師至長安時方寒食吾三人相與戎服逰九龍池飲酒賦詩樂甚是歲吾遷嶺表明年景初亦謫江左忽忽𢾗歲皆未得去寒食無幾念之悽然作詩寄任因命舍弟同賦之居今行古任定祖底事遷延亦未歸我坐力田傷地脈君緣搜句漏天機故都回首三寒食新歲經心兩濕衣孝道一生凡幾化不因到此始知非乙未正月丁丑與舍弟掉小舟窮西溪至愁絶處度不可進乃歸溪側有兩榕甚竒清隂可庇𢾗十榻水東老人常飲酒其下云楊梅溪上栁初黃荊竹岡頭日正長獨木小舟輕似𥿄一尊促席穩于床樹從坡去無人識水出山來帶藥香應有居民解秦語為言昭代好還鄉有感示舍弟端孺一出湟關五見梅愚心幾欲伴黃埃弟兄手足窮孤竹母子肝腸泣老菜好語忽從天上落行人直向一作叩海邉回此生報國無他事力穡供輸莫待催逰廣州悟性寺寺有越王臺蓋尉他時所築有井井甚竒問之號達磨井云﨑嶇赱上方浩蕩取秋光臺上經樛女江天入夜郎華夷憑檻逺興廢引杯長泉脈來何處中含定慧香舜祠韶州謳歌率土性之也號泣旻天孝矣乎何惜扁舟繫韶石憶曽萬里呌蒼梧臘嶺戲書上世有鞭能赱石今人無鐸可驅山一回憑膝一移足老盡行人未老顔長沙竹笋聞于天下大者可十斤重食之甚甘而不氷脾昔渡湘欲作詩未暇也今日𣸪過之乃酬以此篇地入長沙莫嘆卑竹萌徑尺舊相知九重才復金門籍萬里先參玉版師契濶纍年真負口徘徊彌月未妨脾渭川風味那能對中有離騷九辨辭雜詩其一屏迹舍人巷灌園居士橋花開不旋踵草剃𣸪齊腰蛤哭明朝雨雞鳴暗夜潮未能全獨樂鄰里招邀其二已絶經年筆仍開盡日門身謀嗟翠羽人事嘆榕根𬞞食風掀市樓居水破村嶺南霜自薄何淂鬢邊其三便歸良不惡未去亦隨緣户口知無瘴謳歌覺有年藤箋淂句後桂酒抱愁邊經術吾衰矣猶堪舉力田其四不死良難學全生或可幾茶隨東客到藥附廣船歸棊倦收成敗書慵卷是非關心無雜慮魂夢入精微其五兀坐且如此出門安所之手香柑熟後髮脫草枯時精力看書覺情懷夆盞知炎州無過雁二子在天涯其六飽食為茶地深耕覔酒村翻泥逢暗笋汲井淂飛梅湖盡船頭轉山窮屐齒回田間良自苦清興亦悠哉其七壯歲日千里晚途天一方花縵聊傲世白祫亦隨鄉團扇侵時令方書遣晝長此間吾所樂便擬卜林塘眉山唐先生文集卷三眉山唐先生文集卷三目唐庚子西近體詩十月𣸪暄送客之五羊又送故人赴循州司理寄潮陽尉鄭太玉次鄭太玉見寄韻船居壬辰九月不雨至巳年三月穡事去矣今夕輒𣸪沛然喜甚臥作舍弟既到有作收景𥘉貶所書次勾景山見寄韻夜聞蛋户叩船作長江礧欣然樂之殊覺有起豫之興因念涪上所作招漁父詞非是更作此詩反之示舍弟端孺北風纍日不止寒甚寄鄭潮陽即事又又遣興又送舍弟幹事廣州春日謫居書事大觀四年春吾與友人任景初舍弟端孺自蜀來京師至長安時方寒食吾三人相與戎服逰九龍池飲酒賦詩樂甚是歲吾遷嶺表明年景𥘉亦謫江左忽忽𢾗歲皆未淂去寒食無幾念之悽然作詩寄任因命舍弟同賦之乙未正月丁丑與舍弟掉小舟窮西溪至愁絶處度不可進乃歸溪側有兩榕甚竒清隂可庇數十榻水東老人常飲酒其下云有感示舍弟端孺逰廣州悟性寺寺有趙王臺蓋尉他時所築有井井甚竒問之號達磨井云舜祠韶州臘嶺戲書長沙竹笋聞于天下大者可十斤重食之甚甘而不氷脾昔渡湘欲作詩未暇也今日𣸪過之乃酬以此篇雜詩其一其二其三其四其五其六其七
