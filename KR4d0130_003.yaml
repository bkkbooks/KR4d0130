front:
  text: 眉山唐先生文集卷三
  hash: sha256:2b6d80ee4b6694044511f61314fb33b4c3b7d1dbeb2970b7426a6690cdf2137c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_003-1a}
body:
  text: 眉山唐庚子西近体詩十月𣸪暄誰㑹世間事即今冬後秋残年仍御裌先日已重裘地势笑州冷天時北客愁此生橐籥内反𣸪任吹咻送客之五羊不到番禺乆繁雄良自如江山禹貢外城郭漢兵餘圓折明珠浦旁行異域書五羊雖足楽双鯉未冝踈又建國今陳迹逰人合賦詩廢䑓樛女後遺井鮑姑時客去通星漢僧来自月支憑君黄木口為致海祠碑送故人赴循州司理溪入尉他宫撑舟門復通梅花吴驛外萍寔楚謡東方䇿他時執圓扉到日空天涯并画絶我無徳爵但年尊音塵不継應相悉萬事而今付黙存舡居憑誰㪯此問瞿曇已築虚空作小庵維摩經虚空作室无有是処不但燕閑充泛宅亦堪来徃寄浮驂江湖有理吾将老魚鳥無心客自慚非𣸪雲安憂斗水床頭垂手淂清甘壬辰九月不雨至已年三月穡事去矣今夕輙𣸪沛然喜甚卧作老去生涯白木鑱脱逢艰食更何堪春深野色憂年悪夜半簷声斍雨甘睡外莫听泥活活想中已覩麦含含明朝竹徑添幽事玉板堂頭作小參舎弟既到有作武陵倉卒记他時我独南翔子北飛覷过㡬多帰後事相㸔仍是别時衣匪躬老矣惟心在便腹依然但髮稀尚有苦吟三十載與君同飽蜀山薇收景初貶所書信断常怀信断憂淂書还有淂書愁未應宿業都相似縂為饒声不肯休見説胷中卷雲梦莫将皮裏貯陽秋而翁有道知㒷廢不患無詞詣播州次勾景山見寄韵此生正生不知天豈有豨苓觧引年但斍囀喉都是諱就令摇尾有誰怜腰金已付児曹佩心印還當我軰傳他日乗車来問道葦間相頋共延縁夜聞蜑户叩舡作長江礧欣然楽之殊斍有起予之㒷因念涪上所作招漁又詞非是更作此詩反之示舎弟端孺當年無奈氣狂何醉檄涪翁棄短蓑晚落炎州磨歲月欲從諸蜑丐烟波與君共作長江礧况我能為南海歌身世即今良可見不應老子尚婆娑比風累日不止寒甚寄鄭潮陽山前臘雪想紛紛風到南訛尽䖏村瓮面不容存酒子床頭㡬欲㸑桐孫園林呼舞知衰怯窓户奔馳斍眩昏咫尺潮陽五袴國可能分我一𥜗温即事帰心急似隴頭水華髮多于嶺上梅正是尭朝猶落此當時湘浦亦冝㦲又還家乆近書难冩破屋隂晴榻屡移吾道非邪来曠野人生楽尔復何時又案頭行掃塵隨起窓眼纔封雨又梢更力穷空沽白餅莫将疲薾閗黄茅遣㒷僧寺借經便大字鄰墻喚酒及新篘三年于此淂其理一飽已还非所求又酒經自淂非多斈詩律深嚴近寡恩田里歌呼無籍在朝廷議論有司存送舎弟幹事廣州欲罷媿决䇿擬行愁索居人心旱魃後旅色颶風餘撃柝秋江夜開帆曉霧初他郷仗神理瀝胆奠扶胥春日謫居書事四十緇成素清明緑勝紅形客千慮後門舘一貧中白日時時别青兼䖏䖏同此生唇舌裡啼鳥暮春風大覌四年春吾與友人任景𥘉舎弟端孺自蜀來京師至長安時方寒食吾三人相與戎服逰九龍池飲酒賦詩楽甚是歲吾迁嶺表明年景初亦謫江左忽忽𢾗歲皆未得去寒食無㡬念之悽然作詩寄任因命舎弟同賦之居今行古任定祖底事遷延亦未帰我坐力田傷地脉君縁搜句漏天机故都囬首三寒食新歲經心両湿衣孝道一生凢㡬化不因到此始知非乙未正月丁丑與舎弟掉小舟窮西溪至愁绝䖏度不可進乃帰溪側有両榕甚竒清隂可庇𢾗十榻水東老人常飲酒其下云楊梅溪上栁初黄荊竹岡頭日正長独木小舟輕似𥿄一尊促席穏于床樹従坡去無人識水出山来帶藥香應有居民觧秦語為言昭代好还郷有感示舎弟端孺一出湟関五見梅愚心㡬欲伴黄埃弟兄手足窮孤竹母子肝腸泣老菜好語忽従天上落行人直向一作叩海邉囬此生报國無他事力穡供輸莫待催逰廣州悟性寺寺有越王䑓盖尉佗時所築有井井甚竒問之號達磨井云﨑嶇赱上方浩蕩取秋光䑓上經樛女江天入夜郎華夷憑檻逺㒷廢引盃長泉脉来何䖏中含定慧香舜祠韶州謳歌率土性之也號泣旻天孝矣乎何惜扁舟繫韶石憶曽萬里呌蒼梧臘嶺戯書上世有鞭䏻赱石今人無鐸可驅山一囬憑膝一移足老尽行人未老顔長沙竹笋聞于天下大者可十斤重食之甚甘而不氷脾昔渡湘欲作詩未暇也今日𣸪过之乃酬以此篇地入長沙莫嘆卑竹萌徑尺舊相知九重纔復金門籍萬里先参玉版师契濶累年真負口徘徊弥月未妨脾渭川風味那䏻对中有離騒九辨辞雜詩其一屏跡舎人巷灌園居士橋花開不旋踵草薙𣸪齊腰蛤哭明朝雨雞鳴闇夜潮未䏻全独楽鄰里招邀其二已絶經年筆仍開尽日門身謀嗟翠羽人事嘆榕根𬞞食風掀市楼居水破村嶺南霜自薄何淂鬂边其三便帰良不悪未去亦隨縁户口知無瘴謳歌覺有年藤牋淂句後桂酒抱愁边經術吾衰矣犹堪㪯力田其四不死良难斈全生或可㡬茶隨東客到藥附廣舡帰棊倦收成敗書慵卷是非関心無雜慮䰟梦入精微其五兀坐且如此出門安所之手香柑熟後髮脱草枯時精力㸔書斍情懐夆盏知炎州無過雁二子在天涯其六飽食為茶地深耕覔酒村翻泥逢暗笋汲井淂飛梅湖盡舡頭轉山窮屐歯囬田間良自苦清㒷亦悠㢤其七壮歲日千里晚途天一方花縵聊傲世白祫亦随鄉團扇侵時令方書遣昼長此間吾所楽便擬卜林塘眉山唐先生文集卷三眉山唐先生文集卷三目唐庚子西近体詩十月𣸪暄送客之五羊又送故人赴循州司理寄潮陽尉鄭太玉次鄭太玉見寄韵船居壬辰九月不雨至巳年三月穡事去矣今夕輙𣸪沛然喜甚臥作舎弟既到有作収景𥘉貶所書次勾景山見寄韵夜聞蜑户叩舡作長江礧欣然楽之殊斍有起予之㒷因念涪上所作招漁父詞非是更作此詩反之示舎弟端孺北風累日不止寒甚寄鄭潮陽即事又又遣㒷又送舎弟幹事廣州春日謫居書亊大覌四年春吾與友人任景初舎弟端孺自蜀来京師至長安時方寒食吾三人相與戎服逰九龍池飲酒賦詩楽甚是歲吾遷嶺表明年景𥘉亦謫江左忽忽𢾗歲皆未淂去寒食無㡬念之悽然作詩寄任因命舎弟同賦之乙未正月丁丑與舎弟掉小舟窮西溪至愁絶䖏度不可進乃㱕溪側有両榕甚竒清隂可庇数十榻水東老人常飲酒其下云有感示舎弟端孺逰廣州悟性寺寺有趙王䑓盖尉佗時所築有井井甚竒問之號達磨井云舜祠韶州臘嶺戯書長沙竹笋聞于天下大者可十斤重食之甚甘而不氷脾昔渡湘欲作詩未暇也今日𣸪過之乃酬以此篇雜詩其一其二其三其四其五其六其七
