front:
  text: 眉山唐先生文集卷十七
  hash: sha256:d00c01937a9272cafab35ea2cf63602db03ae1afa20fb90ad3d7733a6148a93a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_017-1a}
body:
  text: 眉山唐庚子西雜文歸歟賦歸歟先生歸歟先生坐講六籍立談百氏突姬孔之堂奧刳軻雄之心髓遊說天子間關千里射䇿万言捭闔亂理葩吐竒霞散綺拔犀渠擢象齒曽不能入事為律片言窹旨傴僂一命摧折委靡窮騏驥于捕鼠困干將于𥙷履血鵬而肉鯨兮尚不能逞刀機之殘􅊜兮又何足䑛昔薛丞相置東閣以觀士朱遊拂衣而起奚扁舟之不泛豈洞庭之無水先生笑曰嗚呼噫嘻子言小哉病者嗜于土炭餓者甘于糠粃醉者安于遇虎怒者恬子染指万法非實皆由心起狐尾見于疑目牛閗聞于病耳宿瘤何惡顰眉何美狐裘何榮牛衣何耻吾謂戴安道破琴而不肯作未若宋之遜秉笏而唱吟閻立本沮氣于畫師未若禰正平遺形于鼓吏抱關擊柝兮亦悠悠彈冠結髮兮亦悠悠吾忘情于彼此者也歸歟先生古體詩陌上桑曲䔥踈陌上桑寂寞採桑女蠶老葉轉稀羅敷泪如雨斂𬒮蹙雙蛾秦筝一曲歌殷勤謝郎意其如義命何白頭吟秋風團扇情夜雨長門意高鳥既已逝前魚自當棄賤妾白頭吟知君懷異心秪知茂陵女不憶􅎔卭琴結客少年埸結客少年埸男兒尚氣須激昻朝從魯朱家暮過秦武陽飲酒邯鄲市膝上橫秋霜明年從軍入燉煌金印紫綬輝路傍貧中知己慎勿忘五雜爼五雜爼水中魚去𣸪還天上鳬不獲已轅下駒五雜爼各利地去𣸪還塵埃轡不獲已貧而仕公無渡河公無渡河公無渡河君不見吳兒秋悲小海唱湘女夜怨招魂歌抱石沉清流弄酒奔素娥忠血醉蛟蜃義肉飽黿鼉暗中水弩貫七札魚龍百怪垂涎津吻牙相磨公無渡河公無渡河平地猶恐生風波明妃曲生男禁多才長沙伴湘纍生女禁太美隂山嫁胡兒長沙雖歸如不歸隂山亦𣸪歸無期綘灌通侯延壽死琵琶休怨漢天子舞馬行明皇時教坊舞馬百匹謂之某家嬌其曲謂之傾杯樂天寶之亂此馬流落人間魏博田承嗣得之𥘉不識也已而承嗣大宴軍中酒行樂作馬聞樂聲起舞承嗣以為妖命殺馬豫讀其說而悲之作舞馬行天寶舞馬四百蹄綵床襯步不點泥梨園一曲傾杯樂􅋮首頓足音莭齊幾年流落人間世挽鹽駕鼓不敢嘶忽然技癢不自禁俗眼驚顧身顛隮後生何嘗識此舞謂之不祥固其所風樹吟子路有言樹欲靜而風不止子欲奍而親不待豫三復而悲之故作風樹吟以終其意樹欲靜兮風不止子欲奍兮親不俟歸飛及哺八九子我曽不如畢逋尾樹欲靜兮風不休子欲奍兮親不留旦自梅兮暮至棘當年飼我如鳲鳩戲題醉仙崖誰家翠嶺高亭亭白崖隱起仙人形仙人昔嘗為酒星乘興痛飲乾北溟五湖一吸聊解酲江妃喪魄鼇失靈上帝震怒呵出庭酡然影落秋山青行人幾見霜葉零醉仙醉去不𣸪醒何須荷鍤隨劉伶河沙劫壞歸冥冥古生卷地凨來怒濤起驚散沙汀雙翡翠誰將仙匹鎖金籠孤飛吟呌烟波裡古生開鎖放珍禽春江日暖重相尋巧舌相和葦凨軟綺翼交飛菰浪深壯哉古生真任俠義氣肝腸何激烈功成不𣸪更偷生一劒揮霜襟濺血世間美事多參啇白馬青梅人斷腸古生埋沒在何處江山流水空茫茫走筆贈仙姑仙姑八十春秋高兩鬢墨黑無斑毛鹿胎冠子青紗𫀆神風清俊真仙曺人生瞥忽如銷膏是非海裏翻波濤五斗官米令人勞安䏻俯首爭錐刀碩仙乞我瓢裡一丸藥武陵溪上抖擻世俗腥與臊不然教我蟬蛻羽化祕訣之一二海山深處摘取王母千歲不熟之蟠桃醉後怒筆灰寒火冷燈微明虛簷㵼雨如傾瓶酒酣耳熱身體輕撫􅈾大吼黃鍾聲怒目直視如流星拔劒擊柱傍人驚丈夫寧可五鼎烹安得容此吞舟鯨雲南老人行雲南老人老無力藜杖支腰壠頭立道逢蜀客話平生時𣸪仰天長太息自言貫屬瀘水湄瀘水邊徼濱獠夷夷人之性類蛇豕頻肆虻螫為瘡痍十五年前多寇盜一境騷然不相保民禾收刈虜人家戎馬偷􅋦汶江草近來風俗多變移卷却旌旗張酒旗牛羊村落晚晴處烟火樓臺日暮時兩眼昏花兩鬢雪喜見升平好時莭茅屋橫吹一笛風野店携歸半瓶月問翁致此何因緣道是江陽太守賢鼓琴絃歌下生事十年靜治安吾邊鄭國國僑去已久誰信人間凖前有異日刋為德政碑請問雲南隴頭叟憶昔行憶昔方東來亭傳荒荆棘風庭紅葉乾雨砌蒼苔濕飢虎撥門開哀禽向人泣十載却西還亭傳已完葺青鎖揖江山朱欄趂階級行旅糧不賫大路遺敢拾蜀道無難易人心自寬急寄言守亭者勿使狐狸入午起行細藤簟展波紋緑瓦枕竹床殊不俗白日寥寥午眠熟起來更覺精神足萬緣寂靜數甌茶千偈消磨棊一局此間真味有餘清未羡紛紛厭梁肉張求張求一老兵著帽如破斗賣卜益昌市性命寄杯酒騎馬好事久金錢投瓮牖一語不假借意自有臧否雞肋巧安拳未省怕嗔毆坐此益寒酸餓理將入口未死且强項那睱顧炙手士莭久凋喪䑛痔甜不嘔求豈知道者議論無所苟吾寧從之逰聊以激衰朽擊劔歌三尺光芒耀霜雪長安使氣為任俠閒對要離壯泪垂醉叱荆軻怒眥裂天下承平猛士間夜半無人自彈鋏會須東海斬長鯨歸來倒瀝腥臊血黎城酒黎城酒貴如金汁解盡寒衣才一吸獄曺參軍到骨窮簿書吻燥何由􅊜夜來細雨落簷花對客惟有嘗春茶明朝踏月趂早衙免使路中逢麴車題崔令曲海後崔令飲酒五七斗崔令唱辭一千首時時浪飲輒高歌利鎖名韁總無有人稱雀令為顛狂我知崔令非顛狂承流宣化有餘力髙歌浪醉也何妨晝寢效魯直雨餘熟喘殊喊呀坐翻故𥿄腰足麻鋪陳枕簟搴青紗倒床不復知橫斜夢魂飛揚逺還家故人見我一笑譁須臾睡覺衙鼓撾墻頭瞑雀聲槎槎城上怨雨似懸河風似箭風號雨馳寒刮面何處巡城老健兒城上謳吟自哀怨不知底事偏苦傷聲髙聲低哀思長戍邊役重畏酷法去國年多思故鄉城上歌時夜方半正是孤齊醉魂斷和凨和雨兩三聲推枕投衾坐長嘆傳聞黠虜動熙河戰士連年不解戈今夜風號雨馳處城上哀怨知幾何别句永叔巴江艷艷巴山空十里五里蕉花紅少年鋭意立功業破烟一棹輕如風却思三歲相歡聚說劔論詩輕李杜平生不作兒女悲今日為君重回顧春日雜言官居雙海棠何年植庭中凨流二月間照耀一室紅渾家惜此花具飲呼乃翁翁雖怯杯觴意難逆兒童臘􅌬十分深白眼一引空醉時忘華巔浩歌滿東風又庭前楊栁枝春來蔚然緑老翁髮邊青已去不可𣸪夆杯屬春風此理竟如何轉首飛楊花春風自蹉跎覽鏡昔我先君子德與形氣俱褒衣佩長劒軒昻真丈夫我生困多難乃類山澤癯頭目頗麞鼠愧忝虎豹駒太倉五斗米足奍蕞爾􅥟誰能向天子號飢訴侏儒客至山頭竹萬箇風來玉相戞下有屋數間䔥然如佛剎門無車馬喧幽徑芳草茁隔窗識君聲遽起投筆札黃雞未啄黍環堵無可殺園𬞞煮淡泊山泉啜甘􅉸何以樂嘉賓春禽日嘲􅑜寄題張志行醉峯亭先生饒醖藉表裡皆純粹獨推糟與粕施之為政事百里飲其德陶陶有歡意餘醺落嘉陵一江醇酒味沉酣到山骨頽然偃蒼翆亭中時把酒坐對青山醉醉鄉在何許祗此中間是先生况多文為續醉鄉記聞東坡貶惠州元氣脫形數運動天地內東坡未離人豈比元氣大天地不能容伸舒輒有礙低頭不能仰閉口焉敢咳東坡坦率老局促因難耐何當與道俱逍遙天地外寄郭潜夫我昔逰瀘江泛舟奔楚宫黔江自南來胥㑹涪之東黔江清且碧瀘江濁而紅紅碧不相入分流如卧虹群潴激湍濤洶湧成戰攻須臾尽變濁混混顔色同清固不勝濁此理天下通君視開成間牛李爭長雄要之贊皇子不勝太牢公物理自古然徘徊嘆無窮眉山唐先生文集卷十七眉山唐先生文集卷十七目眉山唐庚子西雜文歸歟賦古體詩陌上桑曲白頭吟結客少年場五雜爼公無渡河明妃曲舞馬行明皇時教坊舞馬百匹謂之某家嬌其曲謂之傾杯樂天寶之亂此馬流落人間魏博田承嗣得之𥘉不識也已而承嗣大宴軍中酒行樂作馬聞樂聲起舞承嗣以為妖命殺馬豫讀其說而悲之作舞馬行風樹吟子路有言樹欲靜而風不止子欲奍而親不待豫三復而悲之故作風樹吟以終其意戲題醉仙崖古生走筆贈仙姑醉後怒筆雲南老人行憶昔行午起行張求擊劔歌黎城酒題崔令曲海後晝寢效魯直城上怨别句永叔春日雜言又覽鏡客至寄題張志行醉峯亨聞東坡貶惠州寄郭潜夫
