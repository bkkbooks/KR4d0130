front:
  text: 眉山唐先生文集卷十八
  hash: sha256:f2d1f73acedfa1dc44948614b7721250bef008fa57b14046c38fb9be193d7bbd
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_018-1a}
body:
  text: 眉山唐庚子西古體詩病鶴行鶴兮鶴兮何處來秋江靜兮蘆花開波浪浸月白皚皚千聲萬聲鳴哀哀不飛不翔不飲啄骨脊稜稜瘦如削氷姿玉質僅生存雪羽霜毛半零落隺兮寉兮何鬱鬱我知爾是冲天物芝田就飬孤高情瑶池洗出神仙骨傳聞仙島冥冥中水晶甃作蓬菜宫祥烟瑞霧常濛濛好將六翮搏天凨寄郭虞卿讀書老益苦瀟灑比元淡直行不由徑慎獨肯欺暗如何已鴻冥猶𣸪見蜉撼寡和郢中曲忍辱漁陽摻斗筲彼常態義命吾何憾屈伸固有時佳境當徐啖題溫泉觀溫泉宫裡行人宿􅊜泉池上行人浴人自多情感盛衰泉固無心任榮辱細路蟠蟠入踈竹萬年秦山一作万里晴川皆在目吾皇高拱九重深一作不若雲青山一枝松蘿為誰緑題洪川驛倦遊征人鬢欲絲膏車秣馬東南馳出門四顧迷路歧閉户却坐愁支頥魚生釡灶鼠巢枝爾畦千里成陂池吾皇致治方無為淫雨破塊天何如勸君飲酒君勿疑行使止尼良由時未逃形數皆有涯此獨未信無窮期食笋行半夜春山試雷雨驚起蟄龍𥘉出土野人不惜蒼苔古掘得嘉餐自燒煮滿􅐻明玉逺飄風一箸鱸魚味差苦竹齊食罷竹隂午竹裏行吟傲簮組君誇食肉君固卑我誇食笋我亦癡阿蠻豐膩飛燕瘦意態雖異要皆竒君不見天隨先生貧食𣏌又不見關中客卿肥刺齒豐儉不齊皆有理彼此相忘聊爾耳題史廷直郊居黃金轉手盡郊居掩清晝山容凉肺腑竹意净懷䄂入門編簡香無復更銅臭君看道南院豈識元德秀棕花斫破夜義頭取出仙人掌鮫人滿腹珠鮰魚出新網送王觀𣸪交代文正活國手頗恨見不及宦逰識其孫想像髙冠岌豈但為交承自是賢友執尤喜談性命微到鬼神泣吾曺飲滄海百川資一吸失腳沙土間卷舌䑛泥汁焉依既云久􅎔别百憂集去去自護持雨荷終不􅊜戲贈王推官誠中乃祖賦混成津涯極深逺家學到諸郎文字復清婉今作劾鼠吏于理誠未穩怒草三千牘馳驛奏龍衮上問今安在幕聀𥙷閬苑召賜數刻對歎息相見晚總未置青瑣亦應校黃本九萬里扶搖忽若馳峻坂送趙元恩司法誰不從王事夙夜獨匪懈休沐猶坐曺伏日不歸𪠘平生熟人法餘事工小楷自稱霹靂手作縣真癬疥鮑宣雖强項􅎔事中實駭從君學吏禮稍稍識起拜今當告别去何以贈行邁二十罰自親此理須少戒送扈大夫端叟平生未識韓不碩封萬户方幸得依劉未幾公已去三年此晋滯一味惟忠恕江水倒隨人劍嶺橫遮路那知黃門手就寫碧蘚賦空聞隴上兒擊塊歌五袴到任後寄家兄君子所就三為食最為下起家仰寸祿此實下焉者南山無敝廬千里就官舍但使食有魚敢言曺乏馬同寮皆故人每事相假借况𣸪官長賢醉歸應不罵送鄉人下弟歸鄉閉門誦詩史已讀萬卷破飬氣塞天地不受一毫挫名聲落空廓蹤跡長坎坷塵埃相邂逅齒髮嗟老大文章心未死功業手猶唾世事若循環天理猶轉磨朝得暮或失俯弔仰輒賀行見風雲㑹驚起南陽卧送趙安道下苐大官危小官卑君不得官君勿悲君不見前日宰相今海涯胡椒八百斛流落知為誰又不見州縣官折腰事細兒嘗憂一語不中治敢對西山笏拄頥大官危小官卑君不淂官君勿悲願君酒量如鴟夷勿作瓶罌居井眉與君賭取醉為期明日烏帽風披披代先狀寄孫熙叔疇昔告行邁别酒月中把蹭蹬我已歸徘徊君尚且相逢忽驚怪已覺都幻假但當呼阿素預遣置若下略聽誦靈光未敢賦換馬一醉洗塵埃萬事真土苴郡人獻笋守以分餉郡寮而吏獨見遺守知之命追賜焉蓋不出既久而人忘之也因成一篇坐穩膝生踝凝塵罩藍版出少顔面生未熟城市眼爭席人相忘饋肉禮非簡本自無光彩不必更埋鏟自知吾老矣置酒具瓶盞起舞屬細君相對一笑莞友人還鄉有感飢烏啞啞枝上啼秋凨䔥蕭吹客衣儒冠誤身不得歸女癡妻寒病乳老歸來聚首貧亦好我固知之歸不早束書十載逰長安一官逺謝醫卜賢託生長鑱真可憐君今别我還故里想見親朋問所以為言憔悴京城裡哀賢仁廟乃文考𥙿陵真武王先帝幾于成主上賢于康時亦有二子採薇登首陽其一猶行歌其一今云亡功在百世外懦夫心膽張齊侯但多馬名滅身未彊讀邸報當今求多聞取士到蓬蓽時時得新語誰謂山縣僻昨日拜御史今日除諌官立朝無貟漢恩厚論事不妨朝氏安臺省諸公登衮衮閉門熟睡黃紬穩訊囚參軍坐廳事據案嚼齒牙引囚到庭下囚口爭喧譁參軍氣益振聲厲語更切自古官中財一一民膏血為吏掌營鑰反竊以自私人不汝誰何如摘頷下髭事老惡自彰證佐日月明推窮見毛􅍺那可口舌爭有內奮然出請與參軍辨參軍心如眼有睫不自見參軍在場屋薄薄有聲稱只今作參軍幾時淂騫騰無功食國祿去竊能幾何上官乃容隱曽不加譴訶囚今信有罪參軍冝揣分等是為貧計何苦獨相困參軍噤無語反顧吏卒嗟包褁琴與書明日吾歸休程使君生辰歌使君來分銅虎符哺飬百姓如哺雛設􅓡在旦人奔走夆首爭為使君壽但碩使君如乃翁福德種種皆圓融官至大中年九十諸郎鳴玊左右立寄杜蓬州閬中勝事不妨竒舊來僻佐人誰知祗緣乃祖腸斷句名與江水東南馳閬人德之不敢忘遺祠今在南山上壁間畫得太瘦生想是當年苦吟樣寄時模本博新詩為我落筆揮珠璣君家自是箇中腳會道春從沙際歸中秋遇雨感懷呈世澤彥直𥘉逰東都年二十清歡趂得中秋及髙陽會中酒徒集惠和坊裡繡鞍入蟹螯嘗新左手執雞頭未老搓玉粒杯行到手不待揖明月清風供一吸纏頭不惜傾箱給倚賴决科如俯拾誰知得官反拘縶此景此歡那復緝今歲中秋雨如泣窮山牢落秋光濕孤燈熒熒照書笈屈指流年如箭急通判蘇君俞見和復次韵答之公才過人其倍十詞藝即今誰跂及萬卷收藏冨編集詩人閫域稱優入西川書生學穿執朅來東遊為祿粒十分折腰敢長揖欲吐壯懷還自吸朋從調笑閗捷給狂言偶發難收拾語意俳諧韵牽縶不敢獻公公密緝報章大是鮫人泣一一珠璣落圓􅊜自慚思竭如空笈口吻悲吟知窘急喜雨呈趙世澤去年雨多憂水潦今年雨少憂枯槁都緣縣政失中和水旱年年勤父老前時雲起雨欲落夜半風來還一掃明朝引首望雲漢屋上晨暾仍杲杲賦輸百萬未破白簿腳何緣淂勾倒上書自劾欲歸去老婦挽衣傍奪藁技窮往訴北山神是夕沛然償祈禱稻畦罷亜勢已活竹裏蕭踈聲更好故應神意閔孤拙苟免歲中書下考便安杵臼伺秋成雲子滿田行可搗蓬州杜使君洪道屢稱我于諸公聞之愧甚為詩謝之去天一尺古蓬州年來除守得勝流渠家本是城南杜詩律賢我三千籌禮記投壷某折于某若干如此才髙却解事入眼人才皆可意他邑猶分刺史天片言每為將軍地故應憐我退無田力相推挽令向前傍人聞說皆撫掌竹竿那使鮎魚緣嘲陸羽陸子作茶經竟為茶所困其中無所主復著毁茶論簡賢傲長者彼自愚不遜茶好固自若于我有何恨便當脫野服洗盞為一獻飲罷挈茶去譬彼澆畦畹君看襧正平意氣真能健逹與不達人何啻相千萬眉山唐先生文集卷十八眉山唐先生文集卷十八目唐庚子西古體詩病鶴行寄郭虞卿題溫泉觀題洪川驛食笋行題史廷直郊居棕花送王觀𣸪交代戲贈王推官誠中送趙元恩司法送扈大夫端叟到任後寄家兄送鄉人下第歸鄉送趙安道下第代先狀寄孫熙叔郡人獻笋守以分餉郡寮而吏獨見遺守知之命追賜焉蓋不出既久而人忘之也因成一篇友人還鄉有感哀賢讀邸報訊囚程使君生辰歌寄杜蓬州中秋遇雨感懷呈世澤彥直通判蘇君俞見和復次韵答之喜雨呈趙世澤蓬州杜使君洪道屢稱我于諸公聞之愧甚為詩謝之嘲陸羽
