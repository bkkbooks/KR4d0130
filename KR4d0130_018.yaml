front:
  text: 眉山唐先生文集卷十八
  hash: sha256:f2d1f73acedfa1dc44948614b7721250bef008fa57b14046c38fb9be193d7bbd
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_018-1a}
body:
  text: 眉山唐庚子西古体詩病鶴行鶴兮鶴兮何䖏来秋江静兮蘆花開波浪浸月白皚皚千声萬声鳴哀哀不飛不翔不飲啄骨脊稜稜痩如削氷姿玉質僅生存雪羽霜毛半零落隺兮寉兮何欝欝我知爾是冲天物芝田就飬孤高情瑶池洗出神仙骨傳聞仙島冥冥中水晶甃作蓬菜宫祥烟瑞霧常濛濛好将六翮搏天凨寄郭虞卿讀書老益苦潇洒比元澹直行不由徑慎獨肯欺暗如何已鴻冥猶𣸪見蜉撼寡和郢中曲忍辱漁陽掺斗筲彼常態義命吾何憾屈伸固有時佳境當徐㗖題温泉觀温泉宫裡行人宿􅊜泉池上行人浴人自多情感盛衰泉固無心任荣辱細路蟠蟠入踈竹萬年秦山一作万里晴川皆在目吾皇高拱九重深一作不若雲青山一枝松蘿爲誰緑題洪川驛倦㳺征人鬂欲絲膏車秣馬東南馳出門四頋迷路歧閉户却坐愁支頥魚生釡灶䑕巣枝尔畦千里成陂池吾皇致治方無爲淫雨破塊天何如劝君飲酒君勿疑行使止尼良由時未迯形数皆有涯此独未信無窮期食笋行半夜春山試雷雨驚起蟄龍𥘉出土野人不惜蒼苔古掘得嘉飡自燒煮滿􅐻明玉逺飄風一箸鱸魚味差苦竹齋食罷竹隂午竹裏行吟傲簮組君誇食肉君固卑我誇食笋我亦痴阿蛮豊膩飛燕瘦意態雖異要皆竒君不見天隨先生貧食𣏌又不見関中客卿肥刺齒豊儉不齊皆有理彼此相忘聊尔耳題史廷直郊居黄金轉手盡郊居掩清晝山容凉肺腑竹意净怀䄂入門編簡香無復更銅臭君㸔道南院豈識元徳秀棕花斫破夜义頭取出仙人掌鮫人滿腹珠鮰魚出新網送王覌𣸪交代文正活國手頗恨見不及宦逰識其孫想像髙冠岌豈但為交承自是賢友执尤喜談性命㣲到鬼神泣吾曺飲滄海百川資一吸失脚沙土間卷舌䑛泥汁焉依既云乆􅎔别百憂集去去自䕶持雨荷終不􅊜戲贈王推官誠中乃祖賦混成津涯極深逺家斈到諸郎文字復清婉今作劾䑕吏于理誠未穏怒草三千牘馳驛奏龍衮上問今安在幕聀𥙷閬苑召賜数刻对歎息相見晚縂未置青瑣亦應校黄本九萬里扶揺忽若馳峻坂送趙元恩司法誰不從王亊夙夜独匪懈休沐猶坐曺伏日不帰𪠘平生熟人法餘亊工小楷自称霹靂手作縣真癬疥鮑宣雖强項􅎔亊中寔駭從君斈吏礼稍稍識起拜今當告别去何以贈行邁二十罰自親此理湏少戒送扈大夫端叟平生未識韓不碩封萬户方幸得依刘未㡬公已去三年此晋滯一味惟忠恕江水倒隨人劍嶺横遮路那知黄門手就冩碧蘚賦空聞隴上児撃塊歌五袴到任後寄家兄君子所就三為食最為下起家仰寸禄此寔下焉者南山無敝廬千里就官舎但使食有魚敢言曺乏馬同寮皆故人每亊相假借况𣸪官長賢醉帰應不罵送郷人下弟帰郷閉門誦詩史已讀萬卷破飬氣塞天地不受一毫挫名声落空廓蹤跡長坎坷塵埃相邂逅齒髮嗟老大文章心未死功業手猶唾世亊若循環天理猶轉磨朝得暮或失俯弔仰輙賀行見風雲㑹驚起南陽卧送趙安道下苐大官危小官卑君不得官君勿悲君不見前日宰相今海涯胡椒八百斛流落知為誰又不見州縣官折腰亊細児尝憂一語不中治敢对西山笏拄頥大官危小官卑君不淂官君勿悲願君酒量如䲭夷勿作瓶甖居井眉與君賭取酔為期明日烏㡌風披披代先状寄孫熈叔疇昔告行邁别酒月中把蹭蹬我已帰徘徊君尚且相逢忽驚怪已斍都幻假但當呼阿素預遣置若下略聽誦灵光未敢賦換馬一酔洗塵埃萬亊真土苴郡人献笋守以分餉郡寮而吏独見遺守知之命追賜焉盖不出既乆而人忘之也因成一篇坐穩膝生踝凝塵罩藍版出少顔面生未熟城市眼争席人相忘饋肉礼非簡本自無光彩不必更埋鏟自知吾老矣置酒具瓶盞起舞属細君相对一笑莞友人還郷有感飢烏唖唖枝上啼秋凨䔥蕭吹客衣儒冠誤身不得帰女痴妻寒病乳老帰来聚首貧亦好我固知之帰不早束書十載逰長安一官逺謝医卜賢託生長鑱真可怜君今别我还故里想見親朋問所以為言憔悴京城裡哀賢仁庙乃文考𥙿陵真武王先帝㡬于成主上賢于康時亦有二子採薇登首陽其一猶行歌其一今云亡功在百世外懦夫心胆張齊侯但多馬名㓕身未彊讀邸报當今求多聞取士到蓬蓽時時得新語誰謂山縣僻昨日拜御史今日除諌官立朝無貟漢㤙厚論事不妨晁氏安䑓省諸公登衮衮閉門熟睡黄紬穩訊囚参軍坐廳亊㩀案嚼歯牙引囚到庭下囚口争喧譁參軍氣益振声厲語更切自古官中財一一民膏血為吏掌营鑰反窃以自私人不汝誰何如摘頷下髭亊老悪自彰証佐日月明推窮見毛􅍺那可口舌争有内奮然出請與參軍辨參軍心如眼有睫不自見參軍在場屋薄薄有声称只今作參軍㡬時淂騫騰无功食國禄去窃能㡬何上官乃容隱曽不加譴訶囚今信有罪参軍冝揣分䓁是爲貧計何苦独相困參軍噤無語反頋吏䘚嗟包褁琴與書明日吾帰休程使君生辰歌使君来分銅虎符哺飬百姓如哺雛設􅓡在旦人奔走夆首争爲使君壽但碩使君如乃翁福徳種種皆圓融官至大中年九十諸郎鳴玊左右立寄杜蓬州閬中勝亊不妨竒舊来僻佐人誰知祗縁乃祖腸断句名與江水東南馳閬人徳之不敢忘遺祠今在南山上壁間畫得太痩生想是當年苦吟様寄時模本博新詩爲我落筆揮珠璣君家自是箇中脚会道春從沙際帰中秋遇雨感懐呈世澤彦直𥘉逰東都年二十清欢趂得中秋及髙陽會中酒徒集惠和坊裡綉鞍入蟹螯尝新左手執雞頭未老搓玉粒盃行到手不待揖明月清風供一吸纏頭不惜傾箱給倚頼决科如俯拾誰知得官反拘縶此景此歡那復緝今歲中秋雨如泣穷山牢落秋光湿孤灯荧荧照書笈屈指流年如箭急通判蘇君俞見和復次韵荅之公才过人其倍十詞藝即今誰跂及萬卷收藏冨編集詩人閫域称優入西川書生學穿執朅来東㳺為禄粒十分折腰敢長揖欲吐壮怀还自吸朋従調笑閗㨗給狂言偶發难收拾語意俳諧韵牽絷不敢献公公宻緝报章大是鮫人泣一一珠璣落圓􅊜自慚思竭如空笈口吻悲吟知窘急喜雨呈趙世澤去年雨多憂水潦今年雨少憂枯槁都縁縣政失中和水旱年年勤父老前時雲起雨欲落夜半風来还一掃明朝引首望雲漢屋上晨暾仍杲杲賦輸百萬未破白簿脚何縁淂勾倒上書自劾欲帰去老婦挽衣傍奪藁技穷徃訴北山神是夕沛然償祈禱稲畦罷亜势已活竹裏蕭踈声更好故應神意閔孤拙苟免歲中書下考便安杵臼伺秋成雲子滿田行可擣蓬州杜使君洪道屡称我于諸公聞之媿甚為詩謝之去天一尺古蓬州年来除守得勝流渠家本是城南杜詩律賢我三千籌礼記投壷厶折于厶若干如此才髙却觧亊入眼人才皆可意他邑猶分刺史天片言每為将軍地故應怜我退無田力相推挽令向前傍人聞説皆撫掌竹竿那使鮎魚縁嘲陸羽陸子作茶經竟為茶所困其中無所主復著毁茶論簡賢傲長者彼自愚不遜茶好固自若于我有何恨便當脱野服洗琖為一献飲罷挈茶去譬彼澆畦畹君㸔襧正平意氣真能徤逹與不達人何啻相千萬眉山唐先生文集卷十八眉山唐先生文集卷十八目唐庚子西古体詩病鶴行寄郭虞卿題温泉覌題洪川驛食笋行題史廷直郊居棕花送王覌𣸪交代戯贈王推官誠中送趙元恩司法送扈大夫端叟到任後寄家兄送郷人下第帰郷送趙安道下第代先状寄孫熈叔郡人献笋守以分餉郡寮而吏独見遺守知之命追賜焉盖不出既乆而人忘之也因成一篇友人还郷有感哀賢讀邸報訊囚程使君生辰歌寄杜蓬州中秋遇雨感怀呈世泽彦直通判蘇君俞見和復次韵荅之喜雨呈趙世澤蓬州杜使君洪道屡称我于諸公聞之媿甚為詩謝之嘲陸羽
