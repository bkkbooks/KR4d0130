front:
  text: 眉山唐先生文集卷二十
  hash: sha256:b97beae114ecf2a5a926df79b66b754596d231cfab43163c90a854e2b9b17f73
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_020-1a}
body:
  text: 眉山唐庚子西古體詩會飲尉斫效八仙體尉公不忝東吳英坐上拍滿樽中盈令尹學道眼目明作佛肯後靈運成户掾句法令人驚登壇抗臂從我盟法曺靜如不自鳴胸中自有百萬兵㑹稽少年冨才情墨竹中含楚辭聲泮宫老人駕虛名賦詩飲酒畏後生古風贈謝與權行其一錦囊琭琭竒經笥便便腹幾擬問天公如何飲不足鳴梟愛好音璞石琢良玉為報採詩人文翁能化蜀其二我有無弦琴無絃亦無徽忘言乃能解得意心自知山髙流水深尚笑鍾子期為君奏此曲改調作别離其三生逢堯舜君四門方穆穆賢俊日登庸不聞澗阿獨碩君攄賢業邦方有道榖母縮䄂間手軒車逺行復程義父挽詩門户金張貴規摹鄒魯儒平生氷玉姿不受紈綺汙肯顧博餅印甘為小兒呼舊來便劇邑下車成袴𥜗暮年賦從軍隻箸安邊隅子識墓中人永懷屋上烏近體詩談勉翁詩章老夫所畏而以䏻問于不能此殊不可曉也愧而作詩髙才乃爾信虛名句法時來就考評投社得君真惡客專門知我有先生文章已逼三都賦行輩猶推四海兄細看劉侯詩自好不應便伏老弥明既以前韵贈勉翁𣸪懷庭玉因為次韵千金駿骨買虛名驥老通衢價未平逐去定知窮不死向來元以句為生東凨又見一本作囀鶯朋友北信難慿㕍弟兄欲寄此懷惟有月天涯分與故人明峽路十韵上馬復下馬羸軀不暫停鈴聲今古道栁色短長亭亂石波翻雪洪崖岫破青羊歸㳂絶壁鹿飲入寒汀兩岸渾遮月中天略見星雲來通玉壘江去背滄溟春少花難折霜多葉易零愛山猶著物畏棧未忘形事業知安在艱危已偹經宦逰方此始何日遂鴻冥清明日示弟姪歲華忽忽又清明憶與諸生試集英金瑣掣雷開右掖紵欄披雪照升平立班雉尾身疑夢茂對龍顔目乍驚百拜起居分左右十年胸臆展縱橫愧無長䇿裨千慮敢昧𥘉心苟一名三道豈䏻窺董傅乙科今復愧匡衡始吾進取恬無意看汝光華便是榮他日當求田二頃杖藜自足過浮生赴益昌六言豈有登臺袞袞謾令去國遲遲南越纓方欲請北山文莫相移又樂聀如含酒美判司敢嘆官卑㑹待薛疏供帳歸從朱老裁榿上益昌守李大夫標致自清流知名二十秋諸儒堂上席群客帳前籌南後衣拖繡西來幕建油食葱逢屈突封户識荆州𥜗袴三巴國鞬􅐤九郡侯故事寧武軍莭制諸郡道興期變魯文盛擬從周主𬋩學事訟矢雖關聼賓壺不廢投本府訟牒至冗公處之有餘地未妨登衮衮暫屈布優優望府多竒士華顛愧督郵﨑嶇緣底事憔悴此重逰學目江山是翻身歲月遒客愁移帶眼鄉思詠刀頭技癢論文在心闌觸事休那堪趨冉冉祗是判悠悠揣分冝長引憂貧𣸪少留長𥚑何處曵館閣倘容鄒上􅒩使持莭三千里提封一十州天文占使入地上覺錢流吏有言前信農無賦外求事投餘刃畢政本大綱休惠澤坤維潤威凨井絡秋利源乾復溢民瘼痼還瘳德以剛柔濟才兼巨細收道興期變魯文盛擬從周即給中臺筆行拋外計籌孤生真自幸微祿每容偷未可長間去須為寸進謀祗應青白眼䏻為辨薰蕕石漕生日夢斷繼熊夜祥呈饋鯉𥘉固應賢有後誰謂慶無餘為國家相似憂民子不如符分四任虎金佩十年魚未𥙷三公衮聊分八使車權衡公選格陵阜冨軍儲閥閲氊猶在朝廷席正虛稱觴勤祝壽二十考中書翟提倉生日奎畢夜騰輝英靈出帝畿陶門八翼俊郤桂一枝巍使斧今持鉞經編舊絶韋政將儒雅飾學造道心微士論冝金馬君恩且繡衣德純渾可飲才俊不容晞盛世方連茹孤生耻食薇𥘉從􅃮雕仕全拙漢隂機薺舌猶餘苦蓴心未得歸大椿祈不老烏鵲正求依家提倉生日銅梁蟠地角此日誕英竒世路方歌側心田自坦夷著書楊子宅講學仲舒帷庠序聲名久朝廷議論推受釐才賜對攬轡便逢時誰道儒官冷如今使莭持幸全陳孺社喜遇紫芝眉更祝靈椿夀驚烏托穩枝錢憲生日何處産英竒河南定鼎基珠傾鮫室寶蘭長謝庭枝事業堪臺省功名暫海沂案成張說口德滿紫芝眉和氣真堪掬清風凛欲吹每因憐傳癖未甚責書癡盛德雖忘報私心實自知遐齡何以祝華表崔歸時張嘉父生日靈光不自藏今日誕忠良揮麈雲騰湧峩冠隺瘦長彊明心似月勤幹鬢成霜赤縣鳴琴宓清朝攬轡滂權衡公調選陵阜冨餱糧除惡雖云切憂民只恐傷行看星使動已覺省闌香壽考何須祝傳家辟榖方送宋衮臣赴任浙憲綵衣入蜀記當年金紫重來抱使權擁鉞止奸民奠枕揚鞭畫計地流錢汝南評論嘗相借圯上文書獨見傳政目告成才五月歲頭未改恰三遷秦雲慘雪趨朝路吳雨肥梅按部天名位愈隆人愈逺從今帝席為誰專送趙世澤供奉君豈蹶張手是間聊自藏兒童歌楚些婢子誦靈光契分詩交密形骸酒遣忘方依益者友遽理舍人裝雞黍它年約君嘗約豫卜居常潤山河白日長陽關那忍聼衰老易悲傷逰仙雲宫出郭三竿日橫江一葦航雀飛田有麥蠶罷野無桑下馬危梯􅉸開門古殿香雨餘丹井溢苔入醮壇荒畫老星辰動碑殘歲月亡鐘聲落城市符祝走村鄉野鳥啼巴蜀山崖刻漢唐臨歸更回首惜此一襟凉直舍書懷寸枉非吾志休論尺與尋黃披終日卷青對十年襟風眩藥囊雨昏茶捥深楊雄名宦思都向草玄沉又箇處本來冷此時仍更清擁爐成久坐曵杖却徐行瞑色侵書帙秋隂入鼓聲悠然索馬去祗此是功程書鄭撫幹詩卷後本合金閨去翻來玊壘逰邊塵凝不動詩債索相酬自得清新庾非關煆錬周雲臺家體格文館祖風流兾北雖蒙顧遼東祗自羞好傳江上女歌向竹枝秋哀詞雲霄才業逝川東學易年齡一夢中春殿昔抽蟾挂緑夜臺今隕幕蓮紅殘章斷稿塵埃滿别院踈簾笑語空千古龜山原口墓暝烟䔥索白楊風又文章泮水動英逰玉殿騰名十四秋蓮幕未平臺省志薤歌潜引古原愁青雲義氣千金薄緑綬恩綸一命休科第不窮餘訓在鳯毛森秀紹箕裘籌筆鋪脅寡欺孤罪未訶先生此意竟蹉跎謾令鄴下癡兒女駭汗驚惶欲渡河眉山唐先生文集卷二十眉山唐先生文集卷二十目唐庚子西古體詩㑹飲尉斫效八仙體古風贈謝與權行其一其二其三程義父挽詩近體詩談勉翁詩章老夫所畏而以䏻問于不能此殊不可曉也愧而作詩既以前韵贈勉翁復懷庭玉因為次韵峽路十韵清明日示弟姪赴益昌六言又上益昌守李大夫上漕使石􅒩生日翟提倉生日家提倉生日錢憲生日張嘉父生日送宋衮臣赴任浙憲送趙世澤供奉逰仙雲宫直舍書懷又書鄭撫幹詩卷後哀詞又籌筆鋪
