front:
  text: 眉山唐先生文集卷二十
  hash: sha256:b97beae114ecf2a5a926df79b66b754596d231cfab43163c90a854e2b9b17f73
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_020-1a}
body:
  text: 眉山唐庚子西古体詩會飲尉斫効八仙体尉公不忝東吴英坐上拍滿樽中盈令尹斈道眼目明作佛肯後灵運成户掾句法令人驚登壇抗臂從我盟法曺静如不自鳴胸中自有百萬兵㑹稽少年冨才情墨竹中含楚辞声泮宫老人駕虚名賦詩飲酒畏後生古風贈謝與权行其一錦嚢琭琭竒經笥便便腹㡬擬問天公如何飲不足鳴鴞爱好音璞石琢良玉為报採詩人文翁能化蜀其二我有無弦琴無絃亦无徽忘言乃能觧得意心自知山髙流水深尚笑鍾子期為君奏此曲改調作别離其三生逢堯舜君四門方穆穆賢俊日登庸不聞澗阿独碩君攄賢業邦方有道榖母縮䄂間手軒車逺行復程義父挽詩門户金張貴規摹鄒魯儒平生氷玉姿不受紈綺汙肯頋博餅印甘爲小児呼舊来便劇邑下車成袴𥜗暮年賦從軍隻箸安邊隅子識墓中人永怀屋上烏近体詩談勉翁詩章老夫所畏而以䏻問于不能此殊不可曉也媿而作詩髙才乃尔信虚名句法時来就考評投社得君真悪客專門知我有先生文章已逼三都賦行軰猶推四海兄細㸔刘侯詩自好不應便伏老弥明既以前韵贈勉翁𣸪怀庭玉因為次韵千金駿骨買虚名驥老通衢價未平逐去定知穷不死向来元以句為生東凨又見一本作囀鶯朋友北信难慿㕍弟兄欲寄此懐惟有月天涯分與故人明峡路十韵上馬復下馬羸軀不暫停鈴声今古道栁色短長亭乱石波翻雪洪崖岫破青羊帰㳂絶壁鹿飲入寒汀両岸渾遮月中天畧見星雲来通玉壘江去背滄溟春少花难折霜多葉易零爱山猶著物畏棧未忘形亊業知安在艰危已偹經宦逰方此始何日遂鴻冥清明日示弟姪歲華忽忽又清明憶與諸生試集英金瑣掣雷開右掖紵欄披雪照升平立班雉尾身疑梦茂对龍顔目乍驚百拜起居分左右十年胸臆展縦横愧無長䇿裨千慮敢昧𥘉心苟一名三道豈䏻窺董傅乙科今復愧匡衡始吾進取恬無意㸔汝光華便是荣他日當求田二頃杖藜自足過浮生赴益昌六言豈有登䑓袞袞謾令去國遲遲南越纓方欲請北山文莫相移又楽聀如含酒美判司敢嘆官卑㑹待薛䟽供帳帰從朱老裁榿上益昌守李大夫標致自清流知名二十秋諸儒堂上席群客帳前籌南後衣拖繡西来幕建油食葱逢屈突封户識荆州𥜗袴三巴國鞬􅐤九郡侯故亊寕武軍莭制諸郡道㒷期変魯文盛擬從周主𬋩斈亊訟矢雖関聼賓壺不廢投本府訟牒至冗公処之有餘地未妨登衮衮暫屈布優優望府多竒士華顛媿督郵﨑嶇縁底亊憔悴此重逰斈目江山是翻身歲月遒客愁移帯眼郷思詠刀頭技癢論文在心闌触事休那堪趋冉冉祗是判悠悠揣分冝長引憂貧𣸪少留長𥚑何処曵舘閣倘容邹上􅒩使持莭三千里提封一十州天文占使入地上斍錢流吏有言前信農無賦外求事投餘刄畢政本大綱休惠澤坤維潤威凨井絡秋利源乹復溢民瘼痼还瘳徳以剛柔濟才兼巨細收道㒷期変魯文盛擬從周即給中䑓笔行抛外計籌孤生真自幸微禄每容偷未可長閑去湏爲寸進謀祗應青白眼䏻爲辨薫蕕石漕生日夣断継熊夜祥呈饋鯉𥘉固應賢有後誰謂慶無餘爲國家相似憂民子不如符分四任虎金佩十年魚未𥙷三公衮聊分八使車权衡公選格陵阜冨軍儲閥閱氊猶在朝廷席正虚称觴勤祝壽二十考中書翟提倉生日奎畢夜騰輝英灵出帝畿陶門八翼俊郤桂一枝巍使斧今持鉞經編舊絶韋政将儒雅餙斈造道心微士論冝金馬君恩且繡衣徳純渾可飲才俊不容晞盛世方連茹孤生耻食薇𥘉從􅃮雕仕全拙漢隂機薺舌猶餘苦蓴心未得帰大椿祈不老烏鵲正求依家提倉生日銅梁蟠地角此日誕英竒世路方歌側心田自坦夷著書楊子宅講斈仲舒帷庠序声名乆朝廷議論推受釐才賜对攬轡便逢時誰道儒官冷如今使莭持幸全陳孺社喜遇紫芝眉更祝灵椿夀驚烏托稳枝錢憲生日何䖏産英竒河南定鼎基珠傾鮫室宝蘭長謝庭枝亊業堪䑓省功名暫海沂案成張說口徳滿紫芝眉和氣真堪掬清風凛欲吹每因怜傳癖未甚責書痴盛徳雖忘报私心寔自知遐齡何以祝華表崔帰時張嘉父生日靈光不自藏今日誕忠良揮麈雲騰湧峩冠隺痩長彊明心似月勤幹鬂成霜赤縣鳴琴宓清朝攬轡滂權衡公調選陵阜冨餱粮除悪雖云切憂民只恐傷行㸔星使動已斍省闌香壽考何湏祝傳家辟榖方送宋衮臣赴任浙憲綵衣入蜀記當年金紫重来抱使权擁鉞止奸民奠枕揚鞭畫計地流錢汝南評論尝相借圯上文書独見傳政目告成纔五月歲頭未改恰三遷秦雲慘雪趋朝路吳雨肥梅按部天名位愈隆人愈逺從今帝席為誰專送趙世泽供奉君豈蹶張手是間聊自藏児童歌楚些婢子誦灵光契分詩交宻形骸酒遣忘方依益者友遽理舎人装雞黍它年約君尝約予卜居常潤山河白日長陽関那忍聼衰老易悲傷逰仙雲宫出郭三竿日横江一葦航雀飛田有麦蚕罷野無桑下馬危梯􅉸開門古殿香雨餘丹井溢苔入醮壇荒畫老星辰動碑殘歲月亡鐘声落城市符祝走村郷埜鳥啼巴蜀山崖刻漢唐臨帰更囬首惜此一襟凉直舎書怀寸枉非吾志休論尺與㝷黄披終日卷青对十年衿風眩藥嚢雨昏茶捥深楊雄名宦思都向草玄沉又箇䖏本来冷此時仍更清擁炉成乆坐曵杖却徐行瞑色侵書帙秋隂入鼓声悠然索馬去祗此是功程書鄭撫幹詩卷後本合金閨去翻来玊壘逰边塵凝不動詩債索相酬自得清新庾非関鍜錬周雲䑓家体格文館祖風流兾北雖蒙頋遼東祗自羞好傳江上女歌向竹枝秋哀詞雲霄才業逝川東斈易年齡一梦中春殿昔抽蟾挂緑夜䑓今隕幕蓮紅殘章断稿塵埃滿别院踈簾笑語空千古亀山原口墓暝烟䔥索白楊風又文章泮水動英逰玉殿騰名十四秋蓮幕未平䑓省志薤歌潜引古原愁青雲義氣千金薄緑綬恩綸一命休科第不窮餘訓在鳯毛森秀紹箕裘籌笔鋪脅寡欺孤罪未訶先生此意竟蹉跎謾令鄴下痴児女駭汗驚惶欲渡河眉山唐先生文集卷二十眉山唐先生文集卷二十目唐庚子西古体詩㑹飲尉斫效八仙体古風贈謝與权行其一其二其三程義父挽詩近体詩談勉翁詩章老夫所畏而以䏻問于不能此殊不可曉也媿而作詩既以前韵贈勉翁復怀庭玉因為次韵峡路十韵清明日示弟姪赴益昌六言又上益昌守李大夫上漕使石􅒩生日翟提倉生日家提倉生日錢憲生日張嘉父生日送宋衮臣赴任浙憲送趙世澤供奉逰仙雲宫直舎書怀又書鄭撫幹詩卷後哀詞又籌筆鋪
