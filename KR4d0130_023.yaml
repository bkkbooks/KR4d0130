body:
  text: 眉山唐庚子西記顔魯公祠堂記上元中顔魯公為蓬州長史過新政作離堆記四百餘言書而刻之石壁上字徑三寸雖崩壞剝裂之餘而典刑具在使人見之凛然也元符三年余友馬強叔來尹是邑始為公作祠堂于其側而求文以為記余謂仁之勝不仁久矣然有時乎不勝而反為所陷焉者命也史臣論公晚莭偃蹇為姦臣所擠見隕賊手是未必然公孫丞相以仲舒相膠西梁冀以張綱守廣陵李逄吉以韓愈使鎮州而盧杞以公使希烈其用意正相類爾然于𢾗君子者終不能有所傷而公獨不免于虎口由是觀之士之成敗存亡豈不有命耶而小人軒然自以為得計不亦謬乎且吾聞古之尚友者以友天下之善士為未足又尚論古之人誦其詩讀其書思見其人而不可得則方且欲招屈子於江濵起士會于九原蓋其志之所願則超然相慕于數千百載之後而况于公乎公之功名事業既以絶人而文字之妙亦不可及因其心畫之所在而祠之此亦昔人尚友之意也嘗試與強叔登離堆探石堂觀其遺迹而味其平生則公之精神文采猶或可以想見也夫年月日記新修敕書樓記始余未至閬中聞其為劇邑也意其官府制度諸事有體稱古子男之邦既至入門見其所謂敕書樓者􅋻屋𢾗楹椽腐瓦踈將過其下者則必却蓋俯首鞭馬疾驅凛然惟恐其欲壓顧而疑之以為縣治于此不知幾何年今之徔者亦不可勝數樓在􅈦事之前非思慮之所不及然皆更相因仍無改作者何也既而究之乃不足怪者始宣德郎孫君襲既新所堂嘗議及矣未果作而受代去奉議郎李君觀繼修庫獄𣸪有意于是矣以飢而寢其事至余號為愚蠢無知鋭然直前而不顧利害者也然猶尺寸積纍二年而後有作親董其役數月而後有成蓋自二君以迄于今更閲二閠然後得以一變其舊嗚呼何其難哉而况興利除害立事建功規為指置有大于此者不又難哉以余成之之難有以知二君欲為之難以二君欲為之難有以知前人更相因仍歷年滋久而無所改作者彼非安于如此也蓋勢不足以使人力不足以行意舉手動作左窒右礙終日憂畏而不得以遂其所欲為此人之為吏所以無功天下之事所以不立而有志者所以永嘆也何獨此哉何足怪哉樓屋上下十間餘材為吏舍十有七間始于元年之六月成於十二月而余去以二年之七月云崇寧二年正月十五日記書上蔡司空書司空相公閣下十五年前吕丞相用事當此之時某布衣為諸生吕丞相罷章丞相用事當此之時某為利州治獄掾章丞相罷韓丞相用事當此之時某為閬中令韓丞相罷曽丞相用事當此之時某為督郵曽丞相罷而閣下當軸某自常調蒙朝廷記録脫之于刀筆之間而處之于師儒之任自念往時閣下鎮蜀某逰太學閣下還朝而某已歸蜀一迹不涉于門館一字不通于几格流落西南四千里外平生交友皆不在要路不知誰荐而得聞于左右也當此之時其感恩為何如而其責豈易塞哉昨自到任已來日夜黽勉聀事庶幾有以輔報萬一而才調學術止于如此所作講義率皆敷衍前輩所説無一言一句能自立門户亦嘗推究學校利病意欲有所建明而敕令格式周悉具偹乃至無有毫髮未盡可以籍口獨有一事今試言之閣下少加意焉邇來士大夫崇尚經術以義理相髙而忽略文章不以為意夫崇尚經術是矣文章于道有離有合不可一槩忽也唐世韓退之栁子厚近世歐陽永叔尹師魯王深父輩皆有文在人間其辭何嘗不合于經其旨何嘗不入于道行之于世豈得無輔而可以忽略都不加意乎竊觀閣下輔政既以經術取士又使習律習射而醫算書畫悉皆置博士此其用意豈獨遺文章乎而自頃以來此道幾廢埸屋之間人自為體立意造語無𣸪法度冝詔有司取士以古文為法所謂古文雖不用偶灑而散語之中暗有聲調其步驟馳騁亦皆有莭奏非但如今日苟然而已今士大夫間亦有知此道者而時所不尚皆相率遁去不能自見于世冝稍稍收聚而進用之使學者知所趨向不過數年文體自變使後世論宋朝古文復興自閣下始此亦閣下之所願也某久不談世事感閣下屢記某姓名敢𣸪一言或行或否惟閣下裁之上鄧左丞書尚書左丞閣下某學術空虛不能盡知前世事自建隆以來數之蜀之先進仕至兩府者衆矣其行藏出處是非長短非後進小子所得輕議然大抵畏避形迹不敢援引蜀人蓋起逺方孤立無與過于慮患不得不爾天聖中閬人陳鴻漸以文章知名于世制䇿入等以季父當軸不得召試擯棄流落飲恨至死引嫌之風其由來久矣自閣下執政不𣸪沿襲前事每見蜀人未嘗不訪問人物雖不以天下名器私于蜀人而蜀人之善未有棄而不録者老成宿德後生晚學隨冝録用各當其理至于甚愚無知如某等輩猶得偹員學校閣下既不自疑而天下之人亦不以為私何其自任之重自信之篤也某紹聖元年自太學歸從事州縣三仕于此勤苦于簿書獄訟而不以為勞奔走于車塵馬足而不以為卑十年之間遂無一字入國門者意謂古之為貧而仕正當如此既無以取知于人遂不敢求于人知而人亦無有知者不知閣下得之於誰遽有荐引得非過于採聽而好事者遂有以欺左右乎不然何緣記憶也某自到此忽忽歲餘事稍間不廢讀書俸入差厚足以為飬比之流輩最為僥幸所不滿者勢有不便耳風土氣候非所冝而飲食醫藥多不如意此其所以戚戚思蜀而輒布腹心于受恩之地也古語有之為浮屠者必合其尖此言雖小亦自有理惟閣下留意焉上席侍郎書知府侍郎閣下某偹員學校三載于此在輩流中年齒最為老大詞氣學術最為淺陋教養訓導之方最為踈拙所以未即逐去正賴主人以為重今閣下還朝旦夕大用為執政為宰相為公為師此誠門下小子之所願聞然孤宦小官遽奪所依此其胸中不能無介然者日夜思慮求所以輔報萬一而書生門户無有他技因效其所得于古人者惟閣下裁擇某𥘉讀書時未習時事意謂古之聖賢例須建立功名其後涉世益深更事益多考論前代經史益見首尾乃知古人之心本不如此舟遇險則有功燭遇夜則有功藥遇病則有功桔橰遇旱則有功戈弩劍戟臨衝兜鍪遇戰閗則有功凡物有功悉非得已龍蛇雜處而禹有功草木障塞而益有功民不粒食而稷有功天理人倫顛倒失次而契有功夷蠻賊冦干紀亂治而咎繇有功自此以降不可勝舉然皆因時立功非聖賢本意伊陟臣扈巫咸相太戊無他竒功以格上帝乂王家為功巫賢甘􅐻傳説相祖乙武丁不聞有功以保乂有啇為功君陳相成王畢公相康王不自立功以循周公之業為功後世知有功之為功而不知無功之為功其去道已逺至謂聖賢有心于功名其探聖賢亦淺矣天下承平日久綱紀文章纎毫具偹無有毫髮未盡未便一部周禮舉行略遍但不姓姬爾竊謂今日正當持循法度不冝𣸪有增廣建置歌呼于吏舍者勿問醉吐于車􅌲者勿逐客至欲有所關説者飲以醇酒勿聽擇士惟取通大體知古誼者用之雖不立功功在其中矣某之所得于古人者如此不知其當否也倘閣下以為然若歸見何丞相時亦以此説告之上監司書某聞𬋩氏相齊奪伯氏駢邑三百而沒齒無怨言諸葛孔明相蜀廢廖立為民至死不敢恨古之人以德服人者蓋如此某誠不肖蒙諸公誤知過有論荐遂得循資作邑于此其人雖微其位雖卑其中雖空虛無有然有民有社亦一邑之長也到官二年前日治一豪右而不勝其忿狂怒詆悖移文紛然逮今未已今之人誠不及古人逺矣賴執事聰明不以為過在于微賤無復可言者然念朝廷責成于監司監司責成于郡縣郡縣乃朝廷事也今姦人大姓敗群亂法刺史縣令不敢忤視稍繩以法便起異論或責其量力度德犯五不韙或賞其奉公嫉惡不屈于勢噫此特聀所當為不得不然爾責之賞之皆過也使今世人親見漢時何益董宣輩行事當作何等駭怪耶某固不才何足議此然切思比來州縣削弱紀綱廢瓌上下習熟恬不為怪穎昌寄屋彭傑歐縣尉張讀新繁百姓歐縣令李注環州監押潘演歐知州种師中殆非治世所當聞見兹蓋法度陵遲漬染至此某所以言之于左右者誠望執事入為侍從首當論此爾非獨為今日設也區區之心執事察之眉山唐先生文集卷二十三眉山唐先生文集卷二十三目唐庚子西記顔魯公祠堂記新修敕書樓記書上蔡司空書上鄧左丞書上席侍郎書上監司書
