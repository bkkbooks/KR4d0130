body:
  text: 眉山唐庚子西記顔魯公祠堂記上元中顔魯公為蓬州長史過新政作離堆記四百餘言書而刻之石壁上字徑三寸雖崩壊剥裂之餘而典刑具在使人見之凛然也元符三年余友馬强叔来尹是邑始為公作祠堂于其側而求文以為記余謂仁之勝不仁乆矣然有時乎不勝而反為所䧟焉者命也史臣論公晚莭偃蹇為奸臣所擠見隕賊手是未必然公孫丞相以仲舒相膠西梁冀以張綱守廣陵李逄吉以韓愈使鎮州而盧杞以公使希烈其用意正相類尔然于𢾗君子者終不䏻有所傷而公獨不免于虎口由是覌之士之成敗存亡豈不有命耶而小人軒然自以為得計不亦謬乎且吾聞古之尚友者以友天下之善士為未足又尚論古之人誦其詩讀其書思見其人而不可得則方且欲招屈子於江濵起士㑹于九原盖其志之所願則超然相慕于数千百載之後而况于公乎公之功名事業既以絶人而文字之妙亦不可及因其心畫之所在而祠之此亦昔人尚友之意也甞試與强叔登離堆探石堂觀其遺迹而味其平生則公之精神文采猶或可以想見也夫年月日記新修敕書楼記始余未至閬中聞其為劇邑也意其官府制度諸事有体稱古子男之邦既至入門見其所謂敕書楼者􅋻屋𢾗楹椽腐瓦踈将過其下者則必却盖俛首鞭馬疾駈凛然惟恐其欲壓頋而疑之以為縣治于此不知㡬何年今之徔者亦不可勝数楼在􅈦亊之前非思慮之所不及然皆更相因仍無改作者何也旣而䆒之乃不足怪者始宣德郎孫君襲既新所堂尝議及矣未果作而受代去奉議郎李君觀継修庫獄𣸪有意于是矣以饑而寢其事至余號為愚惷無知銳然直前而不頋利害者也然猶尺寸積累二年而後有作親董其役数月而後有成盖自二君以迄于今更閲二閠然後得以一変其舊嗚呼何其难㢤而况興利除害立亊建功規為指置有大于此者不又难哉以余成之之难有以知二君欲為之难以二君欲為之难有以知前人更相因仍歴年滋乆而無所改作者彼非安于如此也盖势不足以使人力不足以行意舉手動作左窒右碍終日憂畏而不得以遂其所欲為此人之為吏所以無功天下之亊所以不立而有志者所以永嘆也何獨此哉何足怪哉楼屋上下十間餘材為吏舎十有七間始于元年之六月成於十二月而余去以二年之七月云崇寕二年正月十五日記書上蔡司空書司空相公閣下十五年前吕丞相用亊當此之時厶布衣為諸生吕丞相罷章丞相用事當此之時厶為利州治獄掾章丞相罷韓丞相用亊當此之時厶為閬中令韓丞相罷曽丞相用亊當此之時厶為督郵曽丞相罷而閣下當軸厶自常調蒙朝廷記録脱之于刀筆之間而處之于師儒之任自念徃時閣下鎮蜀厶逰太學閣下還朝而厶已帰蜀一迹不渉于門舘一字不通于几格流落西南四千里外平生交友皆不在要路不知誰荐而得聞于左右也當此之時其感㤙為何如而其責豈易塞哉昨自到任已来日夜黾勉聀亊庻㡬有以𥙷報萬一而才調斈術止于如此所作講義率皆敷衍前軰所說無一言一句䏻自立門户亦尝推䆒學校利病意欲有所建明而敕令格式周悉具偹乃至無有毫髪未盡可以籍口獨有一亊今試言之閣下少加意焉迩来士大夫崇尚經術以義理相髙而忽畧文章不以爲意夫崇尚經術是矣文章于道有離有合不可一槩忽也唐世韓退之栁子厚近世歐陽永叔尹師魯王深父軰皆有文在人間其辞何尝不合于經其旨何尝不入于道行之于世豈得無𥙷而可以忽畧都不加意乎窃觀閣下輔政既以經術取士又使習律習射而医筭書画悉皆置博士此其用意豈独遺文章乎而自頃以来此道㡬廢埸屋之間人自為体立意造語无𣸪法度冝詔有司取士以古文為法所謂古文雖不用偶洒而散語之中暗有声調其歩驟馳騁亦皆有莭奏非但如今日苟然而已今士大夫間亦有知此道者而時所不尚皆相率遁去不䏻自見于世冝稍稍收聚而進用之使學者知所趋向不過数年文体自変使後世論宋朝古文復㒷自閣下始此亦閣下之所願也厶乆不談世事感閣下屡記厶姓名敢𣸪一言或行或否惟閣下裁之上鄧左丞書尚書左丞閣下厶學術空虚不䏻盡知前世亊自建隆以来数之蜀之先進仕至両府者衆矣其行藏出䖏是非長短非後進小子所得輕議然大抵畏避形跡不敢援引蜀人盖起逺方孤立無與過于慮患不得不爾天聖中閬人陳鴻漸以文章知名于世制䇿入䓁以季父當軸不得召試擯棄流落飲恨至死引嫌之風其由来乆矣自閣下執政不𣸪沿襲前亊每見蜀人未尝不訪問人物雖不以天下名器私于蜀人而蜀人之善未有棄而不録者老成宿徳後生晚學隨冝録用各當其理至于甚愚無知如厶䓁軰猶得偹員學校閣下既不自疑而天下之人亦不以爲私何其自任之重自信之篤也厶紹聖元年自太斈帰従亊州縣三仕于此勤苦于簿書獄訟而不以爲劳奔走于車塵馬足而不以爲卑十年之間遂無一字入國門者意謂古之爲貧而仕正當如此既無以取知于人遂不敢求于人知而人亦無有知者不知閣下得之於誰遽有荐引得非過于採聽而好事者遂有以欺左右乎不然何縁記憶也厶自到此忽忽歲餘亊稍閒不廢讀書俸入差厚足以為飬比之流軰最為僥倖所不滿者勢有不便耳風土氣候非所冝而飲食醫薬多不如意此其所以戚戚思蜀而輙布腹心于受㤙之地也古語有之為浮屠者必合其尖此言雖小亦自有理惟閣下留意焉上席侍郎書知府侍郎閣下厶偹員學校三載于此在軰流中年齒最為老大詞氣學術最為淺陋教養訓導之方最為踈拙所以未即逐去正頼主人以為重今閣下還朝旦夕大用為執政為宰相為公為師此誠門下小子之所願聞然孤宦小官遽奪所依此其胸中不䏻無介然者日夜思慮求所以𥙷報萬一而書生門户無有他技因効其所得于古人者惟閣下裁擇厶𥘉讀書時未習時亊意謂古之聖賢例湏建立功名其後渉世益深更亊益多考論前代經史益見首尾乃知古人之心本不如此舟遇險則有功燭遇夜則有功薬遇病則有功桔橰遇旱則有功戈弩劍㦸臨衝兠鍪遇戦閗則有功凢物有功悉非得已龍蛇雑處而禹有功草木障塞而益有功民不粒食而稷有功天理人倫顛倒失次而契有功夷蛮賊冦干紀亂治而咎繇有功自此以降不可勝舉然皆因時立功非圣賢本意伊陟臣扈巫咸相太戊無他竒功以格上帝乂王家為功巫賢甘􅐻傳說相祖乙武丁不聞有功以保乂有啇為功君陳相成王畢公相康王不自立功以循周公之業為功後世知有功之為功而不知無功之為功其去道已逺至謂圣賢有心于功名其探圣賢亦淺矣天下承平日乆綱紀文章纎毫具偹無有毫髪未盡未便一部周礼舉行畧遍但不姓姬尔窃謂今日正當持循法度不冝𣸪有増廣建置歌呼于吏舎者勿問醉吐于車􅌲者勿逐客至欲有所関說者飲以醇酒勿聽擇士惟取通大体知古誼者用之雖不立功功在其中矣厶之所得于古人者如此不知其當否也倘閣下以為然若帰見何丞相時亦以此說告之上監司書厶聞𬋩氏相齊奪伯氏駢邑三百而沒齒無怨言諸葛孔明相蜀廢廖立爲民至死不敢恨古之人以德服人者盖如此厶誠不肖蒙諸公誤知過有論荐遂得循資作邑于此其人雖微其位雖卑其中雖空虚無有然有民有社亦一邑之長也到官二年前日治一豪右而不勝其忿狂怒詆誖移文紛然逮今未已今之人誠不及古人逺矣頼執亊聪明不以為過在于㣲賤無復可言者然念朝廷責成于監司監司責成于郡縣郡縣乃朝廷亊也今奸人大姓敗群乱法刺史縣令不敢迕視稍䋲以法便起異論或責其量力度德犯五不韙或賞其奉公嫉悪不屈于勢噫此特聀所當為不得不然尔責之賞之皆過也使今世人親見漢時何益董宣軰行亊當作何䓁駭恠耶厶固不才何足議此然切思比来州縣削弱紀綱廢瓌上下習熟恬不爲怪穎昌寄屋彭傑歐縣尉張讀新繁百姓歐縣令李注環州監押潘演歐知州种師中殆非治世所當聞見兹盖法度陵遲漬染至此厶所以言之于左右者誠望執亊入爲侍從首當論此尔非独爲今日設也區區之心執事察之眉山唐先生文集卷二十三眉山唐先生文集卷二十三目唐庚子西記顔魯公祠堂記新修勅書楼記書上蔡司空書上鄧左丞書上席侍郎書上監司書
