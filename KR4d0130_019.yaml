front:
  text: 眉山唐先生文集卷十九
  hash: sha256:4314c4d3ad8044bf4719306674045d7f7e428d5d6a05d15d86aa440f0bd33e6a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_019-1a}
body:
  text: 眉山唐庚子西古体詩代内爺娘嫁我時本以君能文謂當得所托致身到青雲覌今天下亊勝負方紛紜英俊肩相摩料理不到君何妨採薬去相與登鹿門著書示後世千載猶清芬荅世豈無高人刻意在枯槁昔為恩爱累有志莫能保君能喚我帰衰髩及未葆向非有此翁那得有此姥舊本使得耀亊非是著書吾豈䏻庶㡬獲幽討何必登鹿門是山皆可老戊子大水踏歌喧喧雑鐃鼓潭边呼龍令作雨龍嗔揮水十丈餘千村萬落㡬為魚寄􅒜龍神且安䖏熟睡深潭不驚汝又夜半傳呼河入室攬衣下床深没膝舊来水不到譙門老巫帰咎西門君西門君去老巫舞明年却娶河伯婦除鳯州教授非所欲也因作此以自寛人生纔食頃何䖏分好弱刑獄即道場筦庫有真楽故𥿄終日翻毛錐㡬年閣百凾無力致諸公誰説著今承斈校乏頗訝名字錯宿業豈無恋得冶不敢躍骨肉逺难俱嚢装貧易縛師儒要好手老大良非脚戞盡識羔空抽穷知繭薄後生端所畏人材若為作豈唯嘲孝先便恐困有若行路固知难淂地幸不悪栁拖千犬絲山集五色雀綘紗諒無有苜蓿聊可嚼况聞豆積嶺中有不死薬登越王楼左綿城北長安道馬足翻翻人自老越王高䑓藏道边道上行人迷不到楼前西一作落日堕江紅一見如逢鄰舎翁翁来何䖏識面目應在少陵詩句中芙蓉溪歌人間八月秋霜嚴芙蓉溪上春酣酣二南変後魯叟笔七國戦䖏邹軻談人間二月春光好溪上芙蓉迹如掃周家盛䖏伯夷枯漢室隆時賈生老小児造化誰能穷㡬囬枯枿还芳叢只應人老不復少有酒且發衰顔紅冨楽山冨楽之名誰所㽞建安中刘豫州擁兵入蜀萬貔貅孱璋送國来迎頭軍中釃酒椎千牛炙如巴山酒如涪酒酣握手登髙丘極目紫芋蹲春疇冨楽之名此其由君聞此說还信不當時兵𧺫四十秋拆屋不足供誅求生灵嗷嗷鼎中油山中何為乃尔優想今冨楽萬倍刘端能容我迯穷愁山僧笑言客罷休将家逰治平院盖老杜所謂東津也年来官職如氷様只有登臨作酬賞好山一一如佳客令人欲作傾家醸昨日西楼吊王孫今日東津悲逐臣江边勝亊畧尋徧不見海棕髙入雲逰天池院上方細路蟠如綰下有晴川平似坂近水逺山皆可人踴躍来供搜句眼小池中有江湖春孤洲便可呼白蘋團團倚檻㸔清澈不敢洗耳山僧嗔逰雪峯院書所見院在開元寺之西越王楼之東盖小院也東家既峥嵘西隣亦稜層那知齊魯間有此蕞尔滕僻路少人到掣鈴小童譍松扉迫窄入石磴歌危登迎門老龎吠畫壁蒼龍騰庭除静如拭几席不受蝇青焚日日香明續年年灯土盆奍幽花古木纏枯藤雖小亦自足無虧豈湏増憶昨苦盛夏数来避煩蒸每借安禅榻曲此晝眠肱日月當㡬何霜雪遂嚴凝慈竹猶踈踈悪風遂朋朋作詩書屋壁掃㓕聴寺僧十月十八日與舎弟同登越王楼便道趋開元寺上天池淂句滿𥿄顛倒雜乱㡬不可讀明日詮次成二十二韵休浴罷趋局幽居愁杜門重登帝子楼共弔詩人冤凭欄参井天隐几西南坤冬深一水瘦歲晚千山髠豊稔編川陸太平到雞豚江城水頽雉市瓦塵迷鴛坐对仙雲宫秪隔斜陽村楼䑓白水外松栢蒼雲屯天垂望羗山雪汁融朝暾誰為四方些招此千歲䰟便道訪古寺䇿杖㝷灵源上到山椒窮轉斍天池尊行疲犬馬力下視烏鳶翻不應水性髙疑有神物噴肯隨秋漲落况逐夏潦渾潜通八角井散入千家盆漁村喚欲譍釣石諒猶温似聞叩船歌想見持竿蹲吾曺本山林朝衣褁狙猿只應適野車便作忘憂萱詩兼巧拙对酒雜醇醨吞閽吏况觧亊不妨盡餘罇六一堂綿州司户𪠘舎舊為推官斫歐陽文忠公生于此近歲陵井譚望勉翁為參軍葺一室于斫亊之東偏號曰六一堂予聞而嘉之為賦此篇我思六一翁羽化四十年雖不及摳衣每碩為执鞭手弹酔翁操目覩廬陵編床頭五代史屏間七交篇詩常諷思穎曲每歌帰田齋摹画舫様酒法氷堂傳此志自弱冠到今已華顛嗟予又晚軰讀書慕先賢即彼生䖏所館之與周旋時对文章姿稍息簿領肩賢者果不死瞻之猶在前似揮誅奸茟猶努撃佛拳誰當嗣前覌時為易蠧椽勿毁魯恭宅中有夫子天蘇時中惠茶三年泮宫苦幽独中有冝人惟睡足虫魚注罷真廬静午枕鳴雷撼窓屋故人蘇子半幅書餉我閩溪一包玉親題更屈調絃手逺寄来澆飯𬞞腹故應疑我梦得官誰信吾衰已無復空令半夜忍飢吟捜到池塘春艸緑天馬歌贈朱廷玉貳師城中天馬駒眼光掣電汗流朱将軍出塞萬里餘得此龍種来執徐朝踏幽燕暮荆吴歴塊一蹷傍人呼向来價重千金壷一朝不值半束芻千馬萬馬肥如猪受代有日呈譚勉翁謝與权老来忽忽流年緊三見涪江秋葉隕祗縁二子日相從便斍一瓢穷可忍東津曉作招隐賦西楼暮得思帰引文字能令酒盞寛江山未放詩才窘分題踴躍誰避席淂句歡呼同破凖泉名三逸本戲語野史千年傳不冺醉帰半路飛蝙蝠餘㒷中宵伴蚯蚓那知鬚鬂秃于筆但見児童長如笋留滯甘為西域胡衰遲更結東逰靷故山咫尺未成帰坐使蒼顔厚如胗與舎弟飲篇篇皆有酒世疑渊明詩佳䖏正在此俗子那淂知寄跡杯酒中序者為之辞詩酒吾家亊何用寄跡為疑者既已陋序者良亦卑酒殊酔味同勿問醇與醨又温酒澆枯膓戢戢生小詩詩中何䓁語酒後那𣸪知黄菊遂行邁徑去不𣸪辞拒霜猶屈强其势何能為但問酒有無勿計官高卑江边捕魚郎敎我當啜醨受代还眉乆客念吾土每嘆江山非及兹受代去亦𣸪無家帰仕宦㡬半世奔走遍九圍竟無置錐土安此容膝扉还當僦屋居况有囊金揮䖏鄉亦何有去國空依依赴闕十年飡苜蓿梦寐長䦨干継粟自不飽朝虀豈辞酸雖無汗馬劳㡬作蠧魚乹自知爬沙手未辦扶揺摶此行敢僥倖政尔求便安恐或淂所欲圣主天地寛劔州道中見桃李盛開而梅花猶有存者桃花能紅李能白春深無䖏無顔色不應尚有数枝梅可是東君苦留客向来開䖏當嚴冬桃李未在交㳺中即今已是丈人行肯與年少争春風武㒷謡去年山中無黍稷只有根并橡實根作􅔇如食蜜橡實炊飯如剥栗東家有錢食橡實西家無錢惟食今年尽橡實貴山中人作寒蝉枯眉山唐先生文集卷十九眉山唐先生文集卷十九目唐庚子西古体詩代内荅戊子大水又除鳯州敎授非所欲也因作此以自寛登越王楼芙蓉溪歌冨楽山将家逰治平院逰天池院逰雪峯院書所見院在開元寺之西越王楼之東盖小院也十月十八日與舎弟同登越王楼便道趋開元寺上天池得句滿𥿄顛倒雑乱㡬不可讀明日詮次成二十二韵六一堂綿州司户𪠘舎舊為推官􅈦歐陽文忠公生于此近歲陵井譚望勉翁為參軍葺一室于聽亊之東偏號曰六一堂予聞而嘉之爲賦此篇蘇時中惠茶天馬歌贈朱庭玉受代有日呈譚勉翁謝與权與舎弟飲又受代还眉赴闕劔州道中見桃李盛開而梅花猶有存者武㒷謡
