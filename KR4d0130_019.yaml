front:
  text: 眉山唐先生文集卷十九
  hash: sha256:4314c4d3ad8044bf4719306674045d7f7e428d5d6a05d15d86aa440f0bd33e6a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_019-1a}
body:
  text: 眉山唐庚子西古體詩代內爺娘嫁我時本以君能文謂當得所托致身到青雲觀今天下事勝負方紛紜英俊肩相摩料理不到君何妨採藥去相與登鹿門著書示後世千載猶清芬答世豈無高人刻意在枯槁昔為恩愛纍有志莫能保君能喚我歸衰鬢及未葆向非有此翁那得有此姥舊本使得耀事非是著書吾豈䏻庶幾獲幽討何必登鹿門是山皆可老戊子大水踏歌喧喧雜鐃鼓潭邊呼龍令作雨龍嗔揮水十丈餘千村萬落幾為魚寄􅒜龍神且安處熟睡深潭不驚汝又夜半傳呼河入室攬衣下床深沒膝舊來水不到譙門老巫歸咎西門君西門君去老巫舞明年却娶河伯婦除鳯州教授非所欲也因作此以自寬人生才食頃何處分好弱刑獄即道場管庫有真樂故𥿄終日翻毛錐幾年閣百函無力致諸公誰說著今承學校乏頗訝名字錯宿業豈無戀得冶不敢躍骨肉逺難俱囊裝貧易縛師儒要好手老大良非腳戞盡識羔空抽窮知繭薄後生端所畏人材若為作豈唯嘲孝先便恐困有若行路固知難淂地幸不惡栁拖千犬絲山集五色雀綘紗諒無有苜蓿聊可嚼况聞豆積嶺中有不死藥登越王樓左綿城北長安道馬足翻翻人自老越王高臺藏道邊道上行人迷不到樓前西一作落日墮江紅一見如逢鄰舍翁翁來何處識面目應在少陵詩句中芙蓉溪歌人間八月秋霜嚴芙蓉溪上春酣酣二南變後魯叟筆七國戰處鄒軻談人間二月春光好溪上芙蓉迹如掃周家盛處伯夷枯漢室隆時賈生老小兒造化誰能窮幾回枯枿還芳叢只應人老不復少有酒且發衰顔紅冨樂山冨樂之名誰所留建安中劉豫州擁兵入蜀萬貔貅孱璋送國來迎頭軍中釃酒椎千牛炙如巴山酒如涪酒酣握手登髙丘極目紫芋蹲春疇冨樂之名此其由君聞此說還信不當時兵起四十秋拆屋不足供誅求生靈嗷嗷鼎中油山中何為乃爾優想今冨樂萬倍劉端能容我逃窮愁山僧笑言客罷休將家逰治平院蓋老杜所謂東津也年來官職如氷樣只有登臨作酬賞好山一一如佳客令人欲作傾家釀昨日西樓吊王孫今日東津悲逐臣江邊勝事略尋遍不見海棕髙入雲逰天池院上方細路蟠如綰下有晴川平似坂近水逺山皆可人踴躍來供搜句眼小池中有江湖春孤洲便可呼白蘋團團倚檻看清徹不敢洗耳山僧嗔逰雪峯院書所見院在開元寺之西越王樓之東蓋小院也東家既峥嶸西鄰亦稜層那知齊魯間有此蕞爾滕僻路少人到掣鈴小童譍松扉迫窄入石磴歌危登迎門老龎吠畫壁蒼龍騰庭除靜如拭几席不受蠅青焚日日香明續年年燈土盆奍幽花古木纏枯藤雖小亦自足無虧豈須增憶昨苦盛夏數來避煩蒸每借安禪榻曲此晝眠肱日月當幾何霜雪遂嚴凝慈竹猶踈踈惡風遂朋朋作詩書屋壁掃滅聽寺僧十月十八日與舍弟同登越王樓便道趨開元寺上天池淂句滿𥿄顛倒雜亂幾不可讀明日詮次成二十二韵休浴罷趨局幽居愁杜門重登帝子樓共弔詩人冤憑欄參井天隱几西南坤冬深一水瘦歲晚千山髠豐稔編川陸太平到雞豚江城水頽雉市瓦塵迷鴛坐對仙雲宫秪隔斜陽村樓臺白水外松柏蒼雲屯天垂望羌山雪汁融朝暾誰為四方些招此千歲魂便道訪古寺䇿杖尋靈源上到山椒窮轉覺天池尊行疲犬馬力下視烏鳶翻不應水性髙疑有神物噴肯隨秋漲落况逐夏潦渾潜通八角井散入千家盆漁村喚欲譍釣石諒猶溫似聞叩船歌想見持竿蹲吾曺本山林朝衣褁狙猿只應適野車便作忘憂萱詩兼巧拙對酒雜醇醨吞閽吏况解事不妨盡餘樽六一堂綿州司户𪠘舍舊為推官斫歐陽文忠公生于此近歲陵井談望勉翁為參軍葺一室于斫事之東偏號曰六一堂豫聞而嘉之為賦此篇我思六一翁羽化四十年雖不及摳衣每碩為執鞭手彈醉翁操目覩廬陵編床頭五代史屏間七交篇詩常諷思穎曲每歌歸田齊摹畫舫樣酒法氷堂傳此志自弱冠到今已華顛嗟豫又晚輩讀書慕先賢即彼生處所館之與周旋時對文章姿稍息簿領肩賢者果不死瞻之猶在前似揮誅奸茟猶努擊佛拳誰當嗣前觀時為易蠧椽勿毁魯恭宅中有夫子天蘇時中惠茶三年泮宫苦幽獨中有冝人惟睡足蟲魚注罷真廬靜午枕鳴雷撼窗屋故人蘇子半幅書餉我閩溪一包玉親題更屈調絃手逺寄來澆飯𬞞腹故應疑我夢得官誰信吾衰已無復空令半夜忍飢吟搜到池塘春草緑天馬歌贈朱廷玉二師城中天馬駒眼光掣電汗流朱將軍出塞萬里餘得此龍種來執徐朝踏幽燕暮荆吳歷塊一蹶傍人呼向來價重千金壷一朝不值半束芻千馬萬馬肥如猪受代有日呈談勉翁謝與權老來忽忽流年緊三見涪江秋葉隕祗緣二子日相從便覺一瓢窮可忍東津曉作招隱賦西樓暮得思歸引文字能令酒盞寬江山未放詩才窘分題踴躍誰避席淂句歡呼同破凖泉名三逸本戲語野史千年傳不泯醉歸半路飛蝙蝠餘興中宵伴蚯蚓那知鬚鬢秃于筆但見兒童長如笋留滯甘為西域胡衰遲更結東逰靷故山咫尺未成歸坐使蒼顔厚如疹與舍弟飲篇篇皆有酒世疑淵明詩佳處正在此俗子那淂知寄跡杯酒中序者為之辭詩酒吾家事何用寄跡為疑者既已陋序者良亦卑酒殊醉味同勿問醇與醨又溫酒澆枯腸戢戢生小詩詩中何等語酒後那𣸪知黃菊遂行邁徑去不𣸪辭拒霜猶屈强其勢何能為但問酒有無勿計官高卑江邊捕魚郎教我當啜醨受代還眉久客念吾土每嘆江山非及兹受代去亦𣸪無家歸仕宦幾半世奔走遍九圍竟無置錐土安此容膝扉還當僦屋居况有囊金揮處鄉亦何有去國空依依赴闕十年餐苜蓿夢寐長䦨干繼粟自不飽朝虀豈辭酸雖無汗馬勞幾作蠧魚乾自知爬沙手未辦扶搖摶此行敢僥幸政爾求便安恐或淂所欲聖主天地寬劔州道中見桃李盛開而梅花猶有存者桃花能紅李能白春深無處無顔色不應尚有數枝梅可是東君苦留客向來開處當嚴冬桃李未在交遊中即今已是丈人行肯與年少爭春風武興謡去年山中無黍稷只有根并橡實根作􅔇如食蜜橡實炊飯如剝栗東家有錢食橡實西家無錢惟食今年尽橡實貴山中人作寒蟬枯眉山唐先生文集卷十九眉山唐先生文集卷十九目唐庚子西古體詩代內答戊子大水又除鳯州教授非所欲也因作此以自寬登越王樓芙蓉溪歌冨樂山將家逰治平院逰天池院逰雪峯院書所見院在開元寺之西越王樓之東蓋小院也十月十八日與舍弟同登越王樓便道趨開元寺上天池得句滿𥿄顛倒雜亂幾不可讀明日詮次成二十二韵六一堂綿州司户𪠘舍舊為推官􅈦歐陽文忠公生于此近歲陵井談望勉翁為參軍葺一室于聽事之東偏號曰六一堂豫聞而嘉之為賦此篇蘇時中惠茶天馬歌贈朱庭玉受代有日呈談勉翁謝與權與舍弟飲又受代還眉赴闕劔州道中見桃李盛開而梅花猶有存者武興謡
