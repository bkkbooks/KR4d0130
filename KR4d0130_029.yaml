front:
  text: 眉山唐先生文集卷二十九
  hash: sha256:3a156791fdaebcab0c3bee68730e2681255914e5ce31669700206431d9614db1
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_029-1a}
body:
  text: 眉山唐庚子西祭文祭祖墳文嗚呼昔我先祖積善纍仁以垂𥙿于後昆皇天福善篤生我先人夙有淑質未幼而學我先祖以考終惟我先人丕承厥志率德履行令聞令望風動于四方匹夫匹婦罔不知有我先人時命不與則竟罔有成功至于小子某不肖懼忝前烈早夜祗惕畏慎雖荐更多難則亦罔敢怠荒而稟賦顓蒙不能承我祖宗之志天子哀其愚錫以一命俾俟罪于益昌非某小子能實惟我祖宗之休嗚呼某生不辰不逮事于祖宗夙夜恃怙則犬馬之飬有所施惟是勤勞王事益盡為臣之忠庶幾有禆我祖宗之志緒不至于隕越嗚呼酒醴荐羞雖則不腆以告其區區之心祖宗其格思尚享祭宋承之文嗚呼公乎維公蜀人起于逺方角出特立致身冨貴頭角軒昻入握省闈出持使斧有燁其光西極岷峨東盡河湟維公之疆聖神嗣興改易法度登崇俊良先帝舊臣千載一時森列廟堂一日九遷唾手可淂易如探囊車在要津舟在急流遂爾淪亡炙手之勢桑隂未移遽冷如霜跪奠道左感念疇昔揮涕其滂尚享登程公儀文嗚呼哀哉我昔携孥赴官益昌公時送我泣下霑裳云我老矣不𣸪見子終天之别將止于此我謂不然願公加餐秩滿即還彈指頃間我舟既行翁止于岸眷眷不去回首永嘆我官于東轉眼十年𣸪來尋翁墓木蒼然一作墓柏森然永懷往事泪落秋草為文寫哀以荐萍藻嗚呼哀哉靈其尚享祭陳户部文惟公學道寬中善于容物立言詣理足以名家入則郎潛出則使指踐更既熟進退自如未應間適之年遽有便安之請舍者爭席方物我以相忘弔者在門遂幽明之永隔耆舊零落衣冠嘆傷闕文之史今亡正始之音遂絶豈無禮樂顧先進之可思雖有典刑嗟老成之愈逺况我小子受公深知拊棺長號有泪如覆嗚呼哀哉靈其尚享祭孔明文天降喪亂漢祚將傾公抱器業南陽躬耕隱而未見行而未成嗚呼清哉萬乘知已三顧茅廬計安天下周爰咨諏協力合謀克贊伯圖嗚呼智哉帝念戰戰兢兢舉國托孤知公之能公受顧命拳拳服􅈾嗚呼忠哉建國之𥘉國如綴旒負扆涖政為伊為周燕蓋不亂民言不流嗚呼難哉步卆數萬哆然北出河洛騷動雍梁震栗曹氏君臣為之仄席嗚呼壯哉天未厭亂短公之命禮樂不興斯民不幸曹氏君臣酌酒相慶嗚呼痛哉昔我先子旅病瀘川乃禱公祠兾淂生還神鑒孔昭生還故山嗚呼靈哉西蜀遺民荷公之恩登公之祠拜公之神祭公以饌吊公以文嗚呼歆哉尚享南行祭江濱文年月日西蜀唐某頓首跪拜江濱之靈慷慨太息而祝曰僕草萊野夫愚不知分不能與田夫野老傭耕南畝而背書腰劔假道荆楚以逰大梁鄉里親戚笑其狂妄兄弟妻孥泣涕撮挽而擊鼓發棹奮然不顧其志蓋將有所為也他日登金門上玉堂垂璫珥筆昻軒峩冠亦在于此榮耀父母庇廕兄弟兼濟朋友飬活妻子亦在于此安國家定社稷立功名使千萬世不泯亦在于此僕之此行所望大矣所繫重矣神之有靈鑒其所存為我拘黿鼉蟄蛟蜃鞭逐鯨鯢俾無驚湍怒濤之恐此神之隂助力也其他功名冨貴則人所自致非敢以祈于神尚享代程信孺祭新婦文平生孝和天豈無耳冝壽而夭孰窮此理邈然二孫誰撫誰視豈無他人寧若所恃魂兮何之豈復念此代路次祭文殯之于室猶在目前喪既即路遂復寂然昔以歡交今以哀别痛如之何兮有泪如血䇿題問尊儒問大觀新書春秋釋奠于先聖前世宗工臣儒皆淂與于從祀之列尊儒重道之意可謂至矣嘗聞漢興之𥘉六經出于散亡之餘有齊魯韓毛之詩有田焦費氏之易有伏勝孔安國之書有慶普小大戴之禮支分派别並立于天下非獨為説不同而經文亦異其後諸家之學既已滅熄而毛氏之詩費氏之易孔氏之書小戴之禮獨行于後世此四人者其于經旨雖不能有所彂明而聖人經文淂以遂傳天下實此四人之力也今三人皆從祀而一人獨無與焉議者將欲建明以稱朝廷尊儒重道之意王制問孟子之時去成周為未逺而成周之治蓋孟子之所欲為而不淂者也以其所欲為之心而考其所未逺之事冝乎皆淂其實而至論班爵祿之制有不合于經者夫公侯伯子男固五等也而曰天子一位公一位侯一位伯一位子男同一位以天子之尊而列于五等之間既非所冝而子男同一位之説又于傳無所見以子男之居皆五十里而謂之同耶則公侯皆百里而不謂之同者何也以子男之爵皆五命而謂之同耶則侯伯皆七命而不謂之同者何也其言卿大夫士之受地與王制不同而論耕者之所獲與周官亦異雖曰諸矦惡其害已而去其籍然此數事猶見于他經不為無所考而孟子之論如此有司所以疑而問也用賢問先王之時其所以待天下之賢者與能者異矣賢者不可責以事則使之在位而服休能者不可虛其材則使之在職而服采此書所謂承之庸之而孟子所謂尊賢使能者也然周之建官三百有六十自卿大夫至于下士莫不因事以設位因位以制祿未有居位食祿而不任以事者雖冡宰之賢貴亦未離于服采焉其所謂服休者不過三公而已服采者嘗衆服休者常寡則天下賢者將何以處之耶在位者任德而常逸在職者任事而常勞則先王用人亦有流品之異耶兵賦問政必本于財財必取于民賞必施于功罰必加于罪此為天下國家不可易之制也布粟力役之征古之制也而孟子以為用其二而民有殍用其三而父子離關市夫里之征古之制也而孟子則欲去關市之征無夫里之布執干戈衛社稷古之所謂力也而孟子以為善戰者服上刑土地闢田野治古之所謂力而孟子以為闢草萊任土地者次之兹豈古之制歟意者其自有旨歟儒異問先儒有言孟子之書所以象論語故旨意合同者衆蓋大賢擬聖而作也切嘗考之疑其不然孔子君命召不俟駕孟子將朝聞命而遂不果孔子去衛明日遂行孟子去齊三宿而後出晝其制行之異類如此孔子稱樂則韶舞而孟子則曰今之樂猶古之樂也孔子稱畏大人而孟子則曰説大人則藐之其言之異類皆如此安在其為合歟抑其所以為異者乃其所以同之歟言語古之取士者或以德進或以事舉或以言揚言之用于世其來逺矣內有朝覲會同辭受送勞之禮外有存省聘問傳遽道諭之事束帶立朝與賓客言使于四方不辱君命專對之才不可謂無益于用是以聖人雖以德行為先而語言辭命亦在所不廢此宰我子貢所以淂齒于顔閔之后而公西華所以淂與于由求之列也子耻巧言後也遂以訥質為賢是果聖人之意哉言不可以取人則古之所謂以言揚者又何也孔子四科今用其三矣其一未也故與諸公議之眉山唐先生文集卷二十九眉山唐先生文集卷二十九月唐庚子西祭文祭祖墳文祭宋承之文祭程公儀文祭陳户部文祭孔明文南行祭江濵文代程信孺祭新婦文代路次祭文䇿題問尊儒王制用賢兵賦儒異言語
