front:
  text: 眉山唐先生文集卷二十九
  hash: sha256:3a156791fdaebcab0c3bee68730e2681255914e5ce31669700206431d9614db1
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_029-1a}
body:
  text: 眉山唐庚子西祭文祭祖墳文嗚呼昔我先祖積善累仁以垂𥙿于後昆皇天福善篤生我先人夙有淑貭未㓜而學我先祖以考終惟我先人丕承厥志率德履行令聞令望風動于四方匹夫匹婦罔不知有我先人時命不與則竟罔有成功至于小子厶不肖惧忝前烈早夜祗惕畏慎雖荐更多难則亦罔敢怠荒而禀賦顓䝉不䏻承我祖宗之志天子哀其愚錫以一命俾竢罪于益昌非厶小子䏻实惟我祖宗之休嗚呼厶生不辰不逮事于祖宗夙夜恃怙則犬馬之飬有所施惟是勤劳王事益盡為臣之忠庶㡬有禆我祖宗之志緒不至于隕越嗚呼酒醴荐羞雖則不腆以告其區區之心祖宗其格思尚享祭宋承之文嗚呼公乎維公蜀人起于逺方角出特立致身冨貴頭角軒昻入握省闈出持使斧有燁其光西極岷峨東盡河湟維公之疆聖神嗣㒷改易法度登崇俊良先帝舊臣千載一時森列庙堂一日九遷唾手可淂易如探嚢車在要津舟在急流遂尔淪亡炙手之勢桒隂未移遽冷如霜跪奠道左感念疇昔揮涕其滂尚享登程公儀文嗚呼哀㢤我昔携孥赴官益昌公時送我泣下霑裳云我老矣不𣸪見子終天之别将止于此我謂不然願公加飡秩滿即還弹指頃間我舟既行翁止于岸眷眷不去囬首永嘆我官于東轉眼十年𣸪来㝷翁墓木蒼然一作墓柏森然永懐徃事泪落秋草為文冩哀以荐萍藻嗚呼哀㢤灵其尚享祭陳户部文惟公學道寛中善于容物立言詣理足以名家入則郎潜出則使指踐更既熟進退自如未應閑適之年遽有便安之請舍者争席方物我以相忘弔者在門遂幽明之永隔耆舊零落衣冠嘆傷闕文之史今亡正始之音遂絶豈無礼楽頋先進之可思雖有典刑嗟老成之愈逺况我小子受公深知拊棺長號有泪如覆嗚呼哀㢤灵其尚享祭孔明文天降丧乱漢祚将傾公抱器業南陽躬耕隱而未見行而未成嗚呼清㢤萬乗知已三頋茅廬計安天下周爰諮諏恊力合謀克賛伯圖嗚呼智㢤帝念戦戦兢兢㪯國托孤知公之䏻公受頋命拳拳服􅈾嗚呼忠㢤建國之𥘉國如綴旒負扆涖政為伊為周燕盖不乱民言不流嗚呼难㢤歩卆数萬哆然北出河洛騷動雍梁震慄曹氏君臣為之仄席嗚呼壮㢤天未厭乱短公之命礼楽不㒷斯民不幸曹氏君臣酌酒相慶嗚呼痛哉昔我先子旅病瀘川乃禱公祠兾淂生還神鍳孔昭生還故山嗚呼灵哉西蜀遺民荷公之恩登公之祠拜公之神祭公以饌吊公以文嗚呼歆㢤尚享南行祭江濱文年月日西蜀唐厶頓首跪拜江濱之靈慷慨太息而祝曰僕草莱野夫愚不知分不能與田夫野老傭耕南畆而背書腰劔假道荆楚以逰大梁鄉里親戚笑其狂妄兄弟妻孥泣涕撮挽而撃鼓發棹奮然不頋其志盖将有所為也他日登金門上玉堂垂璫珥笔昻軒峩冠亦在于此荣耀父母庇廕兄弟兼濟朋友飬活妻子亦在于此安國家定社稷立功名使千萬世不冺亦在于此僕之此行所望大矣所繫重矣神之有灵鍳其所存為我拘鼋鼍蟄蛟蜃鞭逐鯨鯢俾無驚湍怒濤之恐此神之隂助力也其他功名冨貴則人所自致非敢以祈于神尚享代程信孺祭新婦文平生孝和天豈無耳冝壽而夭孰窮此理邈然二孫誰撫誰視豈無他人寕若所恃䰟兮何之豈復念此代路次祭文殯之于室猶在目前丧既即路遂復寂然昔以歡交今以哀别痛如之何兮有泪如血䇿題問尊儒問大觀新書春秋釋奠于先聖前世宗工臣儒皆淂與于従祀之列尊儒重道之意可謂至矣尝聞漢㒷之𥘉六經出于散亡之餘有齊魯韓毛之詩有田焦費氏之易有伏勝孔安國之書有慶普小大戴之礼支分派别並立于天下非獨爲說不同而經文亦異其後諸家之斈既已㓕熄而毛氏之詩費氏之易孔氏之書小戴之礼獨行于後世此四人者其于經㫖雖不䏻有所彂明而聖人經文淂以遂傳天下寔此四人之力也今三人皆従祀而一人獨無與焉議者将欲建明以称朝廷尊儒重道之意王制問孟子之時去成周為未逺而成周之治盖孟子之所欲為而不淂者也以其所欲為之心而考其所未逺之事冝乎皆淂其寔而至論班爵禄之制有不合于經者夫公侯伯子男固五䓁也而曰天子一位公一位侯一位伯一位子男同一位以天子之尊而列于五䓁之間既非所冝而子男同一位之說又于傳無所見以子男之居皆五十里而謂之同耶則公侯皆百里而不謂之同者何也以子男之爵皆五命而謂之同耶則侯伯皆七命而不謂之同者何也其言卿大夫士之受地與王制不同而論耕者之所獲與周官亦異雖曰諸矦悪其害已而去其籍然此數事猶見于他經不為無所考而孟子之論如此有司所以疑而問也用賢問先王之時其所以待天下之賢者與䏻者異矣賢者不可責以事則使之在位而服休䏻者不可虚其材則使之在職而服采此書所謂承之庸之而孟子所謂尊賢使䏻者也然周之建官三百有六十自卿大夫至于下士莫不因事以設位因位以制禄未有居位食禄而不任以事者雖冡宰之賢貴亦未離于服采焉其所謂服休者不過三公而已服采者尝衆服休者常寡則天下賢者将何以䖏之耶在位者任德而常逸在職者任事而常劳則先王用人亦有流品之異耶兵賦問政必本于財財必取于民賞必施于功罰必加于罪此爲天下國家不可易之制也布粟力役之征古之制也而孟子以爲用其二而民有殍用其三而父子離関市夫里之征古之制也而孟子則欲去関市之征無夫里之布執干戈衛社稷古之所謂力也而孟子以為善戦者服上刑土地闢田野治古之所謂力而孟子以為闢草莱任土地者次之兹豈古之制欤意者其自有旨欤儒異問先儒有言孟子之書所以象論語故旨意合同者衆盖大賢擬聖而作也切尝考之疑其不然孔子君命召不俟駕孟子将朝聞命而遂不果孔子去衛明日遂行孟子去齊三宿而後出晝其制行之異類如此孔子称楽則韶舞而孟子則曰今之楽猶古之楽也孔子称畏大人而孟子則曰説大人則藐之其言之異類皆如此安在其為合欤抑其所以為異者乃其所以同之歟言語古之取士者或以德進或以事㪯或以言揚言之用于世其来逺矣内有朝覲会同辞受送劳之礼外有存省聘問傳遽道諭之事束帶立朝與賓客言使于四方不辱君命專对之才不可謂無益于用是以聖人雖以徳行為先而語言辞命亦在所不廢此宰我子貢所以淂歯于顔閔之后而公西華所以淂與于由求之列也子耻巧言後也遂以訥貭為賢是果聖人之意㢤言不可以取人則古之所謂以言揚者又何也孔子四科今用其三矣其一未也故與諸公議之眉山唐先生文集卷二十九眉山唐先生文集卷二十九月唐庚子西祭文祭祖坆文祭宋承之文祭程公儀文祭陳户部文祭孔明文南行祭江濵文代程信孺祭新婦文代路次祭文䇿題問尊儒王制用賢兵賦儒異言語
