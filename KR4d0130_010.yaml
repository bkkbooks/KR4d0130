front:
  text: 眉山唐先生文集卷十
  hash: sha256:cf955e3373c73986ccff96b856420decdb2ec4f7f0bdb06eb1166867546669ac
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_010-1a}
body:
  text: 眉山唐庚子西傳陸諝傳陸諝麴城人少與壷子啇君相友善約先貴無相忘已而壷子任太常商君主爵都尉通顯矣而諝方辟青州為從事壷商上疏曰臣等無狀蒙陛下器使待罪九卿自非得天下賢聖與之同升則非但無以副陛下傾渴而臣等亦自不滿臣友麴城陸諝者夆世莫能測其為人以為剛又無虐以為柔又有立文雅醞藉號為醇儒至論全身保家治國安天下則又似謀臣䇿士往時袁盎相吳王驕日久𢾗陷害二千石盎用其兄子種計與諝厚善卒賴其力淂脫虎口以歸此全生之道也吕太后時群臣動見覆族吕須讒陳平曰平為相非治事專從諝戲婦女后聞之私獨喜而平淂以全其宗此保家之效也河間修德為仁義天子不悅王俱日命諝作樂而河間幸無他此治國之效也曺參為相國賓客以百𢾗參悉謝去獨召諝問計連日夜語不厭相事幾廢而民間作畫一之歌此安天下之效也臣聞王者尊有德敬有功今諝既賢聖而又上自朝廷郊廟燕享下至田里冠昏聚會諝未嘗不在其間功效不為後人而位青州從事簿空置臣等無益上從其言遣壷子持莭召諝至見上歡甚是日拜諝光祿勳頃之封醴泉侯食千户諝歎曰生我者天地成我者壷啇也二人既荐諝以身下之然上每念諝輒并召二人諝卒諡懿侯子淳嗣至曽孫漓不肖以罪廢國除諝既沒二人亦踈斥屏居不復召用云太史公曰漢興陸賈以辨説遊公卿間名聲籍甚為太中大夫以夀終而諝𣸪以德業位九卿賜爵侯傳國𢾗世陸氏之先豈有天祿哉贊羅浮二賢贊并序葛稚川化去三十餘年單道開始來羅浮今山中人知有稚川而不知有道開蓋稚川既為鄧嶽所晉居山燒煉著書者𢾗年丹灶具存而道開平日惟食細石𢾗百淡無所為以故後世莫淂而考陳郡袁宏雖作道開贊然宏嘗為淵聖御名溫作九錫文矣此手豈冝復弄世外事而贊文亦𣸪不見于世遂作二贊書之山谷而不顯其處以貽後代之好竒者云江左日陋無復德輝翔而不集翩然南飛鄧嶽細兒處仲餘黨豈有識知亦復瞻仰吾緣外丹遂居羅浮豈以嶽故而議去留所就者大寧恤其小吾與嶽遊如狎鷗鳥右贊稚川世人茹柔剛則吐之匙抄爛飯口如牛呞至人忘物剛柔一致其視食石如餡餅餌北平飲羽出于無心食石之理于此可尋我雖不能而識其理庶幾潄之以厲其齒右贊道開張曲江畫像贊并序大觀四年冬吾南遷至曲江其故老為吾言唐開元中平盧帥張守圭遣偏將安祿山奏事京師張文獻公見之大驚密請除之不從未幾守圭入朝祿山引兵襲契丹大敗所亡失以萬計公請以軍法誅之又不從後二十年祿山稱兵犯順公之沒蓋十六年矣明皇奔蜀始悔不用公言于是遣使度嶺吊祭以舊史驗之良然然吾嘗謂眀皇一日殺三庶人如刈竹葦如剖瓜瓠無毫髮顧惜而誅一胡雛若拔齒然此何理也方是時唐祚將衰親踈厚薄之序一切倒置陵夷至于天寶之末人倫天理滅德敗壞悵垍其壻也而先叛永王其子也又叛太子起兵靈武則又叛雖微祿山唐祚未必不衰而唐祚之衰自祿山始明皇嘗嘆公沒朕不𣸪聞忠言正使公存吾知其言不𣸪用矣公平生論事至多而斯言不用尤可痛恨吾欲訪其故居而弔其墓識其子孫以永其遺風餘烈時方遷斥勢有所未暇獨淂其遺像流涕焉因作贊曰魏武言典午不可親而文帝待之坦然不疑也齊王攸言胡雛不可飬而晉武寵之崔然不移也莫親于父子莫愛于兄弟一有所蔽則親愛莫淂而奪之况于踈逺乎然則公言之不用固其冝也噫先事則未有信已事而悔則無及前世之敗未有不由于斯也可勝道哉可勝痛哉此吾所以見公之像慨然而咨嗟也銘益橋銘吾聞九卦主困而言也而曰益以興利者何哉以為自利耶則非所以為德之裕以為利物耶則非所以安困之時數以問易師易師皆不領政和元年謫居鵝城以暇日逰豐湖偃仰于橋亭之上閲其欵識欣然而笑曰吾淂之矣君子之心何嘗不欲兼修而有所謂獨善者淂非淂已也顧力不足耳方其不淂已之時而適有毫髮便益可以利人則雖窮厄九死之餘苟可以致力彼未有棄而不為者即無可為矣猶思所以為利于後代而况于當世乎吾將將淂之矣因名之曰益橋而為之銘曰過晉而悲至燕而微一至之情已過則移真悲不移生死由是云何能然有本所致吾觀此橋日度方屨積而計之巧曆莫𢾗以窮苦時作利修事乃知困中有益之義史南夀墓銘邑人史南夀以政和七年戊戌卒于家其子卜葬地得至孝鄉善聽里山地之原卜葬日淂十年十一月己酉于是遣使來請銘銘曰公之系太原史九齢名南夀字鼻祖灝尉􅎔卭屬唐末不後東居吾鄉為著姓自克恭丹稜令曽祖瑾祖正辭父大同世髙資列甲第名上田産巨萬僮指千公少時習于富捐金錢如糞土朝遊誰韓王孫莫遇誰左阿君居擊鍾出連騎盛而衰亦其理時既異事不同客益落家屢空身困約氣不衰捧笑腹伸談眉里人子喪所怙尸在地貧不舉公聞之時方食棄匕箸起太息立解衣易緡錢稅其孤衆翕然賙棺衾具飯含賻畢集尸乃斂性嗜書多所藏尤喜醫受禁方公為方殆天淂誚生御名起死虢𣣔為書施無窮草未就以夀終夀幾何七十五隂種德莫知數德既熟穫者誰娶王氏生兩兒長易簡吾故人有氣莭能苦辛次行簡尤所畏學已優時未仕女二人皆已行宋師錫洎孫京孫男一孫女二男耆卿女幼稚六故鄉為新墳近先壠利後昆中有銘文百句句三言信萬古亡兄墓銘先公奉議有子三人兄其長也少時受書為文章治易春秋皆有家法其志豈易量哉已而病肺不淂盡其力以學然天資孝友所立有絶人者正使力學其淂亦不過如此元祐三年秋先公逰瀘南豫兄弟持母喪于丹山兄半夜蹴豫曰吾夢收尊書彂之淂亟來二字何也尊淂無它乎吾心動矣汝侍几筵吾今趨瀘南省尊豫未有以應兄奮曰吾決矣是夕褁糧黎明赱洪川將僦舟而江水盛怒聲搖數十里客舟布岸皆相顧不動兄倣徨堤上有漁者持小艇繫港中啖以厚利不諾兄跳入據艇中叱僕夫解維漁者不得已從之用二日半至瀘而先公果病甚見兄大驚詰其所以來兄具道曲折先公嗟曰天告汝也是日疾少間兄具大舟迎侍以歸居𢾗日疾復作遂卒嗚呼方是之時非兄孝道足以通神誠足以知幾其禍可勝言哉元符二年冬弟庚以貢夆事繫獄􅎔卭語連兄臨卭并械之凡對吏逾年掠治無完膚而其詞確然不及􅏤以故獄久不具卒會赦除之其堅忍如此兄性真率無威儀人多易之至是乃大服以為不可及嗟乎吾少兄十有五年年二十五即去為吏四方五年十年乃一歸歸不過旬月復去此其中寧能無軼事乎然其大莭可覩矣兄以崇寧五年五月二十一日卒于家而貧不即葬殯僧舍十有三年然後淂歸骨于某村之原時政和八年十一月日也銘曰兄諱瞻改伯虎始字望之今長孺氏于唐望于魯五十二年卒歸土夫人范前物故葬有周制以范袝男子二才一女男業儒釋女猶處墓用銘家有譜後世參之考其素眉山唐先生文集卷十眉山唐先生文集卷十目唐庚子西傳陸諝傳贊羅浮二賢贊并序張曲江畫像贊銘益橋銘史南夀墓銘亡兄墓銘
