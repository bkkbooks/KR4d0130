front:
  text: 眉山唐先生文集卷十
  hash: sha256:cf955e3373c73986ccff96b856420decdb2ec4f7f0bdb06eb1166867546669ac
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_010-1a}
body:
  text: 眉山唐庚子西傳陸諝傳陸諝麹城人少與壷子啇君相友善约先貴無相忘已而壷子任太常商君主爵都尉通顯矣而諝方辟青州為從亊壷商上䟽曰臣等無状蒙陛下噐使待罪九卿自非得天下賢圣與之同升則非但無以副陛下傾渇而臣䓁亦自不滿臣友麹城陸諝者夆世莫䏻測其為人以為剛又無虐以為柔又有立文雅醞藉號為醇儒至論全身保家治國安天下則又似謀臣䇿士徃時袁盎相吴王驕日乆𢾗䧟害二千石盎用其兄子種計與諝厚善卒賴其力淂脱虎口以帰此全生之道也吕太后時群臣動見覆族吕須讒陳平曰平為相非治亊專從諝戯婦女后聞之私独喜而平淂以全其宗此保家之効也河間修徳為仁義天子不悦王俱日命諝作樂而河間幸無他此治國之効也曺参為相國賓客以百𢾗参悉谢去独召諝問計連日夜語不厭相亊㡬廢而民間作畫一之歌此安天下之効也臣聞王者尊有德敬有功今諝既賢圣而又上自朝廷郊庙燕享下至田里冠昬聚㑹諝未尝不在其間功効不為後人而位青州従事簿空置臣䓁无益上從其言遣壷子持莭召諝至見上歓甚是日拜諝光禄勲頃之封醴泉侯食千户諝歎曰生我者天地成我者壷啇也二人既荐諝以身下之然上每念諝輙并召二人諝卒謚懿侯子淳嗣至曽孫漓不肖以罪廢国除諝既没二人亦踈斥屏居不復召用云太史公曰漢㒷陸賈以辯说游公卿間名声籍甚為太中大夫以夀终而諝𣸪以徳業位九卿賜爵侯傳國𢾗世陸氏之先豈有天禄㢤賛羅浮二賢賛并序葛稚川化去三十餘年单道開始来羅浮今山中人知有稚川而不知有道開盖稚川既為鄧岳所晋居山燒煉著書者𢾗年丹灶具存而道𨳩平日惟食細石𢾗百淡無所為以故後世莫淂而考陳郡袁宏雖作道開賛然宏尝爲渊圣御名温作九錫文矣此手豈冝復弄世外事而賛文亦𣸪不見于世遂作二賛書之山谷而不顕其䖏以貽後代之好竒者云江左日陋無復徳輝翔而不集翩然南飛鄧岳細児䖏仲餘黨豈有識知亦復瞻仰吾縁外丹遂居羅浮豈以岳故而議去留所就者大寕恤其小吾與岳㳺如狎鷗鳥右賛稚川世人茹柔剛則吐之匙抄爛飯口如牛呞至人忘物剛柔一致其視食石如餡餅餌北平飲羽出于無心食石之理于此可尋我雖不能而識其理庻㡬潄之以厲其歯右賛道𨳩張曲江画像賛并序大覌四年冬吾南迁至曲江其故老為吾言唐開元中平盧帥張守珪遣偏将安禄山奏事京师張文献公見之大驚宻請除之不從未㡬守珪入朝禄山引兵襲契丹大敗所亡失以萬計公請以軍法誅之又不從後二十年禄山称兵犯順公之没盖十六年矣明皇奔蜀始悔不用公言于是遣使度嶺吊祭以舊史騐之良然然吾尝謂眀皇一日殺三庶人如刈竹葦如剖瓜瓠無毫髮頋惜而誅一胡雛若㧞歯然此何理也方是時唐祚将衰親踈厚薄之序一切倒置陵夷至于天宝之末人倫天理㓕徳敗壊悵垍其壻也而先叛永王其子也又叛太子起兵靈武則又叛雖㣲禄山唐祚未必不衰而唐祚之衰自禄山始明皇尝嘆公没朕不𣸪聞忠言正使公存吾知其言不𣸪用矣公平生論事至多而斯言不用尤可痛恨吾欲訪其故居而弔其墓識其子孫以永其遺風餘烈時方迁斥势有所未暇独淂其遺像流涕焉因作賛曰魏武言典午不可親而文帝待之坦然不疑也齊王攸言胡雏不可飬而晋武寵之磪然不移也莫親于父子莫爱于兄弟一有所蔽則親爱莫淂而奪之况于踈逺乎然則公言之不用固其冝也噫先事則未有信已事而悔則无及前世之敗未有不由于斯也可勝道㢤可勝痛㢤此吾所以見公之像慨然而咨嗟也銘益橋銘吾聞九卦主困而言也而曰益以㒷利者何㦲以為自利耶則非所以為徳之裕以為利物耶則非所以安困之時数以問易師易师皆不領政和元年謫居鵝城以暇日逰豊湖偃仰于橋亭之上閱其欵識欣然而笑曰吾淂之矣君子之心何尝不欲兼脩而有所謂独善者淂非淂已也頋力不足耳方其不淂已之時而適有毫髮便益可以利人則雖窮厄九死之餘苟可以致力彼未有弃而不為者即無可為矣犹思所以為利于後代而况于当世乎吾将将淂之矣因名之曰益橋而為之銘曰過晋而悲至燕而微一至之情已過則移真悲不移生死由是云何能然有本所致吾覌此橋日度方屨積而計之巧暦莫𢾗以穷苦時作利脩事乃知困中有益之義史南夀墓銘邑人史南夀以政和七年戊戌卒于家其子卜葬地得至孝郷善听里山地之原卜葬日淂十年十一月己酉于是遣使来請銘銘曰公之系太原史九齢名南夀字鼻祖灝尉􅎔卭属唐末不後東居吾郷為著姓自克恭丹稜令曽祖瑾祖正辞父大同世髙貲列甲第名上田産鉅萬僮指千公少時習于富捐金錢如糞土朝㳺誰韓王孫莫遇誰左阿君居撃鍾出連騎盛而衰亦其理時既異事不同客益落家屡空身困約氣不衰捧咲腹伸談眉里人子丧所怙尸在地貧不舉公聞之時方食棄匕箸起太息立觧衣易緡錢稅其孤衆翕然賙棺衾具飯含賻畢集尸乃歛性嗜書多所蔵尤喜医受禁方公爲方殆天淂誚生御名起死虢𣣔爲書施無窮草未就以夀終夀㡬何七十五隂種徳莫知数徳既熟穫者誰娶王氏生両児長易简吾故人有氣莭能苦辛次行簡尤所畏斈已優時未仕女二人皆已行宋師錫洎孫京孫男一孫女二男耆卿女㓜稚六故郷為新坟近先壠利後昆中有銘文百句句三言信萬古亡兄墓銘先公奉議有子三人兄其長也少時受書為文章治易春秌皆有家法其志豈易量㢤已而病肺不淂尽其力以斈然天資孝友所立有绝人者正使力斈其淂亦不过如此元祐三年秋先公逰瀘南予兄弟持母丧于丹山兄半夜蹴予曰吾梦收尊書彂之淂亟来二字何也尊淂無它乎吾心動矣汝侍几筵吾今趋瀘南省尊予未有以應兄奮曰吾决矣是夕褁粮黎明赱洪川将僦舟而江水盛怒声揺数十里客舟布岸皆相頋不動兄徬徨堤上有漁者持小艇繫港中㗖以厚利不諾兄跳入㩀艇中叱僕夫觧維漁者不得已從之用二日半至瀘而先公果病甚見兄大驚詰其所以来兄具道曲折先公嗟曰天吿汝也是日疾少間兄具大舟迎侍以帰居𢾗日疾復作遂卒嗚呼方是之時非兄孝道足以通神誠足以知㡬其祸可勝言㦲元符二年冬弟庚以貢夆亊繋獄􅎔卭語連兄临卭并械之凢对吏逾年掠治無完膚而其詞確然不及􅏤以故獄乆不具卒会赦除之其堅忍如此兄性真率無威仪人多易之至是乃大服以爲不可及嗟乎吾少兄十有五年年二十五即去爲吏四方五年十年乃一帰帰不过旬月復去此其中寕能無軼事乎然其大莭可覩矣兄以崇寕五年五月二十一日卒于家而貧不即葬殯僧舎十有三年然後淂帰骨于厶村之原時政和八年十一月日也銘曰兄諱瞻改伯虎始字望之今長孺氏于唐望于魯五十二年卒帰土夫人范前物故葬有周制以范袝男子二纔一女男業儒釋女猶䖏墓用銘家有譜後世参之考其素眉山唐先生文集卷十眉山唐先生文集卷十目唐庚子西傳陸諝傳賛羅浮二賢賛并序張曲江畫像賛銘益橋銘史南夀墓銘亡兄墓銘
