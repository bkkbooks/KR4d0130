front:
  text: 眉山唐先生文集卷二十八
  hash: sha256:b84771028c8b4437b24ddbdd2c808176d3c2193b4c7b4553afe1f9b0349aef17
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_028-1a}
body:
  text: 眉山唐庚子西雜文書朱尚書集後仁廟𥘉號人物全盛時而尚書與其兄鄭公以文章擅天下其後鄭公作宰相以事業顯于時而尚書獨不至大用徘徊掖垣十數年間故其文特多特竒兄弟于字學至深故其文多竒字誦者往往不識其將殁也又命其子慎無刋類文集故甚祕而不傳于世元符二年其子衮臣為利路轉運判官豫典獄益昌始淂尚書所為文讀之粲然東坡所謂字字照縑素詎不信哉文集二百卷豫淂九十有九卷其餘在曽子開家衮臣謂豫他日當取之并以授子云讀巢元修傳唐末有鄭遨者與李振厚善振仕梁至崇政使遨未嘗一至其門後唐同光𥘉振竄嶺外遨徒步萬里往見之其後一百八十年而宋有巢元修事士之難得蓋如此吾聞子由立朝謇謇有大體然靳惜名器太甚良以是失士心比其敗也士大夫詆之又過矣觀其書巢元修事可勝嘆哉可勝嘆哉諭幽燕檄我國家運啓漢符疆包禹迹際天所覆無不統臨盡海以還悉皆臣妾措函生于壽域躋寰宇于聖涯惟燕督亢之圖淂古幽州之域鼓刀屠肆俱懷義烈之風擊築行歌咸有英雄之氣向因悖晉割啖孽胡邀功一時貽禍萬世名宗令姓遂為異域文人竒士秀民永棄無知之俗蔑聞五教何啻百年風俗浸移已作李陵之胡服謳謡未改豈忘莊舄之越吟朝廷哀爾無辜淪于不化夷刑虜罰虐我遺黎犬穢羊羶薰吾故地爰整弔民之旅不逺徯后之情𣸪千里之關河拯一方之塗炭今則遼東欵塞賊齒益寒靈武獗牙虜臂皆斷孤危之勢顛覆可知倘能用夏變夷捨逆取順其如信賞當倍常科録可用之新氓捐無名之暴斂庶令陷溺𣸪覩太平誡諭諸路提舉常平司恤民夫理財所以飬民養民所以阜財知理財而不知恤民則民且散矣安淂財而理諸財用不足而加賦優民其害有甚于是者則財亦不可以不理此常平之法所以必不可廢雖廢而必𣸪也雖然徒法不能以自行故國家部置使者任之以權授之以成書使專董其事豫欲使民仰事俯育足以自給汝為豫欲使民凶年飢歲無流離失業汝恤豫欲使民疾苦呻吟有以自逹汝聽豫欲使吏奉法惟謹無意外鑿空以侵漁小民汝察庶民艱食赤子開口仰哺嗷嗷吏或恬視不發圭撮民所不欲吏或牽課抑強以利歲入之贏數期會未至吏或文移四出繫纍𫾣撲以要治辦之功汝其紏戒必罰無赦嗚呼有弊吏無弊法立法之意至寬至厚條目至纎至悉至明至白汝確行之無俾民受其害而歸咎於法毋俾異意之人得以藉口譊譊無謂朝廷不汝聞知往盡乃職朕言惟服其聼無怠思庵記跋尾有思是作病無思是滅病有思而無作惟無邪者近之無思而非滅惟不出其位者近之君侯幾於道哉思無邪而不出乎其位雜著自説詩最難事也吾於他文不至蹇澀惟作詩甚苦悲吟纍日然後成篇𥘉讀時未見可羞處姑置之明日取讀瑕疵百出輒𣸪悲吟纍日返𣸪改正比之前時稍稍有加焉𣸪數日取出讀之病𣸪出凡如此數四方敢示人然終不能竒李賀母責賀曰是兒必欲嘔出心乃已非過論也今之君子動輒千百言略不經意真可貴哉名小子説世疑老子西逰以謂有慈有儉有不為天下先持是道以逰于世何所不容而猶有所去就耶是大不然惟其無注而不容則雖蠻貊之邦行矣此其所以為老氏故名小子曰聃字以景老客至説貧家無酒食待客惟有茶湯爾山郡無佳茗而湯材亦不嘗有顧惟有水自入夏江水渾而井泥不可飲客至相對清談然比來公事冗冗清談亦不暇客之不至也冝哉失茶具説吾家失茶具戒婦慎勿求婦曰何也吾應之曰彼竊者必其所好也心之所好則思淂之懼吾靳之不與也而竊之則斯人也淂其所好矣淂其所好則寶之懼其泄而祕之懼其壞而安置之則是物也淂其所託矣人得其所好物淂其所託𣸪何言哉婦笑曰嘻是烏淂不貧異針道喪俗弊非惟今日援而救之顧自有術汝既無術欲救不能揭揭自異徒以取憎魯人獵軝未害于理方春鄉社未害于正禮有從俗易貴隨時汝獨自異背俗而馳凡汝所為世俗尤嗤充汝之􅍾蚓而後可士不必異亦不必同異褊同汚均失乎中勿異勿同惟義之適勿以汝身與世為的直針直乃一莭未為全德全德之人能曲能直不師全德而蹈一莭十圍之腹不能納一吸之氣徑尺之顱不能壓三寸之舌毫端棘末在汝胸臆汝不能納沖口逆突出輒逆人遂失顔色顔色不懌內藏怨隙談笑之間遽成仇敵汝怨汝疾終身不汝釋汝不早自責何以安汝迹耶雜説桓帝永壽二年天下民口五千餘萬自李固杜喬陳蕃李􅈾之徒相繼誅死漢室于是大亂天下四分五裂血戰百餘年晉武平吳然後天下𣸪合為一是歲民口五百餘萬比之永壽殺四千五百餘萬矣嗟哉悲夫君子賢人之存亡用舍其所繫豈小哉皇太后服藥齋僧文伏以眉毫散玉臨照十方臂色舒金護持一切仰資願力上祝慈闈恭惟皇太后謙道施平坤德載厚始佑思齊之聖惠于宗公逮參訪落之謀率時昭考過軫邦家之念稍違寢食之和有詔多方恭修勝利慿無量佛作大醫王早臻勿藥之瘳益引後天之算永均介福敷錫群生和南謹疏謝雨文攸司失政無以召和正覺能仁勇于利物遂獲沛然之澤𣸪興稿矣之苗無淂之功莫知所報又攸司失政無以召和大道集虛竗于應物遂獲沛然之澤𣸪興稿矣之苗不宰之功莫知所報祈晴文維神有以庇民則民有以事神歲方幸于有秋雨不止而彌旬將磨鎌而刈穫𣸪閉户而嚬呻人自慙于屢禱神不倦于為仁民之所籲神惟有慿謝晴文劔利皆旱種不入土神私此邦獨賜以雨雨既過多厥害惟均令𣸪還之遂禱于神拜手未起雨聲遽止歸未及家霽色千里令有何德感于神明將何以報之惟牲肥酒馨送湫文視之冷然可濫觴兮用之沛然澤一方兮􅎆瓶罐勺破驕陽兮稼穡以蘇民小康兮功成不返失其常兮作歌以送之以示不忘兮辭廟祝文敢昭告于某神某不用于時來長此民淂以理去實賴于神神以為然餘無足道戒行有期敢不以告祭諸廟祝文析報著甲令此常典也今歲兹土無大旱潦蠶榖以登賦輸以時顧守土者治行不足以致此惟治朝叶氣所薰與夫上下神祇之庇庥而賜不可以虛受故潔蠲飲食以答靈貺尚享眉山唐先生文集卷二十八眉山唐先生文集卷二十八目唐庚子西雜文書朱尚書集後讀巢元修傳諭幽燕檄誠諭諸路提舉常平司恤民思庵記跋尾雜著自説名小子説客至説失茶具説異針直針雜説皇太后服藥齋僧文謝雨文又祈晴文謝晴文送湫文辭廟祝文祭諸廟祝文
