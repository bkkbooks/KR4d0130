front:
  text: 眉山唐先生文集卷三十
  hash: sha256:8710d5c1b7b2b981065a5dcabb49b50981087aeb9af7dad6aaf32841ae625c59
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_030-1a}
body:
  text: 眉山唐庚子西䇿題為已問為已之甚而至于絶物者此楊朱之制行也孟子以為不義兼愛之甚而至于喪我者此墨翟之制行也孟子以為不仁外不至于絶物內不至于喪我處乎二者之間確然守之而不移者此子莫之制行也孟子以為害道夫士之擇術蓋亦可謂難矣兼愛者謂之不仁為已者謂之不義處乎二者之間自以為淂之矣而又謂之害道然則如之何而可乎必外此三者而後可以為道乎抑所以謂之道者亦不離于此乎道德仁義問楊子曰老子之言道德吾有取焉耳及捶提仁義絶滅禮樂吾無取焉耳夫道德仁義一也道在天則為隂陽在地則為剛柔在人則為仁義仁則三德所謂柔克義則三德所謂剛克仁義相濟則三德所謂正直者也故善言道德者未嘗不通于仁義善言仁義者未嘗不本于道德知道德而不知仁義是果足以為知道德者乎取其言道德而不取其賤仁義此有司所以不䏻無疑而質之于諸君也史官問動則左史書之言則右史書之三代而上王者莫不知此然六官之屬三百有六十獨不聞有所謂左右史者以為闕而不置耶則古之諸矦莫不有史晋之乘楚之檮杌是也而况於王者乎以為置而不録耶則羅春鳥除鳥鳶去鼉黽除水蟲之類至纎至悉無所不載而况于書言動者乎意者左右之職非六卿之屬耶抑周之建官不䏻盡見于六篇之書乎諸君其試陳之焉兵制問兵法有言有制之兵無䏻之將不可敗也無制之兵有能之將不可勝也李廣之為將也居則無部曲出則無行伍幕府無簿書之煩屯合無刁斗之衛務為簡易士卒樂之程不識之為將也居則正部曲出則正行伍晝治簿書夜擊刁斗近乎煩優士卒苦之夫以兵法觀之不識之將近乎有制之兵而李廣之事蓋不可以為法于後世者也前史是廣而非不識何㦲二者皆古之良將也諸公將安處乎六韜問兵家之有六韜猶儒之有六經也其取名必有義其序事必有法自文師以下治內謂之文自發啓以下治外謂之武此學者之所共知而無𣸪有可疑者焉自王翼至于農器而謂之龍自軍略至于壘虛而謂之虎自林戰至于公險而謂之豹自分合至于武騎士而謂之犬其取名之義其序事之法亦可淂而聞乎道體問指不足以喻指也非指者䏻喻之有不足以治有也無有者䏻治之父子之仁君臣之義夫婦之别長幼之序朋友之信是皆未離乎流者也權量以為平城池以為固車服以為勸斧鉞以為威符莭以為信是皆未離乎形者也既涉于有則不免于纍而自古天下未嘗敢廢者何哉蓋穴土而淂空鑿牗而得無則所謂有者乃無之所資故也夫無相者既不䏻以自行有物者不免于有纍然則將安處乎以有為體以無為用雖涉于有而免其纍焉此必有道矣治道問以道治天下者其事略以事治天下者其事詳是故曆以步其數象以占其象以道在日星者如此而已事則有璣衡以齊之平使當其分秩使當其序以道在四時者如此而已事則有巡守以考之或析或因或夷或隩以道在民者如此而已事則有典刑以示之孳尾希革毛毨氄毛以道在物者如此而已事則有官職以掌之觀堯舜之書則所謂道與事蓋可見矣以道治天下則無為者也以事治天下則有為者也堯典以道治天下而舜謂之無為者何哉無為者天也有為者人也舜既以無為為治而堯獨謂之法天者何哉治法明天問為治之序始于明天次以道德次以仁義五變而刑名可舉九變而賞罰可言古之聖人未有不循于此者也諸子言治道多矣大抵皆失其序其所當務者不過于分守刑名因任之術原省是非賞罰之事方是時䏻以仁義道德為意者蓋寡矣而况䏻明天乎天不䏻明則道德裂滅道德不明則仁義消壞道德仁義既以滅裂消壞則其所謂分守刑名因任之術原省是非賞罰之事可以為天下用而不足以用天下矣此漢唐之治所以終不及于古歟然則明天者治法之本也此學者之所冝知也同俗問廣谷大川異制人生其間異俗將因其俗而治之耶則人自為禮無所統一家自為法無所視效殆非先王所以教民之意也抑將易其俗而同之耶或抑其所䏻而强其所不䏻奪其所欲而與其所不欲殆非先王所以觀民之意也古人有言一道德同風俗又曰齊其政不易其冝修其教不易其俗二說乃相反且如此其可以相為用乎征斂問周之𥘉王業始基四方諸矦未盡賓貢九州之賦未盡輸入征討戰伐之事未尽休息倉廪府庫未至于有餘方是之時冝乎多取然而關市未有征也澤梁未有禁也園囿之利猶與民共之山藪林麓從可知也天下既平物衆地大四方諸侯皆已賓貢九州之賦皆已輸入征討戰伐之事皆已休息倉廪府庫之積不患乎不足當是之時冝乎寡取然關市始有征矣澤梁始有禁矣山藪林麓猶設官以守之園囿從可知也豈先後之勢有不淂不然者歟抑先王之立法𥘉不為有餘不足計歟諸君其深考而偹陳之耕讀問先王之時其所謂師儒者乃六卿之吏而其所謂士者乃六卿之民故為士者未嘗不耕而為農者未嘗不學周官以九職任萬民而士不與焉蓋以士寓其間故也周道衰𬋩仲始以新意變三代之法定四民之居而士農之判蓋自此始而孔子孟子之教以耕稼為小人之事非士君子之所當為而從學之徒一言及此則深詆而力排之者何也舜不耕于歷山禹稷不躬稼而有天下伊尹不耕於有莘之野乎何害其為聖且賢而孔子孟子之論如此必自有㫖也有司願與聞之學易問孟子習孔子者也楊子習孟子者也傳稱孔子晚而喜易序彖繫象說卦文言讀之韋編三絶曰加我數年五十以學易可以無大過矣其篤志如此孟子之書大抵皆淂于經其傳稱詩書禮樂蓋無所不有而獨未嘗言易豈孔子好易而孟子獨不好歟楊子之學雖無所不通而考其所淂尤在于易其言天下休咎既已詳于易之道而推本隂陽律曆又明于易之數豈楊子知易而孟子獨不知歟豈聖賢之嗜好果有不同者歟抑所謂知者果不在于言與不言之間歟老莊問傳稱莊子之學無所不窺而其要本于老子著書十餘萬言大抵以明老子之術而莊之自言則又異于此以為道術既裂各得其一而不䏻以相通如耳目鼻口各有所明如百家技巧各有所用有老𣆀聞而說之者有莊周聞而說之者審如所言則莊子之學其原不出于老子明矣而傳之所言如此者何哉老莊之學諸君深淂之矣其試辨之程材問昔者七十子之徒從夫子于洙泗之間其志未嘗不欲附驥尾而名益彰夫子之心亦未嘗不欲成其名于後世而卒能以其所長淂與于四科之列者十人而已此夫子所以愍其成材之難而有不及門之嘆也然以曽子之賢而不與德行赤也束帶立朝可使與賓客言而不與于言語子賤之治至於民不忍欺而不與于政事子張有聖人之一體與遊夏等矣而不與于文學夫成材之難夫子常嘆之矣幸而有焉又棄而不録聖人果何心哉其去取冝自有理也言信問天以五生物地以五成之故萬物盈於天地之間而其要必歸于五在天為五行在人為五事在物則為五味五聲五色而吾性之所有者則為五常此天地萬物自然之數匹夫之所共知而聖人不䏻有所加損也今言仁義禮智而信不與焉是猶五行之無土五事之無思至于五味五聲五色皆闕其一謂尽物之理可乎而孟子之說如此學者所冝深考其意也人物問由漢以來著書立言純合于經而不雜以諸子百家之說者楊子一人而已至論人物則猶有可疑者焉夫莊子者古之所謂隱居放言者也而以申韓配之莊子豈申韓之流也哉顔子之于聖人一間耳而以黔婁四皓配之猶若有理焉至以韋成配之不亦甚乎伯夷聖之清栁下惠聖之和而以仲元配之仲元雖賢然亦豈至是哉楊子必不妄也有司求之未至爾諸君其以告之四庫提要云唐庚與蘇軾皆眉州人又先後謫居惠州宜于鄉先輩多所稱述而集中聞東坡眨惠州詩深著微詞今讀其詩似有所諷至謂集內除前詩及送王觀復序內稱從蘇子于湘南一句外餘無一字及軾則不然今考集內雜文書朱尚書集後及茅三卷近體詩乙未正月云云七律一首均曾及坡語提要蓋未深考之也壬中秋九月校誦一過并題禮逸眉山唐先生文集三十卷終眉山唐先生文集卷三十目唐庚子西䇿題為已道德仁義史官兵制六韜道體治道治法明天同俗征斂耕讀學易老莊程材言信人物
