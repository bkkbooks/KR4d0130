front:
  text: 眉山唐先生文集卷十五
  hash: sha256:509444552914f4a988252f6b1de556a23424876a537b748aa97a9561bdb8f1f1
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_015-1a}
body:
  text: 眉山唐庚子西雜文書三謝詩後江左諸謝詩文見文選者六人希逸無詩宣逺叔源有詩不工今取靈運惠連元暉詩合六十四篇為三謝詩是三人者詩至元暉語益工然蕭散自得之趣亦復少減漸有唐風矣于此可以觀世變也唐子西書生日設醮文切以有生之衆所欲不同貧者願乎多財冨者期于不死賤者志求乎顯逹貴者思保其久長人既無厭神亦難應臣雖無似志實不然雖亦有禱于三清惟乞無災之二字但以私門多故歷歲不寧齒髮變于艱危精神耗于憂慮爰因生日虔叩上蒼庶幾天髙而聽卑所謂物窮則反本使身心安穩尚復何求眠食康寧便為至足其他外物一付自然既所請之甚微冝必從于所禱下情懇仰伏望照􅎔臣無任瞻天望聖激切屏營之至生日青詞上界髙髙非人間世衆生優優如海中沙以如此之至微求自通于至逺亡何得達惟有至誠臣稟生雖愚奉道有素謹因生日特啓醮筵雖濁世溷淆豈降􅎔之敢望而至心齋潔庶慈憫以來歆止于禳災非敢求福臣無任焚黃祭文嗣子承議郎某敢昭告于皇考承事先生皇妣孺人五十二娘之靈通籍于朝逮今十年遇大禮者數矣而負罪流落久隔贈典乃者蒙恩復齒朝著始贈皇考承事皇妣孺人蓋自孤苦垂三十年然後能取一命以追榮父母而少伸人子之心其不孝不敏之罪無所逃矣雖善文其過者莫能為之詞也區區之心考妣其鑒之尚享祭家氏文敢昭告于前母家氏孺人之靈國家恩德厚矣士人列于朝者非獨榮其父母又并其前母而封之上以極其父子之恩傍以廣其兄弟之義皆聖世之彌文前代之闕典也然非平日為善之報亦何能致之哉尚享代內醮文頃歲以來多難相繼今兹遇疾猶異常時雖生死之有期兾神明之可禱雙親皓首殊未報于生成稚子弱齢尚未離于乳哺仰祈洪造少假餘年得畢此心外無所望也墓志銘行狀附淮隂賢婦墓志銘賢婦亡姓名淮隂下鄉人蓋老矣貧無自資以洴澼絖為業屬秦末亂離民不親耒耜者纍年矣天下飢饉婦方坐沙上以水擊絮望見城下有客長大帶刀劍倣徨水濵婦私獨怪之遂就與語則壯士也而有飢色婦哀其困館而食至數十日欣然無倦意客感嘆曰異日必重報母是時天下兵動關東豪傑並起婦視客非庸人終能有所就遂佯怒以語激之曰丈夫不能自食吾哀王孫而進之食寧望報乎會楚兵過淮客仗劍楚君麾下楚不能用客亡命歸漢得大將從漢王定三秦與楚人戰京索間有功二年八月始以涉西河破魏豹九月破代十二月破趙明年十二月遂破齊蓋自北出至是歲餘而卷天下之半明年二月漢遣使立客齊王明年引兵會漢垓下破楚天下大定漢客徙王楚都下邳蓋自寄食五年裂地數千里南面稱孤于是下令求婦報千金天下不多客之賢而多婦之長者有知識客韓信也婦卒葬泗口南岸銘曰項王喑嗚亜父謨謀信來不呼信去不拘坐視信逋反噬其􅥟匹婦區區而知信乎吁徐夫人墓志銘夫人徐氏其先京兆人唐末避地遂家于眉州丹􅏢自考以前蜀人憚逺仕進者尚少故曽祖某祖某考某三世無食祿者夫人幼穎悟年十二喪所恃己能順適繼母無毫髮不滿意考為人嚴重左右莫敢仰視獨夫人侍側輒怡然為之解顔家人因以白事年二十歸劉氏舅姑得之喜即委以家政方是時劉氏纍世好施生事蕭然夫人既專內事雖細務必親之規畫處置悉有法度可守未幾劉氏𣸪振舅姑既沒父母春秋髙嗣子早喪夫人奉飬喪祭能盡其道姪有少孤從其母嫁者夫人取置諸子間摩頂撫育無有輕重厚薄至為婚媾能自立乃巳課二子讀書甚力既而二子以次取進士第元符三年長子汲為合州司理參軍奉夫人以行是歲六月二十四日卒年五十二少子湜登科時夫人沒五年矣惜乎不及見也汲今以宣德郎知鄢陵縣湜以通仕郎行蜀州晉原尉女適楊某孫若于尚幼大觀四年十一月日葬于某鄉之原其將葬也鄢陵以行狀請銘于豫豫交鄢陵二十餘年朋友之情既不可違而夫人之善又不可廢其事父母舅姑也如此其治家立門户也又如此收恤孤露而成之又如此教其子問學連年取科第流聲號于時又如此是烏淂不銘也哉銘曰大兒來歸里門下車小兒來歸擁版以趨宦孝成矣繫而母且而母不留可悲也夫史子深墓志銘君諱通字子深姓史氏世為眉之青神人少與其兄珣皆以文學知名于鄉年十七以貢舉不中遂退居于楠溪之上杜門著書絶人事者數年淂易蓍若干卷乾坤别解三卷禮記義一卷詳説四卷律吕氣數十二卷書義八卷詩義若干卷論語孟子解各若干卷子史論若干卷其書既出學者翕然稱之或曰是知古矣其于時事未必知也己而君至京師進世要機務十卷芻蕘䇿二十卷其言當世便利非草茅布衣之士所能言之至于論兵則雖謀臣宿將練習邊事者不能易也或曰是能言矣其于行事未必能也己而君起家尉通州遂能使人畏己遇事輒斷號為強明至作磐石今則又專務寬厚和易撫字勸課如古循吏所為蓋二邑之俗不同故君所以應之者亦異名聲大著諸公交章荐之而君巳卒縣人哭泣悲思至今父老猶喜道當時事吾嘗謂學者所貴乎知經者以其能知道所貴乎知道者以其能應物白首窮經而不能應物又何以經為哉悲夫君學足以知經道足以應世而晚得一命年止五十七不得以充其志官止于一縣令不得以盡其才故其應物者止于如此此吾黨之士所以嗟惋嘆惜為之請銘以葬而吾亦不得而辭也史氏糸出魯國後徙杜陵唐末入蜀遂家于眉曽祖祖考皆不仕君中元祐三年進士第歷逹州通州尉資州盤石令年月日卒于官舍先娶侯氏再娶程氏男二人曰紀曰彥時女五人長適某次適某孫男二人女一人皆幼以大觀三年三月日葬于某山之原銘曰子深之書學者多有雖不銘之自足以久既足以久而又銘之子深之傳愈久不疑史夫人墓志銘夾江縣孫公諱某之夫人姓史氏眉州青神人故任嘉州軍事推官諱著明之曽孫故贈大理寺丞諱昭吉之孫余外祖諱及之季女也余少時嘗至其家矣公長不逾中人語音如鐘喜談前言往行亹亹可聽蓋嘗約家事勿復相關悉聽夫人夫人明敏解事而入情其規矩措置有絶人者孫氏歲入不資用度亦廣矣而夫人治之皆有法內外親戚姻婭之間冠婚殯祭慶吊之事殆無虛日而夫人處之皆有體公三娶男女九人而夫人待之皆如己之所出余固嘗隂以察之矣未嘗見其有毫髮輕重厚薄也方是之時長子昌齡時年四十餘歲而喜從豫遊幼子昌裔時年十五六晝出從師受書及抵暮夜方歸甫歸夫人必親自以教之使無倦惰之容及垂首誦讀至夜分之時然後乃己女有適羅某者有適王某者有適于魏某而早卒者有適于張某者又有適于宋某者有未笄者及有絶幼者是歲乃紹聖之元年甲戌也今二十五年矣公先卒既葬夫人又卒今及葬矣而子昌齢又卒矣有孫七人曽孫則三人也昌裔今又改名衍亦有孫七人矣向之云未笄者今則嫁承議郎鮮于某而有封號矣向所云絶幼者今則為某人之妻而且亦有子矣流光如過隙耳而欲無老得乎詩云未幾見兮突而辨兮是以有德者所行所為身雖沒而音容不隔儀型常著而常新百年之間若旦暮也夫人貌類先妣孺人倘卒然間遇之幾有不能辨之者先妣既沒時余以畫者失真恐無以示後人因取夫人傳神以􅎔焉見之者無不隕涕其兄弟之間蓋如此斯亦竒矣然然則銘其墓者非余而又誰任之哉夫人享年七十有一其卒也以政和四年十一月五日其葬也以八年十一月一日乃銘之曰豐泉之原封若斧祔而合之蓋從魯其甥銘之固其所眉山唐先生文集卷十五眉山唐先生文集卷十五目唐庚子西雜文書三謝詩後生日設醮文生日青詞焚黃祭文祭家氏文代內醮文墓志銘淮隂賢婦墓志銘徐夫人墓志銘史子深墓志銘史夫人墓志銘
