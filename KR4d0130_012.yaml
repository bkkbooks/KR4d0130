front:
  text: 眉山唐先生文集卷十二
  hash: sha256:fb75ebe6bb3f9cf5ebb699cda833ac4f8d261ca9a6e81d4b707fc95a74c1d5a8
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_012-1a}
body:
  text: 眉山唐庚子西三國雜事曹公征下邳擒關羽以歸禮之甚厚而察其心神無久留之意使張遼以情問之羽嘆曰極知曺公待我厚然吾受劉將軍恩終不可留要當立效報曹公而去及羽破顔良曹公知其必去厚加賞賜公悉封還拜書告辭歸先主于袁軍左右請追之公曰彼各為其主勿追之也羽為曺公所厚而終不忘其君可謂賢矣然戰國之士亦䏻之曺公淂羽不殺待之厚而因用其力亦可謂賢矣然戰國之君亦䏻之至羽必欲立效以報公然後封還所賜拜書告辭而去進退去就雍容可觀殆非戰國之士矣曹公知羽必去重賞以以贐其歸戒左右勿追曰彼各為其主也內䏻平其氣不以彼我為心外能成羽之忠不私其力于巳是猶有先王之遺風焉吾嘗論曹公曰是人䏻為善而不䏻不為惡䏻為善是以䏻享國不能不為惡是以不能取天下黃𥘉二年八月魏遣太常邢正持莭䇿權為吳王加九錫權受之是歲吳蜀相攻大戰于夷陵吳人卑辭事魏受其封爵恐魏之議其後耳而魏略以為權有僣意而自顧位輕故先卑而後倨之先卑者規得封爵以成僣竊之基後倨者兾見討伐以激怒其衆且吳至權三世矣其勢足以自立尚何以封爵為哉受封爵則君臣矣供職貢矣除邊關矣國有警急以事聞無淂擅興兵攻擊矣羽書至則悉甲士從徴矣非身入朝則遣侍子入宿衛矣彼藩國固然亡足怪者一不從命則王師致討有詞矣然後發兵拒戰是抗上矣尚安䏻激怒其衆也哉既而魏責侍子權不䏻堪卒叛之為天下笑方其危急之時群臣無魯仲連之識出一切之計以寬目前之患而陳夀以勾踐竒之勾踐事吳則嘗聞之矣受吳封爵則未之聞也魏明帝問黃權曰三國鼎立何者為正權曰當以天文為正往歲熒惑守心文皇帝崩吳蜀平安此其證也權推魏為正統未必不然然權初無他說一以天文决之此非余之所敢知也黃初四年三月癸卯月犯心大星占曰心為天王位王者惡之四月癸巳蜀先主殂于永安宫而二國皆自如天道豈易言哉晋天文志稱二石雖僣號其强弱常占昴宿不關太微紫宫然以載紀考之流星入紫宫而劉聰殞彗星掃太微而苻堅敗熒惑守帝座而吕隆破故知推論正統固自有理也晋庾翼與兄氷書曰歲星犯天關江東無它故而季龍頻年閉關此復是天公憒憒無皂白之證也噫人之責天亦太詳矣為天者不亦難哉先主攻劉璋所至輒克置酒大㑹于涪謂龎統曰今日之㑹樂矣統曰伐人之國而以為歡非仁者之兵也先主曰武王勝商前歌後舞非仁者耶備之識陋矣何足論哉至于樂與不樂之義則有可得而言者傳曰師有功則奏凱歌又曰戰勝以喪禮居之二義孰是吾聞聖人無心以百姓心為心其戰也本所以憂民之憂其勝也不得不樂民之樂故師有功則奏凱歌此無足怪者然道失而後德德失而後仁仁失而後義義失而後禮道至于禮其去本逺矣而况于兵乎故戰勝以喪禮居之亦無足怪者言樂與不樂皆未之盡也古之處此者外則歌舞而內以喪禮居之黃𥘉四年司徒華歆司空王昭尚書令陳群太史令許芝謁者僕射諸葛誕各有書與諸葛亮陳天命人事欲使舉國稱藩亮不報魏之群臣可謂不學亡術而昧于識慮矣使其學術識慮如漢䔥望之者不為此舉動也漢宣帝時呼韓欵塞稱藩望之議以客禮待之使他日遁去于漢不為叛臣宣帝從之蓋方是時胸奴雖衰然素號敵國非東甌南粵比也名分一正遂不可易他日叛去何以處之彂兵加誅則勢有所未䏻置之不問則無以令天下故方其柔順之時待以不臣之禮非獨示以謙德蓋將將為後日久逺之慮也魏之自視何如宣帝吳蜀雖弱不至如呼韓邪之時彼雖稱藩猶當待以弗臣况未服而强之耶前此加權封爵而為權所戲侮今𣸪喻蜀稱藩為亮所不答自西自東自南自北無思不服者不如是之勞也興平二年袁術僣號于九江置南北郊是時荆州牧劉表亦郊祀天地漢不䏻制唯天子祀天地于郊唯魯淂用郊郊祀之禮聖人之所甚重而後之亂人欲為大盜於天下未嘗不先盜兵所甚重者此莊老之徒所以有聖人不死大盜不止之說也至楊子之論則又不然秦人祀白畤周不即禁卒舉天下而與之名分所在不淂不重夫莊老之說儒者固己非之而楊子之論亦𣸪有所未盡楊子惟知嚴名分以􅎔天下而不知䏻保天下者然後䏻守名分秦人之祀白畤周非不欲禁之力有所不䏻也然則欲守名分者先勉其所以保天下者哉諸葛孔明說先主以跨有荆益保其􅑐阻天下有變則命一上將以荆州之軍向宛雒而身率益州之衆以攻秦川先主稱善髙祖既破陳狶還至雒陽嘆曰代居常山北而趙從山南有之逺乃立子常為代王以代郡㕍門屬焉地固有封境雖接而形勢非便者矣荆州在山前距蜀五千餘里而蜀從山後有之其勢實難非獨不䏻有荆州也雖得秦川亦不䏻守何者梁益險絶蓋自守之國而不可以兼并凡物之在山外者尺寸不䏻有此髙祖所以棄漢中而取三秦也權欲令太子登讀漢書習知近代之事以張昭有師法重煩勞之乃令休從昭受讀還以授登劉偹教禪以漢書而權亦令張昭以漢書授其子登世以權偹之智不足以知二帝三王故其所以貽謀者止于如此是大不然伊尹之訓太甲也稱有夏先后而不及唐虞周公之戒成王也稱啇三宗而不及虞夏豈伊尹周公之智不足以知堯舜禹哉亦取其近于時切于事者而己權偹之知識不足擬伊尹周公至其教子不忽近而慕逺不貴名而賤實此亦伊尹周公之遺法也晋漢春秋曰孫皓聞羊陸交和以詰于抗抗曰臣不如是正足以彰其德耳于祜無傷也或以祜抗為失臣莭兩􅏺之親仁善鄰者國家之事出竒克敵者將帥之職羊陸以將帥之職而修國家之事此論者所以􅏺其失莭也竊謂不然兵固多術矣有以力相傾者有以智相傾者有以德相傾者秦漢以來惟知詐力一有為德則是非為之紛然而不知所謂以德相傾者是亦出竒而己矣何名為失莭哉然晋陽秋以為羊陸推僑札之好兹太過矣兵家詭道何僑札之有就如所云乃不足貴何則非吳鄭之使而敦僑札之分處方面之仕而私境外之交此非所以稱羊陸之美也三國雜事篇下操征栁城偹勸劉表襲許表不䏻用其計挾天子令諸矦其事始于齊御名晋文而齊御名晋文未嘗遷惠王襄王于齊晋也除難定亂興滅繼絶功效既著諸矦自服耳董卓以獻帝居長安李茂正以昭宗幸鳯翔發號制令動以制詔為名然而天下諸矦群起而攻之何也無尺寸之功以取信于天下而有劫主之名以負謗于諸矦則天下諸矦群起而攻之亦固其理也使表䏻勤王如御名文耶雖不襲許何害其為令諸矦哉如其不然雖襲許適足以致諸矦之師而已卓與茂正是也眉山唐先生文集卷十二眉山唐先生文集卷十二目唐庚三國雜事曹公征下邳擒關羽以歸禮之甚厚黃初二年八月魏遣太常邢正持莭䇿權為吳王加以九錫權受之魏明帝問黃權曰三國鼎立何者為正先主攻劉璋所至輒克置酒大㑹于涪黃𥘉四年魏華歆王昭等各有書與諸葛亮陳天命人事欲使舉國稱藩亮不報興平二年袁術僣號于九江漢不䏻制諸葛孔明說先主以跨有荆益保其巖阻權欲令太子登讀漢書習知近代之事晋漢春秋曰孫皓聞羊陸交和以詰于抗三國雜事篇下操征栁城備勸劉表襲許表不能用其計
