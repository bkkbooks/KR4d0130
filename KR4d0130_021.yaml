front:
  text: 眉山唐先生文集卷二十一
  hash: sha256:0bac77a14276465260824e1aa9348378b25cdb2412cd20f7961b001688dc6473
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_021-1a}
body:
  text: 眉山唐庚子西近體詩獲蠻賊代主簿賀張安撫詔書頻促馬頭東更為邊民縛狡童三箭不煩仁貴乎七擒自得武侯功梟雛已去古巢冷狼子不歸秋穴空何用聲名逹朝聽恐妨辟榖伴喬松書齋即事書生不事事書齋春晝長竹色笑語緑松風意思涼簞瓢樂仁義圖史披興亡此間有佳趣此外皆茫茫題所居鼾睡失青春昏昏尚欠伸素知行路惡敢厭在家貧搜句工雖淡看書味頗真檄來端不喜毛義已無親夜坐感懷聲斷鐘樓月文書對坐時破窗燈焰走凍研筆鋒遲名利髮將寉風霜手欲龜何當一簔雨披曉剪蓴絲述懷名字雖云繫列曺儒風門户只蕭騷頭顱自揣冝藏拙指目何妨笑奍髙本以食貧來仰祿豈于王事更辭勞老來精力堪驚嘆一𥿄文書輒𢾗遭秋夕書懷亹亹歲華侵垂垂老境􅎔時光自風雨寒色到衣衾萬竅號秋杪孤燈照夜深蛩聲亦清苦唧唧伴人吟過湖縣狼虎猶知父子仁人生安有不親親武皇况是聰明主却恨𥘉無一諌臣過田橫墓其一成則為王敗則亡英雄成敗本尋常滄溟無際何妨死却死東郊未耿光其二九江梁楚竟誅夷自古才髙先見疑脫使􅐱生猶未死將軍來此亦何為過潼關鐡衣十萬擁胡雛手釋襟喉計赤踈閫外不聞天子詔將軍未甚讀兵書題瀘川縣樓六字百斤黃魚鱠玉萬户赤酒燒霞榆甘渡頭客艇荔枝林下人家蘇君俞通判愚齋人間爭以智相高底事紛紛祗自勞頓覺宋愚真有味莫將佳處語兒曺又三年消遣琴書在一室清虛杖履涼却怪齋名渾未盡過來愚智已兼忘題春歸亭沙際春光又早歸亭前景物故應竒緑楊雅與清江稱殘雪偏于碧嶂冝流水無慿何處去東風有凖不吾欺芳菲欄檻無窮興消得新愁入鬢絲和程大夫荔枝家在岷峨飽荔枝十年逰宦但神馳側生流詠今千載左思蜀都賦云側生荔枝入貢稱珍彼一時定自不將凡果比曺子建云龍眼凡果非荔枝比如何偏與瘴煙冝白頭莫作江南客辜負山中故友期雪意二首其一睡眼拭朦朧開門雪正濃客來迷舊徑虎過識新蹤浦逺渾無寉林踈只有松惜琴如不解酒興若為供其二榆關書不至雪又滿平蕪指冷頻呵玉胸寒屢掩酥緑嘗冬至酒紅擁夜深爐塞上風沙急征衣到也無閨怨芳草繞池緑天涯人未歸春來更消瘦渾欲不勝衣俞和叔座上賦白鹿洞中于世本無求取白鹿洞一落人間幾見秋和月看時迷濯濯隔雲聼處認􅊯􅊯未容寉客矜風韻應許猿翁作品流莫把竒毛驚俗眼恐妨歸去舊山幽寓精道齋有感懷家山論兵作賦兩匆匆人事光隂轉手空五作半夜夢飛山色裡一年秋在雨聲中揚州騎寉非無意上蔡牽黃信此窮韋有林泉未歸去欲將清興問征鴻又悠悠功業老堪憐舊事慿誰可共論直欲酒中賖快樂尚能花裡覔寒溫詩書娛我成何事歲月侵人不見痕汾水年年秋堆到庾郎何處不銷魂晚春寄友人其一眼底春愁惱殺儂楊州往事旋成空風流只合稱狂客衰颯何堪作病翁水國春深梅子雨江南日暮鯉魚風何時執手同樽酒收拾清歡笑語中其二滿眼蕪菁斷送春多情饒病兩關身只知老去人心改不覺愁來酒盞頻霜鶻空拳知有命溟魚水恐傷神丈夫出處端無據猶恐辭家再入秦春日雜興七首其一羲陽瀟灑燕臺詩誰解知音似栁枝寂寂間庭春色過露花無語背人悲其二愛梅常恐著花遲日禱東風莫後期及得見梅還冷淡東風全在小桃枝其三茸茸小雨弄春晴已有狂花未見鶯便使一年惆悵在曉窗寒夢别輕盈其四春衣𥘉作舞雩歸手展韋編畫寢稀解使芳隂快幽意飛紅零落繞窗扉其五短帽輕衫信馬行郊原春色太牽情兔葵燕麥渾間事最有蕪菁到處生其六月團新碾破春酲賴有歸鴻寄好音人在天涯莫回首恐偷華髮上瑶簮其七故人不見空凝睇過眼全踈只斷魂猶有野梅􅎔水在一枝無語伴黃昏張祖同挽詞西南失望郎天理信茫茫豪逸陳驚座風流馬季長才冝分竹使恩不自椒房清白今方著群兒勿謗傷任太君挽詞賢婦古亦少紛紛何况今柏舟全美志綵服慰幽心舊邑虛湯沐新阡祔藁砧子孫門户壯誰敢齒諸任送太學李生歸鄊挈笈來東序經年亦􅌒逰却辭同舍去聊慰倚門憂顔子進未止何蕃誰為留到家席不暖隨計又皇州送蘇教授赴闕三年泮水振洙風俯接諸生屢改容嶺霧因時難隱豹岩雲有便得從龍久欽才調無雙手今喜聲名逹九重拂袖漢陽休更問丈夫事業出心胸别閩中許秀才􅎔岐長嘆息此嘆意深微浮世年年别𥘉心事事違捫參蜀道逺犯斗海槎歸故國有餘樂黃雞秋正肥送朱元素歸飬又可曽為客到江陽塞上蕭條斷旅腸歌動竹枝終日楚笛吹梅弄數聲羌仰天太息偷銜憤𬒳髮驚呼不為狂校尉自能清白眼肯教牛尾一般黃調華陽尉家世傳儒素平生學古文三年思故國一命荷明君折莭羞黃版歸休許白雲吟詩無廢事薄俸不禁分孟東野尉平陽淫于詩曺務盡廢郡置假尉以代之分其半俸焉天寧莭口號九曲昆渠換碧流挺生英主間千秋謳歌萬國才歸禹損益三年便繼周南畝暗侵山色盡西陲展到海邊休不知誰是乘槎客為採蟠桃荐冕旒眉山唐先生文集卷二十一眉山唐先生文集卷二十一目唐庚子西近體詩獲蠻賊代主簿賀張安撫書齋即事題所居夜坐感懷述懷秋夕書懷過湖縣過田橫墓其一其二過潼關題瀘州縣樓蘇君俞通判愚齋又題春歸亭和鄭大夫荔枝雪意二首其一其二閨怨俞和叔座上賦白鹿寓精道齋有感懷家山又晚春寄友人其一其二春日雜興其一其二其三其四其五其六其七張祖同挽詞任太君挽詞送太學李生歸鄉送蘇教授赴闕别閩中許秀才送朱元素歸奍贈瀘倅丘明善又調華陽尉天寧莭口號
