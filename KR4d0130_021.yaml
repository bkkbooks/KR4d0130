front:
  text: 眉山唐先生文集卷二十一
  hash: sha256:0bac77a14276465260824e1aa9348378b25cdb2412cd20f7961b001688dc6473
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_021-1a}
body:
  text: 眉山唐庚子西近体詩獲蛮賊代主簿賀張安撫詔書頻促馬頭東更為边民縛狡童三箭不煩仁貴乎七擒自得武侯功梟雛已去古巣冷狼子不帰秋穴空何用声名逹朝聴恐妨辟榖伴喬松書斋即事書生不事事書斋春晝長竹色笑語緑松風意思凉簞瓢楽仁義圖史披㒷亡此間有佳趣此外皆茫茫題所居鼾睡失青春昏昏尚欠伸素知行路悪敢厭在家貧捜句工雖淡看書味頗真檄来端不喜毛義已無親夜坐感怀声断鐘樓月文書对坐時破窓灯㷔走凍研筆鋒遲名利髪将寉風霜手欲亀何當一簔雨披曉剪蓴絲述怀名字雖云繋列曺儒風門户只䔥騷頭顱自揣冝藏拙指目何妨笑奍髙本以食貧来仰禄豈于王事更辞劳老来精力堪驚嘆一𥿄文書輙𢾗遭秋夕書怀亹亹歲華侵垂垂老境􅎔時光自風雨寒色到衣衾萬竅號秋杪孤灯照夜深蛩声亦清苦唧唧伴人吟過湖縣狼虎犹知父子仁人生安有不親親武皇况是聪明主却恨𥘉無一諌臣過田横墓其一成則為王敗則亡英雄成敗本尋常滄溟无際何妨死却死東郊未耿光其二九江梁楚竟誅夷自古才髙先見疑脱使􅐱生猶未死将軍来此亦何為過潼関鐡衣十萬擁胡雛手釋襟喉計赤踈閫外不聞天子詔将軍未甚讀兵書題瀘川縣楼六字百斤黄魚鱠玉萬户赤酒燒霞榆甘渡頭客艇荔枝林下人家蘇君俞通判愚斋人間争以智相高底事紛紛祗自劳頓斍宋愚真有味莫将佳䖏語児曺又三年消遣琴書在一室清虚杖履凉却怪斋名渾未盡過来愚智已兼忘題春帰亭沙際春光又早帰亭前景物故應竒緑楊雅與清江称殘雪偏于碧嶂冝流水無慿何䖏去東風有凖不吾欺芳菲欄檻無穷興消得新愁入鬂絲和程大夫荔枝家在岷峨飽荔枝十年逰宦但神馳側生流詠今千載左思蜀都賦云側生荔枝入貢称珍彼一時定自不将凡果比曺子建云龍眼凢果非荔枝比如何偏與瘴烟冝白頭莫作江南客辜負山中故友期雪意二首其一睡眼拭朦朧開門雪正濃客来迷舊徑虎過識新蹤浦逺渾無寉林踈只有松惜琴如不觧酒㒷若為供其二榆関書不至雪又滿平蕪指冷頻呵玉胸寒屡掩酥緑尝冬至酒紅擁夜深炉塞上風沙急征衣到也無閨怨芳草遶池緑天涯人未帰春来更消痩渾欲不勝衣俞和叔座上賦白鹿洞中于世本無求取白鹿洞一落人間㡬見秋和月㸔時迷濯濯隔雲聼䖏認􅊯􅊯未容寉客矜風韵應許猿翁作品流莫把竒毛驚俗眼恐妨帰去舊山幽寓精道齋有感懐家山論兵作賦両怱怱人事光隂轉手空五作半夜夣飛山色裡一年秋在雨声中揚州騎寉非無意上蔡牽黄信此穷韋有林泉未帰去欲将清㒷問征鴻又悠悠功業老堪怜舊事慿誰可共論直欲酒中賖快楽尚䏻花裡覔寒温詩書娱我成何事歲月侵人不見痕汾水年年秋㕍到庾郎何䖏不銷䰟晚春寄友人其一眼底春愁惱殺儂楊州徃事旋成空風流只合稱狂客衰䬃何堪作病翁水國春深梅子雨江南日暮鯉魚風何時執手同樽酒收拾清歡笑語中其二滿眼蕪菁断送春多情饒病両関身只知老去人心改不斍愁来酒盞頻霜鶻空拳知有命溟魚水恐傷神丈夫出䖏端無㩀猶恐辞家再入秦春日雑㒷七首其一羲陽瀟洒燕䑓詩誰觧知音似栁枝寂寂閑庭春色過露花無語背人悲其二爱梅常恐着花遲日禱東風莫後期及得見梅还冷淡東風全在小桃枝其三茸茸小雨弄春晴已有狂花未見鶯便使一年惆悵在暁窓寒梦别輕盈其四春衣𥘉作舞雩帰手展韋編畫寝稀觧使芳隂快幽意飛紅零落遶窓扉其五短㡌輕衫信馬行郊原春色太牽情兎葵燕麦渾閑事最有蕪菁到䖏生其六月團新碾破春酲賴有帰鴻寄好音人在天涯莫囬首恐偷華髪上瑶簮其七故人不見空凝睇过眼全踈只断䰟犹有野梅􅎔水在一枝無語伴黄昏張祖同挽詞西南失望郎天理信茫茫豪逸陳驚座風流馬季長才冝分竹使恩不自椒房清白今方著群児勿謗傷任太君挽詞賢婦古亦少紛紛何况今柏舟全美志綵服慰幽心舊邑虚湯沐新阡祔藁砧子孫門户壮誰敢齒諸任送太學李生帰鄊挈笈来東序經年亦􅌒逰却辞同舎去聊慰倚門憂顔子進未止何蕃誰為留到家席不煖隨計又皇州送蘇教授赴闕三年泮水振洙風俯接諸生屡改容嶺霧因時难隐豹岩雲有便得從龍乆欽才調無双手今喜声名逹九重拂䄂漢陽休更問丈夫事業出心胸别閩中許秀才􅎔岐長嘆息此嘆意深㣲浮世年年别𥘉心事事違捫参蜀道逺犯斗海槎帰故國有餘楽黄雞秋正肥送朱元素帰飬又可曽為客到江陽塞上䔥條断旅腸歌動竹枝終日楚笛吹梅弄数声羌仰天太息偷啣憤𬒳髪驚呼不為狂校尉自䏻清白眼肯教牛尾一般黄調華陽尉家世傳儒素平生斈古文三年思故國一命荷明君折莭羞黄版帰休許白雲吟詩無廢事薄俸不禁分孟東野尉平陽淫于詩曺務尽廢郡置假尉以代之分其半俸焉天寕莭口號九曲昆渠換碧流挺生英主間千秋謳歌萬國纔帰禹損益三年便継周南畆暗侵山色尽西陲展到海边休不知誰是乗槎客為採蟠桃荐冕旒眉山唐先生文集卷二十一眉山唐先生文集卷二十一目唐庚子西近体詩獲蛮賊代主簿賀張安撫書齋即事題所居夜坐感怀述怀秋夕書懐過湖縣過田横墓其一其二過潼関題瀘州縣楼蘇君俞通判愚齋又題春帰亭和鄭大夫荔枝雪意二首其一其二閨怨俞和叔座上賦白鹿寓精道斋有感怀家山又晚春寄友人其一其二春日雑㒷其一其二其三其四其五其六其七張祖同挽詞任太君挽詞送太斈李生帰郷送蘇教授赴闕别閩中許秀才送朱元素帰奍贈瀘倅丘明善又調華陽尉天寕莭口號
