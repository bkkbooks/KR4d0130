front:
  text: 眉山唐先生文集卷二十四
  hash: sha256:9583d0e9a08e0d7716c4dd026401659431b88ada1dc924bbd86ab42193a2fa54
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_024-1a}
body:
  text: 眉山唐庚子西書上憲使書某竊惟閣下奉使入蜀首尾三年于兹矣蜀中縉紳士大夫與夫四方之逰宦于蜀者不知其幾何人揚眉吐氣求出于門下者亦不知其幾何人求而得者幾何人求而不得者幾何人應者有盡而求者無窮意者閣下亦厭而鄙之否乎某嘗思之此非獨士人之罪時使之然也先王之世所以進退天下人材之術與今大異蓋自堯舜時已有三載考績三考黜陟幽明之説至于成周而其法大偹官府群吏日考其成月考其要歲終則冡宰考其會而議廢置三歲則王者大計而誅賞之當是之時才者有所勸不才者無所容凡所以正其位進其治作其事制其食者莫不有先後之敘故士皆安分樂業惟上之所進退曷嘗有此奔競馳騖之風哉周道衰先王之法壞凡上之所以進退天下之士者一切出于保任薦舉嗟夫保任荐舉之法行則奔競馳騖之風作此理之自然勢之必至也豈獨士人之罪哉孟子曰士之仕也猶農夫之耕也其失位也猶諸侯之失國家也無田則不祭出強則載贄士之進取固不足多責獨論其正與不正爾某迂昧寡合衆所非笑獨閣下惻然以為可教奬借誨諭似非偶然方此依賴而遽聞閣下有使吳之命雖欲長侍下風可復得乎是用忘其鄙陋而妄有説于左右伏惟閣下觀先王所以進退人材與近世不同憐士之進取實繫于時而寬假之某之所不勝幸願上翟提舉書某暗塞不通世務獨于諸書粗知首尾而平生所篤好者惟孟子七篇因其言以推其為心則其去取略可見矣其書曰求則得之舍則失之求有益于得也求之有道得之有命求無益于得也所謂求有益于得者果何物也在我之固有者也我固有是惻隱也我固有是羞惡也我固有是辭遜也我固有是是非也反而求之則萬物皆偹為仁義為禮智聚而為浩然之氣散而充塞乎天地之間舍而不求則集義所生者遂至于梏亡而不用之心不免于茅塞日夜之所息雨露之所潤者萌蘖不勝于斧斤牛羊而終歸于濯濯也故曰求則得之舍則失之求有益于得也所謂求無益于得者果何物也在彼之倘來者也是物也如遊塵如野馬如蚊虻之過耳如風雨寒暑如空中之浮雲來莫知其所至去莫知其所適來不可得而留去不可得而追求之未必得而不求者或得焉故曰求之有道得之有命求無益于得者也然則孟子之去取其亦可見矣有益于得者孟子求之無益于得者孟子不求也某自幼讀書于家事師于鄉求友于京師從學士大夫逰僅二十年既而􅌒之默坐終日觀一性之𥘉以求孟子之所求者而茫然竟未有所得今復置此而從事馳騖以求孟子之所不求者不亦昧其𥘉心為知道者所非笑哉然切聞之孔子曰可與言而不與之言謂之失人不可與言而與之言謂之失言説易者曰豫之𥘉六未可豫而豫故有鳴豫之凶六三可豫而不豫故有盱豫之悔恭惟閣下負俊聲二十年今為天子奉使萬里聰明通逹如明鑑止水而某于此時效官左右得以朝夕受誨真孔子所謂可言而易所謂可豫之期矣若不稍自振發以投一時之機會則不亦失人而有盱豫之悔乎用是忘其鄙陋而妄有干説于左右幸閣下少垂意而加察之不勝願幸上俞漕書某以章句書生偹貟屬部官府之務掌其八刑禁法令簿書錢榖芻秣市井無所不􅊢而兼領權攝者蓋不與焉雖日夜焦心勞思惟馬上得休息而思慮之表有不應三尺律者多矣賴上官慈仁未忍汰去使月得五斗紅腐以祭以飬固已僥幸豈冝開口求進為不知分人耶然念趨事以來忽忽半載每以職事進見必蒙教誨慰諭惻然有憫憐之意私自揆度似見知于左右者昧冒自陳而執事試觀焉某自少暗塞不通曉世務獨好觀古人經藉傳記上自堯舜三代下迄隋唐五季數千年事僅能涉獵凡所論著實非有以過人而一時輩流謬見推借年十八始逰京師遂與群俊並驅爭先未嘗少却鼓唱虛譽相扇於埸屋間是時年少氣鋭未歷世事遂以功名唾手可淂而不信造物之能厄已也年二十四始得一官隨牒推移十載于此平生相知零替略盡一落選調不能自脫今三十四矣蒼顔白髮奔走塵埃中雖名從八品實胥校市評爾憂患摧折曽不淂吐氣此皆曩時盜名無實大言妄想為造物者所憎以至于此𣸪何言哉今兹所陳誠以閣下聰明通逹敦厚和粹道德之氣見于面目此西南之士所以歸心而某亦不能無望于門墻也昔騏驥伏櫪聞伯樂足音而長鳴某非騏驥而閣下士之伯樂也有伏櫪而長鳴者其亦少垂意而察焉幸甚上監司書某宦學四方從縉紳士大夫逰僅二十年聞執事之賢有日矣然未知其所以為賢者前日黨事起朝廷元老大臣與夫當世賢人君子一切貶竄斥逐方是時執事由某官謫為某官洎黨事罷向之所謂元老大臣與夫賢人君子者皆起于嶺嶠荒逺之地以次收敘甄𣸪録用落落然布列中外方是時執事由某官擢為某官昔之觀人者必于用舍進退之間以求其背向去就之志蓋觀其所以逐而其莭可見觀其所以𣸪而其才可知嗚呼此執事之所以為賢者歟乃者執事下車之𥘉某自顧踈賤不敢造次奉書猶兾按部過邑得以瞻望顔色今既除代恐其遂去而不得一見也因寫近著文若干以獻執事以謂既不淂一見猶欲執事知其姓名耳文字不工𥘉不喜示人泩在益昌五年自念方在困中其言不足以取信未嘗一出所學以伸于不知已者其出可謂不偶然矣澄按有暇試隱几而閲之莞然一笑即付之火干瀆尊重慚汗不已答陳聖從書公名家子博學有才此固鄙人之所願交而惟恐其不可得也惠然辱書相待過厚使人讀之面熱汗下且承示以所疑以公之明豈不到此耶意者將自有説耶古人有言多聞守之以約多見守之以卓蓋聞見既廣然後收斂反約此入道之序也子路曰何必讀書然後為學孔子曰是故惡夫佞者子路之言孔子之所惡也公何疑焉讀醫書而不能為醫者有之矣未有不讀醫書而能為醫者世人徒見嘗讀醫書而不能為醫便以醫書為不足學而一切從其臆決此其殺人常毒于挺刃矣自頃學者多以𥿄上語為殺人芻狗務欲超然自淂于不可言傳之際聞某此説當見詬然佛言無有一法自虛空入者此所謂真實語也公試思之切磋琢磨乃是朋友之常分公有問難願淂反覆講究某有所疑亦當質于左右師範之説祗作笑端置之勿道千萬千萬表賀天寧莭代程守穹昊儲休將永熙朝之祚聖神應運丕承大定之基鳴社在晨際天共慶中賀恭惟皇帝陛下寅恭克已孚惠淂心自然堯舜之仁故能濟衆醇用成康之化幾致措刑政已逮于中和國遂臻于康靖爰祀誕彌之莭冝增逸樂之年臣承乏逺方欣逢瑞旦身縻符竹空馳頌聖之誠目斷觚稜莫綴稱觴之末臣無任謝曆日表代翟提刑四時既定然後允釐于百工七政已齊可以肆類于上帝蓋折因夷隩之本實裁成輔相之厚中賀恭惟皇帝陛下賁飾觀天革孚治曆俾歲月日時無易故金木土榖惟修臣承乏外臺𣸪瞻新歲日惟不足豈小善之不為時不再來嗟大恩之未報誓圖寸效不費分隂臣無任賀立皇后表代家提舉徽名寶册表正宫闈叶氣􅌚聲飛騰寰宇中賀臣常究觀典籍灼見古𥘉雖聖神特起而有為必內外相須而致理立朝立市共成建國之功親耕親蠶同底化民之道故周姒淂參于十亂而虞媯有輔于重華恭惟皇帝陛下德進日新合由天作載𥘉潛邸已諧窹寐之求入纂丕圖乃眷憂勤之助誕敷渙號式正坤儀承九廟之蒸嘗奉兩宫之定省緝熙隂教功相民彛臣承乏逺方與聞慶幸兔罝美化將形四國之風鳬藻盛儀莫綴千官之列臣無任賀降皇子表代宋運判前星騰耀麗日重光凡在照􅎔舉傾瞻仰中賀臣竊以漢室之尊冡嗣遂立髙媒堯封之祝聖人俾多男子蓋承祧之至重任主器以非輕恭惟皇帝陛下駿惠先猷作新聖治奉天以敬恪勤父事之心飬物以慈摩撫子來之俗蓼蕭𬒳澤行葦霑仁穹昊駢禧元良育秀為社稷久長之慶承祖宗積纍之休遣使告期重離明之有繼飛郵肆眚逹解雨于無垠臣承乏逺方欣聞吉語震雷􅊒􅊒知匕鬯之克堪螽羽詵詵期子孫之浸盛臣無任眉山唐先生文集卷二十四眉山唐先生文集卷二十四目唐庚子西書上憲使書上翟提舉書上俞漕書上監司書答陳聖從書表賀天寧莭表謝曆日表賀立皇后表賀降皇子表
