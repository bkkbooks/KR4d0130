front:
  text: 眉山唐先生文集卷二十四
  hash: sha256:9583d0e9a08e0d7716c4dd026401659431b88ada1dc924bbd86ab42193a2fa54
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_024-1a}
body:
  text: 眉山唐庚子西書上憲使書厶竊惟閣下奉使入蜀首尾三年于兹矣蜀中縉紳士大夫與夫四方之逰宦于蜀者不知其㡬何人揚眉吐氣求出于門下者亦不知其㡬何人求而得者㡬何人求而不得者㡬何人應者有尽而求者無窮意者閣下亦厭而鄙之否乎厶尝思之此非獨士人之罪時使之然也先王之世所以進退天下人材之術與今大異盖自尭舜時已有三載考績三考黜陟幽明之説至于成周而其法大偹官府群吏日考其成月考其要歲終則冡宰考其㑹而議廢置三歲則王者大計而誅賞之當是之時才者有所勸不才者無所容凢所以正其位進其治作其事制其食者莫不有先後之叙故士皆安分楽業惟上之所進退曷尝有此奔競馳騖之風哉周道衰先王之法壊凢上之所以進退天下之士者一切出于保任薦㪯嗟夫保任荐㪯之法行則奔競馳騖之風作此理之自然勢之必至也豈獨士人之罪哉孟子曰士之仕也猶農夫之耕也其失位也猶諸侯之失國家也無田則不祭出彊則載贄士之進取固不足多責獨論其正與不正爾厶迂昧寡合衆所非笑獨閣下惻然以為可教奨借誨諭似非偶然方此依賴而遽聞閣下有使吴之命雖欲長侍下風可復得乎是用忘其鄙陋而妄有説于左右伏惟閣下觀先王所以進退人材與近世不同憐士之進取实繫于時而寛假之厶之所不勝幸願上翟提舉書厶暗塞不通世務獨于諸書粗知首尾而平生所篤好者惟孟子七篇因其言以推其為心則其去取畧可見矣其書曰求則得之舎則失之求有益于得也求之有道得之有命求無益于得也所謂求有益于得者果何物也在我之固有者也我固有是惻隐也我固有是羞悪也我固有是辭遜也我固有是是非也反而求之則萬物皆偹為仁義為礼智聚而為浩然之氣散而充塞乎天地之間舎而不求則集義所生者遂至于梏亡而不用之心不免于茅塞日夜之所息雨露之所潤者萌蘖不勝于斧斤牛羊而終帰于濯濯也故曰求則得之舎則失之求有益于得也所謂求無益于得者果何物也在彼之倘来者也是物也如㳺塵如野馬如蚊蝱之過耳如風雨寒暑如空中之浮雲来莫知其所至去莫知其所適来不可得而留去不可得而追求之未必得而不求者或得焉故曰求之有道得之有命求無益于得者也然則孟子之去取其亦可見矣有益于得者孟子求之無益于得者孟子不求也厶自㓜讀書于家亊師于郷求友于京師従斈士大夫逰僅二十年旣而􅌒之黙坐終日覌一性之𥘉以求孟子之所求者而茫然竟未有所得今復置此而從亊馳騖以求孟子之所不求者不亦昧其𥘉心為知道者所非笑哉然切聞之孔子曰可與言而不與之言謂之失人不可與言而與之言謂之失言說易者曰豫之𥘉六未可豫而豫故有鳴豫之凶六三可豫而不豫故有盱豫之悔恭惟閣下負俊聲二十年今爲天子奉使萬里聪明通逹如明鑑止水而厶于此時効官左右得以朝夕受誨真孔子所謂可言而易所謂可豫之期矣若不稍自振發以投一時之机㑹則不亦失人而有盱豫之悔乎用是忘其鄙陋而妄有干說于左右幸閣下少垂意而加察之不勝願幸上俞漕書厶以章句書生偹貟属部官府之務掌其八刑禁法令簿書錢榖芻秣市井無所不􅊢而兼領權攝者盖不與焉雖日夜焦心劳思惟馬上得休息而思慮之表有不應三尺律者多矣賴上官慈仁未忍汰去使月得五斗紅腐以祭以飬固已僥倖豈冝開口求進為不知分人耶然念趋亊以来忽忽半載每以職亊進見必蒙教誨慰諭惻然有憫憐之意私自揆度似見知于左右者昧冐自陳而執亊試覌焉厶自少暗塞不通暁世務獨好覌古人經藉傳記上自堯舜三代下迄隋唐五季数千年亊僅䏻渉獵凢所論著寔非有以過人而一時軰流谬見推借年十八始逰京師遂與群俊並駈争先未嘗少却鼓唱虚譽相扇於埸屋間是時年少氣鋭未歴世亊遂以功名唾手可淂而不信造物之䏻厄已也年二十四始得一官隨牒推移十載于此平生相知零替畧盡一落選調不䏻自脱今三十四矣蒼顔白髪奔走塵埃中雖名従八品寔胥校市評尔憂患摧折曽不淂吐氣此皆曩時盗名無寔大言妄想為造物者所憎以至于此𣸪何言哉今兹所陳誠以閣下聪明通逹敦厚和粹道徳之氣見于面目此西南之士所以帰心而厶亦不䏻無望于門墙也昔騏驥伏櫪聞伯楽足音而長鳴厶非騏驥而閣下士之伯楽也有伏櫪而長鳴者其亦少垂意而察焉幸甚上監司書厶宦學四方從縉紳士大夫逰僅二十年聞執事之賢有日矣然未知其所以為賢者前日黨亊起朝廷元老大臣與夫當世賢人君子一切貶竄斥逐方是時執事由某官謫為某官洎黨亊罷向之所謂元老大臣與夫賢人君子者皆起于嶺嶠荒逺之地以次收叙甄𣸪録用落落然布列中外方是時執亊由某官擢為某官昔之觀人者必于用舍進退之間以求其背向去就之志盖觀其所以逐而其莭可見覌其所以𣸪而其才可知嗚呼此執事之所以為賢者欤乃者執事下車之𥘉厶自頋踈賤不敢造次奉書猶兾按部過邑得以瞻望顔色今既除代恐其遂去而不得一見也因冩近著文若干以献執事以謂既不淂一見猶欲執事知其姓名耳文字不工𥘉不喜示人泩在益昌五年自念方在困中其言不足以取信未嘗一出所斈以伸于不知已者其出可謂不偶然矣澄按有暇試隱几而閱之莞然一笑即付之火干瀆尊重慚汗不已荅陳聖従書公名家子愽斈有才此固鄙人之所願交而惟恐其不可得也惠然辱書相待過厚使人讀之面熱汗下且承示以所疑以公之明豈不到此耶意者将自有説耶古人有言多聞守之以約多見守之以卓盖聞見既廣然後收歛反約此入道之序也子路曰何必讀書然後為斈孔子曰是故悪夫佞者子路之言孔子之所悪也公何疑焉讀醫書而不䏻為醫者有之矣未有不讀醫書而䏻為醫者世人徒見嘗讀醫書而不能為醫便以醫書為不足斈而一切從其臆决此其殺人常毒于挺刄矣自頃斈者多以𥿄上語為殺人芻狗務欲超然自淂于不可言傳之際聞厶此説當見詬然佛言無有一法自虚空入者此所謂真寔語也公試思之切磋琢磨乃是朋友之常分公有問难願淂反覆講䆒厶有所疑亦當貭于左右師範之説祗作笑端置之勿道千萬千萬表賀天寕莭代程守穹昊儲休将永熈朝之祚聖神應運丕承大定之基鳴社在晨際天共慶中賀恭惟皇帝陛下寅恭克已孚惠淂心自然堯舜之仁故能濟衆醇用成康之化㡬致措刑政已逮于中和國遂臻于康靖爰祀誕弥之莭冝増逸楽之年臣承乏逺方欣逢瑞旦身縻符竹空馳頌聖之誠目断觚稜莫綴稱觴之末臣無任謝暦日表代翟提刑四時既定然後允釐于百工七政已齊可以肆類于上帝盖折因夷隩之本寔裁成輔相之厚中賀恭惟皇帝陛下賁餙觀天革孚治暦俾歲月日時無易故金木土榖惟修臣承乏外䑓𣸪瞻新歲日惟不足豈小善之不為時不再来嗟大恩之未報誓圖寸效不費分隂臣無任賀立皇后表代家提㪯徽名宝冊表正宫闈叶氣􅌚声飛騰寰宇中賀臣常䆒覌典籍灼見古𥘉雖聖神特起而有為必内外相須而致理立朝立市共成建國之功親耕親蚕同底化民之道故周姒淂參于十亂而虞媯有𥙷于重華恭惟皇帝陛下德進日新合由天作載𥘉潜邸已諧窹寐之求入纂丕圖乃眷憂勤之助誕敷渙號式正坤儀承九廟之蒸尝奉两宫之定省緝熈隂教功相民彛臣承乏逺方與聞慶幸兎罝美化将形四國之風鳬藻盛儀莫綴千官之列臣無任賀降皇子表代宋運判前星騰耀䴡日重光凢在照􅎔舉傾瞻仰中賀臣窃以漢室之尊冡嗣遂立髙媒堯封之祝聖人俾多男子盖承祧之至重任主器以非輕恭惟皇帝陛下駿惠先猷作新聖治奉天以敬恪勤父事之心飬物以慈摩撫子来之俗蓼䔥𬒳澤行葦霑仁穹昊駢禧元良毓秀為社稷乆長之慶承祖宗積累之休遣使告期重離明之有継飛郵肆眚逹解雨于無垠臣承乏逺方欣聞吉語震雷􅊒􅊒知匕鬯之克堪螽羽詵詵期子孫之浸盛臣無任眉山唐先生文集卷二十四眉山唐先生文集卷二十四目唐庚子西書上憲使書上翟提舉書上俞漕書上監司書荅陳聖從書表賀天寕莭表謝暦日表賀立皇后表賀降皇子表
