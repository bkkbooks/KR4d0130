front:
  text: 眉山唐先生文集卷二十五
  hash: sha256:d3974b9d4fb913b9b370b82e378a5b8bb869a9be142e87e143c2bc74c468a534
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_025-1a}
body:
  text: 唐庚子西表到任謝上表代嶺表觀風已慚治效坤維按漕𣸪玷寵靈引組知榮撫襟增㥏中謝伏念臣單平冷系迂暗常才雖懷許國之孤忠非有過人之竒莭偶緣冗宦𬒳遇先皇擢任監司猥承人乏出分使指益愧食浮才自脫于殿刑蔑可書之最目謬􅈾渙渥重忝皇華鼠能已盡于五窮鉛刀何堪于再割鴻恩未報俄驚仙䁀之成濬哲肇興尚念遺簮之舊遂容尸素未即棄捐此蓋伏遇皇帝陛下聖健行天大明出震開並採兼收之路隆太平極治之基致此冥頑類蒙委寄粹表未瞻于天日殊私已佩于丘山敢不續短俾長勉為正登車興嘆雖微孟博之才叱馭遂行姑勵王尊之莭㳙銖可效糜粉為期賀進築表代臣某言准進奏院報四月𥘉七日涇原路合熙河環慶秦鳯路人馬出寨收天都山進築西安州天都臨羌寨了當至五月𥘉九日分屯訖者四路雲屯如入無人之境三城鼎峙坐收不戰之功華夏􅌚騰蠻夷震中賀臣竊以要荒之叛服係乎制馭之是非有西羌久稽天討當元豐之願治將議剪除逮元祐之偷安務從姑息養成其惡以迄于今屬神聖之嗣興起師徒而進築逺攻近取日削月侵城堙漸迫其腹心刁斗相聞于巢穴天都形勝既歸掌握之中靈武勢孤自有唇亡之懼積年之冦指日可平恭惟皇帝陛下仁勇兼資德刑相濟震文王之一怒所以安民體成周之四征終于成德神武不殺上兵伐謀故䏻旬月之間大𣸪祖宗之地不疾而速惟斷乃成某猥以空踈誤蒙委寄振衣踴躍欣聞三捷之音拜手歡呼上萬年之夀同前代百堵皆作三旬而成竒速之功古今未有中賀臣聞王者無外天下為家凡聲教之未通必討平而後已蠢兹夏虜久盜西陲虐彼一方逮今纍世寶元慶曆數叛服之不常熙寧元豐屢剪除而未盡比興進築出自睿謀大師雲屯萬杵雷動山河克𣸪垺堞相望封疆逺跨于流沙刁斗聲聞于瀚海天都巨險猶俯拾于纎毫靈武孤危諒不勞于餘刃恭惟皇帝陛下湯心勇知堯德武文建一勞永逸之謀成萬世無疆之業攄祖宗之宿憤壯社稷之靈威臣迹逺天顔聀縻使指效官有守惟懷鼇忭之心稱夀無因徒切葵傾之志臣無任慰國恤表代伏惟遺誥皇太后以正月十四日上升者發開驛訃宣示郡人狂號失聲震悼喪魄恭惟大行皇太后家順以巽坤柔而剛决大䇿于禁中指麾而定成治功于天下退托不居有姜任婦德之賢非漢唐母后之比向嬰疾病本自憂勤瞑眩弗瘳彌留遽及伏惟皇帝陛下深仁賦性純孝因心方攀慕于寶慈諒何堪于荼毒然以宗祧任重軍國事叢願寬罔極之哀少副有生之望臣忝郡寄不獲奔詣闕庭臣無任啓謝蔡太師啓代始緣力請淂返弊廬終絶進升之望未甘扶杖起居雖健于𬋩寧久已飾巾志意自同于陳實忽奉昭回之蹟大推雱霈之恩舊惡宿愆一時蕩滌前侯故將以次甄收顧惟朽鈍之􅥟屢費陶鎔之手終蒙記録不忍棄捐謂其嘗任宰司故優其班序謂其久安田里仍處以虛間就使自為之謀想亦不過如此靜循其本敢不知㱕此蓋伏遇某官以王佐之才值聖人之運將令四海盡蒙比屋之封肯使一夫獨掩向隅之泣致兹衰退亦極寵榮食既愈浮寧有小言之𥙷位非所稱得無大耋之憂辭受之間莫知所措賀鄭太宰啓代伏審拜恩中陛進位元台凡在陶鎔實深慶忭竊以虞刑未措選于衆而舉臯陶啇䁀將調求諸野而得傅說偹見載籍號為美談然臯陶之術非本于民情而傅說之舉不由于師錫坐超􅒯古允屬聖時恭惟其官識照幾先學窮繫表禁林視草知盛德之有言樞極運籌見真儒之無敵既延登子揆路實滿慰于輿情以舜事堯意其在此維申及甫兹豈偶然必將盡攄胸臆之竒庶幾大慰邇遐之望某側聞誕告實副願言徒深賀厦之情阻與掃門之役永懷欣豫未易名言賀劉少宰啓代伏審拜恩天陛進位台纒凡在陶鎔舉深􅌚忭竊以國家安治何啻百年宰相稱呼蓋嘗屢易置平章于後省冠僕射于南宫猶襲唐餘未皇周制主上親行宸翰追述先猷作新二宰之名永著一王之法自非智足以斷國論仁足以遂物冝則何以上副旁求進膺大用恭惟某官才推人傑學造天民言不外于聖人故嘗合稷喻必根于經術豈肯借秦登二府者曽未數年裨萬乘者蓋非一事逮兹爰立實副具瞻所謂䔥也規而曺也隨周公左而召公右年登可待刑措為期方此投間聞之起立阻逺潭潭之府莫趨兩兩之階欣躍之誠實倍倫等賀右僕射韓相公啓代伏審顯奉制麻延登宰籍席播騰九有􅌚慶一辭竊聞考元龜以斷大謀不如舊德指喬木而稱故國未若世臣才猷夙著于廟堂名實已隆于天下故社稷因之而倚重而朝廷恃此以稽疑恭惟某官器重海􅉼神清玉粹天資攸禀有仁民愛物之心家學所傳皆論道經邦之術藹揚令聞坦涉亨途頃任樞纒謀已深于漢幄出􅎔閫寄澤未溥于南霖政地久虛僉言允屬值聖朝之嗣服思輔相以迓衡召還三遷遂宅百揆韋平盛事固無愧于古人房杜全功誠責成于今日必將盡發胸中之藴庶幾大慰海內之心某承乏遐陬側聞除目阻逺潭潭之府莫趨兩兩之階叢忭寸誠難形尺牘賀門下李侍郎啓代伏審拜恩中陛秉政東臺凡與生成舉深欣懌竊以明良之㑹今昔所難董賈有志而竟不逢時房杜淂君而未䏻及禮故漢功不過于如此而唐政亦終于闋然追還古𥘉意在今日恭惟某官識探道奧學濟聖涯經天緯地之文淂之性禀尊主庇民之略盡在術中早躋華途夙著時望西垣潤色燦追典誥之風右轄論思肅振維綱之任頃從鳯閣出守麟符衆人嘆其失時君子知其𣸪用值聖神之嗣服思耆舊以迓衡召還自外而任以春官曽未閲時而入居左省除音所徹衆議允諧必將盡攄胸臆之竒庶幾大慰遐邇之望某久依琳館嘗辱鈞陶激􅌚忭于重襟難叙陳于弱翰佇聞爰立益副具瞻賀蔣樞密啓代伏審誕敷明命擢二鴻樞世稔服于重名人共欣于顯拜恭惟某官才髙康濟志切經綸文章秀彂于妙齡器業飬成于晚莭中外荐更之久所守益完縱橫應變之才無施不可出而頗牧入則卿雲先帝深知欲大用而未果嗣皇愛眷遂圖任而無疑召還自外而歸直禁林曾未閲時而延登右府參裁機政寧穆邦猷朝廷取决于坐籌邊鄙折衝于燕爼君臣千載孰窺造膝之謀冠帶百蠻行見止戈之武某側聞除目阻逺鈞嚴莫伸賀厦之私永愧登門之舊其如歡忭罔喻端倪賀安諌議啓伏審光奉制綸推居諌苑朝廷增重中外聳聞竊以致君澤民聖賢之所易逢時遇主古今之至難當諌行言聽之時居面折廷諍之任淂伸其志實係于天恭惟某官藴藉深醇議論辨博飬慷慨敢言之氣負縱橫適用之才必將論列是非敷陳利害然恐供聀未幾别有九遷之榮遇事輒言安俟七年之久某荷知有素稱慶無緣欣忭之私實倍夷等眉山唐先生文集卷二十五眉山唐先生文集卷二十五目唐庚子西表到任謝上表賀進築表同前慰國恤表啓謝蔡太師啓賀鄭太宰啓賀劉少宰啓賀右僕射韓相公啓賀門下李侍郎啓賀蔣樞密啓賀安諌議啓
