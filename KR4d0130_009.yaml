front:
  text: 眉山唐先生文集卷九
  hash: sha256:0d1c718750a0661a09bd2bc72c990c7fbbf497ad46e051994e8cd8f11d937a52
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0130_SBCK_009-1a}
body:
  text: 眉山唐庚子西記射象記政和三年三月乙卯有象逸于惠州之北門惠人相與攻之操戈戟弓弩火炬者至數百人而空手旁觀鼓噪以助勇者亦以千計既至皆逡巡不進有監稅蒙順國者雍州邊人以趫捷自矜短衣踊躍挾數十矢射之中項皆如蝟毛象龎然不動徐以鼻卷去最後中左耳流血被面象怒馳之順國棄弓反走未𢾗走象以鼻鈎其膝盤之于地蹂踐之衆潰走散象亦緩緩引去少焉走卒就視則順國已碎首折脅陷胸流腸死矣吾時方食聞之投箸嘆息嗟夫使象得入城則鼻之所觸齒之所拂足之所蹴豈𣸪有邑屋居民聚落也哉為万人排難而以一身死之此吾所以嘆也然吾聞交趾捕象必用機穽未有直決者吾常識其形矣其立如屋其卧如堤其行如舟是豈可與力競也哉若人者可謂愚矣此吾所以又嘆也然向使百數人者叶心戮力齊奮而共擊之亦未必不勝脫令不勝猶當不至于此此吾所以又歎也雖然古之不量事力奮區區之忠以排難救人為己任而困于無助以至碎首折脅陷胸流腸而死者亦安可勝數凡有志而無成者皆是也何獨此哉此吾所以又歎也作射象記李氏山園記伯陽甫續史記後三百年而老聃伯陽為柱下史後世因以伯陽甫為伯陽則二人為一人矣范武子晉士會也而古今人表置士會于中上列危武子于上中則一人為二人矣豈惟人哉龍目一名益智而益智非龍目龍目出海南山各間味甘益智出西域味辛而廣雅曰益智龍目也則二物為一物矣枇杷盧橘一也而上林賦曰盧橘夏􅍄黃柑橙榛枇杷橪柿亭奈厚朴則一物為二物矣夫父祖之事子孫有不及知州里之物耆舊有不遍睹而况述千載之上𢾗千萬里之外者乎亦何能無失耶吾南遷惠州寓居城南李氏之山園園高下𢾗十畝草木華實無所不有而龍目盧橘為特盛吾兄弟甥舅無日不往來逍遙于其下而笑舊説之謬蓋常以比伯陽甫范武子之事而為之嘆息因書其事使後世知有是園又知吾常逰戲于此又知著述不可以不慎而學諸子百家之言者亦知其有淂有失而審所取云水東廟記廟中神像二其一介胃按劒而坐者曰興祚王其一烏巾紫襴端笏而坐者曰泰民王觀興祚之名疑南漢時所封而不畝遂以為然者蓋無所考也吾始至惠州屏居于南山之上北望西江之東林木之間夜夜有燈煜然里人曰此水東㚑廟也吾聞之悚然檮焉自是感于精神彂于夢寐者非一以其事近怪故不復悉書而要之靈應卓然有不可不信者然吾嘗聞之易矣凡天道之所虧益地道之所流受鬼神之所禍福與人之好惡大抵相似吾今以無狀不肖獲罪于世至于中原之大無所容其軀而竄伏于五嶺之南羅浮之東披黃茅而居者五年後而歸則其見惡于人也可謂極矣方是之時雖吾之心亦復自惡而神獨眷眷如此意者鬼神之中亦有異好者乎抑亦捨其迹而求其心憐其窮厄而忘其罪戾亦如吾君所以寬而不誅已棄而復收之意乎不然何其與易相反神之威德始于神江被于瀕流𢾗百里之間故神江鐵步水東皆有廟而水東廟為特盛然皆不在祀典故或者以為疑夫以祀典而論鬼神猶以閥閲而論人物也便謂之盡可乎此亦無足疑者政和五年六月二十四日眉山唐某記易庵記客問陶隱居吾欲注周易本草孰先隱居曰易冝先客曰何也隱居曰注易誤猶不至殺人注本草誤則有不得其死者矣世以隱居為知言與吾之説大異蓋六經者致治之本草也漢時決疑獄斷國論悉引經術兹豈細故而易言哉本草所以辨物六經所以辨道道者物之所以生物者人之所以資為生一物之誤猶不及其餘道術一誤則無復孑遺矣前世儒臣引經悮國其禍至于伏尸百萬流血千里本草之悮豈至是哉注本草悮其禍疾而小注六經悮其禍遲而大隱居注本草矣故知本草之為難而未嘗注經故不知經之為尤難而不可率易如此世以不服藥為中醫此言雖小可以喻大吾用易不審陷禍幾死今幸間廢方且據庵熟讀而深思之復書此記二本其一以自警其一以示二子焉年月日記書大鑒碑隂記曹溪大鑒禪師碑元和中栁栁州文紹聖中蘇定武書前長老辨公立石至崇寧初此碑坐纍毁去今長老和公更書而刻之唐子曰大鑒之道不以文而重輕栁州之文不以字而隱顯辨公以大鑒之道栁州之文定武之書三法和合以成此碑使喜書者因字以求文好文者因詞以求道其意以為更相彂明而不知其適足以相纍何則志于字者見字而不見文志于文者見文而不見道安在其為更相發眀才去其一而二者皆病此和合之患也今子𣸪以栁州之文配大鑒之道雖無前日字畫之纍亦安能免于所謂和合者哉雖然是間蓋有理焉文寄于字是字而非文道寓于文是文而非道三法雖和合體相各差别眼色合為見色雖去而視存耳聲合為聞聲雖亡而聽自若也既不能相為用矣又烏能相為纍哉和喜曰然請書子言吾刻之碑隂傳資政韓公家傳韓公諱粹彥字師質相州安陽人魏忠獻王之子故丞相儀公之弟也春秋之世韓獻子大有功于趙故宋有天下而韓氏為特盛忠獻有勳勞于天下先朝著令世選韓氏子孫一人官相州故公弱冠以選監相州酒稅秩滿復監相州倉稍遷國子監光祿寺主簿衛尉寺丞提夆京東常平等事尚書司勳貟外郎接伴北朝賀天寧莭使充北朝正旦國信使主上即位儀公改左僕射公避親改少府少監遷吏部員外郎丐外輔淂陳州儀公罷相公亦罷郡主𬋩嵩山崇禮宫五年許自便主𬋩西京留司御史臺駕幸興德禪院有感詔韓氏子孫在吏議者悉除之未幾主𬋩南京鴻慶宫丁毋憂服除拜光祿少鄉上享原廟攝太常卿接伴北朝賀天寧節大使使還賜出身拜祕書監二年以徽猷閣待制知興仁府俄擢定州路安撫馬步軍都總𬋩知定武軍府事還朝拜吏部侍郎主𬋩右選求外輔拜龍圖閣學士復知定州年五十四薨于中山公名重北方而聞于契丹故聘使往還公未嘗不在其間而北道謀帥公未常不為選首其使契丹也王師方西征虜意不自安公既入境皆交口問事公對以使事有指不敢及其他公既慎重其事不敢縱言而虜亦順適其意不敢復問而雲中館送擡箱事例客省使不肯拜受香藥酒皆反覆論難卒正其禮淂其所守而還公始授館虜主戒館中勿生事公射于館中虜主乘小車與其孫觀焉因解驂以侑射且命畫工貌之以歸其為逺人所慕如此公為侍郎者再而吏部之政為最勤其殿大邦者三而定武之政為最逸蓋吏部分四選而侍郎右選至為雜冗公承積弊之後釐正簿書遣決滯務增損廢置五萬四千一百余事髮為幾白然後怨詈謗讟化為歡謡上聞而嘉之公進秩一等官吏賞有差所謂最勤者如此中山魏王儀公舊治也遺民故老猶有存者聞公作世濟堂固已感悅而公之撫軍治民悉遵先世規摹故雍容談笑無他施為而軍府肅然所謂最逸者如此余嘗讀公奏議以考其為心大抵以愛民為本始公知陳州作護城堤自是無復水患人至今便之然至定武時議者欲決滹沱河水注塘濼中而界保州永寧之間作限水堤則公極論其不可始公在武定時詔訪以備邊之計公畫四䇿以儲蓄為先務然河朔均糴則公復有所不從所謂以愛民為本者如此余讀公奏議十卷至論致仕官𣸪起免追所淂恩典以勵風莭喟然嘆曰大哉言乎有忠獻之風矣始公貌類其父世人以為忠獻𣸪出而號小魏公神宗哲宗亦以是深器之然終不至大用故余所書止于如此世以忠獻比周公旦召公奭太公望今考史記世家周公之子伯禽太公之子吕伋皆齷齪庸人無事可書而召公之後九世無聞至燕惠侯然後稍見于史則余今所書如此公可謂不忝其世矣贊曰公子保之謂余言先公在武定時有説先公取幽燕者先公折之曰國家奄有四海寧少此彈丸土耶北方無事百有餘年兩朝之民淂以奍生淂以送死得以事其父母而飬育其子孫始之者冦凖而成之者公也傳曰仁人之言其利溥哉今所謂仁者果誰歟非公孰能當之眉山唐先生文集卷九眉山唐先生文集卷九目唐庚子西記射象記李氏山園記水東廟記易庵記書大鑒碑隂記傳資政韓公家傳
